// ── Vincular la tarea COMPLETA (sin checklist propio) a un ítem de una
// tarea de período más amplio. Disponible para cualquier período salvo
// "año" (no hay nada más amplio arriba), y solo si la tarea no tiene su
// propio checklist (si lo tiene, se vincula ítem por ítem más arriba).
function mSave(){
  var nameEl=document.getElementById('m-name');if(!nameEl)return;
  var name=nameEl.value.trim();
  if(!name){nameEl.style.borderBottomColor='var(--bad)';nameEl.focus();return;}
  // Pedido: el checklist ahora está disponible para tareas de cualquier
  // período (antes solo para "día"). Además, en plan gratuito se recorta a
  // MAX_CHECKLIST_ITEMS_FREE ítems por las dudas (mAddCL ya lo bloquea al
  // agregar, esto es solo un resguardo extra al guardar).
  var isDay=M.task.period==='dia';
  // BUGFIX / pedido: "Cantidad" y "Checklist interno" no pueden estar
  // activos los dos a la vez (si no, no queda claro cuál decide si la
  // tarea está completa). mToggleQty()/mToggleCLSection() ya lo evitan al
  // tocar los interruptores; esto es un resguardo extra al guardar — si
  // por lo que sea llegan los dos en true, gana el checklist por ser más
  // específico.
  if(M.hasQty && M.hasCL) M.hasQty=false;
  var cl=M.hasCL?M.checklist.filter(function(i){return i.text.trim();}):[];
  if(!isPremium() && cl.length>MAX_CHECKLIST_ITEMS_FREE) cl=cl.slice(0,MAX_CHECKLIST_ITEMS_FREE);
  var qty=M.hasQty?Math.max(2,M.qty):1;
  var done_=cl.length?checklistSatisfied({checklist:cl,clRule:M.clRule}):(qty>1?(M.task.prog||0)>=qty:!!M.task.done);
  // BUGFIX: si es una tarea simple (sin "Cantidad"), "prog" debe quedar en
  // sincronía con "done" (0 o 1) — igual que ya se corrigió en tapTask() —
  // para que un vínculo hacia otra tarea (t.clLinkUp) calcule bien el
  // delta la próxima vez que se marque/desmarque. Antes quedaba siempre en
  // 0 acá, pisando lo que tapTask() hubiera dejado.
  var prog=M.hasQty?Math.min(M.task.prog||0,qty):(done_?1:0);
  // Fecha específica (tarea puntual, no recurrente) — si está activa, además
  // recalculamos el día de semana correspondiente por si se desactiva luego.
  var dateInp = isDay ? document.getElementById('m-date-input') : null;
  var specificDate = (isDay && M.hasDate && dateInp && dateInp.value) ? dateInp.value : null;
  var effectiveDay = specificDate ? dayIdxFromDate(new Date(specificDate+'T00:00:00')) : M.task.day;
  // El recordatorio solo tiene sentido si la tarea es diaria y tiene hora
  // definida; si se desactivó la hora, el recordatorio no se guarda activo.
  var notifSaved = (isDay && M.hora && M.notif && M.notif.on) ? {on:true, hh:M.notif.hh||0, mm:M.notif.mm!=null?M.notif.mm:15} : null;
  // Pedido: la tarea COMPLETA puede estar vinculada (clLinkUp) aunque tenga
  // checklist propio — antes se borraba el vínculo acá apenas el checklist
  // tenía algún ítem; ahora se conserva siempre tal cual estaba.
  var saved=Object.assign({},M.task,{text:name,checklist:cl,qty:qty,prog:prog,done:done_,crucial:isDay?!!M.crucial:false,categoryId:isDay?(M.categoryId||null):null,hora:isDay?(M.hora||null):null,duracion:isDay?(M.duracion||60):60,date:isDay?specificDate:null,day:isDay?effectiveDay:M.task.day,notif:notifSaved,clLinkUp:(M.task.clLinkUp||null),hasCL:!!M.hasCL,clFresh:!!M.clFresh,clRule:(M.hasCL&&M.clRule&&M.clRule.mode==='kofn')?{mode:'kofn',k:Math.max(1,Math.min(M.clRule.k||1,cl.length||1))}:null,hasTimer:isDay&&!!M.hasTimer,timer:(isDay&&M.hasTimer)?M.timer:null,registryId:(M.registryId&&regById(M.registryId))?M.registryId:null,regPerItem:!!(M.hasCL&&M.registryId&&M.regPerItem),oneShotWeek:(isDay&&!specificDate&&!!M.oneShot),repeatEveryDays:(isDay&&specificDate&&M.repeatEvery>0)?M.repeatEvery:null});
  // Si algún ítem vinculado cambió su avance mientras se editaba en este
  // modal (se le sumó/restó cantidad, o se marcó/desmarcó un ítem simple),
  // empujar ese cambio hacia el ítem vinculado — comparando contra el
  // checklist tal como estaba cuando se abrió el editor. Se calculan los
  // dos deltas (1 a 1 y "al completar") para que cada vínculo use el que
  // corresponda según su propio modo.
  var oldCL = M.task.checklist || [];
  function _clEffProg(i){ return clItemQty(i)>1 ? (i.prog||0) : (i.done?1:0); }
  function _clEffDone(i){ return clItemQty(i)>1 ? (i.prog||0)>=clItemQty(i) : !!i.done; }
  var clDeltas = [];
  oldCL.forEach(function(oi){
    if(!hasLinks(oi.linkUp)) return;
    var ni = cl.find(function(i){return i.id===oi.id;});
    var newP = ni ? _clEffProg(ni) : 0; // el ítem se borró: se retracta su aporte
    var d = newP - _clEffProg(oi);
    var wasD = _clEffDone(oi), nowD = ni ? _clEffDone(ni) : false;
    var cd = (!wasD && nowD) ? 1 : (wasD && !nowD ? -1 : 0);
    if(d || cd) clDeltas.push({item: ni||oi, delta: d, compl: cd});
  });
  // Igual, pero para el vínculo de la tarea COMPLETA (clLinkUp) — el avance
  // que aporta es la cantidad de ítems completados (antes/después).
  var wholeDelta=0, wholeCompl=0;
  if(hasLinks(saved.clLinkUp)){
    var oldDoneCountW = oldCL.filter(function(i){return i.done;}).length;
    var newDoneCountW = cl.filter(function(i){return i.done;}).length;
    wholeDelta = newDoneCountW - oldDoneCountW;
    var wasDoneW = oldCL.length ? oldCL.every(function(i){return i.done;}) : !!M.task.done;
    var nowDoneW = done_;
    wholeCompl = (!wasDoneW && nowDoneW) ? 1 : (wasDoneW && !nowDoneW ? -1 : 0);
  }
  if(M.isNew){S.tasks.push(saved);}else{S.tasks=S.tasks.map(function(t){return t.id===saved.id?saved:t;});}
  clDeltas.forEach(function(d){ propagateCLLink(d.item, d.delta, d.compl); });
  if(wholeDelta || wholeCompl) propagateCLLink({linkUp:saved.clLinkUp}, wholeDelta, wholeCompl);
  removeOverlay('task-modal');saveState();checkMedals();render();
  playSound(M.isNew?'add':'toggle');
}
function removeOverlay(id){
  var el=document.getElementById(id);
  if(!el) return;
  el.classList.add('closing');
  setTimeout(function(){ if(el && el.parentNode) el.remove(); }, 180);
}

// ── Racha con período de gracia de 1 día ────────────────────────────────────
// ¿Está la racha "en vivo" (contando días, mostrando el contador, logros,
// etc.)? Distinto de S.simpleMode: acá los niveles/XP siguen activos, solo
// se apaga el sistema de racha en sí (pedido: opción independiente).
function streakActive(){ return !S.simpleMode && !S.streakDisabled; }
// Pedido: si un día no alcanza el umbral, el usuario tiene hasta el FINAL
// DEL DÍA SIGUIENTE para tickear esas tareas y que ese día igual cuente
// para la racha. Pasado ese plazo, las tareas se pueden seguir marcando
// (hasta 7 días atrás, ver canTicket en openDayDetail) pero ya no revive
// la racha de ese día — queda "cerrado" (finalized).
//
// Tareas "de un día concreto" dateKey: las puntuales con esa fecha, más las
// recurrentes de ese día de semana, siempre que dateKey siga dentro de la
// semana en curso (el reset semanal de los lunes reutiliza el mismo objeto
// de tarea para la semana nueva, así que una vez cruzada esa frontera ya no
// se puede reconstruir el detalle de la semana anterior — la misma
// limitación que ya tenía openDayDetail para tickear tareas pasadas).
function tasksForDateKey(dateKey){
  var d = parseLocalDate(dateKey);
  var wIdx = dayIdxFromDate(d);
  var recurring = isSameWeekAsToday(d) ? S.tasks.filter(function(t){return t.period==='dia'&&!t.date&&t.day===wIdx&&!isSkipped(t);}) : [];
  var dated = S.tasks.filter(function(t){return t.period==='dia'&&t.date===dateKey;});
  return recurring.concat(dated);
}
// ¿Sigue "dentro de gracia" el día dateKey? (hoy mismo, o el día
// inmediatamente anterior — que se puede completar hasta el final de hoy).
function isWithinGracePeriod(dateKey){
  var diff = Math.round((parseLocalDate(todayStr()) - parseLocalDate(dateKey))/86400000);
  return diff>=0 && diff<=1;
}
// Evalúa (o re-evalúa) el cumplimiento de un día concreto y guarda/actualiza
// su historial — salvo que ya esté "finalized" (fuera de gracia y ya
// resuelto para siempre), en cuyo caso no se vuelve a tocar. Días sin
// ninguna tarea asignada (dayTasks vacío) no generan entrada — no hay nada
// que evaluar — y se dejan tal cual estaban (relevante para el borde
// semana-anterior/semana-actual del último día de la semana).
function evaluateDayHistory(dateKey, weekendSkipAllowed){
  var prev = (S.dailyHistory||{})[dateKey];
  if(prev && prev.finalized) return prev;
  var dow = parseLocalDate(dateKey).getDay(); // 0=domingo,6=sábado
  var isWknd = (dow===0||dow===6);
  if(!S.dailyHistory) S.dailyHistory={};
  // BUGFIX: el fin de semana libre solo puede EXTENDER una racha que ya
  // viene viva (weekendSkipAllowed — reconcileStreak lo calcula mirando si
  // S.streak.days>0 justo antes de este día) — nunca puede generar una
  // racha nueva de la nada. Antes, cualquier sábado/domingo se daba por
  // cumplido sin condición, así que una racha ya rota "revivía" sola en el
  // fin de semana siguiente aunque no se hubiera hecho nada esos días.
  if(S.streakCfg && S.streakCfg.skipWeekends && isWknd && weekendSkipAllowed){
    var wkEntry = {ratio:1, completed:prev?prev.completed:0, total:prev?prev.total:0, streakReached:true, threshold:S.streakCfg.threshold, weekendSkipped:true, finalized:false};
    S.dailyHistory[dateKey]=wkEntry;
    return wkEntry;
  }
  var dayTasks = tasksForDateKey(dateKey);
  if(!dayTasks.length) return prev||null;
  var am=getActiveMode();
  var thr=am&&am.lowThresh?am.lowThresh:S.streakCfg.threshold;
  var completed = dayTasks.filter(isDone).length; // cuántas quedaron 100% completas — para mostrar "3/5"
  // Pedido: el avance PARCIAL de una tarea con cantidad específica o con
  // checklist también debe contar como porcentaje parcial hacia el umbral
  // del día — antes una tarea a medias (ej. 7/10) sumaba 0 hasta llegar al
  // 100%. tRatio() ya calcula justo esa fracción (checklist: ítems
  // hechos/total; cantidad: prog/meta; check simple: 0 o 1).
  var partialSum = dayTasks.reduce(function(s,tk){return s+tRatio(tk);},0);
  var r = partialSum/dayTasks.length;
  var entry = {ratio:r, completed:completed, total:dayTasks.length, streakReached:r>=thr, threshold:thr, finalized:false};
  S.dailyHistory[dateKey]=entry;
  return entry;
}
// Recorre día a día desde el último día confirmado de racha hasta hoy,
// extendiendo la racha mientras cada día cumpla el umbral. El primer día
// que YA salió del período de gracia sin cumplir corta la racha ahí (pero
// se sigue avanzando por si algún día posterior ya está al día). Un día
// todavía en gracia (hoy, o ayer que aún puede completarse hasta el final
// de hoy) detiene el recorrido: ni suma ni corta la racha todavía.
function reconcileStreak(){
  if(S.simpleMode) return;
  if(!S.streak) S.streak={days:0,lastDate:null,total:0};
  var today = todayStr();
  var todayDate = parseLocalDate(today);
  var yesterdayKey = localDateStr(addDaysLocal(new Date(),-1));
  var cursor = S.streak.lastDate ? addDaysLocal(parseLocalDate(S.streak.lastDate),1) : todayDate;
  var guard=0;
  while(cursor <= todayDate && guard<3660){
    guard++;
    var cKey = localDateStr(cursor);
    var weekendSkipAllowed = S.streak.days>0; // ver BUGFIX en evaluateDayHistory
    var h = evaluateDayHistory(cKey, weekendSkipAllowed);
    if(h && h.streakReached){
      h.finalized = true;
      if(!streakActive()){
        // Racha desactivada (pero niveles activos, o modo simplificado ya
        // filtrado arriba): igual guardamos el historial del día — lo usa
        // el calendario y medallas por cumplimiento diario — pero no
        // tocamos el contador ni mostramos nada. lastDate avanza para no
        // tener que reprocesar estos días si se reactiva más adelante.
        S.streak.lastDate = cKey;
        cursor = addDaysLocal(cursor,1);
        continue;
      }
      var nd=S.streak.days+1, nt=(S.streak.total||0)+1;
      S.streak={days:nd,lastDate:cKey,total:nt};
      var bonus=0;
      if(nd%7===0)bonus+=5;
      if(nt%30===0)bonus+=7;
      if(nt%180===0)bonus+=30;
      checkAndUnlockAchievement(nd);
      if(bonus>0)addXP(bonus);
      if(cKey===today){
        setTimeout(function(){showStreakAchieved(nd,bonus);},900);
      } else if(cKey===yesterdayKey && !h.weekendSkipped){
        // Confirmado dentro del período de gracia — aviso breve, sin el
        // modal grande de racha (ese queda reservado para el día de "hoy").
        setTimeout(function(){toast('✅ Alcanzaste a completar ayer a tiempo — racha en '+nd+' 🔥');},400);
      }
      cursor = addDaysLocal(cursor,1);
      continue;
    }
    if(!h){ cursor = addDaysLocal(cursor,1); continue; } // día sin tareas: no altera la racha
    if(isWithinGracePeriod(cKey)) break; // todavía se puede completar — esperar
    // Gracia vencida sin alcanzar el umbral: la racha se corta en este día
    // (si está activa — si no, solo avanzamos el puntero sin tocar days/total).
    h.finalized = true;
    S.streak = streakActive() ? {days:0, lastDate:cKey, total:S.streak.total||0} : Object.assign({},S.streak,{lastDate:cKey});
    cursor = addDaysLocal(cursor,1);
  }
  saveState();
}
// Se llama tras cada tarea completada (hoy o, dentro del editor de un día
// pasado, ayer) para recalcular el historial y la racha al vuelo.
function checkStreakNow(){
  if(S.simpleMode)return; // Modo simplificado: sin racha
  reconcileStreak();
  render();
}

// ── Logros y Medallas ─────────────────────────────────────────────────────
// LOGROS (achievements): hitos de racha (30, 120, 365 días). Se desbloquean
//   en silencio (sin modal/aviso) y se ven en la pestaña Progreso.
// MEDALLAS (medals): acciones específicas. También en silencio.

var ACHIEVEMENT_DAYS = [30, 120, 365];
function checkAndUnlockAchievement(days){
  var unlocked = false;
  if(ACHIEVEMENT_DAYS.indexOf(days) !== -1) unlocked = true;
  if(days > 365 && days % 365 === 0) unlocked = true;
  if(unlocked){
    var ach = {id:'streak-'+days, days:days, dateUnlocked:new Date().toISOString()};
    if(!S.achievements)S.achievements=[];
    var exists = S.achievements.some(function(a){return a.id===ach.id;});
    if(!exists){
      S.achievements.push(ach);
      // Recompensa: XP según días de racha
      var xpBonus = days >= 365 ? 50 : days >= 120 ? 30 : 20;
      addXP(xpBonus);
      saveState();
      setTimeout(function(){
        playSound('achievement');
        showRewardToast('🏆 '+getAchievementName(days).title, '+'+xpBonus+' XP');
      }, 500);
    }
  }
}

// Verifica todas las medallas y desbloquea las que correspondan (sin aviso)
function checkMedals(){
  if(S.simpleMode)return; // Modo simplificado: sin medallas/logros
  if(!S.medals)S.medals = [];
  var changed = false;
  MEDALS_CATALOG.forEach(function(m){
    var already = S.medals.some(function(um){return um.id===m.id;});
    if(already)return;
    if(m.check()){
      S.medals.push({id:m.id, dateUnlocked:new Date().toISOString()});
      changed = true;
      // Entregar recompensa (si tiene) y mostrar el modal de medalla desbloqueada
      // con la medallita animada + confeti, en vez de un simple toast de texto.
      if(m.reward){
        if(m.reward.type === 'xp'){
          addXP(m.reward.value);
        } else if(m.reward.type === 'limit+1'){
          // Aumentar límite de tareas de la cuenta en 1 en todos los períodos
          if(!S.bonusTaskLimit) S.bonusTaskLimit = 0;
          S.bonusTaskLimit += m.reward.value;
        } else if(m.reward.type === 'trackslot+1'){
          // Cupo extra para seguimientos de nivel personalizados
          if(!S.bonusTrackSlots) S.bonusTrackSlots = 0;
          S.bonusTrackSlots += m.reward.value;
        }
      }
      setTimeout(function(medal){
        return function(){ queueMedalUnlocked(medal); };
      }(m), 800);
    }
  });
  if(changed) saveState();
}

function drawShareImage(days, totalCompleted, daysLogged){
  var canvas = document.getElementById('shareCanvas');
  if(!canvas)return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var name = getAchievementName(days);
  
  // Colores según tema (paleta cálida fija para legibilidad)
  var bgColor = '#f5ede0';
  var inkColor = '#1a1a1a';
  var accentColor = '#c97842';
  var inkSoftColor = '#3a3530';
  
  // Fondo con degradado
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#f5ede0');
  grad.addColorStop(1, '#e8c5a8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // Patrón decorativo: círculos sutiles
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = accentColor;
  for(var i=0;i<8;i++){
    ctx.beginPath();
    ctx.arc(W*Math.random(), H*Math.random(), 100+Math.random()*200, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Marco interior
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 4;
  ctx.strokeRect(80, 80, W-160, H-160);
  
  // Logo Gr. arriba
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 60px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('[', W/2 - 80, 200);
  ctx.fillText(']', W/2 + 80, 200);
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 70px Georgia, serif';
  ctx.fillText('Gr.', W/2, 210);
  
  // Subtítulo Gramific[app]
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 22px Arial, sans-serif';
  ctx.fillText('GRAMIFIC[APP]', W/2, 260);
  
  // Emoji grande del logro
  ctx.font = '180px Arial';
  ctx.fillText(name.emoji, W/2, 470);
  
  // Título del logro
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 64px Georgia, serif';
  ctx.fillText(name.title, W/2, 580);
  
  // Días destacados
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 220px Georgia, serif';
  ctx.fillText(days, W/2, 800);
  
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 32px Arial, sans-serif';
  ctx.fillText('DÍAS DE RACHA', W/2, 860);
  
  // Estadísticas en la parte de abajo
  ctx.fillStyle = inkColor;
  ctx.font = '600 26px Arial, sans-serif';
  if(totalCompleted > 0){
    ctx.fillText(totalCompleted + ' tareas completadas en ' + daysLogged + ' días activos', W/2, 940);
  }
  
  // Frase motivadora
  ctx.fillStyle = inkSoftColor;
  ctx.font = 'italic 22px Georgia, serif';
  var frase;
  if(days === 30) frase = '"Un mes de constancia"';
  else if(days === 120) frase = '"4 meses es ya un hábito"';
  else if(days === 365) frase = '"Un año entero... A pura perseverancia"';
  else frase = '"' + days + ' días de sudor y organización"';
  ctx.fillText(frase, W/2, 1000);
}

// On load: if last activity was 2+ days ago, reset streak — salvo que se
// haya activado "Libre los fines de semana" y el hueco sea puro sábado y
// domingo, en cuyo caso esos días se auto-completan y la racha sigue viva.
// Reparación única (bugfix): antes, un sábado/domingo con "fin de semana
// libre" se daba por cumplido sin condición, así que una racha ya rota
// podía "revivir" sola ese fin de semana sin haber hecho nada. Si la racha
// guardada termina justo en un tramo de días "regalados" por el fin de
// semana cuyo día anterior real NO estaba cumplido, se descuenta ese
// tramo inflado — una sola vez, al cargar la app.
function repairInflatedWeekendStreak(){
  if(!S.streak || !S.dailyHistory || !S.streak.days || !S.streak.lastDate) return;
  var cursor = parseLocalDate(S.streak.lastDate);
  var weekendRunLength = 0;
  var guard = 0;
  while(guard<10){
    guard++;
    var key = localDateStr(cursor);
    var entry = S.dailyHistory[key];
    if(!entry || !entry.weekendSkipped) break;
    weekendRunLength++;
    cursor = addDaysLocal(cursor, -1);
  }
  if(weekendRunLength===0) return; // la racha actual no termina en un finde regalado
  var beforeKey = localDateStr(cursor);
  var beforeEntry = S.dailyHistory[beforeKey];
  if(beforeEntry && beforeEntry.streakReached) return; // sí venía viva de antes — estaba bien

  var newDays = Math.max(0, S.streak.days - weekendRunLength);
  var newTotal = Math.max(0, (S.streak.total||0) - weekendRunLength);
  S.streak = {days:newDays, lastDate:beforeKey, total:newTotal};
  // Los días descontados quedan "sin finalizar" para volver a evaluarse
  // más adelante con la lógica ya corregida, en vez de quedar congelados.
  var rewalk = parseLocalDate(beforeKey);
  for(var i=0;i<weekendRunLength;i++){
    rewalk = addDaysLocal(rewalk, 1);
    var k = localDateStr(rewalk);
    if(S.dailyHistory[k]) S.dailyHistory[k].finalized = false;
  }
  saveState();
}
function checkStreakOnLoad(){
  // BUGFIX: new Date('YYYY-MM-DD') parsea como medianoche UTC; leer luego
  // .getDay() (local) sobre eso podía devolver el día de la semana
  // equivocado en husos con offset negativo como Chile. parseLocalDate
  // (usado dentro de reconcileStreak) arma la fecha con medianoche LOCAL,
  // que es lo que corresponde acá.
  repairInflatedWeekendStreak();
  reconcileStreak();
}

// ── Notificaciones (preguntar muy de a poco) ───────────────────────────────
// ── Sistema de spotlight / tour interactivo ────────────────────────────────
// Un "spotlight" es un overlay semitransparente que deja visible solo el
// elemento objetivo, con un tooltip anclado al costado. El usuario debe
// interactuar con el elemento resaltado para avanzar (o puede saltar).

var _tourActive = false;
var _tourSteps = [];
var _tourIdx = 0;
var _tourOnDone = null;

// Crear el DOM del spotlight (solo una vez)
function _ensureSpotlightDOM(){
  if(document.getElementById('sl-overlay')) return;
  var style = document.createElement('style');
  style.innerHTML = [
    '#sl-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;}',
    '#sl-cutout{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border-radius:12px;transition:all .35s cubic-bezier(.4,0,.2,1);}',
    '#sl-tooltip{position:absolute;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 14px;max-width:260px;max-height:calc(100vh - 24px);overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1);}',
    '#sl-tooltip .sl-title{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;}',
    '#sl-tooltip .sl-body{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;}',
    '#sl-tooltip .sl-action{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:5px;}',
    '#sl-tooltip .sl-nav{display:flex;gap:8px;align-items:center;}',
    '#sl-tooltip .sl-skip{flex:1;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:Inter,sans-serif;text-align:left;}',
    '#sl-tooltip .sl-next{background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}',
    '#sl-pulse{position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);animation:slpulse 1.4s infinite;pointer-events:none;}',
    '@keyframes slpulse{0%{transform:scale(.8);opacity:1;}100%{transform:scale(1.7);opacity:0;}}'
  ].join('');
  document.head.appendChild(style);
  var ov = document.createElement('div');
  ov.id = 'sl-overlay';
  ov.innerHTML = '<div id="sl-cutout"></div><div id="sl-pulse"></div><div id="sl-tooltip"></div>';
  document.body.appendChild(ov);
}

function _slPosition(step){
  var cutout = document.getElementById('sl-cutout');
  var tip = document.getElementById('sl-tooltip');
  var pulse = document.getElementById('sl-pulse');
  if(!cutout||!tip) return;

  var PAD = 10;
  var EDGE = 12; // margen mínimo respecto a los bordes de la pantalla
  var targetEl = step.target ? document.querySelector(step.target) : null;
  // window.innerHeight no siempre refleja el alto realmente visible en
  // celular (la barra de direcciones del navegador aparece/desaparece y lo
  // desincroniza) — visualViewport es más confiable cuando está disponible.
  var vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);

  // Medir el tooltip YA renderizado con su contenido real, en vez de asumir
  // una altura fija — el texto de cada paso varía, y en pantallas chicas o
  // con letra más grande (accesibilidad) puede ocupar bastante más de lo
  // esperado. getBoundingClientRect() da el tamaño real sin importar dónde
  // esté posicionado ahora mismo (max-width/max-height ya lo acotan).
  var tipRect = tip.getBoundingClientRect();
  var tipW = tipRect.width || 260;
  var tipH = tipRect.height || 200;

  if(targetEl){
    var r = targetEl.getBoundingClientRect();
    cutout.style.left = (r.left - PAD)+'px';
    cutout.style.top  = (r.top  - PAD)+'px';
    cutout.style.width  = (r.width  + PAD*2)+'px';
    cutout.style.height = (r.height + PAD*2)+'px';
    // Pulso en el centro del elemento
    pulse.style.display = 'block';
    pulse.style.left = (r.left + r.width/2 - 18)+'px';
    pulse.style.top  = (r.top + r.height/2 - 18)+'px';
    // Tooltip debajo o arriba, según cuál lado tiene espacio real suficiente
    // para la altura YA medida (no una estimación).
    var spaceBelow = vh - r.bottom - EDGE;
    var spaceAbove = r.top - EDGE;
    var top;
    if(spaceBelow >= tipH + 14){
      top = r.bottom + 14;
    } else if(spaceAbove >= tipH + 14){
      top = r.top - tipH - 14;
    } else {
      // No cabe cómodo ni arriba ni abajo (pantalla chica o texto largo):
      // se ubica del lado con más espacio disponible; si aún así no entra
      // completo, el propio tooltip scrollea internamente (ver overflow-y
      // en el CSS) en vez de quedar cortado sin forma de verlo.
      top = spaceBelow >= spaceAbove ? (r.bottom + 14) : Math.max(EDGE, r.top - tipH - 14);
    }
    // Clamp final: nunca permitir que el tooltip quede arriba/abajo del viewport
    top = Math.max(EDGE, Math.min(top, vh - tipH - EDGE));
    tip.style.top = top+'px';
    var tipX = Math.max(EDGE, Math.min(r.left, vw - tipW - EDGE));
    tip.style.left = tipX+'px';
  } else {
    // Sin elemento objetivo: centrado en pantalla, también acotado a lo que
    // realmente cabe.
    cutout.style.left='50%'; cutout.style.top='40%'; cutout.style.width='0'; cutout.style.height='0';
    pulse.style.display='none';
    tip.style.left = Math.max(EDGE, (vw-tipW)/2)+'px';
    tip.style.top  = Math.max(EDGE, Math.min((vh-tipH)/2, vh - tipH - EDGE))+'px';
  }
}

function _slRender(){
  _ensureSpotlightDOM();
  var ov = document.getElementById('sl-overlay');
  var tip = document.getElementById('sl-tooltip');
  if(!ov||!tip) return;
  ov.style.display = 'block';
  ov.style.pointerEvents = 'all'; // bloquea clics fuera del cutout

  var step = _tourSteps[_tourIdx];
  var total = _tourSteps.length;
  var dotsHTML = _tourSteps.map(function(_,i){
    return '<div style="width:'+(i===_tourIdx?18:5)+'px;height:5px;border-radius:3px;background:'+(i===_tourIdx?'var(--accent)':'var(--line)')+';transition:all .25s;display:inline-block;"></div>';
  }).join('');

  var actionHtml = step.action
    ? '<div class="sl-action"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'+step.action+'</div>'
    : '';
  var isLast = _tourIdx === total-1;

  tip.innerHTML =
    '<div style="display:flex;gap:4px;margin-bottom:12px;">'+dotsHTML+'</div>'+
    '<div class="sl-title">'+step.title+'</div>'+
    '<div class="sl-body">'+step.body+'</div>'+
    actionHtml+
    '<div class="sl-nav">'+
      '<button class="sl-skip" onclick="tourSkip()">Saltar tour</button>'+
      (!isLast
        ? '<button class="sl-next" onclick="tourNext()">Siguiente →</button>'
        : '<button class="sl-next" onclick="tourDone()">✓ Listo</button>'
      )+
    '</div>';

  // Posicionar después de que el DOM esté pintado con el contenido real (doble
  // rAF: dos frames de margen para que fuentes/layout ya estén asentados
  // antes de medir la altura real del tooltip).
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ _slPosition(step); });
  });

  // Hacer que el cutout sí deje pasar los clics al elemento objetivo
  var cutout = document.getElementById('sl-cutout');
  if(cutout){
    cutout.style.pointerEvents = 'none';
    // El overlay general bloquea todo — excepto los clics dentro del bbox del
    // elemento objetivo, que los dejamos pasar usando el truco de pointer-events
    // solo en la capa del tooltip y de la "máscara fuera".
  }
  // Si el paso tiene onEnter (navegar a la pestaña correcta), ejecutarlo
  if(step.onEnter) step.onEnter();
}

function tourNext(){
  if(_tourIdx < _tourSteps.length-1){ _tourIdx++; _slRender(); }
  else { tourDone(); }
}
function tourSkip(){ tourDone(); }
function tourDone(){
  // BUGFIX: antes esto solo OCULTABA el overlay (display:none) sin sacarlo
  // del DOM. Como se agrega con document.body.appendChild(), el sistema que
  // vincula el botón "atrás" con el historial lo detecta como un modal
  // abierto y le reserva una entrada de historial — pero si nunca se
  // elimina de verdad, esa entrada queda "fantasma" para siempre. Efecto:
  // la primera vez que el usuario presiona "atrás" después de ver CUALQUIER
  // tour (bienvenida, proyecto, subida de nivel...), el botón se gasta en
  // cerrar este overlay fantasma en vez de navegar, y hay que presionarlo
  // dos veces — la segunda además "salta" un paso de más porque el
  // navegador ya había retrocedido una posición real durante el intento
  // perdido. Eliminarlo de verdad deja que el mecanismo genérico de
  // modales sincronice el historial correctamente, como con cualquier otro
  // overlay que se cierra a mano.
  var ov = document.getElementById('sl-overlay');
  if(ov) ov.remove();
  _tourActive = false;
  if(_tourOnDone) _tourOnDone();
  _tourOnDone = null;
}
// Si el celular rota o cambia el alto disponible (p.ej. se abre el teclado,
// o el navegador muestra/oculta la barra de direcciones), recalculamos la
// posición del tooltip activo para que no quede mal ubicado.
window.addEventListener('resize', function(){
  if(_tourActive && _tourSteps[_tourIdx]) _slPosition(_tourSteps[_tourIdx]);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){
    if(_tourActive && _tourSteps[_tourIdx]) _slPosition(_tourSteps[_tourIdx]);
  });
}

// ── Centro de notificaciones ──────────────────────────────────────────────
// Pedido: una lista en vivo de todo lo que está realmente programado para

// diaria y aviso de racha — en vez de tener que adivinar entrando a cada
// tarea. Se aplica el horario de silencio (ver pushPastQuietHours) para que
// la hora mostrada sea la que de verdad va a sonar.
function buildNotificationAgenda(){
  var items = [];
  var now = new Date();
  (S.tasks||[]).filter(function(t){return isTaskToday(t) && t.hora && t.notif && t.notif.on && !isDone(t);}).forEach(function(t){
    var nt = t.notif||{hh:0,mm:15};
    var parts=(t.hora||'0:0').split(':');
    var taskTime = new Date(); taskTime.setHours(parseInt(parts[0],10)||0, parseInt(parts[1]||'0',10)||0,0,0);
    var alertTime = pushPastQuietHours(new Date(taskTime.getTime() - ((nt.hh||0)*60+(nt.mm||0))*60000));
    items.push({time:alertTime, icon:'🔔', color:'#e8875a', label:t.text, sub:(!nt.hh&&!nt.mm)?'A la hora de la tarea':'Recordatorio de tarea'});
  });
  (S.tasks||[]).filter(function(t){return isTaskToday(t) && t.reminder && t.reminder.time && !isDone(t);}).forEach(function(t){
    var parts=t.reminder.time.split(':');
    var d=new Date(); d.setHours(parseInt(parts[0],10)||0,parseInt(parts[1]||'0',10)||0,0,0);
    items.push({time:pushPastQuietHours(d), icon:'🔔', color:'#e8875a', label:t.text, sub:'Recordatorio independiente'});
  });
  if(S.dailyReviewReminder && S.dailyReviewReminder.on){
    var days = S.dailyReviewReminder.days;
    var todayEnabled = !days||!days.length||days.indexOf(todayIdx())!==-1;
    if(todayEnabled){
      var d2=new Date(); d2.setHours(S.dailyReviewReminder.hh||0,S.dailyReviewReminder.mm||0,0,0);
      items.push({time:pushPastQuietHours(d2), icon:'📋', color:'#3a7c8c', label:'Revisión diaria', sub:'Revisar y marcar tareas de hoy'});
    }
  }
  if(S.streakRisk && S.streakRisk.on){
    var d3=new Date(); d3.setHours(S.streakRisk.hh!=null?S.streakRisk.hh:21, S.streakRisk.mm||0,0,0);
    items.push({time:pushPastQuietHours(d3), icon:'🔥', color:'#c0503a', label:'Racha en riesgo', sub:'Solo si aún no llegas al umbral de hoy'});
  }
  items = items.filter(function(it){return it.time > now;});
  items.sort(function(a,b){return a.time-b.time;});
  return items;
}

// Programa el próximo aviso del recordatorio diario (hoy si no ha pasado
// todavía la hora elegida, si no mañana a la misma hora) y, al dispararse,
// se vuelve a programar sola para el día siguiente — así se mantiene
// funcionando mientras la pestaña/app siga abierta, sin depender de que
// el usuario reabra la app cada día.
// ── Horario de silencio ──────────────────────────────────────────────────
// Pedido: un rango horario (ej. 22:00–08:00) que ningún tipo de aviso
// interrumpa — en vez de cancelarlo, se pospone hasta que termine el
// silencio, para no perder el recordatorio del todo.
function isInQuietHours(date){
  var qh = S.quietHours;
  if(!qh || !qh.on) return false;
  var mins = date.getHours()*60+date.getMinutes();
  var start = (qh.startHH||0)*60+(qh.startMM||0);
  var end = (qh.endHH||0)*60+(qh.endMM||0);
  if(start===end) return false; // rango vacío = no bloquea nada
  if(start<end) return mins>=start && mins<end;
  return mins>=start || mins<end; // cruza medianoche (ej. 22:00–08:00)
}
function pushPastQuietHours(date){
  var qh = S.quietHours;
  if(!qh || !qh.on || !isInQuietHours(date)) return date;
  var end = new Date(date);
  end.setHours(qh.endHH||0, qh.endMM||0, 0, 0);
  if(end <= date) end.setDate(end.getDate()+1); // el fin del silencio cae "mañana"
  return end;
}
// Convierte el día de una fecha JS (getDay(): 0=domingo) al índice que usa
// el resto de la app para los días de la semana (DAYS[0]="Lunes"…6=Domingo).
function appDayOfWeek(date){ var d=date.getDay(); return d===0?6:d-1; }
// Chips rápidos para "¿cuánto antes avisar?" — cubren el 95% de los casos
// (justo a la hora / 5 / 15 / 30 / 60 min antes) en un solo toque, en vez de
// tener que ir sumando de a 1 minuto con los botones +/- de más abajo.
// Columna reutilizable de un stepper +/- (horas o minutos) — usada como
// ajuste fino de respaldo debajo de los chips rápidos.
function stepperColumn(fnName, spanId, val, label){
  return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">'+
    '<button type="button" onclick="'+fnName+'(1)" style="width:32px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;cursor:pointer;color:var(--ink);">+</button>'+
    '<span id="'+spanId+'" style="font-size:20px;font-weight:800;color:var(--ink);min-width:38px;text-align:center;font-variant-numeric:tabular-nums;">'+String(val).padStart(2,'0')+'</span>'+
    '<button type="button" onclick="'+fnName+'(-1)" style="width:32px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;cursor:pointer;color:var(--ink);">−</button>'+
    '<span style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">'+label+'</span>'+
  '</div>';
}
var NOTIF_PRESETS = [0,5,15,30,60];
function notifPresetChips(hh, mm, setFnName){
  var totalMin = (hh||0)*60+(mm||0);
  return '<div style="display:flex;gap:6px;margin-bottom:10px;">'+
    NOTIF_PRESETS.map(function(p){
      var active = totalMin===p;
      var label = p===0?'A la hora':(p<60?p+' min':(p/60)+'h');
      return '<button type="button" onclick="'+setFnName+'('+p+')" style="flex:1;padding:8px 2px;border-radius:9px;border:1.5px solid '+(active?'var(--accent)':'var(--line)')+';background:'+(active?'var(--accent-bg)':'var(--paper)')+';color:'+(active?'var(--accent)':'var(--muted)')+';font-size:10.5px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">'+label+'</button>';
    }).join('')+
  '</div>';
}
// Texto de vista previa — pedido: mostrar tal cual lo que va a decir el
// aviso, en vez de solo los números de configuración.
function notifPreviewText(taskName, hh, mm){
  var isExact = !hh && !mm;
  if(isExact) return '“Es la hora: '+taskName+'”';
  var pre = (hh?hh+'h ':'') + (mm?mm+'min ':'');
  return '“En '+pre.trim()+': '+taskName+'”';
}

function scheduleDailyReviewReminder(){
  if(!S.dailyReviewReminder || !S.dailyReviewReminder.on) return;
  if(S.notifPermission !== 'granted') return;
  if(typeof Notification === 'undefined') return;
  var now = new Date();
  var target = new Date();
  target.setHours(S.dailyReviewReminder.hh||0, S.dailyReviewReminder.mm||0, 0, 0);
  if(target <= now) target.setDate(target.getDate()+1); // ya pasó hoy: programar para mañana
  target = pushPastQuietHours(target);
  var msUntil = target - now;
  var timer = setTimeout(function(){
    // Pedido: elegir en qué días de la semana quieres este aviso — se
    // revisa recién al momento de sonar (si hoy no está marcado, se salta
    // en silencio y se reprograma para el día siguiente igual).
    var days = S.dailyReviewReminder.days;
    var todayEnabled = !days || !days.length || days.indexOf(appDayOfWeek(new Date()))!==-1;
    if(todayEnabled){
      new Notification('Gramifica', {body:'Es hora de revisar tus tareas de hoy y marcar las que ya tengas listas ✓', icon:'/icon-192.png'});
    }
    scheduleDailyReviewReminder(); // se reprograma para el día siguiente
  }, msUntil);
  _notifTimers.push(timer);
}
// ── Aviso de racha en riesgo ─────────────────────────────────────────────
// Pedido: a una hora fija de la tarde/noche, si todavía no se llega al
// umbral del día (con el mismo cálculo de avance parcial que usa la racha),
// avisa para que alcances a reaccionar antes de perderla.
function scheduleStreakRiskWarning(){
  if(!S.streakRisk || !S.streakRisk.on) return;
  if(S.notifPermission !== 'granted') return;
  if(typeof Notification === 'undefined') return;
  var now = new Date();
  var target = new Date();
  target.setHours(S.streakRisk.hh!=null?S.streakRisk.hh:21, S.streakRisk.mm||0, 0, 0);
  if(target <= now) target.setDate(target.getDate()+1);
  target = pushPastQuietHours(target);
  var msUntil = target - now;
  var timer = setTimeout(function(){
    try{
      if(streakActive() && !(S.streakCfg&&S.streakCfg.skipWeekends&&isWeekend())){
        var dayTasks = S.tasks.filter(function(t){return isTaskToday(t);});
        if(dayTasks.length){
          var partial = dayTasks.reduce(function(s,tk){return s+tRatio(tk);},0);
          var ratio = partial/dayTasks.length;
          var am = getActiveMode();
          var thr = (am&&am.lowThresh) ? am.lowThresh : (S.streakCfg?S.streakCfg.threshold:0.7);
          if(ratio < thr){
            new Notification('Gramifica', {body:'🔥 Tu racha está en riesgo — llevas '+Math.round(ratio*100)+'% de '+Math.round(thr*100)+'% hoy. ¡Todavía puedes lograrlo!', icon:'/icon-192.png'});
          }
        }
      }
    }catch(e){}
    scheduleStreakRiskWarning();
  }, msUntil);
  _notifTimers.push(timer);
}

// ── Recordatorio independiente (desde el menú ⋯ de una tarea) ──────────────
// A diferencia del recordatorio dentro de "Editar tarea" (que exige activar
// "Definir horario específico" y avisa X tiempo ANTES de esa hora), este se
// pone directamente desde el menú ⋯ de la tarea, sin requerir horario, y
// guarda una hora exacta de aviso (t.reminder.time = 'HH:MM').
function openReminderPopup(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var existing = (t.reminder && t.reminder.time) ? t.reminder.time.split(':') : null;
  RM = {taskId:id, hh: existing?parseInt(existing[0],10):9, mm: existing?parseInt(existing[1],10):0};
  renderReminderPopup();
}
function renderReminderPopup(){
  removeOverlay('reminder-modal');
  var t = S.tasks.find(function(x){return x.id===RM.taskId;});
  if(!t) return;
  var hasExisting = !!(t.reminder && t.reminder.time);
  var overlay=document.createElement('div');overlay.className='overlay';overlay.id='reminder-modal';
  overlay.addEventListener('click',function(e){if(e.target===overlay)removeOverlay('reminder-modal');});
  overlay.innerHTML='<div class="sheet" style="max-width:340px;">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'+
      '<span class="serif" style="font-weight:700;font-size:18px;">🔔 Recordatorio</span>'+
      '<button onclick="removeOverlay(\'reminder-modal\')" style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;">×</button>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;">Elige la hora a la que quieres recibir un aviso para "'+esc(t.text)+'". No es necesario que la tarea tenga un horario específico.</div>'+
    '<div style="display:flex;justify-content:center;margin-bottom:10px;">'+
      '<input type="time" id="rm-time-input" value="'+String(RM.hh).padStart(2,'0')+':'+String(RM.mm).padStart(2,'0')+'" onchange="rmSetTime(this.value)" style="font-size:22px;font-weight:800;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--bg);font-family:Inter,sans-serif;">'+
    '</div>'+
    '<div id="rm-preview" style="font-size:11px;color:var(--accent);text-align:center;font-style:italic;margin-bottom:16px;">“Recordatorio: '+esc(t.text)+'” a las '+String(RM.hh).padStart(2,'0')+':'+String(RM.mm).padStart(2,'0')+'</div>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="sbtn" onclick="saveReminder()">Guardar</button>'+
      (hasExisting?'<button class="cbtn" onclick="removeReminder()" style="color:var(--bad);">Quitar</button>':'<button class="cbtn" onclick="removeOverlay(\'reminder-modal\')">Cancelar</button>')+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}
// Reemplaza los +/- de a 1 minuto: el input nativo type="time" ya trae su
// propio selector (rueda en iOS, reloj en Android), mucho más rápido para
// elegir una hora exacta que ir tocando de a un minuto.
function rmSetTime(val){
  if(!RM || !val) return;
  var p = val.split(':');
  RM.hh = parseInt(p[0],10)||0;
  RM.mm = parseInt(p[1]||'0',10)||0;
  var t = S.tasks.find(function(x){return x.id===RM.taskId;});
  var prev = document.getElementById('rm-preview');
  if(prev && t) prev.textContent = '“Recordatorio: '+t.text+'” a las '+String(RM.hh).padStart(2,'0')+':'+String(RM.mm).padStart(2,'0');
}
function saveReminder(){
  if(!RM) return;
  var t = S.tasks.find(function(x){return x.id===RM.taskId;});
  if(!t){ RM=null; return; }
  t.reminder = {time: String(RM.hh).padStart(2,'0')+':'+String(RM.mm).padStart(2,'0')};
  saveState();
  scheduleNotifications();
  removeOverlay('reminder-modal');
  toast('🔔 Recordatorio guardado');
  RM=null;
  render();
}
function removeReminder(){
  if(!RM) return;
  var t = S.tasks.find(function(x){return x.id===RM.taskId;});
  if(t) delete t.reminder;
  saveState();
  scheduleNotifications();
  removeOverlay('reminder-modal');
  toast('Recordatorio eliminado');
  RM=null;
  render();
}

// ── Programador de notificaciones locales ──────────────────────────────────
// Usa la Web Notifications API para agendar un aviso por cada tarea del día
// que el usuario haya marcado explícitamente con "🔔 Recordatorio para esta
// tarea" (opt-in por tarea, no automático). Los timers se recrean cada vez
// que cambia la configuración o al abrir la app (los timers no persisten
// entre sesiones — cuando se integre FCM, esto pasa a ser serverless y
// persistente).
var _notifTimers = [];
function scheduleNotifications(){
  // Limpiar timers anteriores
  _notifTimers.forEach(function(t){clearTimeout(t);});
  _notifTimers = [];
  if(S.notifPermission !== 'granted') return;
  if(typeof Notification === 'undefined') return;
  var today = todayIdx();
  var now = new Date();
  // Solo tareas que el usuario activó explícitamente con "🔔 Recordatorio
  // para esta tarea" — ya no se avisa automáticamente para toda tarea con
  // hora definida, cada una se elige a propósito.
  var todayTasks = (S.tasks||[]).filter(function(t){
    return isTaskToday(t) && t.hora && t.notif && t.notif.on && !isDone(t);
  });
  todayTasks.forEach(function(t){
    var nt = t.notif || {hh:0, mm:15};
    var parts = t.hora.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
    var taskTime = new Date();
    taskTime.setHours(h, m, 0, 0);
    // Restar el aviso anticipado según configuración de ESTA tarea (hh horas + mm minutos)
    var alertTime = new Date(taskTime.getTime() - ((nt.hh||0)*60 + (nt.mm||0))*60000);
    alertTime = pushPastQuietHours(alertTime); // pedido: horario de silencio pospone, no cancela
    var msUntil = alertTime - now;
    if(msUntil < 0) return; // ya pasó hoy
    var taskName = t.text;
    var isExact = !nt.hh && !nt.mm;
    var pre = isExact ? '' : (nt.hh?nt.hh+'h ':'') + (nt.mm?nt.mm+'min ':'');
    // Sin esc() aquí: la Notification API del sistema muestra texto plano,
    // no HTML, así que escapar (& → &amp;, etc.) mostraría entidades literales.
    var body = isExact
      ? 'Es la hora: '+taskName
      : 'En '+pre.trim()+': '+taskName;
    var timer = setTimeout(function(){
      new Notification('Gramifica', {body: body, icon: '/icon-192.png'});
    }, msUntil);
    _notifTimers.push(timer);
  });
  // Recordatorios independientes puestos desde el menú ⋯ (t.reminder.time),
  // no requieren que la tarea tenga "horario específico" activado.
  var reminderTasks = (S.tasks||[]).filter(function(t){
    return isTaskToday(t) && t.reminder && t.reminder.time && !isDone(t);
  });
  reminderTasks.forEach(function(t){
    var parts = t.reminder.time.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
    var alertTime = new Date();
    alertTime.setHours(h, m, 0, 0);
    alertTime = pushPastQuietHours(alertTime);
    var msUntil = alertTime - now;
    if(msUntil < 0) return; // ya pasó hoy
    var taskName = t.text;
    var timer = setTimeout(function(){
      new Notification('Gramifica', {body: 'Recordatorio: '+taskName, icon: '/icon-192.png'});
    }, msUntil);
    _notifTimers.push(timer);
  });
  // Recordatorio diario de revisión y aviso de racha en riesgo (Yo →
  // Notificaciones) — independientes de las tareas del día, se reprograman
  // solos día a día (ver sus funciones).
  scheduleDailyReviewReminder();
  scheduleStreakRiskWarning();
  if(_notifTimers.length) console.log('[Notif] '+_notifTimers.length+' recordatorio(s) programado(s) para hoy');
}

// ── Init ───────────────────────────────────────────────────────────────────

// 🐛 REPORTE AUTOMÁTICO DE ERRORES (Opción A — Crashlytics web)
// Captura errores JS no controlados y los guarda en Firestore → colección
// 'crash_reports'. Cuando la app esté empaquetada en Android, el SDK nativo
// de Firebase Crashlytics reemplaza esto con reportes mucho más detallados.
// ════════════════════════════════════════════════════════════════════════════
window.onerror = function(msg, src, line, col, err){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   String(msg).slice(0,300),
      src:   String(src).slice(0,200),
      line:  line, col: col,
      stack: err && err.stack ? err.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ua:    navigator.userAgent.slice(0,120),
      ver:   '3.0'
    });
  } catch(e){ /* no propagar errores del propio reporter */ }
  return false; // no suprimir el error en consola
};
window.addEventListener('unhandledrejection', function(ev){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   'UnhandledPromise: '+(ev.reason ? String(ev.reason).slice(0,300) : 'unknown'),
      stack: ev.reason && ev.reason.stack ? ev.reason.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ver:   '3.0'
    });
  } catch(e){}
});

// ── Swipe horizontal en #content — animación suave + circular ──────────────
(function(){
  var c = document.getElementById('content');
  if(!c) return;

  var sx=0, sy=0, startTime=0;
  var dragging=false, axis=null; // null | 'x' | 'y'
  var swipeMode=null; // null | 'hoy' | 'plan' | 'energia' — se fija en touchstart
  // Pedido: que deslizar ENCIMA de la grilla semanal (no solo del título de
  // la fecha) también pueda cambiar de semana. La grilla también scrollea
  // horizontalmente sola cuando no entran todas las columnas, así que si el
  // gesto arrancó ahí dejamos que ese scroll nativo ocurra normal (no lo
  // seguimos con nuestra animación) y solo si el arrastre total termina
  // siendo GRANDE lo tomamos como "cambiar de semana" al soltar el dedo.
  var weekGridDrag=false;

  // Overlay de feedback visual durante el drag
  var ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;font-size:40px;';
  document.body.appendChild(ghost);

  function isDefaultLayout(){ return (S.interfaceLayout||'default')==='default'; }
  function isHoy(){ return (S.tab==='hoy'||S.tab==='dia') && isDefaultLayout(); }
  // Energía (Modos / Plantillas) se puede recorrer deslizando, igual que
  // los días en Hoy. Pedido: Plan (Objetivos/Progreso) ya NO cambia de
  // subpestaña al deslizar — dentro de Calendarios, en cambio, deslizar
  // mueve entre meses o semanas (ver mode 'calendarios' más abajo).
  function energiaSubtabs(){ return ['modos','plantillas']; }
  function currentSwipeMode(){
    if(!isDefaultLayout()) return null;
    if(S.tab==='hoy'||S.tab==='dia') return 'hoy';
    if(S.tab==='horario') return 'calendarios';
    // Pedido: dentro de Plan → Objetivos, deslizar mueve entre semana/mes/
    // semestre/año — pero OJO, esto no debe dispararse en Progreso ni en
    // Calendarios (que ya tienen su propio significado para el swipe), así
    // que se agrega como modo aparte, distinto de 'calendarios'.
    if(S.tab==='plan'||S.tab==='objetivos') return 'objetivos';
    if(S.tab==='energia'||S.tab==='modos'||S.tab==='plantillas') return 'energia';
    return null;
  }
  function currentSubtab(mode){
    if(mode==='energia') return (S.tab==='plantillas')?'plantillas':'modos';
    return null;
  }
  // Dentro de Calendarios → Semanal hay una grilla que se desplaza
  // horizontalmente por sí misma (ver id="horario-scroll-wrap") cuando no
  // entran todas las columnas; si el gesto empieza ahí Y hace falta ese
  // scroll, dejamos que sea un scroll normal en vez de cambiar de semana.
  function startedOnHorarioScroll(target){
    var wrap = document.getElementById('horario-scroll-wrap');
    return !!(wrap && wrap.contains(target) && wrap.scrollWidth > wrap.clientWidth + 4);
  }
  // BUGFIX: la barra de categorías ("Todas / Estudio / Trabajo / ...") en
  // Hoy también se desplaza horizontalmente cuando hay muchas categorías —
  // sin este chequeo, arrastrar el dedo ahí para ver las categorías de más
  // a la derecha se interpretaba a la vez como "cambiar de día", y los dos
  // gestos se pisaban entre sí.
  function startedOnCatTabsScroll(target){
    var wrap = document.getElementById('cat-tabs-bar');
    return !!(wrap && wrap.contains(target) && wrap.scrollWidth > wrap.clientWidth + 4);
  }

  c.addEventListener('touchstart', function(e){
    swipeMode = currentSwipeMode();
    if(!swipeMode) return;
    weekGridDrag = false;
    if(swipeMode==='calendarios' && (S.calendariosSubTab||'semanal')==='semanal' && startedOnHorarioScroll(e.target)){
      weekGridDrag = true; // se sigue registrando el gesto, pero sin el efecto de "seguir el dedo" (ver touchmove/touchend)
    } else if(swipeMode==='hoy' && startedOnCatTabsScroll(e.target)){
      swipeMode = null; // dejar que la barra de categorías scrollee normalmente
      return;
    }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    dragging = true;
    axis = null;
    c.style.transition = 'none';
  }, {passive:true});

  c.addEventListener('touchmove', function(e){
    if(!dragging||!swipeMode) return;
    var dx = e.touches[0].clientX - sx;
    var dy = e.touches[0].clientY - sy;

    // Determinar eje al inicio del gesto
    if(!axis){
      if(Math.abs(dx)>8||Math.abs(dy)>8){
        axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      }
      return;
    }
    if(axis !== 'x') return;
    // Si el gesto empezó sobre la grilla semanal, se deja que scrollee sola
    // (no se sigue el dedo con nuestra traslación) — recién se decide si
    // fue "cambiar de semana" al soltar, según qué tan largo fue en total.
    if(weekGridDrag) return;

    // Seguir el dedo con traslación suave
    c.style.transform = 'translateX('+dx*0.35+'px)';

    // Sin overlay — la animación de salida ya da el feedback
  }, {passive:true});

  c.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    ghost.style.opacity = '0';

    if(!swipeMode || axis !== 'x'){
      c.style.transition = 'transform .2s ease';
      c.style.transform = '';
      axis = null;
      swipeMode = null;
      weekGridDrag = false;
      return;
    }

    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    var elapsed = Date.now() - startTime;
    // Pedido: si el gesto arrancó sobre la grilla semanal (que también
    // scrollea sola), se pide un arrastre bastante más largo ("deslizar
    // harto") antes de tomarlo como "cambiar de semana", para no
    // pelearse con el scroll corto y normal de la grilla.
    var threshold = weekGridDrag ? 110 : (elapsed < 250 ? 30 : 60); // swipe rápido = menos recorrido requerido

    if(Math.abs(dx) < threshold || Math.abs(dy) > Math.abs(dx)*0.9){
      // Cancelar — volver al lugar con rebote (si fue un drag de grilla,
      // la transformación de #content nunca se tocó, así que este reset
      // es inofensivo de todas formas)
      c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
      c.style.transform = '';
      axis = null;
      swipeMode = null;
      weekGridDrag = false;
      return;
    }

    // Si es Energía pero solo tiene 1-2 sub-pestañas, calculamos a cuál
    // saltar; si el modo es 'hoy' seguimos con la lógica original de día.
    var mode = swipeMode;
    var goRight = dx > 0; // dedo hacia la derecha = ítem anterior (día/pestaña/mes/semana previo)
    var nextSubtab = null;
    if(mode==='energia'){
      var subtabs = energiaSubtabs();
      var cur = currentSubtab(mode);
      var idx = subtabs.indexOf(cur);
      if(idx<0) idx=0;
      if(subtabs.length<2){ // nada a donde ir — cancelar con rebote
        c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
        c.style.transform = '';
        axis = null; swipeMode = null; weekGridDrag = false;
        return;
      }
      var nextIdx = goRight ? (idx===0?subtabs.length-1:idx-1) : (idx===subtabs.length-1?0:idx+1);
      nextSubtab = subtabs[nextIdx];
    }

    // Pedido: dentro de Calendarios, deslizar mueve entre meses/semanas —
    // pero sin re-animar la pestaña Plan entera (subpestañas, toggle
    // Semanal/Mensual, cabecera del mes, agenda de abajo...), que se sentía
    // como un refresh de golpe. En Mensual, además, ahora es un deslizamiento
    // de verdad (no un fundido): el mes se va entero hacia un lado mientras
    // el que entra se ve "acercarse" desde el borde opuesto — para eso usa
    // su propio recorte (#cal-days-viewport, con overflow:hidden). En
    // Semanal se mantiene el fundido suave de siempre, acotado a la grilla.
    if(mode==='calendarios'){
      c.style.transition = 'transform .12s ease-out';
      c.style.transform = '';
      var calSub = S.calendariosSubTab||'semanal';
      var isMonthSlide = calSub==='mensual';
      var targetId = isMonthSlide ? 'cal-days-viewport' : 'horario-scroll-wrap';
      var calAreaBefore = document.getElementById(targetId);
      if(calAreaBefore){
        if(isMonthSlide){
          calAreaBefore.style.transition = 'transform .16s ease-out';
          calAreaBefore.style.transform = 'translateX('+(goRight?'100%':'-100%')+')';
        } else {
          calAreaBefore.style.transition = 'transform .14s ease-out, opacity .14s';
          calAreaBefore.style.transform = 'translateX('+(goRight?'-8%':'8%')+')';
          calAreaBefore.style.opacity = '0';
        }
      }
      setTimeout(function(){
        var sub = S.calendariosSubTab||'semanal';
        if(sub==='mensual'){
          if(S.calGridExpanded!==false) calNav(goRight?-1:1);
          else calNavWeek(goRight?-1:1);
        } else {
          weekNav(goRight?-1:1);
        }
        var calAreaAfter = document.getElementById(targetId);
        if(calAreaAfter){
          if(isMonthSlide){
            calAreaAfter.style.transition = 'none';
            calAreaAfter.style.transform = 'translateX('+(goRight?'-100%':'100%')+')';
            requestAnimationFrame(function(){
              requestAnimationFrame(function(){
                calAreaAfter.style.transition = 'transform .22s cubic-bezier(.25,.46,.45,.94)';
                calAreaAfter.style.transform = '';
              });
            });
          } else {
            calAreaAfter.style.transition = 'none';
            calAreaAfter.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
            calAreaAfter.style.opacity = '0';
            requestAnimationFrame(function(){
              requestAnimationFrame(function(){
                calAreaAfter.style.transition = 'transform .18s ease-out, opacity .16s';
                calAreaAfter.style.transform = '';
                calAreaAfter.style.opacity = '1';
              });
            });
          }
        }
      }, 160);
      axis = null;
      swipeMode = null;
      weekGridDrag = false;
      return;
    }

    // Pedido: dentro de Objetivos, deslizar cambia de período (semana → mes
    // → semestre → año) de forma fluida — pero solo en esa área
    // (period-tab-row + lista de tareas), sin re-animar ni reconstruir las
    // 3 pestañas de Plan de arriba ni nada más. Mismo tipo de deslizamiento
    // "de verdad" que usa el mes en Calendarios (un lado se va, el otro
    // entra desde el borde opuesto), acotado a #objetivos-swipe-area.
    if(mode==='objetivos'){
      c.style.transition = 'transform .12s ease-out';
      c.style.transform = '';
      var periods = enabledGoalPeriods();
      var curIdx = periods.indexOf(S.period);
      if(curIdx<0) curIdx = 0;
      if(periods.length<2){ // nada a donde ir — cancelar con rebote
        c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
        c.style.transform = '';
        axis = null; swipeMode = null; weekGridDrag = false;
        return;
      }
      // dedo hacia la derecha (goRight) = período anterior, igual que el resto de los gestos
      var nextPeriodIdx = goRight ? (curIdx===0?periods.length-1:curIdx-1) : (curIdx===periods.length-1?0:curIdx+1);
      var objArea = document.getElementById('objetivos-swipe-area');
      if(objArea){
        objArea.style.transition = 'transform .16s ease-out';
        objArea.style.transform = 'translateX('+(goRight?'100%':'-100%')+')';
      }
      setTimeout(function(){
        S.period = periods[nextPeriodIdx];
        var objAreaAfter = document.getElementById('objetivos-swipe-area');
        if(objAreaAfter){
          objAreaAfter.innerHTML = renderObjetivosSwipeArea();
          objAreaAfter.style.transition = 'none';
          objAreaAfter.style.transform = 'translateX('+(goRight?'-100%':'100%')+')';
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){
              objAreaAfter.style.transition = 'transform .22s cubic-bezier(.25,.46,.45,.94)';
              objAreaAfter.style.transform = '';
            });
          });
        }
      }, 160);
      axis = null;
      swipeMode = null;
      weekGridDrag = false;
      return;
    }

    // Transición suave: fade + pequeño desplazamiento (misma animación para
    // día y sub-pestañas de Energía)
    c.style.transition = 'transform .14s ease-out, opacity .14s';
    c.style.transform = 'translateX('+(goRight?'-8%':'8%')+')';
    c.style.opacity = '0';

    setTimeout(function(){
      if(mode==='hoy'){
        if(goRight){
          S.day = S.day === 0 ? 6 : S.day - 1;
        } else {
          S.day = S.day === 6 ? 0 : S.day + 1;
        }
        c.style.transition = 'none';
        c.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
        c.style.opacity = '0';
        c.scrollTop = 0;
        render();
      } else {
        c.style.transition = 'none';
        c.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
        c.style.opacity = '0';
        c.scrollTop = 0;
        setTab(nextSubtab); // ya hace render() y toca el sonido de cambio de pestaña
      }
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          c.style.transition = 'transform .18s ease-out, opacity .16s';
          c.style.transform = '';
          c.style.opacity = '1';
        });
      });
    }, 130);

    axis = null;
    swipeMode = null;
    weekGridDrag = false;
  }, {passive:true});

  // Limpiar si se cancela el touch
  c.addEventListener('touchcancel', function(){
    dragging = false;
    axis = null;
    swipeMode = null;
    weekGridDrag = false;
    ghost.style.opacity = '0';
    c.style.transition = 'transform .2s ease';
    c.style.transform = '';
    c.style.opacity = '1';
  }, {passive:true});
})();

// ── Botón "atrás" del sistema (o gesto de volver) ───────────────────────────
// Por defecto, en una SPA como esta, el botón físico/gesto de "atrás" del
// celular sale directamente de la app: el navegador nunca se enteró de que
// "cambiaste de pestaña" o "abriste un modal", porque todo eso pasa
// reemplazando el HTML de la página en vez de navegar de verdad. Esto lo
// arregla apoyándose en la History API:
//   1) Cada modal/overlay que se agrega a <body> (editar tarea, confirmar
//      eliminar, menús ⋯, etc.) empuja una entrada al historial. Si se cierra
//      "a mano" (Guardar/Cancelar/click afuera), sincronizamos retrocediendo
//      nosotros mismos para no dejar una entrada fantasma.
//   2) Cada cambio de pestaña real (setTab) también empuja una entrada — ver
//      más arriba.
// Al presionar "atrás", primero se cierra el modal más reciente si hay uno
// abierto; si no hay ninguno, se vuelve a la pestaña anterior. Solo cuando ya
// no queda nada de esto en el historial de la app, "atrás" vuelve a hacer lo
// de siempre (salir / volver a la página anterior fuera de la app).
(function(){
  var trackedModals = []; // pila de nodos <div> de modales/overlays abiertos
  var handlingPop = false;   // true mientras cerramos algo en respuesta a "atrás"
  var syntheticBack = false; // true cuando somos NOSOTROS quienes llamamos history.back()

  function isTrackable(node){
    // Cualquier elemento agregado directamente a <body> de aquí en adelante
    // cuenta como "modal": overlays de tareas, confirmaciones, menús ⋯, hojas
    // de opciones, animaciones de logro, etc. Los elementos permanentes
    // (contenido, nav inferior, toast, splash, el "ghost" del swipe...) ya
    // existían antes de empezar a observar, así que nunca disparan esto.
    return node.nodeType === 1 && node.parentNode === document.body;
  }

  var mo = new MutationObserver(function(mutations){
    mutations.forEach(function(m){
      if(m.addedNodes) m.addedNodes.forEach(function(node){
        if(!isTrackable(node) || handlingPop) return;
        try{ history.pushState({navModal:true}, ''); }catch(e){}
        trackedModals.push(node);
      });
      if(m.removedNodes) m.removedNodes.forEach(function(node){
        var idx = trackedModals.indexOf(node);
        if(idx === -1) return;
        var wasTop = idx === trackedModals.length - 1;
        trackedModals.splice(idx, 1);
        // Se cerró "a mano" (botón Guardar/Cancelar/tocar afuera). Si era el
        // que estaba arriba de la pila, sincronizamos el historial
        // retrocediendo nosotros para no dejar una entrada fantasma. Si no
        // era el de arriba (p.ej. una animación que se autodestruye mientras
        // hay otro modal abierto encima), no tocamos el historial para no
        // cerrar el modal equivocado.
        if(!handlingPop && wasTop){
          syntheticBack = true;
          try{ history.back(); }catch(e){ syntheticBack = false; }
        }
      });
    });
  });
  mo.observe(document.body, {childList:true});

  function closeTopModal(){
    var node = trackedModals[trackedModals.length-1];
    if(!node) return;
    handlingPop = true;
    if(node.id==='project-view'){
      // BUGFIX: la vista de proyecto no es un overlay genérico — abrirla
      // oculta a mano la barra de pestañas inferior (openProjectView) y solo
      // closeProjectView() sabe restaurarla (además de limpiar
      // S.activeProjectId y volver a renderizar). Si acá se usaba el mismo
      // removeOverlay() genérico de cualquier modal, el nodo se borraba pero
      // la barra inferior se quedaba oculta para siempre al volver con el
      // botón "atrás" del celular. Iba de la mano de este mismo cierre
      // "por atrás", que closeProjectView() no maneja: al llamarlo desde
      // acá, su propio ov.remove() dispara este mismo observer, pero como
      // handlingPop ya está en true no se vuelve a tocar el historial.
      try{ closeProjectView(); }catch(e){ if(node.parentNode) node.remove(); }
    } else if(node.id==='timer-run'){
      // Mismo motivo que project-view: la sesión de temporizador tiene
      // limpieza propia (cancelar sonidos programados, parar el intervalo,
      // soltar el wake lock) que removeOverlay() genérico no conoce — sin
      // esto, salir con el botón atrás dejaba sonidos fantasma programados
      // y la pantalla sin poder apagarse nunca más.
      try{ closeTimerRun(); }catch(e){ if(node.parentNode) node.remove(); }
    } else if(node.id){
      // Reutiliza el mismo fade-out que ya usa el resto de la app para cerrar
      try{ removeOverlay(node.id); }catch(e){ if(node.parentNode) node.remove(); }
    } else if(node.parentNode){
      node.remove();
    }
    trackedModals.pop();
    setTimeout(function(){ handlingPop = false; }, 220);
  }

  window.addEventListener('popstate', function(e){
    if(syntheticBack){ syntheticBack = false; return; }
    if(trackedModals.length){
      closeTopModal();
      return;
    }
    // Pedido: Yo ahora navega entre una lista de categorías y pantallas
    // dedicadas (ver openYoScreen/closeYoScreen) — el botón atrás del
    // celular debe volver de a un paso ahí también, igual que con los
    // modales. navYoScreen puede ser null (volver a la lista principal).
    if(e.state && 'navYoScreen' in e.state){
      S.yoScreen = e.state.navYoScreen;
      if(S.yoScreen===null) S._yoFrom = null;
      var cYo = document.getElementById('content'); if(cYo) cYo.scrollTop = 0;
      render();
      return;
    }
    var targetTab = (e.state && e.state.navTab) ? e.state.navTab : 'hoy';
    if(targetTab !== S.tab){
      _tabHistorySuspended = true;
      setTab(targetTab);
      _tabHistorySuspended = false;
    }
  });
})();
// ── Auto-actualización: si hay una versión nueva publicada, recargar ─────
// Al volver de segundo plano Android reanuda la página vieja sin recargarla.
// Aquí se compara APP_VERSION con version.json (siempre pedido sin caché).
// Los datos viven en localStorage/Firebase, que NO se tocan al recargar.
// IMPORTANTE: al publicar una versión nueva, cambiar el número aquí Y en version.json.
var APP_VERSION = '2026.10.02.2';
function checkForUpdate(){
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(v){
      if(!v || !v.version || v.version === APP_VERSION) return;
      if(typeof TR !== 'undefined' && TR && !TR.finished) return; // no cortar un temporizador en curso
      var ae = document.activeElement;
      if(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;      // no perder lo que se está escribiendo
      try{
        if(sessionStorage.getItem('og6-reloaded-for') === v.version) return; // evita bucles
        sessionStorage.setItem('og6-reloaded-for', v.version);
      }catch(e){}
      location.reload();
    })
    .catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') checkForUpdate();
});
window.addEventListener('pageshow', function(e){ if(e.persisted) checkForUpdate(); });
checkForUpdate();
loadState();           // Cargar datos guardados en localStorage (¡debe ir primero!)
// Registrar el service worker — necesario para que Android considere la
// app instalable como PWA (modo standalone sin barra de navegador) y para
// que Firebase Cloud Messaging pueda mostrar avisos con la app cerrada.
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('firebase-messaging-sw.js').catch(function(e){
      console.warn('No se pudo registrar el service worker:', e);
    });
  });
}
// BUGFIX: trackVisit() existía pero nunca se invocaba desde ningún lado, así
// que S.visitHistory quedaba vacío para siempre y las medallas "Presente"
// (7 días seguidos) y "Habitual" (30 días) eran imposibles de conseguir.
trackVisit();          // Registrar la visita de hoy
checkMedals();         // Revisar medallas al iniciar
checkStreakOnLoad();
var _bootAutoReset = checkAutoReset();      // Reinicio automático por período (ver checkAutoReset)
advanceRecurringEvents(); // Adelantar eventos "cada N días" cuya fecha ya pasó
render();
announceAutoReset(_bootAutoReset);
setTimeout(function(){
  var sp=document.getElementById('splash');
  if(sp){sp.classList.add('hide');setTimeout(function(){sp.remove();},600);}
  // Tutorial inicial (si no se ha visto)
  setTimeout(maybeShowTutorial, 600);
  // Show reset notification on weekend (after splash)
  setTimeout(checkResetNotification, 400);
  // Preguntar permiso de notificaciones (de forma muy poco insistente)
  setTimeout(maybeAskNotifPermission, 5000);
},1600);
</script>
