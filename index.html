function tplSetDay(d){
  TPL.currentDay = d;
  // Actualizar solo las partes que cambian sin re-crear el modal entero (evita scroll reset)
  var overlay = document.getElementById('tpl-modal');
  if(!overlay){ showTemplateModal(); return; }
  
  // Actualizar tabs
  DAYS.forEach(function(name,i){
    var count = TPL.tasks.filter(function(t){return t.day===i;}).length;
    var btn = document.getElementById('tpl-day-btn-'+i);
    if(btn){
      btn.style.background = i===d ? 'var(--accent)' : 'transparent';
      btn.style.color = i===d ? 'white' : 'var(--muted)';
      btn.innerHTML = name.slice(0,3)+(count?'<span style="display:block;font-size:9px;opacity:.8;">'+count+'</span>':'');
    }
  });
  
  // Actualizar lista de tareas y botón de agregar
  var area = document.getElementById('tpl-list');
  if(area) area.innerHTML = tplItemsHTML();
  var addBtn = document.getElementById('tpl-add-btn');
  if(addBtn) addBtn.textContent = '+ Agregar tarea para '+DAYS[d];
  var copyBtn = document.getElementById('tpl-copy-btn');
  if(copyBtn) copyBtn.textContent = 'Copiar tareas de '+DAYS[d]+' a todos los días';
}
function tplItemsHTML(){
  var dayTasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  if(!dayTasks.length)return '<div class="empty" style="padding:14px 0;font-size:13px;">Sin tareas para '+DAYS[TPL.currentDay]+'.</div>';
  return dayTasks.map(function(t){
    var i = TPL.tasks.indexOf(t);
    var hasQty = (t.qty||1)>1;
    return '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;">'+
      '<div style="display:flex;gap:6px;align-items:center;">'+
        (t.crucial?'<span style="color:var(--accent);font-size:13px;flex-shrink:0;">★</span>':'')+
        '<input value="'+esc(t.text)+'" oninput="tplUpdateText('+i+',this.value)" placeholder="Nombre de la tarea" style="flex:1;border:none;border-bottom:1px solid var(--line);outline:none;font-size:14px;background:transparent;padding:4px 0;font-family:Inter,sans-serif;color:var(--ink);"/>'+
        '<button onclick="tplToggleCrucial('+i+')" title="Crucial" style="background:none;border:none;color:'+(t.crucial?'var(--accent)':'var(--muted-soft)')+';font-size:14px;cursor:pointer;padding:0 4px;">★</button>'+
        '<button onclick="tplRemoveTask('+i+')" style="background:none;border:none;color:var(--muted-soft);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;">×</button>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;color:var(--muted);">'+
        '<span style="cursor:pointer;" onclick="tplToggleQty('+i+')">'+(hasQty?'✓ Cantidad: '+t.qty:'+ Cantidad')+'</span>'+
        (hasQty?'<button class="qb" style="width:24px;height:24px;font-size:14px;" onclick="tplQty('+i+',-1)">−</button><button class="qb" style="width:24px;height:24px;font-size:14px;" onclick="tplQty('+i+',1)">+</button>':'')+
      '</div>'+
    '</div>';
  }).join('');
}
function tplUpdateText(i,v){TPL.tasks[i].text=v;}
function tplToggleCrucial(i){TPL.tasks[i].crucial=!TPL.tasks[i].crucial;tplRerender();}
function tplAddTask(){TPL.tasks.push({text:'',qty:1,prog:0,crucial:false,checklist:[],links:{},day:TPL.currentDay});tplRerender();}
function tplRemoveTask(i){TPL.tasks.splice(i,1);tplRerender();}
function tplToggleQty(i){if((TPL.tasks[i].qty||1)>1){TPL.tasks[i].qty=1;}else{TPL.tasks[i].qty=3;}tplRerender();}
function tplQty(i,d){TPL.tasks[i].qty=Math.max(2,(TPL.tasks[i].qty||2)+d);tplRerender();}
function tplCopyToAllDays(){
  var dayTasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  if(!dayTasks.length){toast('No hay tareas para copiar');return;}
  TPL.tasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  for(var d=0;d<7;d++){
    if(d===TPL.currentDay)continue;
    dayTasks.forEach(function(t){TPL.tasks.push(Object.assign({},t,{day:d}));});
  }
  showTemplateModal();
  toast('✓ Copiado a todos los días');
}
function tplRerender(){
  var area=document.getElementById('tpl-list');if(!area)return;
  area.innerHTML=tplItemsHTML();
}
function tplSave(){
  var nameInp = document.getElementById('tpl-name');
  var name = nameInp ? nameInp.value.trim() : TPL.name;
  if(!name){toast('Ponele un nombre a la plantilla');return;}
  var clean = TPL.tasks.filter(function(t){return t.text&&t.text.trim();}).map(function(t){
    return {
      text:t.text.trim(),
      qty:t.qty||1,
      prog:0,
      crucial:!!t.crucial,
      checklist:t.checklist||[],
      links:t.links||{},
      done:false,
      period:'dia',
      day:t.day===undefined?0:t.day
    };
  });
  
  if(!S.templates) S.templates = [];
  var existing = S.templates.find(function(t){return t.id===TPL.templateId;});
  if(existing){
    existing.name = name;
    existing.tasks = clean;
  } else {
    S.templates.push({
      id: TPL.templateId,
      name: name,
      tasks: clean,
      created: new Date().toISOString()
    });
  }
  removeOverlay('tpl-modal');
  saveState();
  checkMedals();
  render();
  toast('✓ Plantilla guardada');
}

function renderWeekSchedule(){
  if(!(S.templates||[]).length) return '';
  var html='<div class="card" style="margin-top:18px;">'+
    '<div style="font-weight:700;font-size:15px;color:var(--ink);margin-bottom:6px;">📅 Programar semanas</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:14px;">Asigná una plantilla a las próximas semanas. Se aplicará automáticamente.</div>';
  
  for(var i=1;i<=4;i++){
    var weekKey = nextWeekKey(i);
    var assignedId = S.weekSchedule[weekKey];
    var assigned = assignedId ? S.templates.find(function(t){return t.id===assignedId;}) : null;
    var weekDate = new Date();
    weekDate.setDate(weekDate.getDate() + i*7);
    var dow = weekDate.getDay(); if(dow===0) dow=7;
    var monday = new Date(weekDate.getTime() - (dow-1)*86400000);
    var label = i===1 ? 'Próxima semana' : i===2 ? 'En 2 semanas' : i===3 ? 'En 3 semanas' : 'En 4 semanas';
    var dateLabel = monday.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;background:var(--bg);border-radius:10px;">'+
      '<div style="flex:1;">'+
        '<div style="font-size:13px;font-weight:600;color:var(--ink);">'+label+'</div>'+
        '<div style="font-size:10px;color:var(--muted);">desde '+dateLabel+'</div>'+
      '</div>'+
      '<select onchange="setWeekTemplate(\''+weekKey+'\',this.value)" style="background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-family:Inter,sans-serif;color:var(--ink);">'+
        '<option value="">Sin plantilla</option>'+
        S.templates.map(function(t){return '<option value="'+t.id+'"'+(assignedId===t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+
      '</select>'+
    '</div>';
  }
  
  html+='</div>';
  return html;
}

function setWeekTemplate(weekKey, tplId){
  if(!S.weekSchedule) S.weekSchedule = {};
  if(tplId) S.weekSchedule[weekKey] = tplId;
  else delete S.weekSchedule[weekKey];
  saveState();
  toast(tplId?'✓ Plantilla programada':'Programación quitada');
}

function applyTemplateNow(tplId){
  var tpl = (S.templates||[]).find(function(t){return t.id===tplId;});
  if(!tpl) return;
  var box=document.createElement('div');box.className='conf-box';
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">Aplicar "'+esc(tpl.name)+'"</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;">Tus tareas diarias actuales se reemplazarán con las de la plantilla. Las tareas semanales/mensuales/etc. se mantienen.</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<button class="sbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove();_applyTemplate(\''+tplId+'\');">Aplicar</button>'+
      '<button class="cbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove();">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
}

function _applyTemplate(tplId){
  var tpl = (S.templates||[]).find(function(t){return t.id===tplId;});
  if(!tpl) return;
  // Backup tareas actuales
  S.taskBackup = {timestamp:new Date().toISOString(), tasks:JSON.parse(JSON.stringify(S.tasks))};
  // Reemplazar tareas del día
  var nonDay = S.tasks.filter(function(t){return t.period!=='dia';});
  var newDayTasks = (tpl.tasks||[]).map(function(t){
    return Object.assign({},t,{
      id:uid(),
      done:false,prog:0,
      day: t.day===undefined?0:t.day,
      checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
    });
  });
  S.tasks = nonDay.concat(newDayTasks);
  S.activeTemplate = tplId;
  S.weekSchedule[getWeekKey()] = tplId;
  saveState();render();
  toast('✓ Plantilla aplicada');
}

function clearActiveTemplate(){
  if(S.taskBackup){
    var box2 = document.createElement('div'); box2.className='conf-box';
    box2.innerHTML='<div class="conf-inner"><div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">Restaurar tareas</div>'+
      '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">¿Restaurar las tareas guardadas antes de activar el modo?</div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="sbtn" onclick="(function(){if(S.taskBackup&&S.taskBackup.tasks)S.tasks=S.taskBackup.tasks;S.taskBackup=null;S.activeTemplate=null;saveState();render();document.querySelector(\'.conf-box\').remove();})()">Restaurar</button>'+
        '<button class="cbtn" onclick="(function(){S.taskBackup=null;S.activeTemplate=null;delete S.weekSchedule[getWeekKey()];saveState();render();document.querySelector(\'.conf-box\').remove();})()">No restaurar</button>'+
      '</div></div>';
    document.body.appendChild(box2);
    return;
  }
  S.activeTemplate = null;
  delete S.weekSchedule[getWeekKey()];
  saveState();render();
  toast('Plantilla quitada');
}

function tapTask(id){
  var t=S.tasks.find(function(t){return t.id===id;});if(!t)return;
  if(t.checklist&&t.checklist.length){expCL(id);return;}
  var wasDone=isDone(t),updated;
  var oldProg = t.prog||0;
  if((t.qty||1)>1){
    var next=(t.prog||0)>=t.qty?0:(t.prog||0)+1;
    updated=Object.assign({},t,{prog:next,done:next>=t.qty});
  }else{updated=Object.assign({},t,{done:!t.done})};
  // Calcular cuánto avanzó (delta)
  var newProg = updated.prog || (updated.done?1:0);
  var delta = newProg - oldProg;
  finishUpdate(updated, !wasDone && isDone(updated), delta);
}
function tapCL(taskId,itemId){
  var t=S.tasks.find(function(t){return t.id===taskId;});if(!t)return;
  var wasDone=isDone(t);
  var oldDone = t.checklist.filter(function(i){return i.done;}).length;
  var newCL=t.checklist.map(function(i){return i.id===itemId?Object.assign({},i,{done:!i.done}):i;});
  var newDone = newCL.filter(function(i){return i.done;}).length;
  var updated=Object.assign({},t,{checklist:newCL,done:newCL.every(function(i){return i.done;})});
  var delta = newDone - oldDone;
  finishUpdate(updated, !wasDone && isDone(updated), delta);
}

  var cl=document.getElementById('cl-'+id),exp=document.getElementById('exp-'+id);if(!cl)return;
  var open=cl.style.display==='none'||cl.style.display==='';
  cl.style.display=open?'block':'none';
  if(exp)exp.style.transform=open?'rotate(180deg)':'none';
}
function finishUpdate(updated, justCompleted, delta){
  S.tasks=S.tasks.map(function(t){return t.id===updated.id?updated:t;});
  S._justCompletedId = justCompleted ? updated.id : null;
  saveState();
  render();
  S._justCompletedId = null; // limpiar para que el pop no se repita en próximos renders
  if(justCompleted){
    if(!S.rewardedTaskIds[updated.id]){
      S.rewardedTaskIds[updated.id]=true;
      addXP(PT[updated.period]||1);
      saveState();
    }
  }
  // Propagar según el modo de vinculación
  propagate(updated, justCompleted, delta||0);
  if(justCompleted) checkStreakNow();
}
// Propaga a las tareas vinculadas según el linkMode:
//   'unit' (default): cada unidad de la hija suma 1 unidad al padre
//   'completion': solo al completar 100% la hija suma 1 unidad al padre
function propagate(t, justCompleted, delta){
  var links=t.links||{};
  var linkMode = t.linkMode || 'unit';
  Object.keys(links).forEach(function(period){
    var tid=links[period];if(!tid||tid===true)return;
    var parent=S.tasks.find(function(p){return p.id===tid;});if(!parent)return;
    var wasDone=isDone(parent);
    var addAmount = 0;
    if(linkMode === 'unit'){
      // Cada unidad de la hija = 1 al padre. Usar delta.
      addAmount = delta || 0;
    } else if(linkMode === 'completion'){
      // Solo al completar la hija al 100% suma 1
      if(justCompleted) addAmount = 1;
    }
    if(addAmount === 0) return;
    var newProg = Math.max(0, Math.min((parent.prog||0)+addAmount, parent.qty||1));
    var nowDone = newProg >= (parent.qty||1);
    var updParent = Object.assign({},parent,{prog:newProg, done:nowDone});
    S.tasks = S.tasks.map(function(tt){return tt.id===tid?updParent:tt;});
    var parentJustCompleted = !wasDone && nowDone;
    if(parentJustCompleted){
      if(!S.rewardedTaskIds[tid]){
        S.rewardedTaskIds[tid]=true;
        addXP(PT[parent.period]||1);
        saveState();
      }
    }
    // Propagar recursivamente (con su delta también)
    propagate(updParent, parentJustCompleted, addAmount);
  });
}

// ── Reset logic: only allowed Sat/Sun, once per weekend ────────────────────
function isWeekend(){
  // Ilimitado: cualquier día es válido para reiniciar
  if(isIlimitado()) return true;
  var d=new Date().getDay();
  return d===0||d===6;
}

// Tracks if reset has been used this weekend (key = ISO date of Saturday)
function getCurrentWeekendKey(){
  var d=new Date();
  var dow=d.getDay();
  if(dow===6)return d.toISOString().slice(0,10);
  if(dow===0){
    var sat=new Date(d.getTime()-86400000);
    return sat.toISOString().slice(0,10);
  }
  return null;
}

function resetUsedThisWeekend(){
  // Ilimitado: no hay restricción de "una vez por fin de semana"
  if(isIlimitado()) return false;
  var key=getCurrentWeekendKey();
  if(!key)return false;
  return localStorage.getItem('og6-reset-used')===key;
}
function markResetUsed(){
  var key=getCurrentWeekendKey();
  if(key)localStorage.setItem('og6-reset-used',key);
}

function confirmReset(){
  // Disabled if not weekend or already used
  if(!isWeekend()||resetUsedThisWeekend()){
    showInfoModal(TEXTS.resetDisabledTitle,TEXTS.resetDisabledBody,TEXTS.resetButton.split(' ')[0]);
    return;
  }
  var box=document.createElement('div');box.className='conf-box';
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">'+TEXTS.resetConfirmTitle+'</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5;">'+TEXTS.resetConfirmBody+'</div>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="sbtn" style="font-size:13px;background:var(--bad);" onclick="doReset();this.closest(\'.conf-box\').remove()">Reiniciar</button>'+
      '<button class="cbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
}
function doReset(){
  // Reinicio de semana: solo tareas de tipo 'dia' y 'semana'
  S.tasks = S.tasks.map(function(t){
    if(t.period === 'dia' || t.period === 'semana'){
      return Object.assign({},t,{done:false,prog:0,checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false});})});
    }
    return t;
  });
  // Limpiar anti-farming para tareas reseteadas
  S.tasks.filter(function(t){return t.period==='dia'||t.period==='semana';}).forEach(function(t){
    if(S.rewardedTaskIds) delete S.rewardedTaskIds[t.id];
  });
  S.taskBlocks = {};
  S.resetUsedCount = (S.resetUsedCount||0) + 1;
  markResetUsed();
  saveState();
  checkMedals();
  render();
  toast('✓ Tareas de la semana reiniciadas');
}

// ── Auto reset on Monday 4 AM ──────────────────────────────────────────────
function checkAutoReset(){
  var now=new Date();
  var dow=now.getDay(); // Mon=1
  var hour=now.getHours();
  var todayKey=now.toISOString().slice(0,10);
  if(dow===1&&hour>=4&&S.lastAutoReset!==todayKey){
    // Auto reset
    S.tasks=S.tasks.map(function(t){return Object.assign({},t,{done:false,prog:0,checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false});})});});
    S.rewardedTaskIds={};
    S.taskBlocks={};
    S.lastAutoReset=todayKey;
    
    // Aplicar plantilla programada para esta semana, si hay
    var thisWeek = getWeekKey();
    var scheduledTplId = S.weekSchedule ? S.weekSchedule[thisWeek] : null;
    if(scheduledTplId){
      var tpl = (S.templates||[]).find(function(t){return t.id===scheduledTplId;});
      if(tpl){
        // Reemplazar tareas del día con las de la plantilla
        var nonDay = S.tasks.filter(function(t){return t.period!=='dia';});
        var newDayTasks = (tpl.tasks||[]).map(function(t){
          return Object.assign({},t,{
            id:uid(),done:false,prog:0,
            day: t.day===undefined?0:t.day,
            checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
          });
        });
        S.tasks = nonDay.concat(newDayTasks);
        S.activeTemplate = scheduledTplId;
      }
    }
    saveState();
  }
}

// ── Time picker helpers (desde / hasta) ──────────────────────────────────────────────────────────────
function mHoraTo12(hora24){
  if(!hora24) return '';
  var parts = hora24.split(':');
  var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
  var ampm = h < 12 ? 'AM' : 'PM';
  var h12 = h % 12 || 12;
  return h12 + ':' + (m<10?'0':'')+m + ' ' + ampm;
}
function mHoraToMins(hora24){
  if(!hora24) return 0;
  var p = hora24.split(':');
  return parseInt(p[0],10)*60 + parseInt(p[1]||'0',10);
}
function mMinsToHora(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  var h = Math.floor(mins/60), m = mins%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function mAddMins(hora24, mins){
  return mMinsToHora(mHoraToMins(hora24) + mins);
}
function mDurLabel(mins){
  if(!mins) return '';
  var h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+'h '+m+' min';
  if(h) return h === 1 ? '1 hora' : h+' horas';
  return m+' min';
}
function mBuildPickerOptions(selected, anchor, which){
  var html = '';
  for(var h=0;h<24;h++){
    for(var m=0;m<60;m+=15){
      var val = (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
      if(which === 'hasta' && anchor && mHoraToMins(val) <= mHoraToMins(anchor)) continue;
      var label = mHoraTo12(val);
      var durLabel = '';
      if(anchor){
        var diff = mHoraToMins(val) - mHoraToMins(anchor);
        if(diff > 0) durLabel = mDurLabel(diff);
      }
      var isActive = val === selected;
      html += '<button type="button" onclick="mPickTime(\''+which+'\',\''+val+'\')" style="'+
        'display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;'+
        'padding:11px 16px;border:none;background:'+(isActive?'var(--accent-bg)':'transparent')+';'+
        'font-family:Inter,sans-serif;font-size:14px;font-weight:'+(isActive?'700':'500')+';'+
        'color:'+(isActive?'var(--accent)':'var(--ink)')+';cursor:pointer;'+
        'border-radius:0;border-bottom:1px solid var(--line-soft);">'+
        '<span>'+label+'</span>'+
        (durLabel?'<span style="font-size:12px;color:var(--muted);font-weight:400;">'+durLabel+'</span>':'')+
      '</button>';
    }
  }
  return html;
}
function mPickTime(which, val){
  if(which === 'desde'){
    M.hora = val;
    var hastaVal = mAddMins(val, M.duracion||60);
    var lbl = document.getElementById('m-desde-label');
    if(lbl) lbl.textContent = mHoraTo12(val);
    var hastaLbl = document.getElementById('m-hasta-label');
    if(hastaLbl) hastaLbl.textContent = mHoraTo12(hastaVal);
    var hastaDD = document.getElementById('m-hasta-dropdown');
    if(hastaDD) hastaDD.innerHTML = mBuildPickerOptions(hastaVal, val, 'hasta');
    var desdeDD = document.getElementById('m-desde-dropdown');
    if(desdeDD) desdeDD.innerHTML = mBuildPickerOptions(val, null, 'desde');
  } else {
    var durMins = mHoraToMins(val) - mHoraToMins(M.hora||'09:00');
    if(durMins <= 0) return;
    M.duracion = durMins;
    var lbl = document.getElementById('m-hasta-label');
    if(lbl) lbl.textContent = mHoraTo12(val);
    var hastaDD = document.getElementById('m-hasta-dropdown');
    if(hastaDD) hastaDD.innerHTML = mBuildPickerOptions(val, M.hora||'09:00', 'hasta');
  }
  var badge = document.getElementById('m-dur-badge');
  if(badge) badge.textContent = mDurLabel(M.duracion||60);
  var dd = document.getElementById('m-'+which+'-dropdown');
  if(dd) dd.style.display = 'none';
  _pickerOpen = null;
  document.removeEventListener('click', mPickerOutsideClose);
}
var _pickerOpen = null;
function mTogglePicker(which){
  var dd = document.getElementById('m-'+which+'-dropdown');
  if(!dd) return;
  var other = which === 'desde' ? 'hasta' : 'desde';
  var otherDD = document.getElementById('m-'+other+'-dropdown');
  if(otherDD) otherDD.style.display = 'none';
  if(_pickerOpen === which){
    dd.style.display = 'none';
    _pickerOpen = null;
    document.removeEventListener('click', mPickerOutsideClose);
    return;
  }
  _pickerOpen = which;
  dd.style.display = 'block';
  setTimeout(function(){
    var active = dd.querySelector('[style*="var(--accent-bg)"]');
    if(active) active.scrollIntoView({block:'center'});
    else {
      var btns = dd.querySelectorAll('button');
      if(btns.length) btns[Math.min(4,btns.length-1)].scrollIntoView({block:'start'});
    }
    document.addEventListener('click', mPickerOutsideClose);
  }, 30);
}
function mPickerOutsideClose(e){
  if(!_pickerOpen) return;
  var wrap = document.getElementById('m-picker-'+_pickerOpen+'-wrap');
  if(wrap && !wrap.contains(e.target)){
    var dd = document.getElementById('m-'+_pickerOpen+'-dropdown');
    if(dd) dd.style.display = 'none';
    _pickerOpen = null;
    document.removeEventListener('click', mPickerOutsideClose);
  }
}

  }

function mSave(){
  var nameEl=document.getElementById('m-name');if(!nameEl)return;
  var name=nameEl.value.trim();
  if(!name){nameEl.style.borderBottomColor='var(--bad)';nameEl.focus();return;}
  // Checklist only allowed for day tasks
  var isDay=M.task.period==='dia';
  var cl=(isDay&&M.hasCL)?M.checklist.filter(function(i){return i.text.trim();}):[];
  var qty=M.hasQty?Math.max(2,M.qty):1;
  var prog=M.hasQty?Math.min(M.task.prog||0,qty):0;
  var done_=cl.length?cl.every(function(i){return i.done;}):(qty>1?prog>=qty:!!M.task.done);
  var saved=Object.assign({},M.task,{text:name,checklist:cl,qty:qty,prog:prog,done:done_,links:M.links,crucial:isDay?!!M.crucial:false,linkMode:M.linkMode||'unit',categoryId:isDay?(M.categoryId||null):null,hora:isDay?(M.hora||null):null,duracion:isDay?(M.duracion||60):60});
  if(M.isNew){S.tasks.push(saved);}else{S.tasks=S.tasks.map(function(t){return t.id===saved.id?saved:t;});}
  removeOverlay('task-modal');saveState();checkMedals();render();
}

// ── Streak: live check after each task completion ──────────────────────────
function checkStreakNow(){
  if(S.simpleMode)return; // Modo simplificado: sin racha
  var today=todayStr();
  if(S.streak.lastDate===today)return;
  var dayTasks=S.tasks.filter(function(t){return t.period==='dia'&&t.day===todayIdx();});
  if(!dayTasks.length)return;
  var am=getActiveMode();
  var thr=am&&am.lowThresh?am.lowThresh:S.streakCfg.threshold;
  var r=dayTasks.filter(isDone).length/dayTasks.length;
  // Guardar siempre el ratio del día en el historial (cumplido o no)
  if(!S.dailyHistory)S.dailyHistory={};
  S.dailyHistory[today]={
    ratio:r,
    completed:dayTasks.filter(isDone).length,
    total:dayTasks.length,
    streakReached:r>=thr,
    threshold:thr
  };
  if(r>=thr){
    var nd=S.streak.days+1,nt=(S.streak.total||0)+1;
    S.streak={days:nd,lastDate:today,total:nt};
    var bonus=0;
    if(nd%7===0)bonus+=5;
    if(nt%30===0)bonus+=7;
    if(nt%180===0)bonus+=30;
    saveState();
    // Verificar logros (30, 120, 365 días) y mostrar imagen creativa
    checkAndUnlockAchievement(nd);
    // Show streak modal AFTER xp toast so they don't overlap
    setTimeout(function(){showStreakAchieved(nd,bonus);},900);
    if(bonus>0)addXP(bonus);
    render();
  } else {
    saveState();
  }
}

var ACHIEVEMENT_DAYS = [30, 120, 365];
function checkAndUnlockAchievement(days){
  var unlocked = false;
  if(ACHIEVEMENT_DAYS.indexOf(days) !== -1) unlocked = true;
  if(days > 365 && days % 365 === 0) unlocked = true;
  if(unlocked){
    var ach = {id:'streak-'+days, days:days, dateUnlocked:new Date().toISOString()};
    if(!S.achievements)S.achievements=[];
    var exists = S.achievements.some(function(a){return a.id===ach.id;});
    if(!exists){
      S.achievements.push(ach);
      // Recompensa: XP según días de racha
      var xpBonus = days >= 365 ? 50 : days >= 120 ? 30 : 20;
      addXP(xpBonus);
      saveState();
      setTimeout(function(){
        showRewardToast('🏆 '+getAchievementName(days).title, '+'+xpBonus+' XP');
      }, 500);
    }
  }
}

// Verifica todas las medallas y desbloquea las que correspondan (sin aviso)
function checkMedals(){
  if(S.simpleMode)return; // Modo simplificado: sin medallas/logros
  if(!S.medals)S.medals = [];
  var changed = false;
  MEDALS_CATALOG.forEach(function(m){
    var already = S.medals.some(function(um){return um.id===m.id;});
    if(already)return;
    if(m.check()){
      S.medals.push({id:m.id, dateUnlocked:new Date().toISOString()});
      changed = true;
      // Primera medalla: mostrar mini-tutorial
      if(S.medals.length === 1){ showFirstMedalTip(); }
      // Entregar recompensa
      if(m.reward){
        if(m.reward.type === 'xp'){
          addXP(m.reward.value);
          setTimeout(function(title, label){
            return function(){showRewardToast('🎖️ '+title, label);}
          }(m.title, m.reward.label), 800);
        } else if(m.reward.type === 'limit+1'){
          // Aumentar límite de tareas de la cuenta en 1 en todos los períodos
          if(!S.bonusTaskLimit) S.bonusTaskLimit = 0;
          S.bonusTaskLimit += m.reward.value;
          setTimeout(function(title, label){
            return function(){showRewardToast('🎖️ '+title, label);}
          }(m.title, m.reward.label), 800);
        }
      }
    }
  });
  if(changed) saveState();
}

function drawShareImage(days, totalCompleted, daysLogged){
  var canvas = document.getElementById('shareCanvas');
  if(!canvas)return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var name = getAchievementName(days);
  
  // Colores según tema (paleta cálida fija para legibilidad)
  var bgColor = '#f5ede0';
  var inkColor = '#1a1a1a';
  var accentColor = '#c97842';
  var inkSoftColor = '#3a3530';
  
  // Fondo con degradado
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#f5ede0');
  grad.addColorStop(1, '#e8c5a8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // Patrón decorativo: círculos sutiles
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = accentColor;
  for(var i=0;i<8;i++){
    ctx.beginPath();
    ctx.arc(W*Math.random(), H*Math.random(), 100+Math.random()*200, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Marco interior
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 4;
  ctx.strokeRect(80, 80, W-160, H-160);
  
  // Logo OG arriba
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 60px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('[', W/2 - 80, 200);
  ctx.fillText(']', W/2 + 80, 200);
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 70px Georgia, serif';
  ctx.fillText('OG', W/2, 210);
  
  // Subtítulo Organiz[app]
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 22px Arial, sans-serif';
  ctx.fillText('ORGANIZ[APP]', W/2, 260);
  
  // Emoji grande del logro
  ctx.font = '180px Arial';
  ctx.fillText(name.emoji, W/2, 470);
  
  // Título del logro
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 64px Georgia, serif';
  ctx.fillText(name.title, W/2, 580);
  
  // Días destacados
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 220px Georgia, serif';
  ctx.fillText(days, W/2, 800);
  
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 32px Arial, sans-serif';
  ctx.fillText('DÍAS DE RACHA', W/2, 860);
  
  // Estadísticas en la parte de abajo
  ctx.fillStyle = inkColor;
  ctx.font = '600 26px Arial, sans-serif';
  if(totalCompleted > 0){
    ctx.fillText(totalCompleted + ' tareas completadas en ' + daysLogged + ' días activos', W/2, 940);
  }
  
  // Frase motivadora
  ctx.fillStyle = inkSoftColor;
  ctx.font = 'italic 22px Georgia, serif';
  var frase;
  if(days === 30) frase = '"Un mes de constancia"';
  else if(days === 120) frase = '"4 meses es ya un hábito"';
  else if(days === 365) frase = '"Un año entero... A pura perseverancia"';
  else frase = '"' + days + ' días de sudor y organización"';
  ctx.fillText(frase, W/2, 1000);
}

    '#sl-tooltip .sl-next{background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}',
    '#sl-pulse{position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);animation:slpulse 1.4s infinite;pointer-events:none;}',
    '@keyframes slpulse{0%{transform:scale(.8);opacity:1;}100%{transform:scale(1.7);opacity:0;}}'
  ].join('');
  document.head.appendChild(style);
  var ov = document.createElement('div');
  ov.id = 'sl-overlay';
  ov.innerHTML = '<div id="sl-cutout"></div><div id="sl-pulse"></div><div id="sl-tooltip"></div>';
  document.body.appendChild(ov);
}

function _slPosition(step){
  var cutout = document.getElementById('sl-cutout');
  var tip = document.getElementById('sl-tooltip');
  var pulse = document.getElementById('sl-pulse');
  if(!cutout||!tip) return;

  var PAD = 10;
  var targetEl = step.target ? document.querySelector(step.target) : null;
  var vw = window.innerWidth, vh = window.innerHeight;

  if(targetEl){
    var r = targetEl.getBoundingClientRect();
    cutout.style.left = (r.left - PAD)+'px';
    cutout.style.top  = (r.top  - PAD)+'px';
    cutout.style.width  = (r.width  + PAD*2)+'px';
    cutout.style.height = (r.height + PAD*2)+'px';
    // Pulso en el centro del elemento
    pulse.style.display = 'block';
    pulse.style.left = (r.left + r.width/2 - 18)+'px';
    pulse.style.top  = (r.top + r.height/2 - 18)+'px';
    // Tooltip debajo o arriba según espacio
    var tipH = 200;
    if(r.bottom + tipH + 20 < vh){
      tip.style.top  = (r.bottom + 14)+'px';
    } else {
      tip.style.top  = Math.max(8, r.top - tipH - 14)+'px';
    }
    var tipX = Math.min(Math.max(8, r.left), vw - 276);
    tip.style.left = tipX+'px';
  } else {
    // Sin elemento objetivo: centrado en pantalla
    cutout.style.left='50%'; cutout.style.top='40%'; cutout.style.width='0'; cutout.style.height='0';
    pulse.style.display='none';
    tip.style.left = Math.max(8,(vw-276)/2)+'px';
    tip.style.top  = Math.max(8,(vh-240)/2)+'px';
  }
}

function _slRender(){
  _ensureSpotlightDOM();
  var ov = document.getElementById('sl-overlay');
  var tip = document.getElementById('sl-tooltip');
  if(!ov||!tip) return;
  ov.style.display = 'block';
  ov.style.pointerEvents = 'all'; // bloquea clics fuera del cutout

  var step = _tourSteps[_tourIdx];
  var total = _tourSteps.length;
  var dotsHTML = _tourSteps.map(function(_,i){
    return '<div style="width:'+(i===_tourIdx?18:5)+'px;height:5px;border-radius:3px;background:'+(i===_tourIdx?'var(--accent)':'var(--line)')+';transition:all .25s;display:inline-block;"></div>';
  }).join('');

  var actionHtml = step.action
    ? '<div class="sl-action"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'+step.action+'</div>'
    : '';
  var isLast = _tourIdx === total-1;

  tip.innerHTML =
    '<div style="display:flex;gap:4px;margin-bottom:12px;">'+dotsHTML+'</div>'+
    '<div class="sl-title">'+step.title+'</div>'+
    '<div class="sl-body">'+step.body+'</div>'+
    actionHtml+
    '<div class="sl-nav">'+
      '<button class="sl-skip" onclick="tourSkip()">Saltar tour</button>'+
      (!isLast
        ? '<button class="sl-next" onclick="tourNext()">Siguiente →</button>'
        : '<button class="sl-next" onclick="tourDone()">✓ Listo</button>'
      )+
    '</div>';

  // Posicionar después de un frame para que el DOM esté pintado
  requestAnimationFrame(function(){ _slPosition(step); });

  // Hacer que el cutout sí deje pasar los clics al elemento objetivo
  var cutout = document.getElementById('sl-cutout');
  if(cutout){
    cutout.style.pointerEvents = 'none';
    // El overlay general bloquea todo — excepto los clics dentro del bbox del
    // elemento objetivo, que los dejamos pasar usando el truco de pointer-events
    // solo en la capa del tooltip y de la "máscara fuera".
  }
  // Si el paso tiene onEnter (navegar a la pestaña correcta), ejecutarlo
  if(step.onEnter) step.onEnter();
}

}

function maybeAskNotifPermission(){

  if(typeof Notification === 'undefined')return;
  if(S.notifPermission === 'granted' || S.notifPermission === 'denied')return;
  // Si nunca se preguntó, esperar a que el usuario tenga al menos 3 días de uso
  var hist = S.dailyHistory || {};
  var daysActive = Object.keys(hist).length;
  if(daysActive < 3)return;
  // Si ya se preguntó, esperar 30 días para volver a preguntar
  if(S.notifAskedDate){
    var lastAsk = new Date(S.notifAskedDate);
    var diffDays = (new Date() - lastAsk) / 86400000;
    if(diffDays < 30)return;
  }

  S.notifAskedDate = new Date().toISOString();
  saveState();
  setTimeout(showNotifAsk, 3000);
}

function grantNotif(){

function setNotifTiming(type, val){
  if(!S.notifTiming) S.notifTiming = {type:'exact', value:15};
  S.notifTiming.type = type;
  if(val) S.notifTiming.value = val;
  saveState();
  scheduleNotifications();
}
function nudgeNotifVal(delta, type, min, max){
  if(!S.notifTiming) S.notifTiming = {type:'exact', value:15};
  // Activar el radio correspondiente si no estaba activo
  S.notifTiming.type = type;
  S.notifTiming.value = Math.min(max, Math.max(min, (S.notifTiming.value||min) + delta));
  saveState();
  // Actualizar solo el número en pantalla sin re-renderizar todo (evita perder foco)
  var el = document.getElementById('notif-'+(type==='before_min'?'min':'hr')+'-val');
  if(el) el.textContent = S.notifTiming.value;
  scheduleNotifications();
}

// ── Programador de notificaciones locales ──────────────────────────────────
// Usa la Web Notifications API para agendar un aviso por cada tarea del día
// que tenga hora definida. Los timers se recrean cada vez que cambia la
// configuración o al abrir la app (los timers no persisten entre sesiones —
// cuando se integre FCM, esto pasa a ser serverless y persistente).
var _notifTimers = [];
function scheduleNotifications(){
  // Limpiar timers anteriores
  _notifTimers.forEach(function(t){clearTimeout(t);});
  _notifTimers = [];
  if(S.notifPermission !== 'granted') return;
  if(typeof Notification === 'undefined') return;
  var nt = S.notifTiming || {type:'exact', value:15};
  var today = todayIdx();
  var todayTasks = (S.tasks||[]).filter(function(t){
    return t.period==='dia' && t.day===today && t.hora && !isDone(t);
  });
  var now = new Date();
  todayTasks.forEach(function(t){
    var parts = t.hora.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
    var taskTime = new Date();
    taskTime.setHours(h, m, 0, 0);
    // Restar el aviso anticipado según configuración
    var alertTime = new Date(taskTime);
    if(nt.type === 'before_min') alertTime.setMinutes(alertTime.getMinutes() - nt.value);
    if(nt.type === 'before_hr')  alertTime.setHours(alertTime.getHours() - nt.value);
    var msUntil = alertTime - now;
    if(msUntil < 0) return; // ya pasó hoy
    var taskName = t.text;
    var body = nt.type==='exact'
      ? 'Es la hora: '+esc(taskName)
      : nt.type==='before_min'
        ? 'En '+nt.value+' min: '+esc(taskName)
        : 'En '+nt.value+' hora'+(nt.value>1?'s':'')+': '+esc(taskName);
    var timer = setTimeout(function(){
      new Notification('Organiz[app]', {body: body, icon: '/icon-192.png'});
    }, msUntil);
    _notifTimers.push(timer);
  });
  if(_notifTimers.length) console.log('[Notif] '+_notifTimers.length+' recordatorio(s) programado(s) para hoy');
}

// 🐛 REPORTE AUTOMÁTICO DE ERRORES (Opción A — Crashlytics web)
// Captura errores JS no controlados y los guarda en Firestore → colección
// 'crash_reports'. Cuando la app esté empaquetada en Android, el SDK nativo
// de Firebase Crashlytics reemplaza esto con reportes mucho más detallados.
// ════════════════════════════════════════════════════════════════════════════
window.onerror = function(msg, src, line, col, err){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   String(msg).slice(0,300),
      src:   String(src).slice(0,200),
      line:  line, col: col,
      stack: err && err.stack ? err.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ua:    navigator.userAgent.slice(0,120),
      ver:   '3.0'
    });
  } catch(e){ /* no propagar errores del propio reporter */ }
  return false; // no suprimir el error en consola
};
window.addEventListener('unhandledrejection', function(ev){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   'UnhandledPromise: '+(ev.reason ? String(ev.reason).slice(0,300) : 'unknown'),
      stack: ev.reason && ev.reason.stack ? ev.reason.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ver:   '3.0'
    });
  } catch(e){}
});

// ── Swipe horizontal en #content — animación suave + circular ──────────────
(function(){
  var c = document.getElementById('content');
  if(!c) return;

  var sx=0, sy=0, startTime=0;
  var dragging=false, axis=null; // null | 'x' | 'y'

  // Overlay de feedback visual durante el drag
  var ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;font-size:40px;';
  document.body.appendChild(ghost);

  function isHoy(){
    return (S.tab==='hoy'||S.tab==='dia') && (S.interfaceLayout||'default')==='default';
  }

  c.addEventListener('touchstart', function(e){
    if(!isHoy()) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    dragging = true;
    axis = null;
    c.style.transition = 'none';
  }, {passive:true});

  c.addEventListener('touchmove', function(e){
    if(!dragging||!isHoy()) return;
    var dx = e.touches[0].clientX - sx;
    var dy = e.touches[0].clientY - sy;

    // Determinar eje al inicio del gesto
    if(!axis){
      if(Math.abs(dx)>8||Math.abs(dy)>8){
        axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      }
      return;
    }
    if(axis !== 'x') return;

    // Seguir el dedo con traslación suave
    c.style.transform = 'translateX('+dx*0.35+'px)';

    // Sin overlay — la animación de salida ya da el feedback
  }, {passive:true});

  c.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    ghost.style.opacity = '0';

    if(!isHoy() || axis !== 'x'){
      c.style.transition = 'transform .2s ease';
      c.style.transform = '';
      axis = null;
      return;
    }

    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    var elapsed = Date.now() - startTime;
    var threshold = elapsed < 250 ? 30 : 60; // swipe rápido = menos recorrido requerido

    if(Math.abs(dx) < threshold || Math.abs(dy) > Math.abs(dx)*0.9){
      // Cancelar — volver al lugar con rebote
      c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
      c.style.transform = '';
      axis = null;
      return;
    }

    // Dirección y animación de salida
    var goRight = dx > 0; // dedo hacia derecha = día anterior
    var exitX = goRight ? '40%' : '-40%';
    // Transición suave: fade + pequeño desplazamiento
    c.style.transition = 'transform .14s ease-out, opacity .14s';
    c.style.transform = 'translateX('+(goRight?'-8%':'8%')+')';
    c.style.opacity = '0';

    setTimeout(function(){
      if(goRight){
        S.day = S.day === 0 ? 6 : S.day - 1;
      } else {
        S.day = S.day === 6 ? 0 : S.day + 1;
      }
      c.style.transition = 'none';
      c.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
      c.style.opacity = '0';
      c.scrollTop = 0;
      render();
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          c.style.transition = 'transform .18s ease-out, opacity .16s';
          c.style.transform = '';
          c.style.opacity = '1';
        });
      });
    }, 130);

    axis = null;
  }, {passive:true});

  // Limpiar si se cancela el touch
  c.addEventListener('touchcancel', function(){
    dragging = false;
    axis = null;
    ghost.style.opacity = '0';
    c.style.transition = 'transform .2s ease';
    c.style.transform = '';
    c.style.opacity = '1';
  }, {passive:true});
})();
