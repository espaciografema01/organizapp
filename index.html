<style>
:root{
  --bg:#f7f7f7;
  --paper:#ffffff;
  --ink:#1a1a1a;
  --ink-soft:#3a3530;
  --accent:#c97842;
  --accent-soft:#e8c5a8;
  --accent-bg:#fdf0e6;
  --muted:#a89a88;
  --muted-soft:#d4c8b6;
  --line:#ececec;
  --line-soft:#f4f4f4;
  --bad:#c25b5b;
}
body.theme-dark {
  --bg:#1a1a1a;
  --paper:#252525;
  --ink:#f5f5f5;
  --ink-soft:#d0d0d0;
  --accent:#ff9966;
  --accent-soft:#ff8844;
  --accent-bg:#332211;
  --muted:#888888;
  --muted-soft:#555555;
  --line:#333333;
  --line-soft:#2a2a2a;
}
body.theme-sepia {
  --bg:#f4eee3;
  --paper:#fdf9f0;
  --ink:#3e2723;
  --ink-soft:#5d4037;
  --accent:#a1887f;
  --accent-soft:#d7ccc8;
  --accent-bg:#efebe9;
  --muted:#8d6e63;
  --muted-soft:#bcaaa4;
  --line:#d7ccc8;
  --line-soft:#efebe9;
}
/* Tema "Bosque" - verde profundo y musgo */
body.theme-bosque {
  --bg:#e8ebe0;
  --paper:#f3f5ed;
  --ink:#1a2818;
  --ink-soft:#3a4a35;
  --accent:#5a7c4a;
  --accent-soft:#a8c499;
  --accent-bg:#dae5d0;
  --muted:#7a8a72;
  --muted-soft:#c0c8b8;
  --line:#d4dccc;
  --line-soft:#e8ece2;
}
/* Tema "Océano" - azul profundo y aguamarina */
body.theme-oceano {
  --bg:#e0e9ed;
  --paper:#eef4f6;
  --ink:#0d2638;
  --ink-soft:#2e4a5c;
  --accent:#3a7c8c;
  --accent-soft:#88bdc8;
  --accent-bg:#cee0e6;
  --muted:#6d8590;
  --muted-soft:#b8c8cf;
  --line:#cfd9de;
  --line-soft:#e3e9ec;
}
/* Tema "Atardecer" - violeta y rosa cálido */
body.theme-atardecer {
  --bg:#f0e5ec;
  --paper:#faf2f6;
  --ink:#2e1a2c;
  --ink-soft:#5a3858;
  --accent:#a85a82;
  --accent-soft:#d8a8c0;
  --accent-bg:#ecd6e2;
  --muted:#8a6878;
  --muted-soft:#cfb8c5;
  --line:#dac8d2;
  --line-soft:#ede0e6;
}
/* Tema "Galaxia" - violeta profundo con dorado, futurista nocturno */
body.theme-galaxia {
  --bg:#0e0a1f;
  --paper:#1a1535;
  --ink:#f0e8ff;
  --ink-soft:#c8b8e8;
  --accent:#d4a847;
  --accent-soft:#9a7eff;
  --accent-bg:#26204a;
  --muted:#7d72a3;
  --muted-soft:#3a3060;
  --line:#2c2550;
  --line-soft:#1f1a40;
}
/* Tema "Cereza" - rojo vino y crema, elegante cálido */
body.theme-cereza {
  --bg:#fbf3f0;
  --paper:#fefaf8;
  --ink:#3a0e1a;
  --ink-soft:#6b2230;
  --accent:#a02942;
  --accent-soft:#dc8090;
  --accent-bg:#f5dde2;
  --muted:#967078;
  --muted-soft:#d4b8be;
  --line:#e8d2d6;
  --line-soft:#f3e8eb;
}
/* Tema "Menta" - turquesa fresco con blanco hueso, calmante */
/* Tema "Terracota" - el terracota domina todo el fondo, crema como color secundario */
body.theme-terracota {
  --bg:#a84e2a;
  --paper:#b85a34;
  --ink:#fdf3e4;
  --ink-soft:#e8d0b0;
  --accent:#ffcaa8;
  --accent-soft:#e8935f;
  --accent-bg:#96401f;
  --muted:#f5ddc2;
  --muted-soft:#eec9a6;
  --line:#9c4a29;
  --line-soft:#ab5230;
  --bad:#ffd6d6;
}
/* El acento y el "bad" (rojo de error) son claros en este tema (para leerse
   como texto sobre el fondo oscuro), así que los botones que los usan como
   FONDO necesitan texto oscuro, no blanco. */
body.theme-terracota .sbtn,
body.theme-terracota [style*="background:var(--accent);color:white"],
body.theme-terracota [style*="background:var(--bad);color:white"]{
  color:#3d1a0a !important;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

body{background:var(--bg);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;color:var(--ink);}
#app{width:100%;max-width:440px;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(60,40,20,.08);}
button{font-family:'Inter',sans-serif;cursor:pointer;color:var(--ink);touch-action:manipulation;}
button:disabled{opacity:.3;cursor:default;}
input{font-family:'Inter',sans-serif;color:var(--ink);}
::-webkit-scrollbar{width:0;}
.serif{font-family:'Cormorant Garamond',serif;}
/* Feedback táctil genérico: la app es solo móvil, no hay hover — el toque
   necesita su propia respuesta visual inmediata (breve, sin animación lenta). */
.sbtn:active,.cbtn:active,.card button:active,.v2-card button:active{opacity:.72;}

/* ── Splash ──────────────────────────────────────────────────────────── */
#splash{
  position:fixed;inset:0;
  background:#ffffff;
  z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
  transition:opacity .6s ease;
}
#splash.hide{opacity:0;pointer-events:none;}

/* Corchete izquierdo — entra desde la izquierda */
@keyframes bracketLeft{
  from{opacity:0;transform:translateX(-28px);}
  to{opacity:1;transform:translateX(0);}
}
/* Corchete derecho — entra desde la derecha */
@keyframes bracketRight{
  from{opacity:0;transform:translateX(28px);}
  to{opacity:1;transform:translateX(0);}
}
/* Letras — aparecen desde abajo con fade */
@keyframes lettersUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
/* Tagline — fade simple, más tarde */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
/* Línea horizontal — crece desde el centro */
@keyframes lineGrow{
  from{transform:scaleX(0);}
  to{transform:scaleX(1);}
}

.splash-bracket-l{
  display:inline-block;
  animation:bracketLeft .55s cubic-bezier(.25,.46,.45,.94) .1s both;
}
.splash-bracket-r{
  display:inline-block;
  animation:bracketRight .55s cubic-bezier(.25,.46,.45,.94) .1s both;
}
.splash-letters{
  display:inline-block;
  animation:lettersUp .5s cubic-bezier(.25,.46,.45,.94) .32s both;
}
.splash-tagline{
  animation:fadeIn .5s ease .75s both;
}
.splash-line{
  transform-origin:center;
  animation:lineGrow .45s cubic-bezier(.25,.46,.45,.94) .85s both;
}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:white;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.tab-btn{flex:1;padding:8px 4px;border:none;border-radius:9px;background:transparent;font-size:12px;color:var(--muted);font-weight:500;transition:all .15s;}
.tab-btn.active{background:var(--accent-bg);color:var(--accent);font-weight:700;}

/* Tamaño de letra global (3 niveles via body class) */
.task-item{border-bottom:1px solid var(--line-soft);}
.task-row{display:flex;align-items:center;gap:10px;padding:11px 0;}
.chk{width:23px;height:23px;border:2px solid var(--muted-soft);background:var(--paper);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;border-radius:7px;}
.chk.circle{border-radius:12px;}
.chk.done{background:var(--accent);border-color:var(--accent);}
.chk.partial{background:var(--accent-bg);border-color:var(--accent-soft);}

/* Pop de satisfacción al completar una tarea */
@keyframes chkPop{
  0%{transform:scale(1);}
  35%{transform:scale(1.32);}
  60%{transform:scale(0.92);}
  100%{transform:scale(1);}
}
.chk-pop{animation:chkPop .38s cubic-bezier(.34,1.56,.64,1);}
@keyframes rowGlow{
  0%{background:var(--accent-bg);}
  100%{background:transparent;}
}
.row-glow{animation:rowGlow 1s ease-out;border-radius:10px;}

/* Pequeño — toda la app */

/* Mediano — toda la app */


/* Grande — toda la app */

/* Íconos de pestañas — siempre grandes */
.bnav-icon{font-size:22px !important;}
.crucial-star{color:var(--accent);font-size:13px;flex-shrink:0;}
.mpbar{background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px;}
.mpbar-fill{background:var(--accent);border-radius:4px;transition:width .4s;}
.cl-row{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--line-soft);}
.cl-box{width:16px;height:16px;border-radius:5px;flex-shrink:0;border:2px solid var(--muted-soft);background:var(--paper);display:flex;align-items:center;justify-content:center;}
.cl-box.done{background:var(--accent);border-color:var(--accent);}
.cl-step-btn{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;line-height:1;}
.cl-step-btn:active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}

.period-tab{padding:5px 14px;border-radius:20px;font-size:13px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);}
.period-tab.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

/* Pedido: reemplaza los óvalos planos de semana/mes/semestre/año por un
   segmented-control tipo "chip", con ícono + etiqueta y una pastilla que
   se resalta sola al elegir — más parecido a un selector nativo. */
.period-tab-row{display:flex;gap:3px;background:var(--bg);border-radius:15px;padding:4px;margin-bottom:18px;}
.period-tab-v2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;border-radius:11px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;}
.period-tab-v2 .ptab-ic{display:flex;color:inherit;}
.period-tab-v2 .ptab-lbl{font-size:10.5px;font-weight:700;letter-spacing:.01em;}
.period-tab-v2.active{background:var(--paper);color:var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.09);}

.card{background:var(--paper);border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);}

/* ── Mejoras visuales globales ────────────────────────────────────────── */
button{transition:transform .1s ease, opacity .15s, background .15s, border-color .15s;}
button:active{transform:scale(0.96);}
.v2-card{transition:transform .12s ease, box-shadow .2s;}
.v2-card:active{transform:scale(0.99);}
.finp:focus{border-bottom-color:var(--accent);}
.finp{transition:border-color .2s;}
.period-tab,.period-tab-v2,.bnav-btn{transition:color .2s,background .2s,border-color .2s,box-shadow .2s;}
::-webkit-scrollbar{width:0;height:0;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.streak-badge{transition:transform .15s;}
.streak-badge:active{transform:scale(0.93);}

.overlay{position:fixed;inset:0;background:rgba(40,25,15,.4);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:overlayFadeIn .2s ease;}
@keyframes overlayFadeIn{from{background:rgba(40,25,15,0);}to{background:rgba(40,25,15,.4);}}
.overlay.closing{animation:overlayFadeOut .18s ease forwards;}
@keyframes overlayFadeOut{from{background:rgba(40,25,15,.4);}to{background:rgba(40,25,15,0);}}
.overlay.closing .sheet{animation:down .18s ease forwards;}
@keyframes down{from{transform:translateY(0);}to{transform:translateY(100%);}}

.sheet{background:var(--paper);border-radius:20px 20px 0 0;padding:22px 22px 50px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;animation:up .25s ease;}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes pop{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes spinIn{from{transform:rotate(-90deg) scale(0.5);opacity:0;}to{transform:rotate(0) scale(1);opacity:1;}}

.finp{width:100%;border:none;border-bottom:1.5px solid var(--line);outline:none;font-size:14px;background:transparent;padding:4px 0;margin-bottom:12px;color:var(--ink);}
.finp::placeholder{color:var(--muted);opacity:1;}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:1;}
.flbl{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.fsec{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.frow{display:flex;align-items:center;justify-content:space-between;}
.tog{width:44px;height:24px;border-radius:12px;border:none;position:relative;cursor:pointer;flex-shrink:0;padding:0;transition:background .18s ease;}
.tok{position:absolute;top:3px;width:18px;height:18px;border-radius:9px;background:white;transition:left .15s;display:block;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.qb{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);}
.sbtn{flex:1;background:var(--accent);color:white;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;}
.cbtn{background:none;border:1.5px solid var(--line);border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;color:var(--ink-soft);}
/* Terciario: para acciones de menor peso ("Ahora no", "Saltar") — solo texto, sin borde, para que no compita con sbtn/cbtn */
.tbtn{background:none;border:none;padding:10px 8px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;}
.addtbtn{background:none;border:1.5px dashed var(--line);border-radius:10px;width:100%;padding:9px;color:var(--muted);font-size:13px;margin-top:10px;display:block;}
.navbtn{background:none;border:1.5px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:22px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;}
.feeder{padding-left:16px;padding-bottom:6px;border-left:2px solid var(--line);margin-left:11px;margin-bottom:4px;}
.conf-box{position:fixed;inset:0;background:rgba(40,25,15,.4);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayFadeIn .18s ease;}
.conf-inner{background:var(--paper);border-radius:16px;padding:24px;width:100%;max-width:300px;animation:pop .22s cubic-bezier(.34,1.56,.64,1);}
.sel-item{width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;color:var(--ink);margin-bottom:8px;display:block;}
.resetbtn{width:100%;background:none;border:1.5px solid var(--bad);opacity:.85;border-radius:12px;padding:11px;color:var(--bad);font-size:13px;margin-top:12px;display:block;}
.empty{text-align:center;color:var(--muted-soft);font-size:14px;padding:32px 0;}
.le-banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;}

/* Logo */
.logo-bracket{color:var(--accent);font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;}
.logo-letters{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--ink);}

/* Level up modal */
.lvl-up{position:fixed;inset:0;background:rgba(30,20,10,.55);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;}
.lvl-up-box{background:var(--paper);border-radius:24px;padding:36px 28px;width:100%;max-width:340px;text-align:center;animation:pop .5s ease;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.lvl-up-emoji{font-size:48px;margin-bottom:12px;}
.lvl-up-title{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-bottom:8px;}
.lvl-up-sym{margin:18px auto;animation:spinIn .8s ease;}
.lvl-up-msg{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:24px;}
.lvl-up-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;}
/* Medalla animada al desbloquear un logro */
.medal-badge{position:relative;width:120px;height:150px;margin:0 auto 4px;}
.medal-badge-ribbon-l{position:absolute;left:30px;top:70px;width:24px;height:64px;background:linear-gradient(180deg,#c94f4f,#8a2f2f);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);transform:rotate(-16deg);animation:ribbonDrop .5s .15s cubic-bezier(.34,1.56,.64,1) backwards;}
.medal-badge-ribbon-r{position:absolute;right:30px;top:70px;width:24px;height:64px;background:linear-gradient(180deg,#c94f4f,#8a2f2f);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);transform:rotate(16deg);animation:ribbonDrop .5s .15s cubic-bezier(.34,1.56,.64,1) backwards;}
.medal-badge-circle{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;background:linear-gradient(145deg,#f5d585,#d9a634);box-shadow:0 8px 18px rgba(0,0,0,.28),inset 0 2px 5px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;border:3px solid #e8b94a;animation:medalPop .6s cubic-bezier(.34,1.56,.64,1);}
.medal-badge-emoji{font-size:46px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
@keyframes medalPop{0%{transform:translateX(-50%) scale(0) rotate(-35deg);opacity:0;}55%{transform:translateX(-50%) scale(1.18) rotate(10deg);opacity:1;}100%{transform:translateX(-50%) scale(1) rotate(0deg);}}
@keyframes ribbonDrop{0%{transform:translateY(-30px) rotate(0deg);opacity:0;}100%{opacity:1;}}

/* Level up animation: confetti + radial flash */
#lvl-anim{position:fixed;inset:0;pointer-events:none;z-index:550;overflow:hidden;}
.lvl-flash{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,rgba(201,120,66,0.8) 0%,rgba(201,120,66,0) 70%);transform:translate(-50%,-50%);animation:flashOut 1.4s ease-out forwards;}
@keyframes flashOut{
  0%{width:50px;height:50px;opacity:0.9;}
  100%{width:1500px;height:1500px;opacity:0;}
}
.confetti{position:absolute;width:10px;height:10px;top:50%;left:50%;border-radius:2px;opacity:0;}
@keyframes confettiBurst{
  0%{transform:translate(-50%,-50%) rotate(0deg);opacity:1;}
  100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--tr));opacity:0;}
}

/* Subtle pulse on the ring after level up */
@keyframes ringPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}
.ring-pulse{animation:ringPulse 0.6s ease-out;}

/* Auth Modal */
#authModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;}

function showAuthModal(){
  if(!firebaseAvailable){
    toast('Firebase no disponible (funciona solo online)');
    return;
  }
  document.getElementById('authModal').style.display='flex';
}

function closeAuthModal(){
  document.getElementById('authModal').style.display='none';
}

function handleAuth(){
  if(!firebaseAvailable){ toast('Firebase no disponible'); return; }
  var email = document.getElementById('authEmail').value.trim();
  var pass = document.getElementById('authPass').value.trim();
  if(!email || !pass){ toast('Completa email y contraseña'); return; }
  
  var isSignup = document.getElementById('authBtn').textContent.includes('Crear');
  var promise = isSignup 
    ? auth.createUserWithEmailAndPassword(email, pass)
    : auth.signInWithEmailAndPassword(email, pass);
  
  promise.then(function(){
    toast(isSignup ? 'Cuenta creada' : 'Sesión iniciada');
  }).catch(function(e){
    var msg = e.message;
    if(e.code === 'auth/email-already-in-use') msg = 'Este email ya está registrado';
    if(e.code === 'auth/weak-password') msg = 'La contraseña debe tener al menos 6 caracteres';
    if(e.code === 'auth/invalid-credential') msg = 'Email o contraseña incorrectos';
    if(e.code === 'auth/invalid-email') msg = 'Email no válido';
    toast(msg);
  });
}

function handleGoogleSignIn(){
  if(!firebaseAvailable){ toast('Firebase no disponible'); return; }
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/calendar.events');

  // Estrategia de login según contexto:
  // - TWA (app instalada desde Play Store): usa signInWithRedirect. El Custom
  //   Tab que abre es "trusted" si el assetlinks.json está bien configurado,
  //   lo que permite compartir cookies con Chrome y que la sesión persista.
  // - Navegador móvil normal (Chrome, etc.): también usa redirect porque los
  //   popups no funcionan bien en móvil.
  // - Desktop: usa popup, que es más fluido y no requiere redirect.
  //
  // IMPORTANTE: en TWA con prueba cerrada de Play Store, el assetlinks.json
  // puede no estar completamente verificado todavía — en ese caso el redirect
  // falla silenciosamente. Si eso pasa, el usuario ve el aviso de diagnóstico.
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var isTWA = document.referrer.includes('android-app://');

  // Persistencia LOCAL: la sesión sobrevive a cierres de la app/navegador.
  // Es crítico setearla ANTES del redirect, no después, porque después de
  // volver del redirect ya es tarde para cambiar la persistencia.
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function(){
    if(isMobile){
      localStorage.setItem('og6-google-redirect-pending', '1');
      localStorage.setItem('og6-google-redirect-ts', Date.now().toString());
      return auth.signInWithRedirect(provider);
    }
    return auth.signInWithPopup(provider).then(function(result){
      if(result.credential && result.credential.accessToken){
        window._googleAccessToken = result.credential.accessToken;
      }
      toast('Sesión iniciada con Google');
      _registerFCMToken();
    });
  }).catch(function(e){
    localStorage.removeItem('og6-google-redirect-pending');
    localStorage.removeItem('og6-google-redirect-ts');
    if(e.code==='auth/unauthorized-domain'){
      toast('Este dominio no está autorizado en Firebase');
    } else if(e.code!=='auth/popup-closed-by-user'){
      toast(e.message);
    }
  });
}

function handleGoogleRedirectResult(){
  if(!firebaseAvailable || !auth) return;
  var wasPending = localStorage.getItem('og6-google-redirect-pending')==='1';
  var redirectTs = parseInt(localStorage.getItem('og6-google-redirect-ts')||'0');
  // Si el redirect fue hace más de 5 minutos y no volvimos, limpiamos la
  // marca para no mostrar mensajes de error stale en aperturas futuras.
  if(wasPending && Date.now() - redirectTs > 5*60*1000){
    localStorage.removeItem('og6-google-redirect-pending');
    localStorage.removeItem('og6-google-redirect-ts');
    wasPending = false;
  }

  auth.getRedirectResult().then(function(result){
    if(result && result.user){
      localStorage.removeItem('og6-google-redirect-pending');
      localStorage.removeItem('og6-google-redirect-ts');
      if(result.credential && result.credential.accessToken){
        window._googleAccessToken = result.credential.accessToken;
      }
      toast('✓ Sesión iniciada con Google');
      _registerFCMToken();
    } else if(wasPending){
      // Volvimos del redirect pero sin usuario y sin error — esto pasa casi
      // siempre en TWA cuando el Digital Asset Links no está verificado
      // correctamente, causando que Chrome no comparta la sesión con la app.
      // La solución para el usuario: abrir en Chrome normal y desde ahí
      // iniciar sesión, la app reconocerá la sesión automáticamente.
      localStorage.removeItem('og6-google-redirect-pending');
      localStorage.removeItem('og6-google-redirect-ts');
      showGoogleSignInFallbackModal();
    }
  }).catch(function(e){
    localStorage.removeItem('og6-google-redirect-pending');
    localStorage.removeItem('og6-google-redirect-ts');
    if(e.code==='auth/unauthorized-domain'){
      toast('Este dominio no está autorizado en Firebase');
    } else if(e.code && e.code!=='auth/no-auth-event'){
      toast('Error Google Sign-In: '+e.message);
    }
  });
}

// 📅 GOOGLE CALENDAR — sincronización bidireccional
// ════════════════════════════════════════════════════════════════════════════
// Preferencias de sync del usuario (guardadas en S.calendarSync):
//   direction: 'app_to_cal' | 'cal_to_app' | 'both'
//   enabled: true | false
function getCalToken(){
  // El access_token se renueva en cada login. Si la sesión venció,
  // re-autenticar silenciosamente para obtener uno fresco.
  return window._googleAccessToken || null;
}
async function syncTaskToCalendar(task){
  var token = getCalToken();
  if(!token || !task.hora) return;
  var prefs = S.calendarSync || {enabled:false, direction:'app_to_cal'};
  if(!prefs.enabled) return;
  if(prefs.direction === 'cal_to_app') return;
  var today = new Date();
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var dateStr = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var parts = task.hora.split(':');
  var h = +parts[0], m = +parts[1];
  var startISO = dateStr+'T'+pad(h)+':'+pad(m)+':00';
  var dur = task.duracion || 60;
  var endDate = new Date(today.getFullYear(), today.getMonth(), today.getDate(), h, m+dur);
  var endISO = endDate.getFullYear()+'-'+pad(endDate.getMonth()+1)+'-'+pad(endDate.getDate())+'T'+pad(endDate.getHours())+':'+pad(endDate.getMinutes())+':00';
  try {
    var res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: JSON.stringify({
        summary: task.text,
        description: 'Creado desde Gramifica',
        start: {dateTime: startISO, timeZone: 'America/Santiago'},
        end:   {dateTime: endISO,   timeZone: 'America/Santiago'}
      })
    });
    if(res.ok){
      var ev = await res.json();
      task.googleEventId = ev.id;
      saveState();
      toast('✓ Tarea agregada a Google Calendar');
    } else {
      var err = await res.json().catch(function(){return {};});
      var msg = (err.error && err.error.message) || 'Error '+res.status;
      if(res.status===401){
        toast('Sesión de Google vencida — vuelve a iniciar sesión');
      } else {
        toast('Calendar: '+msg);
      }
    }
  } catch(e){
    toast('Sin conexión — la tarea no se sincronizó con Calendar');
    console.warn('Calendar sync error:', e);
  }
}
// Disparador manual de la dirección App → Calendar — antes syncTaskToCalendar()
// existía pero nada la invocaba nunca, ni automática ni manualmente, así que
// esa dirección de sincronización no hacía nada pese a que la interfaz la
// ofrecía. Sigue el mismo patrón manual que importFromCalendar() (botón
// "ahora") en vez de dispararse solo al guardar una tarea, para no crear
// eventos duplicados en Calendar cada vez que se edita la misma tarea.
async function exportTodayToCalendar(){
  var token = getCalToken();
  if(!token){ toast('Inicia sesión con Google primero'); return; }
  var pending = (S.tasks||[]).filter(function(t){
    return isTaskToday(t) && t.hora && !t.googleEventId;
  });
  if(!pending.length){ toast('No hay tareas de hoy con hora pendientes de exportar'); return; }
  toast('Exportando '+pending.length+' tarea(s)...');
  for(var i=0;i<pending.length;i++){
    await syncTaskToCalendar(pending[i]);
  }
  saveState();
  render();
}

async function importFromCalendar(){
  var token = getCalToken();
  if(!token) { toast('Inicia sesión con Google primero'); return; }
  var prefs = S.calendarSync || {enabled:false, direction:'app_to_cal'};
  if(!prefs.enabled) return;
  if(prefs.direction === 'app_to_cal') return; // solo exporta, no importa
  var today = new Date();
  var pad = function(n){ return String(n).padStart(2,'0'); };
  var dateStr = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  try {
    var res = await fetch(
      'https://www.googleapis.com/calendar/v3/calendars/primary/events'+
      '?timeMin='+encodeURIComponent(dateStr+'T00:00:00-04:00')+
      '&timeMax='+encodeURIComponent(dateStr+'T23:59:59-04:00')+
      '&singleEvents=true&orderBy=startTime',
      { headers: { 'Authorization': 'Bearer '+token } }
    );
    if(!res.ok) return;
    var data = await res.json();
    var imported = 0;
    (data.items||[]).forEach(function(ev){
      if(!ev.start || !ev.start.dateTime) return; // todo el día, sin hora
      // Evitar duplicados: si ya existe una tarea con este googleEventId, saltar
      if((S.tasks||[]).some(function(t){return t.googleEventId===ev.id;})) return;
      var hora = ev.start.dateTime.slice(11,16); // "HH:MM"
      S.tasks = S.tasks||[];
      S.tasks.push({
        id: uid(),
        text: ev.summary||'Evento de calendario',
        done: false,
        period: 'dia',
        day: todayIdx(),
        qty: 1, prog: 0,
        checklist: [], links: {},
        crucial: false, linkMode: 'unit', categoryId: null,
        hora: hora,
        googleEventId: ev.id,
        fromCalendar: true
      });
      imported++;
    });
    if(imported > 0){ saveState(); render(); toast('✓ '+imported+' evento(s) importado(s) del calendario'); }
    else { toast('No hay eventos nuevos hoy en Google Calendar'); }
  } catch(e){ console.warn('Calendar import error:', e); toast('Error al importar. Intenta de nuevo.'); }
}

// ☁️ SYNC INTELIGENTE (Merge local + cloud)
// ════════════════════════════════════════════════════════════════════════════
async function syncWithCloud(){
  if(!currentUser || !db) return;
  try {
    var userRef = db.collection('users').doc(currentUser.uid);
    var doc = await userRef.get();

    if(!doc.exists){
      // Primer login con esta cuenta de Google: subir los datos de este
      // dispositivo tal cual, sin comparar nada (no hay con qué comparar).
      await userRef.set(sanitizeForFirestore({
        email: currentUser.email,
        created: new Date().toISOString(),
        xp: S.xp,
        streak: S.streak,
        theme: S.theme,
        tasks: S.tasks,
        rewardedTaskIds: S.rewardedTaskIds,
        bajaEnergia: S.bajaEnergia,
        modes: S.modes,
        activeMode: S.activeMode,
        streakCfg: S.streakCfg,
        taskBlocks: S.taskBlocks,
        lastSync: new Date().toISOString()
      }));
      localStorage.setItem('og6-lastSync', new Date().toISOString());
      saveState();
      toast('✓ Datos sincronizados');
      render();
    } else {
      var cloud = doc.data();
      var cloudHasTasks = Array.isArray(cloud.tasks) && cloud.tasks.length>0;
      var localHasTasks = Array.isArray(S.tasks) && S.tasks.length>0;

      // Si AMBOS lados (este dispositivo y la nube) tienen tareas reales y
      // son distintas, no adivinamos con timestamps — la marca de tiempo
      // local casi nunca se actualizaba de forma confiable en versiones
      // anteriores, así que comparar contra ella podía pisar datos nuevos
      // de este dispositivo con una copia vieja de la nube sin avisar.
      // En vez de eso, preguntamos directamente qué copia mantener.
      var sameData = JSON.stringify(cloud.tasks||[]) === JSON.stringify(S.tasks||[]);
      if(cloudHasTasks && localHasTasks && !sameData){
        window._pendingCloudData = cloud;
        showSyncConflictModal(cloud);
        return; // se continúa en resolveSyncConflict()
      }

      applySyncResult(cloud, cloudHasTasks && !localHasTasks);
    }
  } catch(e){
    console.error('Sync error:', e);
    toast('No se pudo sincronizar. Tus datos locales siguen intactos.');
  }
}

// Aplica los datos de la nube (si corresponde) o mantiene los locales,
// y siempre re-renderiza de forma segura para no dejar la app a medio
// camino si algo en los datos de la nube resulta inesperado.
function applySyncResult(cloud, useCloud){
  try {
    if(useCloud){
      if(cloud.xp !== undefined) S.xp = Math.max(S.xp || 0, cloud.xp || 0);
      if(cloud.streak) S.streak = cloud.streak;
      if(cloud.theme) S.theme = cloud.theme;
      if(Array.isArray(cloud.tasks)) S.tasks = cloud.tasks;
      if(cloud.rewardedTaskIds) S.rewardedTaskIds = cloud.rewardedTaskIds;
      if(cloud.bajaEnergia) S.bajaEnergia = cloud.bajaEnergia;
      if(Array.isArray(cloud.modes)) S.modes = cloud.modes;
      if(cloud.activeMode !== undefined) S.activeMode = cloud.activeMode;
      if(cloud.streakCfg) S.streakCfg = cloud.streakCfg;
      if(cloud.taskBlocks) S.taskBlocks = cloud.taskBlocks;
      document.body.className = 'theme-' + S.theme + ' task-size-medium';
      toast('✓ Datos descargados de la nube');
    } else {
      toast('✓ Ya sincronizado');
    }
    saveState();
  } catch(e){
    console.error('Error aplicando datos de sincronización:', e);
    toast('Hubo un problema al aplicar los datos de la nube. Se mantuvo lo local.');
  } finally {
    // El render va en un finally propio: si algo de arriba falla, igual
    // queremos que la interfaz vuelva a responder en vez de quedar colgada.
    try { render(); } catch(e2){ console.error('Render error tras sync:', e2); }
  }
}

function resolveSyncConflict(choice){
  var box=document.getElementById('sync-conflict-box'); if(box) box.remove();
  var cloud = window._pendingCloudData || {};
  window._pendingCloudData = null;
  if(choice==='cloud'){
    applySyncResult(cloud, true);
  } else {
    // Mantener lo local: subimos nuestra versión a la nube para que quede
    // como la vigente (evita que la próxima vez vuelva a preguntar).
    pushToCloud();
    applySyncResult(cloud, false);
  }
}

// Firestore no acepta valores `undefined` en sus escrituras: si algún campo
// llega undefined, .set()/.update() lanzan una excepción SÍNCRONA en el
// momento de llamarlos (antes de tocar la red), lo que puede dejar a medias
// cualquier función que no la esperaba. Esta función limpia el objeto antes
// de cada escritura para evitar ese crash.
function sanitizeForFirestore(obj){
  var clean = {};
  Object.keys(obj).forEach(function(k){
    clean[k] = obj[k] === undefined ? null : obj[k];
  });
  return clean;
}

function pushToCloud(){
  if(!currentUser || !db) return;
  try {
    var sync = new Date().toISOString();
    var payload = sanitizeForFirestore({
      xp: S.xp,
      streak: S.streak,
      theme: S.theme,
      tasks: S.tasks,
      rewardedTaskIds: S.rewardedTaskIds,
      bajaEnergia: S.bajaEnergia,
      modes: S.modes,
      activeMode: S.activeMode,
      streakCfg: S.streakCfg,
      taskBlocks: S.taskBlocks,
      lastSync: sync
    });
    // set(..., {merge:true}) en vez de update(): si el documento del usuario
    // todavía no existe (puede pasar justo después de un login nuevo, antes
    // de que syncWithCloud termine de crearlo), update() falla con
    // "No document to update" y la sincronización se pierde en silencio.
    // set con merge crea el documento si falta, o lo actualiza si ya existe.
    db.collection('users').doc(currentUser.uid).set(payload, {merge:true}).then(function(){
      // Solo marcamos como sincronizado a nivel local si la escritura
      // realmente llegó a la nube — antes se escribía esto de forma
      // optimista ANTES de confirmar el éxito, lo que dejaba al dispositivo
      // creyendo que estaba sincronizado aunque la nube nunca se actualizara.
      localStorage.setItem('og6-lastSync', sync);
    }).catch(function(e){ console.error('Push error:', e); });
  } catch(e){ console.error('Push error (sync):', e); }
}

// Función helper para reemplazar placeholders en textos
function fillText(template, vars) {
  var out = template;
  for (var k in vars) out = out.split('{'+k+'}').join(vars[k]);
  return out;
}

function lvlThresh(l){
  if(l<=0)return 0;
  if(l<LVL_XP.length)return LVL_XP[l];
  var v=LVL_XP[LVL_XP.length-1];
  for(var i=LVL_XP.length;i<=l;i++)v=Math.round(v*1.5);
  return v;
}
function getLevel(xp){
  if(!xp||xp<=0)return 1;
  var l=1;
  while(xp>=lvlThresh(l+1))l++;
  return l;
}
function lvlInfo(xp){
  if(!xp||xp<=0)return{lvl:1,cur:0,nxt:25,ratio:0,inLvl:0,needed:25};
  var l=getLevel(xp),cur=lvlThresh(l),nxt=lvlThresh(l+1);
  var range=nxt-cur;
  var ratio=range>0?(xp-cur)/range:0;
  if(ratio<0)ratio=0;
  if(ratio>1)ratio=1;
  return{lvl:l,cur:cur,nxt:nxt,ratio:ratio,inLvl:xp-cur,needed:range};
}

// Niveles 1-5:  naturaleza (semilla → brote → planta → árbol → árbol en flor)

// Nivel 11+:    cosmos (estrella → constelación → galaxia → gran arquitecto)
// Cada SVG es 24×24, trazos finos monocromos (se tinta con `col`).
function symSVG(lvl, col, sw){
  sw = sw||1.5;
  var s = 'stroke="'+col+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  var f = 'fill="'+col+'" stroke="none"'; // para rellenos sólidos

  if(lvl===1) return '<ellipse cx="12" cy="14" rx="4" ry="5" '+s+'/>'+
    '<path d="M12 9 Q12 4 15 2" '+s+'/>'+
    '<path d="M12 9 Q12 4 9 2" '+s+'/>';

  // Nivel 2: brote — semilla con primer tallo y hoja diminuta
  if(lvl===2) return '<path d="M12 20 Q12 12 12 8" '+s+'/>'+
    '<path d="M12 12 Q8 10 7 7 Q10 7 12 10" '+s+'/>'+
    '<ellipse cx="12" cy="18" rx="3" ry="2" '+s+' opacity=".6"/>';

  // Nivel 3: planta joven — tallo + dos hojas simétricas
  if(lvl===3) return '<path d="M12 22 L12 8" '+s+'/>'+
    '<path d="M12 16 Q8 14 6 10 Q10 10 12 14" '+s+'/>'+
    '<path d="M12 13 Q16 11 18 7 Q14 7 12 11" '+s+'/>';

  // Nivel 4: árbol joven — tronco + copa redondeada
  if(lvl===4) return '<path d="M12 22 L12 14" '+s+'/>'+
    '<path d="M9 22 L15 22" '+s+'/>'+
    '<path d="M8 15 Q7 10 12 7 Q17 10 16 15 Q14 18 12 17 Q10 18 8 15Z" '+s+'/>';

  // Nivel 5: árbol en flor — árbol + pequeñas flores
  if(lvl===5) return '<path d="M12 22 L12 13" '+s+'/>'+
    '<path d="M9 22 L15 22" '+s+'/>'+
    '<circle cx="12" cy="10" r="6" '+s+'/>'+
    '<circle cx="9" cy="9" r="1.2" '+f+' opacity=".7"/>'+
    '<circle cx="14" cy="8" r="1.2" '+f+' opacity=".7"/>'+
    '<circle cx="12" cy="6" r="1.2" '+f+' opacity=".7"/>';

  // Nivel 6: chispa — punto brillante con rayitas cortas
  if(lvl===6){
    var r='';
    for(var a=0;a<360;a+=45){
      var cx=Math.cos(a*Math.PI/180), cy=Math.sin(a*Math.PI/180);
      r+='<line x1="'+(12+5*cx)+'" y1="'+(12+5*cy)+'" x2="'+(12+8*cx)+'" y2="'+(12+8*cy)+'" '+s+'/>';
    }
    return '<circle cx="12" cy="12" r="3.5" '+s+'/>'+r;
  }

  // Nivel 7: llama pequeña — forma orgánica de llama
  if(lvl===7) return '<path d="M12 21 Q7 18 8 13 Q9 10 11 9 Q10 12 12 13 Q14 10 13 6 Q18 9 17 15 Q16 19 12 21Z" '+s+'/>';

  // Nivel 8: antorcha — palo + llama grande
  if(lvl===8) return '<path d="M12 22 L12 14" '+s+'/>'+
    '<path d="M10 22 L14 22" '+s+'/>'+
    '<path d="M12 14 Q8 12 9 8 Q10 5 12 4 Q11 7 13 8 Q15 5 14 2 Q18 5 17 10 Q16 13 12 14Z" '+s+'/>';

  // Nivel 9: hoguera — múltiples llamas + base con leños
  if(lvl===9) return '<path d="M7 18 L17 18" '+s+'/>'+
    '<path d="M8 18 L10 16" '+s+'/>'+
    '<path d="M16 18 L14 16" '+s+'/>'+
    '<path d="M12 16 Q9 14 10 10 Q11 8 12 7 Q11 10 13 10 Q14 7 13 4 Q17 7 16 12 Q15 15 12 16Z" '+s+'/>'+
    '<path d="M9 16 Q8 14 9 12 Q10 11 11 12 Q10 13 9 16Z" '+s+' opacity=".6"/>'+
    '<path d="M15 15 Q16 12 15 10 Q14 11 14 13 Q14 15 15 15Z" '+s+' opacity=".6"/>';

  // Nivel 10: sol — círculo sólido + rayos largos
  if(lvl===10){
    var rays='';
    for(var a=0;a<360;a+=30){
      var cx2=Math.cos(a*Math.PI/180), cy2=Math.sin(a*Math.PI/180);
      rays+='<line x1="'+(12+6*cx2)+'" y1="'+(12+6*cy2)+'" x2="'+(12+10*cx2)+'" y2="'+(12+10*cy2)+'" '+s+'/>';
    }
    return '<circle cx="12" cy="12" r="5" '+s+'/>'+rays;
  }

  // Nivel 11-12: estrella de 6 puntas (Estrella de David / hexagrama)
  if(lvl<=12) return '<polygon points="12,2 14.5,8 21,8 16,12 18.5,19 12,15 5.5,19 8,12 3,8 9.5,8" '+s+'/>';

  // Nivel 13-14: dos estrellas / constelación — patrón de 3 estrellas conectadas
  if(lvl<=14) return '<circle cx="6"  cy="16" r="1.8" '+s+'/>'+
    '<circle cx="12" cy="5"  r="2.2" '+s+'/>'+
    '<circle cx="18" cy="16" r="1.8" '+s+'/>'+
    '<path d="M6 16 L12 5 L18 16 L6 16Z" '+s+' opacity=".5"/>';

  // Nivel 15-17: galaxia — espiral
  if(lvl<=17) return '<path d="M12 12 Q16 8 14 5 Q10 3 7 6 Q4 10 6 14 Q9 18 14 18 Q19 17 20 13 Q20 8 16 5" '+s+'/>'+
    '<circle cx="12" cy="12" r="1.5" fill="'+col+'" stroke="none"/>';

  // Nivel 18-21: dos espirales / doble hélice cósmica
  if(lvl<=21) return '<path d="M5 20 Q8 16 12 12 Q16 8 19 4" '+s+'/>'+
    '<path d="M5 4 Q8 8 12 12 Q16 16 19 20" '+s+'/>'+

  for(var a2=0;a2<360;a2+=30){

    pts22+=(12+9*cx3)+','+(12+9*cy3)+' ';
  }
  var inner='';
  for(var a3=0;a3<360;a3+=60){
    var cx4=Math.cos(a3*Math.PI/180), cy4=Math.sin(a3*Math.PI/180);
    inner+='<line x1="'+(12+4*cx4)+'" y1="'+(12+4*cy4)+'" x2="'+(12+9*cx4)+'" y2="'+(12+9*cy4)+'" '+s+'/>';
  }
  return '<polygon points="'+pts22.trim()+'" '+s+'/>'+
    '<circle cx="12" cy="12" r="4" '+s+'/>'+
    inner;
}

function uid(){return Math.random().toString(36).substr(2,9);}
function todayIdx(){var d=new Date().getDay();return d===0?6:d-1;}
// Número de día del mes (01, 02...) para un día de semana (0=Lun..6=Dom)
// DENTRO de la semana actual — para mostrarlo junto al nombre ("Lunes 07").
function weekdayDateNum(dowIdx){
  var today = new Date(); today.setHours(0,0,0,0);
  var monday = new Date(today); monday.setDate(today.getDate() - todayIdx());
  var d = new Date(monday); d.setDate(monday.getDate() + dowIdx);
  return String(d.getDate()).padStart(2,'0');
}
// BUGFIX CRÍTICO — huso horario: `new Date().toISOString().slice(0,10)`
// convierte SIEMPRE a UTC. En Chile (UTC-3 u UTC-4 según horario de
// verano) eso hacía que la fecha "de hoy" cambiara varias horas ANTES de
// la medianoche real — a las 21-23h la app ya pensaba que era mañana.
// Eso disparaba de noche el reinicio semanal automático (pensado para
// los lunes a las 4 AM) y borraba las tareas ya marcadas como hechas
// ese mismo día. `localDateStr` arma la fecha con los campos LOCALES del
// dispositivo, que es lo correcto para "qué día es hoy para el usuario".
function localDateStr(d){
  d = d || new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
// Parsea un string 'YYYY-MM-DD' como medianoche LOCAL. `new Date('YYYY-MM-DD')`
// interpreta ese string como UTC por spec, así que leerlo después con
// getDay()/getDate() (que son locales) podía devolver el día anterior en
// husos con offset negativo como Chile. Usar esto en vez de `new Date(str)`
// para cualquier fecha guardada con localDateStr/todayStr.
function parseLocalDate(s){
  if(!s) return null;
  var parts = String(s).slice(0,10).split('-');
  return new Date(+parts[0], +parts[1]-1, +parts[2]);
}
// Suma (o resta) días de calendario usando campos locales en vez de sumar
// milisegundos fijos (86400000). Sumar ms fijos falla justo el día del
// cambio de horario de verano/invierno, porque ese día no dura 24 horas
// exactas — con esto, el cambio de hora en Chile ya no corre los cálculos.
function addDaysLocal(d, n){
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, d.getHours()||0, d.getMinutes()||0, d.getSeconds()||0);
}
function todayStr(){return localDateStr(new Date());}

// Devuelve clave de semana ISO: YYYY-Www
function getWeekKey(date){
  date = date || new Date();
  var d = new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  var weekNum = Math.ceil((((d - yearStart)/86400000)+1)/7);
  return d.getUTCFullYear()+'-W'+String(weekNum).padStart(2,'0');
}
function nextWeekKey(offset){
  offset = offset || 1;
  var d = new Date();
  d.setDate(d.getDate() + offset*7);
  return getWeekKey(d);
}
function daysUntilDate(target){
  var now = new Date(); now.setHours(0,0,0,0);
  target = new Date(target); target.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function daysUntilText(days){
  return 'Disponible en '+(days<=0?'hoy':days===1?'1 día':days+' días');
}
// ── Ventanas de reinicio de período (pedido: no solo el último día exacto,
// sino un rango alrededor del cambio de período, como ya existía para la
// semana con sábado/domingo) ────────────────────────────────────────────
// Mes: últimos 3 días del mes que termina + primeros 2 días del siguiente.
function isMonthResetWindow(){
  var d = new Date();
  var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return d.getDate() > lastDay-3 || d.getDate() <= 2;
}
// Identifica qué mes se está "cerrando" — para que "ya usado" siga válido
// en toda la ventana, no solo el día exacto en que se usó (si se usa el
// día 29 y hoy es el 1 del mes siguiente, sigue contando como usado).
function monthResetCycleId(){
  var d = new Date();
  var y = d.getFullYear(), m = d.getMonth();
  if(d.getDate()<=2){ m--; if(m<0){m=11;y--;} }
  return y+'-m'+m;
}
function daysUntilMonthWindowText(){
  var d = new Date(); d.setHours(0,0,0,0);
  var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  var target = new Date(d.getFullYear(), d.getMonth(), lastDay-2);
  return daysUntilText(daysUntilDate(target));
}
// Semestre: últimos 10 días del semestre que termina + primeros 10 del
// siguiente (21-30 jun / 1-10 jul, y 22-31 dic / 1-10 ene).
function isSemesterResetWindow(){
  var d = new Date(); var m=d.getMonth(), day=d.getDate();
  if(m===5 && day>=21) return true;
  if(m===6 && day<=10) return true;
  if(m===11 && day>=22) return true;
  if(m===0 && day<=10) return true;
  return false;
}
function semesterResetCycleId(){
  var d = new Date(); var y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  if(m===0 && day<=10) return (y-1)+'-s1'; // ene 1-10 -> cierre del 2do semestre del año anterior
  if(m===6 && day<=10) return y+'-s0'; // jul 1-10 -> cierre del 1er semestre de este año
  return y+'-s'+(m<6?0:1);
}
function daysUntilSemesterWindowText(){
  var d = new Date(); d.setHours(0,0,0,0);
  var y = d.getFullYear();
  var candidates = [new Date(y,5,21), new Date(y,11,22), new Date(y+1,5,21)];
  var target = candidates[candidates.length-1];
  for(var i=0;i<candidates.length;i++){ if(candidates[i]>=d){ target=candidates[i]; break; } }
  return daysUntilText(daysUntilDate(target));
}
// Año: últimos 15 días de diciembre + primeros 15 de enero.
function isYearResetWindow(){
  var d = new Date(); var m=d.getMonth(), day=d.getDate();
  if(m===11 && day>=17) return true;
  if(m===0 && day<=15) return true;
  return false;
}
function yearResetCycleId(){
  var d = new Date(); var y=d.getFullYear();
  if(d.getMonth()===0 && d.getDate()<=15) return y-1; // ene 1-15 -> cierre del año anterior
  return y;
}
function daysUntilYearWindowText(){
  var d = new Date(); d.setHours(0,0,0,0);
  var y = d.getFullYear();
  var target = new Date(y,11,17);
  if(target < d) target = new Date(y+1,11,17);
  return daysUntilText(daysUntilDate(target));
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Insignia circular consistente para avisos, notificaciones y tutorial.
// content: string SVG (se tiñe con --accent) o un solo emoji (se muestra a su tamaño natural).
function iconBadgeHTML(content, size){
  size = size || 72;
  var isSvg = content.indexOf('<svg') === 0;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--accent);flex-shrink:0;">'+
    (isSvg ? content : '<span style="font-size:'+Math.round(size*0.44)+'px;line-height:1;">'+content+'</span>')+
  '</div>';
}

function isDone(t){
  if(t.checklist&&t.checklist.length)return t.checklist.every(function(i){return i.done;});
  if((t.qty||1)>1)return(t.prog||0)>=t.qty;
  return!!t.done;
}
function tRatio(t){
  if(t.checklist&&t.checklist.length)return t.checklist.filter(function(i){return i.done;}).length/t.checklist.length;
  if((t.qty||1)>1)return Math.min((t.prog||0)/t.qty,1);
  return t.done?1:0;
}

// ── Efectos de sonido ────────────────────────────────────────────────────
// Sintetizados con Web Audio API (sin archivos externos, livianos). Se
// controlan con S.soundOn (default: activado) desde Yo → Más ajustes →
// Ayuda y consejos. El AudioContext se crea de forma perezosa (lazy) en el
// primer sonido, ya que los navegadores exigen un gesto del usuario antes
// de reproducir audio — como todos estos sonidos se disparan desde un
// clic/tap, esto nunca es un problema real.
var _sndCtx = null;
function _sndGetCtx(){
  if(_sndCtx) return _sndCtx;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _sndCtx = new AC();
  }catch(e){ return null; }
  return _sndCtx;
}
// Un solo tono simple con envolvente (ataque rápido, caída suave).
function _sndTone(ctx, startAt, freq, dur, type, gainPeak){
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, startAt);
  gain.gain.setValueAtTime(0, startAt);
  gain.gain.linearRampToValueAtTime(gainPeak||0.18, startAt + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startAt);
  osc.stop(startAt + dur + 0.02);
}
// type: 'complete' (tarea completada), 'crucial' (marcar como crucial),
// 'achievement' (logro/medalla/nivel desbloqueado), 'streak' (racha del día
// lograda), 'add' (tarea creada), 'delete' (tarea eliminada), 'tick' (marcar
// un ítem de checklist sin completar toda la tarea), 'toggle' (clic suave de
// un interruptor on/off), 'warn' (acción bloqueada o advertencia).
function playSound(type){
  if(S.soundOn===false) return; // activado por defecto
  var ctx = _sndGetCtx();
  if(!ctx) return;
  if(ctx.state==='suspended'){ ctx.resume(); }
  var now = ctx.currentTime;
  if(type==='complete'){
    // Dos notas ascendentes cortas y suaves — "listo ✓"
    _sndTone(ctx, now, 523.25, 0.14, 'sine', 0.16);      // Do5
    _sndTone(ctx, now+0.08, 784.0, 0.18, 'sine', 0.16);  // Sol5
  } else if(type==='crucial'){
    // Un "ping" brillante y corto, tipo estrella
    _sndTone(ctx, now, 987.77, 0.10, 'triangle', 0.14);  // Si5
    _sndTone(ctx, now+0.05, 1318.5, 0.16, 'triangle', 0.12); // Mi6
  } else if(type==='achievement'){
    // Pequeña fanfarria ascendente de 4 notas — para medallas/logros/nivel
    _sndTone(ctx, now,      523.25, 0.14, 'triangle', 0.15); // Do5
    _sndTone(ctx, now+0.11, 659.25, 0.14, 'triangle', 0.15); // Mi5
    _sndTone(ctx, now+0.22, 784.00, 0.14, 'triangle', 0.15); // Sol5
    _sndTone(ctx, now+0.33, 1046.5, 0.28, 'triangle', 0.18); // Do6
  } else if(type==='streak'){
    // Más cálido y "de fuego" que el logro genérico — tres notas cortas
    // con un vibrato leve al final, sin llegar a la nota alta de achievement.
    _sndTone(ctx, now,      440.00, 0.12, 'sine', 0.15); // La4
    _sndTone(ctx, now+0.09, 587.33, 0.12, 'sine', 0.15); // Re5
    _sndTone(ctx, now+0.18, 698.46, 0.22, 'sine', 0.17); // Fa5
  } else if(type==='add'){
    // Pop breve y neutro — confirmación de creación, sin ser tan festivo
    // como completar una tarea.
    _sndTone(ctx, now, 660.0, 0.09, 'sine', 0.13);
  } else if(type==='delete'){
    // Dos notas descendentes cortas — algo se fue, sin sonar alarmante.
    _sndTone(ctx, now,      392.00, 0.10, 'sine', 0.12); // Sol4
    _sndTone(ctx, now+0.06, 293.66, 0.14, 'sine', 0.11); // Re4
  } else if(type==='tick'){
    // Clic diminuto, más discreto que 'complete', para un solo ítem del
    // checklist sin cerrar toda la tarea.
    _sndTone(ctx, now, 900, 0.05, 'square', 0.05);
  } else if(type==='toggle'){
    // Clic suave y neutro para interruptores on/off genéricos.
    _sndTone(ctx, now, 700, 0.045, 'square', 0.045);
  } else if(type==='warn'){
    // Zumbido corto y grave — acción bloqueada o que necesita atención.
    _sndTone(ctx, now, 220, 0.16, 'sawtooth', 0.07);
  } else if(type==='tab'){
    // Deslizamiento de tono suave y amigable — para cambios de pestaña,
    // sea por clic en el tab o por swipe. Más cálido que 'toggle'.
    var oscT = ctx.createOscillator();
    var gainT = ctx.createGain();
    oscT.type = 'sine';
    oscT.frequency.setValueAtTime(520, now);
    oscT.frequency.exponentialRampToValueAtTime(680, now+0.09);
    gainT.gain.setValueAtTime(0, now);
    gainT.gain.linearRampToValueAtTime(0.09, now+0.015);
    gainT.gain.exponentialRampToValueAtTime(0.0001, now+0.11);
    oscT.connect(gainT); gainT.connect(ctx.destination);
    oscT.start(now); oscT.stop(now+0.13);
  }
}

// XP is queued briefly so cascade events show as a single +X XP toast
var _xpQueue=0;
var _xpFlushTimer=null;
function addXP(pts){
  if(!pts||pts<=0)return;
  if(S.simpleMode)return; // Modo simplificado: sin XP/niveles
  _xpQueue+=pts;
  if(_xpFlushTimer)clearTimeout(_xpFlushTimer);
  _xpFlushTimer=setTimeout(flushXP,80);
}
function flushXP(){
  if(_xpQueue<=0)return;
  var pts=_xpQueue;_xpQueue=0;
  var oldLvl=getLevel(S.xp);
  S.xp=Math.max(0,S.xp+pts);
  // Snapshot diario de XP total
  if(!S.xpHistory)S.xpHistory={};
  S.xpHistory[todayStr()]=S.xp;
  var newLvl=getLevel(S.xp);
  saveState();
  render();
  showXPToast(pts);
  if(newLvl>oldLvl){
    S.prevLvl=newLvl;
    // Animación de subida de nivel
    playLevelUpAnimation();
    setTimeout(function(){showLevelUp(newLvl);},1100);
  }
}

// ── Animación de subida de nivel ──────────────────────────────────────────
function playLevelUpAnimation(){
  playSound('achievement');
  vibrate([20,30,20,30,40]);
  // Quitar animación previa si existe
  var old = document.getElementById('lvl-anim');
  if(old) old.remove();
  
  var container = document.createElement('div');
  container.id = 'lvl-anim';
  
  // Flash radial
  var flash = document.createElement('div');
  flash.className = 'lvl-flash';
  container.appendChild(flash);
  
  // Confeti (24 partículas)
  var colors = ['#c97842','#e8c5a8','#a85e3a','#f5e3d3','#ffb380','#d4b896'];
  for(var i=0;i<24;i++){
    var p = document.createElement('div');
    p.className = 'confetti';
    var angle = (i/24) * Math.PI * 2 + Math.random()*0.3;
    var dist = 200 + Math.random()*250;
    var tx = Math.cos(angle) * dist;
    var ty = Math.sin(angle) * dist;
    var tr = (Math.random()-0.5) * 720;
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--tx', tx+'px');
    p.style.setProperty('--ty', ty+'px');
    p.style.setProperty('--tr', tr+'deg');
    p.style.animation = 'confettiBurst 1.2s '+(Math.random()*0.15)+'s ease-out forwards';
    if(Math.random() > 0.5){
      // Algunos cuadrados, otros círculos
      p.style.borderRadius = '50%';
    }
    container.appendChild(p);
  }
  
  document.body.appendChild(container);
  
  // Pulso en el anillo XP del header
  var miniArc = document.querySelector('#v2-header .hdr-ring');
  if(miniArc){
    miniArc.classList.add('ring-pulse');
    setTimeout(function(){miniArc.classList.remove('ring-pulse');}, 700);
  }
  
  // Quitar el contenedor después de la animación
  setTimeout(function(){
    if(container && container.parentNode) container.remove();
  }, 1500);
}

function getActiveMode(){
  if(!S.activeMode)return null;
  // BUGFIX: antes este merge perdía el campo `type` (ni S.bajaEnergia ni
  // S.vacaciones ni los modos personalizados en S.modes tienen un campo
  // `type` propio), así que cualquier código que revisara `am.type==='baja'`
  // o `am.type==='custom'` fallaba siempre y mostraba "Normal" aunque
  // Baja Energía (o un modo personalizado) estuviera realmente activo.
  if(S.activeMode.type==='baja')return Object.assign({id:'baja'},S.bajaEnergia,{name:'Baja Energía',type:'baja'});
  if(S.activeMode.type==='vacaciones')return Object.assign({id:'vacaciones'},S.vacaciones,{name:'Vacaciones',icon:'🌴',color:'#a8c499',type:'vacaciones'});
  // BUGFIX CRÍTICO: si S.modes se corrompe (null/undefined) o si el modo
  // personalizado activo fue borrado pero S.activeMode todavía lo apunta,
  // esto lanzaba una excepción. Como getActiveMode() se llama en CADA
  // render() (vía renderV2Header, que corre para toda pestaña), un solo dato
  // corrupto acá dejaba TODA la app sin responder a ningún botón. Ahora, si
  // el modo activo ya no existe, simplemente se desactiva solo en vez de
  // romper el render.
  if(!Array.isArray(S.modes)){ S.modes = []; }
  var found = S.modes.find(function(m){return m.id===S.activeMode.id;});
  if(!found){
    S.activeMode = null; // el modo personalizado activo ya no existe: limpiar
    return null;
  }
  return Object.assign({},found,{type:'custom'});
}

// Cooldown "una vez por semestre" aplicado a modos predeterminados en plan gratuito
var FREE_MODE_COOLDOWN_DAYS = 30; // 1 mes

function bajaCanActivate(){
  // Plan ilimitado: sin cooldowns nunca
  if(isIlimitado())return{ok:true};
  var be=S.bajaEnergia;
  if(!be.activeSince)return{ok:true};
  var since=new Date(be.activeSince);
  var plan=getPlan();
  // Gratuito: una vez por semestre. Donante: sin cooldown (isIlimitado).
  var cooldownDays = plan==='free' ? FREE_MODE_COOLDOWN_DAYS : (be.daysLimit+(be.cooldownMonths||3)*30);
  var until=new Date(since.getTime()+cooldownDays*86400000);
  if(new Date()<until){
    var daysLeft=Math.ceil((until-new Date())/86400000);
    return{ok:false,daysLeft:daysLeft};
  }
  return{ok:true};
}
function bajaRemainingDays(){
  var be=S.bajaEnergia;
  if(!be.activeSince)return 0;
  var since=new Date(be.activeSince);
  // Ilimitado: sin límite de días
  if(isIlimitado())return 999;
  var end=new Date(since.getTime()+be.daysLimit*86400000);
  return Math.max(0,Math.ceil((end-new Date())/86400000));
}

// ── Hiperfoco (premium) ───────────────────────────────────────────────────
// Devuelve el plan actual: 'free', 'donante'
function getPlan(){
  // Vista previa de desarrollador: activable manteniendo presionado el logo
  // 1.5s (ver togglePremiumPreview). Sirve para probar la experiencia de
  // usuario Donante en tu propio dispositivo sin tener que pagar de verdad
  // ni usar una segunda cuenta — no afecta a otros usuarios ni es una compra.
  if(localStorage.getItem('og6-dev-premium-preview')==='1') return 'donante';
  // BUGFIX: `userSubscription` nunca se declara en ningún lado de este
  // archivo — se espera que el wrapper nativo de Android (Play Billing) lo
  // inyecte como window.userSubscription tras verificar una compra real.
  // Referenciarlo directo (sin "window.") lanzaba ReferenceError si ese
  // wrapper nativo no estaba presente (por ejemplo, probando en un navegador
  // normal), lo cual podía romper cualquier pantalla que llamara a
  // getPlan() — que son varias.
  var sub = window.userSubscription;
  if(!currentUser || !sub || sub.status!=='active')return 'free';
  if(sub.expiryDate && new Date(sub.expiryDate)<=new Date())return 'free';
  return 'donante';
}

function isHiperfocoActive(){
  if(!S.hiperfoco||!S.hiperfoco.activeSince)return false;

    var cooldownDays = plan==='free' ? FREE_MODE_COOLDOWN_DAYS : HIPERFOCO_COOLDOWN_DAYS;
    var available=new Date(last.getTime()+cooldownDays*86400000);
    if(new Date()<available){
      var daysLeft=Math.ceil((available-new Date())/86400000);
      return{ok:false,reason:'cooldown',daysLeft:daysLeft};
    }
  }
  return{ok:true};
}
function hiperfocoRemainingDays(){
  if(!isHiperfocoActive())return 0;
  if(isIlimitado())return 999;
  var since=new Date(S.hiperfoco.activeSince);

  return Math.max(0,Math.ceil((end-new Date())/86400000));
}

// ── V2 NAVIGATION ─────────────────────────────────────────────────────────
function setTab(t){
  var prevTab = S.tab;
  S.tab = t;
  var routeToTab = {
    'hoy':'hoy','dia':'hoy',
    'plan':'plan','objetivos':'plan','progreso':'plan','horario':'plan',
    'proyectos':'proyectos',
    'energia':'energia','modos':'energia','plantillas':'energia',
    'yo':'yo','cuenta':'yo','mas':'yo'
  };
  var activeTab = routeToTab[t] || 'hoy';
  // Pedido: si se navega a otra pestaña principal, Yo debe "olvidar" en qué
  // pantalla dedicada se había quedado — la próxima vez que se entre, parte
  // de nuevo en la lista principal de categorías.
  if(activeTab !== 'yo') S.yoScreen = null;
  document.querySelectorAll('.bnav-btn').forEach(function(b){
    var id = b.id.replace('bnav-','');
    b.classList.toggle('active', id === activeTab);
  });
  if(prevTab !== t){
    playSound('tab');
    // Registrar en el historial del navegador para que el botón "atrás" del
    // celular vuelva a la pestaña anterior en vez de salir de la app —
    // salvo que este cambio de pestaña sea justamente la RESPUESTA a haber
    // presionado "atrás" (ver el manejador de popstate más abajo).
    // BUGFIX: si se entra a "Yo", el estado también debe guardar
    // navYoScreen:null explícitamente — si no, al volver "atrás" desde una
    // de sus pantallas dedicadas (Plan y pagos, Preferencias...) el popstate
    // no encontraba esa clave en este escalón del historial, no hacía nada,
    // y una segunda pulsación de "atrás" saltaba de golpe a otra pestaña.
    if(!_tabHistorySuspended){
      var pushObj = {navTab:t};
      if(activeTab==='yo') pushObj.navYoScreen = null;
      try{ history.pushState(pushObj, ''); }catch(e){}
    }
  }
  render();
}


// ── Selección múltiple (mantener presionado) ────────────────────────────────
// Mantener presionado un ítem seleccionable (tarea, proyecto, o modo) entra en
// "modo selección": aparece una casilla en cada ítem del mismo tipo y una
// barra inferior con acciones en lote (eliminar, categoría, mover de día...
// según el tipo). Una vez dentro, un toque normal alterna la selección sin
// tener que volver a mantener presionado.
var SEL = {active:false, type:null, ids:[]};
var _selLpTimer = null, _selLpX = 0, _selLpY = 0, _selLpFired = false;

function selLpStart(type, id, ev){
  if(SEL.active) return; // ya en modo selección: el tap normal decide (ver taskHTMLSelectable, etc.)
  var p = (ev.touches && ev.touches[0]) || ev;
  _selLpX = p.clientX; _selLpY = p.clientY;
  _selLpFired = false;
  clearTimeout(_selLpTimer);
  _selLpTimer = setTimeout(function(){
    _selLpFired = true;
    enterSelectMode(type, id);
  }, 480);
}
function selLpMove(ev){
  if(!_selLpTimer) return;
  var p = (ev.touches && ev.touches[0]) || ev;
  if(Math.abs(p.clientX-_selLpX)>10 || Math.abs(p.clientY-_selLpY)>10){
    clearTimeout(_selLpTimer); _selLpTimer=null;
  }
}
function selLpEnd(){
  clearTimeout(_selLpTimer); _selLpTimer = null;
}
function enterSelectMode(type, firstId){
  SEL.active = true; SEL.type = type; SEL.ids = [firstId];
  playSound('toggle');
  vibrate(15);
  render();
}
function toggleSelect(type, id){
  if(!SEL.active || SEL.type!==type) return;
  var idx = SEL.ids.indexOf(id);
  if(idx===-1) SEL.ids.push(id); else SEL.ids.splice(idx,1);
  playSound('tick');
  if(SEL.ids.length===0){ exitSelectMode(); return; }
  render();
}
function exitSelectMode(){
  SEL.active=false; SEL.type=null; SEL.ids=[];
  render();
}
function selBarBtnStyle(color){
