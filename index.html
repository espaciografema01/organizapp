// ── Vista de proyecto (fullscreen overlay) ─────────────────────────────────
function openProjectView(id){
  S.activeProjectId = id;
  var existing = document.getElementById('project-view');
  if(existing) existing.remove();
  // Ocultar botones flotantes y nav mientras el proyecto está abierto
  var pfab=document.getElementById('project-fab');
  var nav=document.getElementById('bottom-nav');
  if(pfab) pfab.style.display='none';
  if(nav) nav.style.display='none';
  var overlay = document.createElement('div');
  overlay.id = 'project-view';
  overlay.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:800;display:flex;flex-direction:column;overflow:hidden;';
  document.body.appendChild(overlay);
  renderProjectContent();
  // Tour de proyecto: solo la primera vez que el usuario abre algún proyecto
  startProjectTour();
}

function closeProjectView(){
  var ov=document.getElementById('project-view');
  if(ov)ov.remove();
  S.activeProjectId=null;
  // Restaurar nav
  var nav=document.getElementById('bottom-nav');
  if(nav) nav.style.display='flex';
  render();
}

function renderProjectContent(){
  var overlay=document.getElementById('project-view');
  if(!overlay) return;
  // Guardar posición de scroll antes de reemplazar el HTML
  var prevContent = document.getElementById('pv-content');
  var savedScrollTop  = prevContent ? prevContent.scrollTop  : 0;
  var savedScrollLeft = prevContent ? prevContent.scrollLeft : 0;

  var p=(S.projects||[]).find(function(x){return x.id===S.activeProjectId;});
  if(!p){overlay.remove();return;}
  var view=S._projectView||'gantt'; // 'gantt' | 'lista'

  // Calcular progreso global usando calcNodePct (recursivo) para que las
  // subtareas actualicen correctamente el % del padre y del total.
  var totalT=0, doneT=0;
  function sumPct(tasks){
    (tasks||[]).forEach(function(t){
      // Solo contamos nodos hoja hacia el total: si tiene children, su pct
      // es el promedio de ellos (calculado dinámicamente), no un campo propio.
      if(!t.children||!t.children.length){
        totalT++; doneT+=calcNodePct(t)/100;
      } else {
        sumPct(t.children);
      }
    });
  }
  (p.sections||[]).forEach(function(s){ sumPct(s.tasks||[]); });
  var pctGlobal=totalT?Math.round(doneT/totalT*100):0;

  // Header — antes usaba el color del proyecto como fondo sólido de toda la
  // franja superior (choque fuerte contra un tema minimalista/blanco, se
  // sentía "desgastante" al abrir cada proyecto). Ahora el color del proyecto
  // vive solo como una barra de identidad delgada arriba y como acento en la
  // barra de progreso / pestaña activa — el resto es neutro, como el resto de
  // la app.
  var ICON_EDIT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var ICON_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>';
  var ICON_KEBAB = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
  var ICON_GANTT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/></svg>';
  var ICON_LIST  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2.2"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>';
  var ICON_LINK  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6M10 6l1-1a4 4 0 0 1 6 6l-1 1M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>';
  var neutralIconBtn = 'background:var(--bg);border:1.5px solid var(--line);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;';

  overlay.innerHTML='<div style="height:4px;background:'+p.color+';flex-shrink:0;"></div>'+
  '<div id="pv-header" style="background:var(--paper);border-bottom:1px solid var(--line-soft);padding:14px 16px 10px;flex-shrink:0;">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'+
      '<button onclick="closeProjectView()" style="'+neutralIconBtn+'">'+ICON_BACK+'</button>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-weight:800;font-size:18px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" class="serif">'+esc(p.name)+'</div>'+
        (p.desc?'<div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(p.desc)+'</div>':'')+
      '</div>'+
      '<button onclick="openEditProjectModal(\''+p.id+'\')" style="'+neutralIconBtn+'" title="Editar proyecto">'+ICON_EDIT+'</button>'+
      '<button onclick="openProjectMenu(\''+p.id+'\',event)" style="'+neutralIconBtn+'" title="Más opciones">'+ICON_KEBAB+'</button>'+
    '</div>'+
    // Progreso global
    '<div style="background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">'+
        '<span style="font-size:11px;font-weight:700;color:var(--muted);">Progreso general</span>'+
        '<span style="font-size:13px;font-weight:800;color:'+p.color+';">'+pctGlobal+'%</span>'+
      '</div>'+
      '<div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;">'+
        '<div style="height:100%;width:'+pctGlobal+'%;background:'+p.color+';border-radius:3px;"></div>'+
      '</div>'+
      (p.start||p.end?'<div style="font-size:10px;color:var(--muted);margin-top:4px;">'+(p.start?formatDateShort(p.start):'')+' → '+(p.end?formatDateShort(p.end):'sin fecha de fin')+'</div>':'')+
    '</div>'+
  '</div>'+
  // Sub-tabs
  '<div style="display:flex;background:var(--bg);border-bottom:1px solid var(--line-soft);flex-shrink:0;">'+

    '<button onclick="S._projectView=\'conexiones\';renderProjectContent();" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;border:none;border-bottom:2.5px solid '+(view==='conexiones'?p.color:'transparent')+';background:transparent;cursor:pointer;font-family:Inter,sans-serif;font-size:12px;font-weight:700;color:'+(view==='conexiones'?p.color:'var(--muted)')+';">'+ICON_LINK+'Conexiones</button>'+
  '</div>'+
  // Contenido
  '<div id="pv-content" style="flex:1;overflow-y:auto;overflow-x:'+(view==='gantt'?'auto':'hidden')+';">'+
    buildProjectContent(p, view)+
  '</div>'+
  // FAB agregar sección
  '<div style="position:absolute;bottom:20px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;">'+

// ── Vista GANTT ────────────────────────────────────────────────────────────
// ── Vista LISTA ────────────────────────────────────────────────────────────

// ── Helpers para árbol recursivo de tareas ─────────────────────────────────

// Calcula % promedio de un nodo (incluyendo children recursivos)
function calcNodePct(t){
  if(!t.children||!t.children.length) return t.pct||0;
  var sum=0;
  t.children.forEach(function(c){sum+=calcNodePct(c);});
  return Math.round(sum/t.children.length);
}

// Aplana todos los nodos hoja (sin children o sin children con hojas) para Gantt
function flattenTasksForGantt(tasks, sectionIdx, prefix){
  var rows=[];
  (tasks||[]).forEach(function(t,i){
    var num=prefix+(i+1);
    var effectivePct=calcNodePct(t);
    rows.push({t:t, num:num, effectivePct:effectivePct, isLeaf:!t.children||!t.children.length});
    if(t.children&&t.children.length){
      var childRows=flattenTasksForGantt(t.children, sectionIdx, num+'.');
      childRows.forEach(function(r){rows.push(r);});
    }
  });
  return rows;
}

// Encuentra un nodo por id recursivamente
function findNodeById(tasks, id){
  for(var i=0;i<tasks.length;i++){
    if(tasks[i].id===id) return {node:tasks[i], arr:tasks, idx:i};
    if(tasks[i].children&&tasks[i].children.length){
      var res=findNodeById(tasks[i].children,id);
      if(res) return res;
    }
  }
  return null;
}

// Aplana para conexiones
function flattenForConexiones(tasks, prefix){
  var rows=[];
  (tasks||[]).forEach(function(t,i){
    var num=prefix+(i+1);
    rows.push({t:t,num:num});
    if(t.children&&t.children.length){
      flattenForConexiones(t.children, num+'.').forEach(function(r){rows.push(r);});
    }
  });
  return rows;
}

// Renderiza árbol de tareas recursivamente
function renderTaskTree(p, s, tasks, prefix, depth, color){
  color = color || p.color;
  var html='';
  var indent=depth*16;
  (tasks||[]).forEach(function(t,i){
    var num=prefix+(i+1);
    var effectivePct=calcNodePct(t);
    var hasChildren=t.children&&t.children.length>0;
    var dur=t.start&&t.end?Math.ceil((new Date(t.end)-new Date(t.start))/86400000)+1:0;
    var isLeaf=!hasChildren;
    var collapsed=S._collapseNodes&&S._collapseNodes[t.id];
    
    html+='<div style="border-bottom:1px solid var(--line-soft);">'+
      '<div style="display:flex;align-items:center;gap:8px;padding:9px 16px 9px '+(16+indent)+'px;background:'+(depth%2===1?'var(--bg)50%':'transparent')+';">'+
        // Expandir/colapsar si tiene children
        (hasChildren?
          '<button onclick="toggleNodeCollapse(\''+t.id+'\')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font-size:11px;width:16px;flex-shrink:0;transition:transform .15s;transform:'+(collapsed?'rotate(-90deg)':'rotate(0deg')+');">▾</button>'
          :'<div style="width:16px;flex-shrink:0;"></div>')+
        // Círculo de progreso (solo hojas son clickeables para ciclar)
        '<div onclick="'+(isLeaf?'cycleTaskPct(\''+p.id+'\',\''+s.id+'\',\''+t.id+'\')':'null')+'" '+
          'style="width:24px;height:24px;border-radius:50%;border:2px solid '+(effectivePct>=100?'#27ae60':color)+';background:'+(effectivePct>=100?'#27ae60':'transparent')+';display:flex;align-items:center;justify-content:center;cursor:'+(isLeaf?'pointer':'default')+';flex-shrink:0;">'+
          (effectivePct>=100?
            '<svg width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 3.5,6.5 9,1" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':
            '<span style="font-size:8px;font-weight:800;color:'+(hasChildren?'var(--ink)':color)+';">'+effectivePct+'</span>')+
        '</div>'+
        '<div style="flex:1;min-width:0;">'+
          '<div style="display:flex;align-items:center;gap:4px;">'+
            '<span style="font-size:10px;color:var(--muted);flex-shrink:0;">'+num+'</span>'+
            '<span style="font-size:'+(depth===0?13:12)+'px;font-weight:'+(depth===0?600:500)+';color:'+(effectivePct>=100?'var(--muted)':'var(--ink)')+';text-decoration:'+(effectivePct>=100?'line-through':'none')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.name)+'</span>'+
          '</div>'+
          (!hasChildren&&(t.start||dur)?
            '<div style="display:flex;gap:6px;margin-top:2px;">'+
              (t.start?'<span style="font-size:9px;color:var(--muted);">'+formatDateShort(t.start)+'</span>':'')+
              (t.end?'<span style="font-size:9px;color:var(--muted);">→ '+formatDateShort(t.end)+'</span>':'')+
              (dur?'<span style="font-size:9px;color:var(--muted);">· '+dur+'d</span>':'')+
            '</div>':'')+
          (isLeaf&&effectivePct>0&&effectivePct<100?
            '<div style="height:2px;background:var(--line);border-radius:1px;margin-top:3px;overflow:hidden;"><div style="height:100%;width:'+effectivePct+'%;background:'+color+';"></div></div>':'')+
        '</div>'+
        // Botón agregar subtarea
        '<button onclick="openAddTaskModal(\''+p.id+'\',\''+s.id+'\',\''+t.id+'\')" title="Agregar subtarea" style="background:none;border:none;color:'+color+';font-size:14px;cursor:pointer;padding:0 3px;flex-shrink:0;line-height:1;">+</button>'+
        '<button onclick="openEditProjectTask(\''+p.id+'\',\''+s.id+'\',\''+t.id+'\')" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 3px;flex-shrink:0;">✎</button>'+
        '<button onclick="deleteProjectTask(\''+p.id+'\',\''+s.id+'\',\''+t.id+'\')" style="background:none;border:none;color:var(--muted-soft);font-size:16px;cursor:pointer;padding:0 3px;flex-shrink:0;">×</button>'+
      '</div>'+
      // Hijos (si no está colapsado)
      (hasChildren&&!collapsed?renderTaskTree(p,s,t.children,num+'.',depth+1,color):'')+
    '</div>';
  });
  return html;
}

function toggleNodeCollapse(id){
  if(!S._collapseNodes)S._collapseNodes={};
  S._collapseNodes[id]=!S._collapseNodes[id];

// ── buildGanttView (recursivo, muestra toda la jerarquía) ────────────────
function buildGanttView(p){
  var sections=p.sections||[];
  if(!sections.length) return '<div style="text-align:center;padding:40px 16px;color:var(--muted);"><div style="font-size:36px;margin-bottom:10px;">📊</div><div style="font-weight:700;font-size:15px;color:var(--ink);">Sin secciones</div><div style="font-size:12px;margin-top:4px;">Toca "+ Sección" para empezar</div></div>';

  var projStart=p.start?new Date(p.start):new Date();
  var allDates=[];
  // Todas las fechas del Gantt se normalizan a UTC medianoche para evitar
  // desfases de zona horaria: new Date('YYYY-MM-DD') ya es UTC, pero
  // new Date() y setHours(0,0,0,0) son locales. Usamos UTC en todo.
  function utcDay(dateOrStr){
    if(!dateOrStr) return null;
    var s = (typeof dateOrStr==='string') ? dateOrStr : dateOrStr.toISOString().slice(0,10);
    var parts = s.slice(0,10).split('-');
    return new Date(Date.UTC(+parts[0], +parts[1]-1, +parts[2]));
  }
  function collectDates(tasks){
    (tasks||[]).forEach(function(t){
      if(t.start)allDates.push(utcDay(t.start));
      if(t.end)allDates.push(utcDay(t.end));
      if(t.children)collectDates(t.children);
    });
  }
  sections.forEach(function(s){collectDates(s.tasks);});
  if(p.end)allDates.push(utcDay(p.end));
  var rangeStart=utcDay(projStart);
  var rangeEnd=p.end?utcDay(p.end):new Date(rangeStart.getTime()+60*86400000);
  if(allDates.length){
    var minD=allDates.reduce(function(a,b){return a<b?a:b;});
    var maxD=allDates.reduce(function(a,b){return a>b?a:b;});
    if(minD<rangeStart)rangeStart=new Date(minD.getTime()-86400000);
    if(maxD>rangeEnd)rangeEnd=new Date(maxD.getTime()+86400000);
  }
  rangeEnd=new Date(Math.max(rangeEnd.getTime(),rangeStart.getTime()+28*86400000));
  var days=Math.ceil((rangeEnd-rangeStart)/86400000)+1;
  var weeks=Math.ceil(days/7);
  var COL=28, LABEL=150;
  // "hoy" también en UTC para que la resta (today-rangeStart) no tenga decimales
  var todayLocal=new Date(); 
  var today=utcDay(todayLocal.getFullYear()+'-'+(todayLocal.getMonth()+1)+'-'+todayLocal.getDate());
  var dayNames=['D','L','M','X','J','V','S'];
  var hideWE = !!S.ganttHideWeekends;

  // Ancho por columna: 0 si es fin de semana y el usuario decidió ocultarlo.
  // xOf[di] = offset acumulado en px de esa columna (reemplaza el viejo di*COL,
  // que asumía todas las columnas del mismo ancho).
  var colW=[], xOf=[], cum=0;
  for(var dci=0;dci<days;dci++){
    var dd=new Date(rangeStart.getTime()+dci*86400000);
    var isWEc=dd.getUTCDay()===0||dd.getUTCDay()===6;
    var w=(hideWE&&isWEc)?0:COL;
    colW[dci]=w; xOf[dci]=cum; cum+=w;
  }
  var totalW=cum;
  // Ancho en px de un tramo [startIdx, startIdx+span) sumando columnas reales
  // (una tarea que cruza un fin de semana oculto no debe "pagar" ese ancho).
  function pxSpan(startIdx,span){
    var w=0;
    for(var k=startIdx;k<startIdx+span;k++) w += (colW[k]!==undefined?colW[k]:COL);
    return w;
  }

  // Headers semanas
  var hWeeks='';
  for(var w=0;w<weeks;w++){
    var wDays=Math.min(7,days-w*7);
    var wPix=pxSpan(w*7,wDays);
    if(wPix<=0) continue; // semana íntegramente oculta (no debería pasar, por seguridad)
    hWeeks+='<div style="width:'+wPix+'px;flex-shrink:0;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line);background:var(--bg);padding:3px 4px;font-size:9px;font-weight:700;color:var(--muted);text-align:center;">S'+(w+1)+'</div>';
  }
  var hDays='';
  for(var di=0;di<days;di++){
    if(colW[di]<=0) continue;
    var d=new Date(rangeStart.getTime()+di*86400000);
    var isT=d.toDateString()===today.toDateString();
    var isWE=d.getUTCDay()===0||d.getUTCDay()===6;
    var isSat=d.getUTCDay()===6;
    // Fin de semana: sombreado gris neutro (≠ color del proyecto que usa "hoy").
    // Días laborables: sin relleno, borde fino para separar columnas.
    // Sábado tiene borde izquierdo más grueso para marcar el inicio del bloque.
    var dayBg = isT ? p.color+'38' : isWE ? 'rgba(0,0,0,.07)' : 'transparent';
    var borderL = isSat ? 'border-left:2px solid rgba(0,0,0,.18);' : '';
    hDays+='<div style="width:'+colW[di]+'px;flex-shrink:0;text-align:center;font-size:8px;'+
      'color:'+(isT?p.color:'var(--muted-soft)')+';background:'+dayBg+';'+
      'border-right:1px solid var(--line);'+borderL+
      'padding:2px 0;font-weight:'+(isT?800:400)+';">'+dayNames[d.getUTCDay()]+'</div>';
  }
  // Línea de hoy
  var todayOff=Math.round((today-rangeStart)/86400000);
  var todayLine=(todayOff>=0&&todayOff<days&&colW[todayOff]>0)?'<div style="position:absolute;left:'+(LABEL+xOf[todayOff])+'px;top:0;bottom:0;width:2px;background:'+p.color+';opacity:.5;pointer-events:none;z-index:3;"></div>':'';

  // Filas recursivas
  var rowsHTML='';

  // Sincronizar % de nodos con linkedTaskId antes de renderizar
  function syncLinkedPct(tasks){
    (tasks||[]).forEach(function(t){
      if(t.linkedTaskId){
        var appTask = S.tasks.find(function(x){return x.id===t.linkedTaskId;});
        if(appTask){
          var newPct;
          if(appTask.qty && appTask.qty>0){
            // Tarea con cantidad: % según progreso
            newPct = Math.min(100, Math.round((appTask.prog||0)/(appTask.qty)*100));
          } else {
            newPct = isDone(appTask)?100:0;
          }
          if(!t.children||!t.children.length) t.pct = newPct;
        }
      }
      if(t.children) syncLinkedPct(t.children);
    });
  }
  sections.forEach(function(s){ syncLinkedPct(s.tasks||[]); });

  function ganttRow(t, num, depth, barColor){
    var effectivePct=calcNodePct(t);
    var tStart=t.start?utcDay(t.start):null;
    var tEnd=t.end?utcDay(t.end):null;
    var barLeft=tStart?Math.round((tStart-rangeStart)/86400000):0;
    var barWidth=tStart&&tEnd?Math.max(1,Math.round((tEnd-tStart)/86400000)+1):0;
    var hasChildren=t.children&&t.children.length;
    var indent=depth*10;
    // Altura de barra decrece levemente con la profundidad para dar jerarquía visual
    var rowH = Math.max(22, 30-depth*3);
    var barH = Math.max(12, rowH-8);
    var barTop = Math.floor((rowH-barH)/2);
    // Color con opacidad según profundidad (nivel 0 sólido, más profundo más tenue),
    // pero SIEMPRE con contraste claro entre el fondo de la barra (100%) y el relleno (%).
    var depthAlpha = depth===0 ? 1 : depth===1 ? 0.85 : 0.65;
    function alphaHex(a){ var h=Math.round(a*255).toString(16); return h.length<2?'0'+h:h; }
    var barBg = barColor + alphaHex(depthAlpha*0.22);      // fondo translúcido = "contenedor" del 100%
    var barBgFull = effectivePct>=100 ? '#27ae60' : barColor + alphaHex(depthAlpha); // relleno sólido = progreso real
    var barBorder = barColor + alphaHex(depthAlpha*0.55);  // borde visible para marcar el límite del 100%
    var barPxLeft = xOf[barLeft]!==undefined?xOf[barLeft]:barLeft*COL;
    var barPxWidth = tStart&&tEnd ? Math.max(6, pxSpan(barLeft,barWidth)-2) : 0;

    rowsHTML+='<div style="display:flex;border-bottom:1px solid var(--line-soft);min-height:'+rowH+'px;background:'+(depth%2===1?'var(--bg)50%':'transparent')+';">'+
      '<div onclick="openEditProjectTask(\''+p.id+'\',null,\''+t.id+'\')" style="width:'+LABEL+'px;flex-shrink:0;border-right:1px solid var(--line);padding:4px 6px 4px '+(6+indent)+'px;display:flex;align-items:center;gap:3px;overflow:hidden;cursor:pointer;">'+
        (depth>0?'<span style="color:var(--muted-soft);font-size:8px;flex-shrink:0;">'+('└').slice(0,1)+'</span>':'')+
        '<span style="font-size:'+(depth===0?11:depth===1?10:9)+'px;font-weight:'+(hasChildren?700:depth===0?500:400)+';color:'+(depth===0?'var(--ink)':'var(--ink-soft)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">'+esc(t.name)+'</span>'+
        '<span style="font-size:8px;font-weight:700;color:white;background:'+(effectivePct>=100?'#27ae60':effectivePct>0?barColor+'CC':'var(--muted)')+';border-radius:3px;padding:1px 3px;flex-shrink:0;">'+effectivePct+'%</span>'+
      '</div>'+
      '<div style="flex:1;position:relative;height:'+rowH+'px;">'+
        (function(){
          var bg='';
          for(var di2=0;di2<days;di2++){
            if(colW[di2]<=0)continue;
            var d2=new Date(rangeStart.getTime()+di2*86400000);
            var isWE2=d2.getUTCDay()===0||d2.getUTCDay()===6;
            var isSat2=d2.getUTCDay()===6;
            // Sombreado solo en fin de semana; todos los días tienen borde derecho.
            // El borde izquierdo extra en sábado marca visualmente el inicio del bloque.
            var colBg = isWE2 ? 'rgba(0,0,0,.06)' : 'transparent';
            var borderL = isSat2 ? 'border-left:2px solid rgba(0,0,0,.15);' : '';
            // Capa de fondo + borde (usamos divs absolutos para el sombreado y
            // un borde simulado en el margen derecho de cada columna)
            bg+='<div style="position:absolute;left:'+xOf[di2]+'px;top:0;bottom:0;width:'+colW[di2]+'px;'+
              (colBg!=='transparent'?'background:'+colBg+';':'')+
              'border-right:1px solid var(--line-soft);'+borderL+
              'box-sizing:border-box;pointer-events:none;"></div>';
          }
          return bg;
        }())+
        // Barra principal
        (tStart?
          '<div title="'+esc(t.name)+'" '+
          'ontouchstart="showGanttTip(event,\''+esc(t.name).replace(/'/g,'&#39;')+'\')" '+
          'onclick="openEditProjectTask(\''+p.id+'\',null,\''+t.id+'\')" '+
          'style="position:absolute;left:'+barPxLeft+'px;top:'+barTop+'px;height:'+barH+'px;width:'+barPxWidth+'px;border-radius:4px;background:'+barBg+';border:1px solid '+barBorder+';cursor:pointer;overflow:hidden;min-width:6px;box-sizing:border-box;">'+
            '<div style="height:100%;width:'+effectivePct+'%;background:'+barBgFull+';border-radius:4px;transition:width .3s;"></div>'+
          '</div>'
        :'<div onclick="openEditProjectTask(\''+p.id+'\',null,\''+t.id+'\')" style="position:absolute;inset:0;cursor:pointer;"><div style="position:absolute;left:6px;top:'+(rowH/2-5)+'px;font-size:8px;color:var(--muted-soft);font-style:italic;">sin fecha</div></div>')+
      '</div>'+
    '</div>';
    if(hasChildren){
      t.children.forEach(function(c,ci){
        ganttRow(c, num+'.'+(ci+1), depth+1, barColor);
      });
    }
  }

  sections.forEach(function(s,si){
    // Cada sección recibe un color propio (ciclando la paleta de proyectos) en
    // vez de heredar siempre el color del proyecto — así se distinguen entre sí
    // de un vistazo, incluso dentro del mismo proyecto.
    var sectionColor = PROJECT_COLORS[si % PROJECT_COLORS.length];
    // Fila de sección
    rowsHTML+='<div style="display:flex;background:'+sectionColor+'15;border-bottom:1px solid var(--line-soft);">'+
      '<div style="width:'+LABEL+'px;flex-shrink:0;border-right:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;gap:6px;">'+
        '<div style="width:18px;height:18px;border-radius:4px;background:'+sectionColor+';display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+
          '<span style="font-size:10px;font-weight:800;color:white;">'+(si+1)+'</span>'+
        '</div>'+
        '<span style="font-size:12px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">'+esc(s.name)+'</span>'+
        '<button onclick="openEditSectionModal(\''+p.id+'\',\''+s.id+'\')" title="Editar sección" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0 3px;display:flex;align-items:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'+
        '<button onclick="openAddTaskModal(\''+p.id+'\',\''+s.id+'\',null)" style="background:none;border:none;color:'+sectionColor+';font-size:14px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;">+</button>'+
      '</div>'+
      '<div style="flex:1;height:30px;"></div>'+
    '</div>';
    (s.tasks||[]).forEach(function(t,ti){
      ganttRow(t,(si+1)+'.'+(ti+1),0,sectionColor);
    });
  });

  return '<div style="position:relative;min-width:'+(LABEL+totalW)+'px;">'+
    todayLine+
    '<div style="display:flex;position:sticky;top:0;z-index:5;background:var(--paper);">'+
      '<div style="width:'+LABEL+'px;flex-shrink:0;border-right:1px solid var(--line);padding:5px 8px;font-size:10px;font-weight:700;color:var(--muted);background:var(--paper);">TAREA</div>'+
      '<div style="display:flex;">'+hWeeks+'</div>'+
    '</div>'+
    '<div style="display:flex;position:sticky;top:24px;z-index:4;background:var(--paper);">'+
      '<div style="width:'+LABEL+'px;flex-shrink:0;border-right:1px solid var(--line);"></div>'+
      '<div style="display:flex;">'+hDays+'</div>'+
    '</div>'+
    '<div>'+rowsHTML+'</div>'+
    '<div style="height:80px;"></div>'+
  '</div>';
}

// ── openAddTaskModal — agregar tarea a sección o subtarea a nodo padre ────
function openAddTaskModal(pid, sid, parentTaskId){
  // Si parentTaskId es null, agrega a la sección; si no, agrega como hijo del nodo
  var box=document.createElement('div');box.className='conf-box';
  var parentLabel=parentTaskId?'Agregar subtarea':'Agregar tarea';
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;color:var(--ink);margin-bottom:12px;">'+parentLabel+'</div>'+
    '<label class="flbl">Nombre</label><input id="nat-name" class="finp" placeholder="Describe esta tarea..."/>'+
    '<div style="display:flex;gap:10px;margin-top:10px;">'+
      '<div style="flex:1;"><label class="flbl">Inicio</label><input id="nat-start" class="finp" type="date" value="'+(p&&p.start?p.start:new Date().toISOString().slice(0,10))+'"/></div>'+
      '<div style="flex:1;"><label class="flbl">Fin</label><input id="nat-end" class="finp" type="date"/></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;">'+
      '<button class="sbtn" onclick="saveAddTask(\''+pid+'\',\''+sid+'\','+(parentTaskId?'\''+parentTaskId+'\'':'null')+')">Crear</button>'+
      '<button class="cbtn" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div>'+
  '</div>';

}

function saveAddTask(pid,sid,parentTaskId){
  var name=document.getElementById('nat-name');
  if(!name||!name.value.trim()){toast('Escribe un nombre');return;}
  var newTask={
    id:'ptask-'+uid(),
    name:name.value.trim(),
    start:(document.getElementById('nat-start')||{}).value||'',
    end:(document.getElementById('nat-end')||{}).value||'',
    pct:0,
    children:[]
  };
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  var s=p?(p.sections||[]).find(function(x){return x.id===sid;}):null;
  if(!s)return;
  if(!parentTaskId){
    if(!s.tasks)s.tasks=[];
    s.tasks.push(newTask);
  } else {
    var found=findNodeById(s.tasks,parentTaskId);
    if(found){
      if(!found.node.children)found.node.children=[];
      found.node.children.push(newTask);
    }
  }
  saveState();
  var _cb=pRoot().querySelector('.conf-box');if(_cb)_cb.remove();
  renderProjectContent();
}

// openAddTaskToSection ahora redirige a openAddTaskModal
function openAddTaskToSection(pid,sid){
  openAddTaskModal(pid,sid,null);
}

// ── openEditProjectTask (sid puede ser null en Gantt, busca en todo el proyecto) ──
function openEditProjectTask(pid,sidHint,tid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  // Buscar el nodo en todas las secciones
  var found=null, foundSid=sidHint;
  (p.sections||[]).forEach(function(s){
    var r=findNodeById(s.tasks||[],tid);
    if(r){found=r;foundSid=s.id;}
  });
  if(!found&&sidHint){
    var s=(p.sections||[]).find(function(x){return x.id===sidHint;});
    if(s)found=findNodeById(s.tasks||[],tid);
  }
  var t=found?found.node:{id:'ptask-'+uid(),name:'',start:'',end:'',pct:0,children:[]};
  var isNew=!found;
  var box=document.createElement('div');box.className='conf-box';
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;color:var(--ink);margin-bottom:12px;">'+(isNew?'Nueva tarea':'Editar tarea')+'</div>'+
    '<label class="flbl">Nombre</label><input id="pet-name" class="finp" value="'+esc(t.name)+'" placeholder="Nombre de la tarea..."/>'+
    '<div style="display:flex;gap:10px;margin-top:10px;">'+
      '<div style="flex:1;"><label class="flbl">Inicio</label><input id="pet-start" class="finp" type="date" value="'+(t.start||'')+'"/></div>'+
      '<div style="flex:1;"><label class="flbl">Entrega</label><input id="pet-end" class="finp" type="date" value="'+(t.end||'')+'"/></div>'+
    '</div>'+
    ((!t.children||!t.children.length)?
      '<label class="flbl" style="margin-top:10px;">% Completado</label>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">'+
        '<input type="range" id="pet-pct" min="0" max="100" step="5" value="'+(t.pct||0)+'" style="flex:1;accent-color:'+p.color+';" oninput="document.getElementById(\'pet-pct-v\').textContent=this.value+\'%\'"/>'+
        '<span id="pet-pct-v" style="font-size:13px;font-weight:700;color:'+p.color+';width:36px;text-align:right;">'+(t.pct||0)+'%</span>'+
      '</div>':'<div style="font-size:11px;color:var(--muted);margin-top:10px;">% calculado desde subtareas.</div>')+
    '<div style="display:flex;gap:8px;margin-top:14px;">'+
      '<button class="sbtn" onclick="savePET(\''+pid+'\',\''+foundSid+'\',\''+t.id+'\','+isNew+')">Guardar</button>'+
      '<button class="cbtn" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div>'+
  '</div>';
  pRoot().appendChild(box);
}

function savePET(pid,sid,tid,isNew){
  var name=document.getElementById('pet-name');
  if(!name||!name.value.trim())return;
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  var s=p?(p.sections||[]).find(function(x){return x.id===sid;}):null;
  if(!s)return;
  var pct=parseInt((document.getElementById('pet-pct')||{}).value||0);
  if(isNew){
    var nt={id:tid,name:name.value.trim(),start:(document.getElementById('pet-start')||{}).value||'',end:(document.getElementById('pet-end')||{}).value||'',pct:pct,children:[]};
    if(!s.tasks)s.tasks=[];s.tasks.push(nt);
  } else {
    var found=findNodeById(s.tasks||[],tid);
    if(found){
      found.node.name=name.value.trim();
      found.node.start=(document.getElementById('pet-start')||{}).value||'';
      found.node.end=(document.getElementById('pet-end')||{}).value||'';
      if(!found.node.children||!found.node.children.length)found.node.pct=pct;
    }
  }
  saveState();
  var _cb=pRoot().querySelector('.conf-box');if(_cb)_cb.remove();
  renderProjectContent();
}

// Alias para compatibilidad con código antiguo
function deleteProjectTask(pid,sid,tid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  var s=p?(p.sections||[]).find(function(x){return x.id===sid;}):null;
  if(!s)return;
  // Borrar recursivamente (puede ser en cualquier nivel)
  function removeNode(tasks){
    for(var i=0;i<tasks.length;i++){
      if(tasks[i].id===tid){tasks.splice(i,1);return true;}
      if(tasks[i].children&&removeNode(tasks[i].children))return true;
    }
    return false;
  }
  removeNode(s.tasks||[]);
  saveState();renderProjectContent();
}

function cycleTaskPct(pid,sid,tid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  var s=p?(p.sections||[]).find(function(x){return x.id===sid;}):null;
  if(!s)return;
  var found=findNodeById(s.tasks||[],tid);
  if(!found)return;
  var t=found.node;
  // Solo ciclar en nodos hoja
  if(t.children&&t.children.length)return;
  var steps=[0,25,50,75,100];
  var idx=steps.indexOf(t.pct);
  t.pct=steps[(idx+1)%steps.length];
  saveState();renderProjectContent();
}

function formatDateShort(d){
  if(!d)return '';
  var dt=new Date(d+'T12:00:00'); // noon to avoid TZ issues
  return dt.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
}

// ── Export Gantt → Excel (.xlsx) ──────────────────────────────────────────
// Usa SheetJS (disponible como CDN en los artifacts; aquí lo cargamos dinámicamente)
function exportGanttXLSX(pid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p){toast('Proyecto no encontrado');return;}

  function doExport(){
    var XLSX=window.XLSX;
    if(!XLSX){toast('Error cargando librería');return;}

    // ── Utilidades de color ──────────────────────────────────────────────
    // Convierte #RRGGBB → "AARRGGBB" para SheetJS
    function argb(hex, a){
      a = a===undefined ? 'FF' : a;
      return (a + hex.replace('#','')).toUpperCase();
    }
    // Colores de sección (misma paleta que en la app)
    var SEC_COLORS = ['#c97842','#3a7c8c','#5a7c4a','#a85a82','#d4a847','#2d8c70','#8e44ad','#c0392b'];
    var projColorHex = p.color || '#c97842';

    // ── Fechas útiles ────────────────────────────────────────────────────
    function utcDay(s){ var pts=s.slice(0,10).split('-'); return new Date(Date.UTC(+pts[0],+pts[1]-1,+pts[2])); }
    function fmtDate(s){ if(!s)return ''; var d=utcDay(s); return d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCFullYear(); }
    var allDates=[];
    function collectDates(tasks){
      (tasks||[]).forEach(function(t){
        if(t.start)allDates.push(utcDay(t.start));
        if(t.end)allDates.push(utcDay(t.end));
        if(t.children)collectDates(t.children);
      });
    }
    (p.sections||[]).forEach(function(s){collectDates(s.tasks);});
    var rangeStart = p.start ? utcDay(p.start) : new Date();
    var rangeEnd   = p.end   ? utcDay(p.end)   : new Date(rangeStart.getTime()+60*86400000);
    if(allDates.length){
      var minD=allDates.reduce(function(a,b){return a<b?a:b;});
      var maxD=allDates.reduce(function(a,b){return a>b?a:b;});
      if(minD<rangeStart) rangeStart=new Date(minD.getTime()-86400000);
      if(maxD>rangeEnd)   rangeEnd=new Date(maxD.getTime()+86400000);
    }
    var days=Math.ceil((rangeEnd-rangeStart)/86400000)+1;
    var weeks=Math.ceil(days/7);
    var weekLabels=[];
    for(var w=0;w<weeks;w++){
      var wd=new Date(rangeStart.getTime()+w*7*86400000);
      weekLabels.push('S'+(w+1)+' ('+fmtDate(wd.toISOString().slice(0,10))+')');
    }

    // ── Estilos base ─────────────────────────────────────────────────────
    var FIXED_COLS = 6;
    var projRGB = argb(projColorHex,'FF');
    var td = {top:{style:'thin',color:{rgb:'FFD0D0D0'}},bottom:{style:'thin',color:{rgb:'FFD0D0D0'}},left:{style:'thin',color:{rgb:'FFD0D0D0'}},right:{style:'thin',color:{rgb:'FFD0D0D0'}}};
    function wb2(c){ return {top:{style:'medium',color:{rgb:c}},bottom:{style:'medium',color:{rgb:c}},left:{style:'medium',color:{rgb:c}},right:{style:'thin',color:{rgb:'FFD0D0D0'}}}; }
    var styleTitle = {font:{name:'Calibri',sz:18,bold:true,color:{rgb:projRGB}},fill:{fgColor:{rgb:'FFFFFFFF'}},alignment:{horizontal:'left'},border:{bottom:{style:'medium',color:{rgb:projRGB}}}};
    var styleMeta  = {font:{name:'Calibri',sz:10,italic:true,color:{rgb:'FF777777'}},fill:{fgColor:{rgb:'FFFAFAFA'}},alignment:{horizontal:'left'},border:td};
    var styleHeader= {font:{name:'Calibri',sz:10,bold:true,color:{rgb:'FFFFFFFF'}},fill:{fgColor:{rgb:projRGB}},alignment:{horizontal:'center',wrapText:true},border:{top:{style:'medium',color:{rgb:projRGB}},bottom:{style:'medium',color:{rgb:projRGB}},left:{style:'thin',color:{rgb:'FFCCCCCC'}},right:{style:'thin',color:{rgb:'FFCCCCCC'}}}};
    var styleWeekHead={font:{name:'Calibri',sz:9,bold:true,color:{rgb:'FF444444'}},fill:{fgColor:{rgb:'FFEEEEEE'}},alignment:{horizontal:'center',wrapText:true},border:td};
    var styleWeekWE  ={font:{name:'Calibri',sz:9,bold:true,color:{rgb:'FF888888'}},fill:{fgColor:{rgb:'FFE0E0E0'}},alignment:{horizontal:'center',wrapText:true},border:td};
    function styleSection(hex){
      return {font:{name:'Calibri',sz:11,bold:true,color:{rgb:'FFFFFFFF'}},fill:{fgColor:{rgb:argb(hex,'FF')}},alignment:{horizontal:'left'},border:wb2(argb(hex,'FF'))};
    }
    function styleTask(depth,even,hex){
      var baseHex = hex||'EEEEEE';
      // Nivel 0: tinte muy suave del color de sección. Subniveles: alternado gris/blanco.
      var bg = depth===0 ? argb(baseHex,'18') : (even?'FFFFFFFF':'FFF8F8F8');
      return {font:{name:'Calibri',sz:10,bold:depth===0,color:{rgb:'FF222222'}},fill:{fgColor:{rgb:bg}},alignment:{horizontal:'left',indent:depth},border:td};
    }
    function stylePct(pct,hex){
      if(pct>=100) return {font:{name:'Calibri',sz:10,bold:true,color:{rgb:'FF27AE60'}},fill:{fgColor:{rgb:'FFE8F8EF'}},alignment:{horizontal:'center'},border:td};
      if(pct>0)    return {font:{name:'Calibri',sz:10,bold:true,color:{rgb:argb(hex,'FF')}},fill:{fgColor:{rgb:argb(hex,'22')}},alignment:{horizontal:'center'},border:td};
      return {font:{name:'Calibri',sz:10,color:{rgb:'FFBBBBBB'}},fill:{fgColor:{rgb:'FFFAFAFA'}},alignment:{horizontal:'center'},border:td};
    }
    var styleDate={font:{name:'Calibri',sz:10,color:{rgb:'FF555555'}},fill:{fgColor:{rgb:'FFFFFFFF'}},alignment:{horizontal:'center'},border:td};
    var styleDur ={font:{name:'Calibri',sz:10,color:{rgb:'FF777777'}},fill:{fgColor:{rgb:'FFFFFFFF'}},alignment:{horizontal:'center'},border:td};
    // Barras Gantt: fondo sólido del color de sección + texto de progreso
    function styleBarFull(hex){ return {fill:{fgColor:{rgb:argb(hex,'FF')}},font:{name:'Calibri',sz:9,bold:true,color:{rgb:'FFFFFFFF'}},alignment:{horizontal:'center'},border:td}; }
    function styleBarPart(hex){ return {fill:{fgColor:{rgb:argb(hex,'99')}},font:{name:'Calibri',sz:9,bold:true,color:{rgb:'FFFFFFFF'}},alignment:{horizontal:'center'},border:td}; }
    function styleBarStart(hex){ return {fill:{fgColor:{rgb:argb(hex,'55')}},font:{name:'Calibri',sz:9,color:{rgb:'FFFFFFFF'}},alignment:{horizontal:'center'},border:td}; }
    var styleBarEmpty={fill:{fgColor:{rgb:'FFEEEEEE'}},font:{name:'Calibri',sz:8,color:{rgb:'FFDDDDDD'}},alignment:{horizontal:'center'},border:td};
    var styleBarWE   ={fill:{fgColor:{rgb:'FFE4E4E4'}},font:{name:'Calibri',sz:8,color:{rgb:'FFCCCCCC'}},alignment:{horizontal:'center'},border:td};
    var today2=new Date();today2.setHours(0,0,0,0);

    // ── Construcción de la hoja ──────────────────────────────────────────
    var ws = {};
    var rowIdx = 0; // índice de fila (0-based)

    function setCell(r, c, v, s){
      var addr = XLSX.utils.encode_cell({r:r, c:c});
      ws[addr] = {v:v, t:typeof v==='number'?'n':'s'};
      if(s) ws[addr].s = s;
    }
    function emptyRow(r, cols){
      for(var c=0;c<cols;c++) setCell(r,c,'',{fill:{fgColor:{rgb:'FFFFFFFF'}}});
    }

    // Fila 0: título del proyecto
    setCell(rowIdx,0,'PROYECTO: '+p.name.toUpperCase(), styleTitle);
    for(var c=1;c<FIXED_COLS+weeks;c++) setCell(rowIdx,c,'',styleTitle);
    rowIdx++;
    // Fila 1: meta
    setCell(rowIdx,0,'Exportado el '+new Date().toLocaleDateString('es-CL'), styleMeta);
    setCell(rowIdx,2,'Inicio:', styleMeta);
    setCell(rowIdx,3,p.start?fmtDate(p.start):'—', styleMeta);
    setCell(rowIdx,4,'Fin:', styleMeta);
    setCell(rowIdx,5,p.end?fmtDate(p.end):'—', styleMeta);
    rowIdx++;
    emptyRow(rowIdx, FIXED_COLS+weeks); rowIdx++;

    // Fila 3: encabezado de columnas
    ['N°','Tarea','Inicio','Entrega','Días','% Hecho'].forEach(function(h,c){
      setCell(rowIdx,c,h,styleHeader);
    });
    weekLabels.forEach(function(wl,w){ setCell(rowIdx,FIXED_COLS+w,wl,styleWeekHead); });
    rowIdx++;

    // Filas de secciones y tareas
    var globalRowCount = 0; // para zebra entre secciones
    function addRows(tasks, prefix, depth, secColor){
      (tasks||[]).forEach(function(t,ti){
        var num=prefix+(ti+1);
        var pct=calcNodePct(t);
        var dur=t.start&&t.end?Math.round((utcDay(t.end)-utcDay(t.start))/86400000)+1:'';
        var even = (globalRowCount%2===0);
        globalRowCount++;
        var sRow = styleTask(depth,even,secColor);
        setCell(rowIdx,0,num,    sRow);
        setCell(rowIdx,1,(depth>0?'  '.repeat(depth):'')+t.name, sRow);
        setCell(rowIdx,2,fmtDate(t.start||''), styleDate);
        setCell(rowIdx,3,fmtDate(t.end||''),   styleDate);
        setCell(rowIdx,4,typeof dur==='number'?dur:'', styleDur);
        setCell(rowIdx,5,pct+'%', stylePct(pct,secColor));
        // Barras Gantt: cada semana es una celda coloreada
        for(var w=0;w<weeks;w++){
          var wS=new Date(rangeStart.getTime()+w*7*86400000);
          var wE=new Date(wS.getTime()+6*86400000);
          var tS=t.start?utcDay(t.start):null;
          var tE=t.end?utcDay(t.end):null;
          var inWeek=tS&&tE&&tS<=wE&&tE>=wS;
          // Detectar si la semana es pasada, activa o futura
          var isWeekWE = (wS.getDay()===6||wS.getDay()===0); // no aplica, semanas completas
          var isPast = wE < today2;
          var isCurrent = wS<=today2&&today2<=wE;
          var barVal='', barSt;
          if(inWeek){
            if(pct>=100){ barVal='✓'; barSt=styleBarFull(secColor); }
            else if(pct>0){ barVal=pct+'%'; barSt=(isCurrent||isPast)?styleBarPart(secColor):styleBarStart(secColor); }
            else { barVal=''; barSt=styleBarStart(secColor); }
          } else {
            barVal=''; barSt=styleBarEmpty;
          }
          setCell(rowIdx,FIXED_COLS+w,barVal,barSt);
        }
        rowIdx++;
        if(t.children&&t.children.length) addRows(t.children,num+'.',depth+1,secColor);
      });
    }

    (p.sections||[]).forEach(function(s,si){
      var scol = SEC_COLORS[si % SEC_COLORS.length];
      // Fila de sección con nombre en negrita y fondo del color de sección
      setCell(rowIdx,0,(si+1)+'.', styleSection(scol));
      setCell(rowIdx,1,'  '+s.name, styleSection(scol)); // indent visual
      for(var c=2;c<FIXED_COLS+weeks;c++) setCell(rowIdx,c,'',styleSection(scol));
      ws['!rows'] = ws['!rows']||[];
      ws['!rows'][rowIdx] = {hpt:18}; // un poco más alto que las tareas
      rowIdx++;
      globalRowCount = 0; // reiniciar zebra por sección
      addRows(s.tasks||[],(si+1)+'.',0,scol);
      // Fila separadora entre secciones
      emptyRow(rowIdx,FIXED_COLS+weeks); rowIdx++;
    });

    // Rango de la hoja y anchos
    ws['!ref'] = XLSX.utils.encode_range({r:0,c:0},{r:rowIdx-1,c:FIXED_COLS+weeks-1});
    ws['!cols'] = [{wch:6},{wch:34},{wch:11},{wch:11},{wch:7},{wch:10}]
      .concat(weekLabels.map(function(){return {wch:10};}));

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Gantt');
    var fname = p.name.replace(/[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ ]/g,'_')+'_gantt.xlsx';
    XLSX.writeFile(wb, fname);
    toast('✓ Exportado: '+fname);
  }

  if(window.XLSX){doExport();}
  else{
    var scr=document.createElement('script');
    scr.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    scr.onload=doExport;
    scr.onerror=function(){toast('No se pudo cargar la librería de exportación');};
    document.head.appendChild(scr);
  }
}

function openLinkProjectTask(pid,sid,tid){

  var byPeriod={};

      byPeriod[per].map(function(t){
        return '<button onclick="linkProjectTask(\''+pid+'\',\''+sid+'\',\''+tid+'\',\''+t.id+'\');this.closest(\'.conf-box\').remove();" style="width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px;font-size:12px;color:var(--ink);cursor:pointer;background:var(--paper);font-family:Inter,sans-serif;">'+esc(t.text)+'</button>';
      }).join('')+

    opts+
    '<button class="cbtn" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
  '</div>';

}
function linkProjectTask(pid,sid,tid,appTaskId){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  // Buscar el nodo en toda la jerarquía de la sección
  var targetNode=null;
  var s=(p.sections||[]).find(function(x){return x.id===sid;});
  if(s){
    var found=findNodeById(s.tasks||[],tid);
    if(found) targetNode=found.node;
  }
  // Si no se encontró en la sección indicada, buscar en todas las secciones
  if(!targetNode){
    (p.sections||[]).forEach(function(sec){
      if(targetNode) return;
      var found=findNodeById(sec.tasks||[],tid);
      if(found) targetNode=found.node;
    });
  }
  if(!targetNode){ toast('No se encontró la tarea en el proyecto'); return; }
  targetNode.linkedTaskId=appTaskId;
  // Sincronizar % automáticamente
  var appTask=S.tasks.find(function(x){return x.id===appTaskId;});
  if(appTask){
    var pct=isDone(appTask)?100:
      appTask.hasQty?Math.round((appTask.prog||0)/(appTask.qty||1)*100):
      appTask.done?100:0;
    targetNode.pct=Math.min(100,Math.max(0,pct));
  }
  saveState();
  var cb=pRoot().querySelector('.conf-box');if(cb)cb.remove();
  renderProjectContent();
  toast('✓ Tarea conectada');
}
function unlinkProjectTask(pid,sid,tid){
  var p=(S.projects||[]).find(function(x){return x.id===pid;});
  if(!p)return;
  var targetNode=null;
  (p.sections||[]).forEach(function(sec){
    if(targetNode) return;
    var found=findNodeById(sec.tasks||[],tid);
    if(found) targetNode=found.node;
  });
  if(!targetNode)return;
  delete targetNode.linkedTaskId;
  saveState();renderProjectContent();
}

  S.tasks.forEach(function(t){
    if(t.period!=='dia' || t.day!==today) return;

    if(t.checklist && t.checklist.length){
      t.checklist.forEach(function(i){i.done=false;});

  saveState();
  document.querySelectorAll('.conf-box').forEach(function(b){b.remove();});

function doFactoryReset(){
  // Borrar todas las claves og6-* del localStorage
  var keys = [];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k && k.startsWith('og6-')) keys.push(k);
  }
  keys.forEach(function(k){ localStorage.removeItem(k); });
  // Mostrar pantalla de reinicio
  var done = document.createElement('div');
  done.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;';
  done.innerHTML=
    '<div style="font-size:56px;margin-bottom:20px;">✓</div>'+
    '<div class="serif" style="font-weight:800;font-size:24px;color:var(--ink);margin-bottom:10px;">App reiniciada</div>'+
    '<div style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:30px;">Todos los datos fueron borrados.<br>La app vuelve a su estado inicial.</div>'+
    '<button onclick="location.reload()" style="background:var(--accent);color:white;border:none;border-radius:14px;padding:16px 40px;font-size:16px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Volver al inicio</button>';
  document.body.appendChild(done);
}

// ── Exportar / Importar datos ────────────────────────────────────────────
function exportData(){
  var data = {};
  for(var i=0; i<localStorage.length; i++){
    var key = localStorage.key(i);
    if(key && key.startsWith('og6-')) data[key] = localStorage.getItem(key);
  }
  var blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'organizapp-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✓ Datos exportados');
}

function importData(event){
  var file = event.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      var count = 0;
      Object.keys(data).forEach(function(key){
        if(key.startsWith('og6-')){ localStorage.setItem(key, data[key]); count++; }
      });
      loadState(); render();
      toast('✓ '+count+' datos importados. Si algo no se ve, recargá la app.');
    } catch(err){ toast('Error: archivo inválido'); }
  };
  reader.readAsText(file);
}

function taskHTML(t,showPeriod){
  var done=isDone(t),r=tRatio(t);
  var hasQty=(t.qty||1)>1,hasCL=t.checklist&&t.checklist.length>0;
  var clDone=hasCL?t.checklist.filter(function(i){return i.done;}).length:0;
  var innerChk=done?chkSVG():(r>0&&!hasCL?'<span style="font-size:8px;font-weight:700;color:var(--accent);">'+(t.prog||0)+'</span>':(r>0&&hasCL?'<span style="font-size:7px;font-weight:700;color:var(--accent);">'+clDone+'</span>':''));
  var chkCls='chk'+(hasQty?' circle':'')+(done?' done':r>0?' partial':'');
  var justPopped = (S._justCompletedId === t.id);
  if(justPopped) chkCls += ' chk-pop';
  var clHTML='';
  if(hasCL){
    clHTML='<div id="cl-'+t.id+'" style="display:none;padding-left:33px;padding-bottom:10px;">';
    t.checklist.forEach(function(item){
      clHTML+='<div class="cl-row" onclick="tapCL(\''+t.id+'\',\''+item.id+'\')">'+
        '<div class="cl-box'+(item.done?' done':'')+'">'+(item.done?miniChkSVG():'')+'</div>'+
        '<span style="font-size:13px;color:'+(item.done?'var(--muted-soft)':'var(--ink-soft)')+';text-decoration:'+(item.done?'line-through':'none')+';">'+esc(item.text)+'</span>'+
        '</div>';
    });
    clHTML+='</div>';
  }
  var tagHTML=showPeriod?'<div style="margin-top:4px;"><span style="font-size:10px;padding:2px 7px;border-radius:20px;background:'+(PC[t.period]||'var(--line)')+';color:var(--ink-soft);font-weight:600;">'+PL[t.period]+'</span></div>':'';
  var crucialMark=t.crucial?'<span class="crucial-star" title="Tarea crucial">★</span>':'';
  // Etiqueta de categoría (solo para tareas diarias)
  var category = (t.period==='dia' && t.categoryId) ? (S.categories||[]).find(function(c){return c.id===t.categoryId;}) : null;
  var categoryTag = category ? '<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:'+category.color+';color:white;font-weight:600;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;" title="Categoría">'+esc(category.name)+'</span>' : '';
  var horaTag = (t.period==='dia' && t.hora) ? '<span style="font-size:10px;padding:2px 6px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-weight:700;flex-shrink:0;" title="Hora">'+esc(t.hora)+'</span>' : '';
  return '<div class="task-item'+(justPopped?' row-glow':'')+'" id="ti-'+t.id+'">'+
    '<div class="task-row">'+
      '<div class="'+chkCls+'" onclick="tapTask(\''+t.id+'\')">'+innerChk+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="display:flex;align-items:center;gap:6px;">'+
          crucialMark+
          '<span ondblclick="startInlineEdit(\''+t.id+'\')" id="tt-'+t.id+'" style="font-size:14px;color:'+(done?'var(--muted-soft)':'var(--ink)')+';text-decoration:'+(done?'line-through':'none')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;flex:1;min-width:0;" title="Doble click para editar">'+esc(t.text)+'</span>'+
          categoryTag+
          horaTag+
          (hasQty?'<span style="font-size:11px;color:var(--muted);flex-shrink:0;">'+(t.prog||0)+'/'+t.qty+'</span>':'')+
          (hasCL?'<span style="font-size:11px;color:var(--muted);flex-shrink:0;">'+clDone+'/'+t.checklist.length+'</span>':'')+
        '</div>'+
        ((hasQty||hasCL)?mpHTML(r):'')+tagHTML+
      '</div>'+
      (hasCL?'<button onclick="expCL(\''+t.id+'\')" id="exp-'+t.id+'" style="background:none;border:none;color:var(--muted);font-size:14px;padding:0 3px;flex-shrink:0;transition:transform .2s;">▾</button>':'')+
      // Botón editar — visible directo

      // Botón vincular — solo para tareas no-día o con períodos superiores disponibles
      (t.period!=='año'?'<button onclick="openLinkModal(\''+t.id+'\')" title="Vincular con objetivo superior" style="background:none;border:none;color:'+(Object.keys(t.links||{}).length?'var(--accent)':'var(--muted)')+';font-size:13px;padding:0 4px;flex-shrink:0;line-height:1;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 9L9 5"/><path d="M8 3h3v3"/><path d="M6 11H3V8"/></svg></button>':'')+

    '</div>'+clHTML+
  '</div>';

function openTaskMenu(id, event){
  // Cerrar menú anterior si existe
  var prev = document.getElementById('task-menu-popup');
  if(prev){prev.remove();}
  
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var isDay = t.period==='dia';
  
  var menu = document.createElement('div');
  menu.id = 'task-menu-popup';
  menu.style.cssText = 'position:fixed;right:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:800;min-width:220px;overflow:hidden;';
  
  // Posición vertical aproximada
  var rect = event.target.getBoundingClientRect();
  var top = Math.min(rect.bottom + 4, window.innerHeight - 360);
  menu.style.top = top + 'px';
  
  var items = [];
  
  // Crucial (solo day tasks)
  if(isDay){
    items.push({
      icon: t.crucial ? '★' : '☆',
      label: t.crucial ? 'Quitar estrella crucial' : 'Marcar como crucial',
      action: 'toggleCrucial(\''+id+'\')'
    });
    items.push({divider:true});
  }
  
  // Acciones de movimiento (solo tareas del día)
  if(isDay){
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 1 13 1 13 5"/><line x1="13" y1="1" x2="7" y2="7"/><polyline points="5 13 1 13 1 9"/></svg>',
      label:'Llevar al día siguiente', action:'moveTaskToNextDay(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/></svg>',
      label:'Llevar a otro día...', action:'moveTaskToDay(\''+id+'\')'
    });
    items.push({divider:true});
    // Duplicar — ícono de dos hojas superpuestas
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/></svg>',
      label:'Duplicar al día siguiente', action:'duplicateTaskToNextDay(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/><line x1="5" y1="8" x2="9" y2="8" stroke-width="1.3"/><line x1="7" y1="6" x2="7" y2="10" stroke-width="1.3"/></svg>',
      label:'Duplicar a varios días...', action:'duplicateTaskToDays(\''+id+'\')'
    });
    items.push({divider:true});
  }
  
  // Eliminar
  items.push({icon:'<svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="1 3 12 3"/><path d="M4 3V2h5v1"/><rect x="2" y="3" width="9" height="10" rx="1"/><line x1="5" y1="6" x2="5" y2="10"/><line x1="8" y1="6" x2="8" y2="10"/></svg>', label:'Eliminar tarea', action:'delTask(\''+id+'\')', danger:true});
  
  var html = items.map(function(item){
    if(item.divider) return '<div style="height:1px;background:var(--line);margin:3px 0;"></div>';
    return '<button onclick="closeTaskMenu();'+item.action+'" style="display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;background:none;border:none;font-size:13px;color:'+(item.danger?'var(--bad)':'var(--ink)')+';font-family:Inter,sans-serif;cursor:pointer;text-align:left;">'+
      '<span style="width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:'+(item.danger?'var(--bad)':'var(--muted)')+';">'+item.icon+'</span>'+
      '<span>'+item.label+'</span>'+
    '</button>';
  }).join('');
  
  menu.innerHTML = html;
  document.body.appendChild(menu);
  
  // Cerrar al tocar fuera
  setTimeout(function(){
    document.addEventListener('click', function handler(e){
      if(!menu.contains(e.target)){
        menu.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 50);
}

  var lmLinksEl = document.getElementById('lm-links');

// ── Mover / Duplicar entre días ───────────────────────────────────────────
function moveTaskToNextDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var nextDay = (t.day + 1) % 7;
  t.day = nextDay;
  t.done = false; t.prog = 0;
  saveState();render();
  toast('→ Tarea movida a '+DAYS[nextDay]);
}

function moveTaskToDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  showDayPickerModal('¿A qué día quieres mover esta tarea?', false, function(days){
    if(days.length){
      t.day = days[0];
      t.done = false; t.prog = 0;
      saveState();render();
      toast('→ Tarea movida a '+DAYS[days[0]]);
    }
  });
}

function duplicateTaskToNextDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var nextDay = (t.day + 1) % 7;
  var copy = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), day:nextDay, done:false, prog:0});
  copy.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false});});
  S.tasks.push(copy);
  saveState();render();
  toast('⊕ Duplicada para '+DAYS[nextDay]);
}

function duplicateTaskToDays(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  showDayPickerModal('¿En qué días quieres duplicar la tarea?', true, function(days){
    days.forEach(function(d){
      if(d === t.day) return; // no duplicar en el mismo día
      var copy = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), day:d, done:false, prog:0});
      copy.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false});});
      S.tasks.push(copy);
    });
    saveState();render();
    toast('⊕ Duplicada en '+days.length+' día(s)');
  });
}

  }).join('');
  
  box.innerHTML = '<div class="conf-inner" style="max-width:320px;">'+

      '<button class="sbtn" style="font-size:13px;" onclick="dpConfirm()">Confirmar</button>'+

  window._dpSelected = [];
  window._dpMulti = multi;
  window._dpCallback = callback;
}

function dpToggle(i){
  var sel = window._dpSelected;
  var btn = document.getElementById('dpb-'+i);
  if(!btn) return;
  var idx = sel.indexOf(i);
  if(idx === -1){
    if(!window._dpMulti){
      // Si es single select, deseleccionar los demás
      sel.forEach(function(d){
        var b = document.getElementById('dpb-'+d);
        if(b){b.style.background='var(--paper)';b.style.color='var(--ink-soft)';b.style.borderColor='var(--line)';}
      });
      window._dpSelected = [i];
    } else {
      window._dpSelected.push(i);
    }
    btn.style.background = 'var(--accent)';
    btn.style.color = 'white';
    btn.style.borderColor = 'var(--accent)';
  } else {
    window._dpSelected.splice(idx, 1);
    btn.style.background = 'var(--paper)';
    btn.style.color = 'var(--ink-soft)';
    btn.style.borderColor = 'var(--line)';
  }
}

function dpConfirm(){
  var sel = window._dpSelected || [];
  var cb = window._dpCallback;
  var modal = document.getElementById('day-picker-modal');
  if(modal) modal.remove();
  if(cb && sel.length > 0) cb(sel);
  else toast('Selecciona al menos un día');
}
function startInlineEdit(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var span = document.getElementById('tt-'+id);
  if(!span) return;
  // Reemplazar span con input
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.value = t.text;
  inp.style.cssText = 'flex:1;min-width:0;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:6px;padding:3px 6px;font-family:Inter,sans-serif;outline:none;';
  inp.id = 'inline-edit-'+id;
  span.replaceWith(inp);
  inp.focus();
  inp.select();
  var save = function(){
    var v = inp.value.trim();
    if(v && v !== t.text){
      t.text = v;
      saveState();
    }
    render();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){e.preventDefault(); inp.blur();}
    if(e.key === 'Escape'){inp.value = t.text; inp.blur();}
  });
}

// Botón específico para reiniciar tareas de un período (semana, mes, semestre, año)
function headerResetBtnHTML(){
  // Prioridad: año > semestre > mes > semana
  var ilim = isIlimitado();
  var type = 'semana'; // default
  if((isLastDayOfYear()||ilim) && !periodResetUsedThisCycle('año')) type = 'año';
  else if((isLastDayOfSemester()||ilim) && !periodResetUsedThisCycle('semestre')) type = 'semestre';
  else if((isLastDayOfMonth()||ilim) && !periodResetUsedThisCycle('mes')) type = 'mes';
  return resetButtonHTML(type, 'hdr');
}

function periodResetUsedThisCycle(period){
  // Verifica si ya se usó el reinicio de este ciclo
  if(!S.periodResetUsed || !S.periodResetUsed[period]) return false;
  var usedDate = new Date(S.periodResetUsed[period]);
  var now = new Date();
  if(period==='mes') return usedDate.getMonth()===now.getMonth()&&usedDate.getFullYear()===now.getFullYear();
  if(period==='semestre'){
    var usedSem = usedDate.getMonth()<6?0:1;
    var nowSem = now.getMonth()<6?0:1;
    return usedSem===nowSem && usedDate.getFullYear()===now.getFullYear();
  }
  if(period==='año') return usedDate.getFullYear()===now.getFullYear();
  return false;
}

// type: 'semana' | 'mes' | 'semestre' | 'año'
// size: 'lg' (52px, para Hoy) | 'sm' (40px, para Plan)
function resetButtonHTML(type, size){
  var available = false;
  var whenText = '';
  var plan = getPlan();
  var ilim = isIlimitado();
  
  switch(type){
    case 'semana':
      available = isWeekend() && !resetUsedThisWeekend();
      if(!available){
        if(resetUsedThisWeekend()) whenText = 'Ya reiniciaste esta semana';
        else{
          var today = new Date().getDay(); // 0=dom,1=lun...6=sab
          var daysToSat = today===0?6:6-today;
          whenText = 'Disponible en '+(daysToSat===0?'hoy (sábado)':daysToSat===1?'mañana':daysToSat+' días');
        }
      }
      break;
    case 'mes':
      available = isLastDayOfMonth() || ilim;
      whenText = ilim?'Disponible siempre (plan Donante)':'Disponible el último día del mes';
      break;
    case 'semestre':
      available = isLastDayOfSemester() || ilim;
      whenText = ilim?'Disponible siempre':'Disponible el último día del semestre (30 jun / 31 dic)';
      break;
    case 'año':
      available = isLastDayOfYear() || ilim;

      break;

  var sz = size==='hdr' ? 32 : size==='sm' ? 40 : 52;
  var iconSz = size==='hdr' ? 14 : size==='sm' ? 18 : 22;
  
  var clickAction = available
    ? 'tapResetButton(\''+type+'\')'
    : 'showResetInfo(\''+type+'\',\''+whenText+'\')';
  
  return '<button onclick="'+clickAction+'" '+
    'style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;border:none;'+
    'background:'+(available?'var(--accent)':'var(--line)')+';'+
    'cursor:pointer;display:flex;align-items:center;justify-content:center;'+
    'opacity:'+(available?'1':'0.38')+';'+

function doTypeReset(type){
  if(type==='semana'){
    // Usa el reset de semana existente
    doReset();
  } else {
    doPeriodReset(type);
    // Marcar como usado en el período
    if(!S.periodResetUsed) S.periodResetUsed = {};
    var now = new Date();
    S.periodResetUsed[type] = now.toISOString();
    saveState();
  }
}

function confirmReset(){
  if(!isWeekend()||resetUsedThisWeekend()){
    var whenText = resetUsedThisWeekend()
      ? 'Ya reiniciaste esta semana'
      : 'Disponible el sábado o domingo';
    showResetInfo('semana', whenText);
    return;
  }
  tapResetButton('semana');
}

function doPeriodReset(period){
  S.tasks = S.tasks.map(function(t){
    if(t.period===period){
      return Object.assign({},t,{done:false,prog:0,checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false});})});
    }
    return t;
  });
  // Limpiar rewardedTaskIds de las tareas reseteadas
  S.tasks.filter(function(t){return t.period===period;}).forEach(function(t){
    delete S.rewardedTaskIds[t.id];
  });
  saveState();render();
  toast('✓ Tareas de '+PL[period].toLowerCase()+' reiniciadas');
}

// ── Calendario visual de días cumplidos ────────────────────────────────────
function renderStreakCalendar(){
  var hist = S.dailyHistory || {};
  var today = new Date();
  var todayKey = todayStr();
  
  // Mes mostrado (puede ser distinto al actual via S.calendarOffset)
  var offset = S.calendarOffset || 0;
  var displayDate = new Date(today.getFullYear(), today.getMonth()+offset, 1);
  var year = displayDate.getFullYear();
  var month = displayDate.getMonth();
  var monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var monthName = monthNames[month] + ' ' + year;
  
  // Color dorado fijo
  var GOLD = '#f5a524';
  var GOLD_LIGHT = '#fbc04a';
  
  // Primer día del mes y día de la semana (0=Sun ... 6=Sat) — domingo primero
  var firstDay = new Date(year, month, 1);
  var startDow = firstDay.getDay(); // 0=Su, 1=Mo, ..., 6=Sa
  var lastDay = new Date(year, month+1, 0).getDate();
  
  var dayLabels = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  
  // Header con flechas
  var canGoForward = offset < 0; // no permitir ir más allá del actual
  var html = '<div class="card">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">'+
      '<div style="font-weight:700;font-size:15px;color:var(--ink);">Racha</div>'+
      '<div style="font-size:12px;color:var(--muted);">'+monthName+'</div>'+
    '</div>'+
    '<div style="background:var(--bg);border-radius:14px;padding:12px;">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">'+
        '<button onclick="calNav(-1)" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:2px 10px;line-height:1;">‹</button>'+
        '<div style="font-weight:600;font-size:14px;color:var(--ink);">'+monthName+'</div>'+
        '<button onclick="calNav(1)" '+(canGoForward?'':'disabled')+' style="background:none;border:none;color:'+(canGoForward?'var(--muted)':'var(--muted-soft)')+';font-size:22px;cursor:'+(canGoForward?'pointer':'default')+';padding:2px 10px;line-height:1;opacity:'+(canGoForward?'1':'.3')+';">›</button>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">'+
        dayLabels.map(function(l){return '<div style="text-align:center;font-size:10px;color:var(--muted-soft);font-weight:600;padding:3px 0;">'+l+'</div>';}).join('')+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">';
  
  // Espacios vacíos antes del primer día
  for(var i=0;i<startDow;i++){
    html += '<div></div>';
  }
  
  // Días del mes
  // Calcular cuántos días de racha había al inicio del mes para saber los bonos
  var streakAtStart = 0;
  // Sumar días cumplidos en el historial antes de este mes
  Object.keys(hist).sort().forEach(function(k){
    var d2 = new Date(k);
    if(d2 < new Date(year,month,1) && hist[k].streakReached) streakAtStart++;
  });
  
  var runningStreak = streakAtStart;
  
  for(var day=1; day<=lastDay; day++){
    var d = new Date(year, month, day);
    var key = d.toISOString().slice(0,10);
    var data = hist[key];
    var isFuture = d > today;
    var isToday = key === todayKey;
    var streakReached = data && data.streakReached;
    
    if(streakReached) runningStreak++;
    else if(!isFuture && data) runningStreak = 0; // racha rota
    
    // Determinar si este día tiene bono
    var bonusIcon = '';
    if(streakReached){
      if(runningStreak % 180 === 0) bonusIcon = '⭐';       // cada 180 días +30 XP
      else if(runningStreak % 30 === 0) bonusIcon = '🔥';   // cada 30 días +7 XP
      else if(runningStreak % 7 === 0) bonusIcon = '✨';    // cada 7 días +5 XP
    }
    
    var bgStyle, textColor, fontWeight = '600';
    if(streakReached){
      bgStyle = 'background:linear-gradient(135deg,'+GOLD_LIGHT+','+GOLD+');border:2px solid '+GOLD+';';
      textColor = '#fff';
      fontWeight = '700';
    } else if(isFuture){
      bgStyle = 'background:transparent;';
      textColor = 'var(--muted-soft)';
    } else {
      bgStyle = 'background:transparent;';
      textColor = 'var(--muted)';
    }
    
    var todayMark = isToday ? 'box-shadow:0 0 0 2px var(--ink);' : '';
    
    html += '<div style="aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;'+bgStyle+todayMark+';position:relative;">'+
      (bonusIcon?'<span style="position:absolute;top:-4px;right:-4px;font-size:10px;line-height:1;" title="¡Bono de racha!">'+bonusIcon+'</span>':'')+
      '<span style="font-size:14px;color:'+textColor+';font-weight:'+fontWeight+';">'+day+'</span>'+
    '</div>';
  }
  
  html += '</div></div>';

  html += '</div>';
  return html;
}

function calNav(delta){
  var current = S.calendarOffset || 0;
  var next = current + delta;
  // No permitir ir al futuro
  if(next > 0) next = 0;
  S.calendarOffset = next;
  render();
}

// ── Estadísticas ───────────────────────────────────────────────────────────
function renderStats(){
  var hist = S.dailyHistory || {};
  var keys = Object.keys(hist);
  var thisWeek = 0, thisMonth = 0, totalDone = 0, daysLogged = 0;
  var today = new Date();
  var weekStart = new Date(today.getTime() - 7*86400000);
  var monthStart = new Date(today.getTime() - 30*86400000);
  
  keys.forEach(function(k){
    var d = new Date(k);
    var data = hist[k];
    if(!data)return;
    daysLogged++;
    totalDone += data.completed || 0;
    if(d >= weekStart) thisWeek += data.completed || 0;
    if(d >= monthStart) thisMonth += data.completed || 0;
  });
  
  // Mini gráfico XP histórico (últimos 14 días)
  var xpHist = S.xpHistory || {};
  var xpDays = [];
  var lastXp = 0;
  for(var i=13;i>=0;i--){
    var d = new Date(today.getTime() - i*86400000);
    var key = d.toISOString().slice(0,10);
    if(xpHist[key]!==undefined){
      lastXp = xpHist[key];
    }
    xpDays.push(lastXp);
  }
  var maxXp = Math.max.apply(null, xpDays.concat([1]));
  var minXp = Math.min.apply(null, xpDays);
  var range = Math.max(maxXp - minXp, 1);
  
  var chart = '<svg width="100%" height="60" viewBox="0 0 280 60" preserveAspectRatio="none" style="display:block;margin-top:8px;">';
  // Línea
  var pts = xpDays.map(function(xp,i){
    var x = (i/(xpDays.length-1))*280;
    var y = 50 - ((xp-minXp)/range)*40;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  chart += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts+'"/>';
  // Puntos
  xpDays.forEach(function(xp,i){
    var x = (i/(xpDays.length-1))*280;
    var y = 50 - ((xp-minXp)/range)*40;
    chart += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2" fill="var(--accent)"/>';
  });
  chart += '</svg>';
  
  return '<div class="card">'+
    '<div style="font-weight:700;font-size:15px;color:var(--ink);margin-bottom:14px;">📊 Estadísticas</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+thisWeek+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Esta semana</div>'+
      '</div>'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+thisMonth+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Este mes</div>'+
      '</div>'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+totalDone+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Total completadas</div>'+
      '</div>'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+daysLogged+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Días con actividad</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function getAchievementName(days){
  if(days===30)return{emoji:'🌱',title:'Mes constante'};
  if(days===120)return{emoji:'🌳',title:'4 meses de tenacidad'};
  if(days===365)return{emoji:'☀️',title:'¡Un año entero!'};
  if(days>365 && days%365===0)return{emoji:'⭐',title:(days/365)+' años seguidos'};
  return{emoji:'🔥',title:days+' días'};
}

function setStreakThr(v){

// ── Modo Vacaciones ────────────────────────────────────────────────────────
function isVacacionesActive(){
  return S.activeMode && S.activeMode.type==='vacaciones';
}
function vacacionesCanActivate(){
  // Donante: sin cooldown
  if(isPremium())return{ok:true};
  var vc=S.vacaciones;
  if(!vc.activeSince)return{ok:true};
  var since=new Date(vc.activeSince);
  var until=new Date(since.getTime()+FREE_MODE_COOLDOWN_DAYS*86400000);
  if(new Date()<until){
    var daysLeft=Math.ceil((until-new Date())/86400000);
    return{ok:false,daysLeft:daysLeft};
  }
  return{ok:true};
}
function activateVacaciones(){
  if(S.activeMode){toast('Desactiva primero el modo activo');return;}
  var info=vacacionesCanActivate();
  if(!info.ok){toast('Disponible en '+info.daysLeft+' días');return;}
  S.vacaciones.activeSince = todayStr();
  S.activeMode = {type:'vacaciones'};
  S.vacacionesUsedCount = (S.vacacionesUsedCount||0) + 1;
  // Aplicar plantilla si está asociada
  if(S.vacaciones.templateId){
    var tpl=(S.templates||[]).find(function(t){return t.id===S.vacaciones.templateId;});
    if(tpl) _applyTemplate(S.vacaciones.templateId);
  }
  saveState();
  checkMedals();
  render();
  toast('🌴 Modo Vacaciones activado');
}
function deactivateVacaciones(){
  if(S.modeTaskBackup){S.tasks=S.modeTaskBackup;S.modeTaskBackup=null;}
  S.activeMode = null;
  S.vacaciones.activeSince = null;
  S.showHidden = false;
  saveState();render();
}
function toggleCustomMode(id){
  if(S.activeMode&&S.activeMode.type==='custom'&&S.activeMode.id===id){
    // Desactivar: restaurar backup si hay
    if(S.modeTaskBackup){
      S.tasks = S.modeTaskBackup;
      S.modeTaskBackup = null;
    }
    S.activeMode=null;S.showHidden=false;
    saveState();render();
    toast('Modo desactivado');
  } else {
    var mode = S.modes.find(function(m){return m.id===id;});
    if(!mode) return;
    S.activeMode={type:'custom',id:id};
    // Si tiene plantilla asociada, aplicarla
    if(mode.templateId){
      var tpl = (S.templates||[]).find(function(t){return t.id===mode.templateId;});
      if(tpl){
        // Backup tareas actuales
        S.modeTaskBackup = JSON.parse(JSON.stringify(S.tasks));
        // Reemplazar tareas del día con las de la plantilla
        var nonDay = S.tasks.filter(function(t){return t.period!=='dia';});
        var newDayTasks = (tpl.tasks||[]).map(function(t){
          return Object.assign({},t,{
            id:uid(),done:false,prog:0,
            day: t.day===undefined?0:t.day,
            checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
          });
        });
        S.tasks = nonDay.concat(newDayTasks);
        toast('✓ Modo activado con plantilla "'+tpl.name+'"');
      } else {
        toast('Modo activado');
      }
    } else {
      toast('Modo activado');
    }
    saveState();render();
  }
}
function delMode(id){
  S.modes=S.modes.filter(function(m){return m.id!==id;});
  if(S.activeMode&&S.activeMode.type==='custom'&&S.activeMode.id===id){
    S.activeMode=null;
  }
  saveState();render();
}

var TPL = {templateId:null, name:'', tasks:[], currentDay:0};

function newTemplate(){

  };

function editTemplate(id){

      '<button class="cbtn" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
  return;
  S.templates = (S.templates||[]).filter(function(t){return t.id!==id;});

  if(S.weekSchedule){
