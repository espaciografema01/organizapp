// Verifica todas las medallas y desbloquea las que correspondan (sin aviso)
function checkMedals(){
  if(S.simpleMode)return; // Modo simplificado: sin medallas/logros
  if(!S.medals)S.medals = [];
  var changed = false;
  MEDALS_CATALOG.forEach(function(m){
    var already = S.medals.some(function(um){return um.id===m.id;});
    if(already)return;
    if(m.check()){
      S.medals.push({id:m.id, dateUnlocked:new Date().toISOString()});
      changed = true;
      // Entregar recompensa (si tiene) y mostrar el modal de medalla desbloqueada
      // con la medallita animada + confeti, en vez de un simple toast de texto.
      if(m.reward){
        if(m.reward.type === 'xp'){
          addXP(m.reward.value);
        } else if(m.reward.type === 'limit+1'){
          // Aumentar límite de tareas de la cuenta en 1 en todos los períodos
          if(!S.bonusTaskLimit) S.bonusTaskLimit = 0;
          S.bonusTaskLimit += m.reward.value;
        }
      }
      setTimeout(function(medal){
        return function(){ queueMedalUnlocked(medal); };
      }(m), 800);
    }
  });
  if(changed) saveState();
}

function drawShareImage(days, totalCompleted, daysLogged){
  var canvas = document.getElementById('shareCanvas');
  if(!canvas)return;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var name = getAchievementName(days);
  
  // Colores según tema (paleta cálida fija para legibilidad)
  var bgColor = '#f5ede0';
  var inkColor = '#1a1a1a';
  var accentColor = '#c97842';
  var inkSoftColor = '#3a3530';
  
  // Fondo con degradado
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, '#f5ede0');
  grad.addColorStop(1, '#e8c5a8');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  
  // Patrón decorativo: círculos sutiles
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = accentColor;
  for(var i=0;i<8;i++){
    ctx.beginPath();
    ctx.arc(W*Math.random(), H*Math.random(), 100+Math.random()*200, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // Marco interior
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 4;
  ctx.strokeRect(80, 80, W-160, H-160);
  
  // Logo Gr. arriba
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 60px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('[', W/2 - 80, 200);
  ctx.fillText(']', W/2 + 80, 200);
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 70px Georgia, serif';
  ctx.fillText('Gr.', W/2, 210);
  
  // Subtítulo Gramific[app]
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 22px Arial, sans-serif';
  ctx.fillText('GRAMIFIC[APP]', W/2, 260);
  
  // Emoji grande del logro
  ctx.font = '180px Arial';
  ctx.fillText(name.emoji, W/2, 470);
  
  // Título del logro
  ctx.fillStyle = inkColor;
  ctx.font = 'bold 64px Georgia, serif';
  ctx.fillText(name.title, W/2, 580);
  
  // Días destacados
  ctx.fillStyle = accentColor;
  ctx.font = 'bold 220px Georgia, serif';
  ctx.fillText(days, W/2, 800);
  
  ctx.fillStyle = inkSoftColor;
  ctx.font = '600 32px Arial, sans-serif';
  ctx.fillText('DÍAS DE RACHA', W/2, 860);
  
  // Estadísticas en la parte de abajo
  ctx.fillStyle = inkColor;
  ctx.font = '600 26px Arial, sans-serif';
  if(totalCompleted > 0){
    ctx.fillText(totalCompleted + ' tareas completadas en ' + daysLogged + ' días activos', W/2, 940);
  }
  
  // Frase motivadora
  ctx.fillStyle = inkSoftColor;
  ctx.font = 'italic 22px Georgia, serif';
  var frase;
  if(days === 30) frase = '"Un mes de constancia"';
  else if(days === 120) frase = '"4 meses es ya un hábito"';
  else if(days === 365) frase = '"Un año entero... A pura perseverancia"';
  else frase = '"' + days + ' días de sudor y organización"';
  ctx.fillText(frase, W/2, 1000);
}

// On load: if last activity was 2+ days ago, reset streak — salvo que se
// haya activado "Libre los fines de semana" y el hueco sea puro sábado y
// domingo, en cuyo caso esos días se auto-completan y la racha sigue viva.
// Reparación única (bugfix): antes, un sábado/domingo con "fin de semana
// libre" se daba por cumplido sin condición, así que una racha ya rota
// podía "revivir" sola ese fin de semana sin haber hecho nada. Si la racha
// guardada termina justo en un tramo de días "regalados" por el fin de
// semana cuyo día anterior real NO estaba cumplido, se descuenta ese
// tramo inflado — una sola vez, al cargar la app.
function repairInflatedWeekendStreak(){
  if(!S.streak || !S.dailyHistory || !S.streak.days || !S.streak.lastDate) return;
  var cursor = parseLocalDate(S.streak.lastDate);
  var weekendRunLength = 0;
  var guard = 0;
  while(guard<10){
    guard++;
    var key = localDateStr(cursor);
    var entry = S.dailyHistory[key];
    if(!entry || !entry.weekendSkipped) break;
    weekendRunLength++;
    cursor = addDaysLocal(cursor, -1);
  }
  if(weekendRunLength===0) return; // la racha actual no termina en un finde regalado
  var beforeKey = localDateStr(cursor);
  var beforeEntry = S.dailyHistory[beforeKey];
  if(beforeEntry && beforeEntry.streakReached) return; // sí venía viva de antes — estaba bien

  var newDays = Math.max(0, S.streak.days - weekendRunLength);
  var newTotal = Math.max(0, (S.streak.total||0) - weekendRunLength);
  S.streak = {days:newDays, lastDate:beforeKey, total:newTotal};
  // Los días descontados quedan "sin finalizar" para volver a evaluarse
  // más adelante con la lógica ya corregida, en vez de quedar congelados.
  var rewalk = parseLocalDate(beforeKey);
  for(var i=0;i<weekendRunLength;i++){
    rewalk = addDaysLocal(rewalk, 1);
    var k = localDateStr(rewalk);
    if(S.dailyHistory[k]) S.dailyHistory[k].finalized = false;
  }
  saveState();
}
function checkStreakOnLoad(){
  // BUGFIX: new Date('YYYY-MM-DD') parsea como medianoche UTC; leer luego
  // .getDay() (local) sobre eso podía devolver el día de la semana
  // equivocado en husos con offset negativo como Chile. parseLocalDate
  // (usado dentro de reconcileStreak) arma la fecha con medianoche LOCAL,
  // que es lo que corresponde acá.
  repairInflatedWeekendStreak();
  reconcileStreak();
}

// ── Notificaciones (preguntar muy de a poco) ───────────────────────────────
// ── Sistema de spotlight / tour interactivo ────────────────────────────────
// Un "spotlight" es un overlay semitransparente que deja visible solo el
// elemento objetivo, con un tooltip anclado al costado. El usuario debe
// interactuar con el elemento resaltado para avanzar (o puede saltar).

var _tourActive = false;
var _tourSteps = [];
var _tourIdx = 0;
var _tourOnDone = null;

// Crear el DOM del spotlight (solo una vez)
function _ensureSpotlightDOM(){
  if(document.getElementById('sl-overlay')) return;
  var style = document.createElement('style');
  style.innerHTML = [
    '#sl-overlay{position:fixed;inset:0;z-index:9000;pointer-events:none;}',
    '#sl-cutout{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border-radius:12px;transition:all .35s cubic-bezier(.4,0,.2,1);}',
    '#sl-tooltip{position:absolute;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 14px;max-width:260px;max-height:calc(100vh - 24px);overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.25);transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1);}',
    '#sl-tooltip .sl-title{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;}',
    '#sl-tooltip .sl-body{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;}',
    '#sl-tooltip .sl-action{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:5px;}',
    '#sl-tooltip .sl-nav{display:flex;gap:8px;align-items:center;}',
    '#sl-tooltip .sl-skip{flex:1;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:Inter,sans-serif;text-align:left;}',
    '#sl-tooltip .sl-next{background:var(--accent);color:white;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;}',
    '#sl-pulse{position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);animation:slpulse 1.4s infinite;pointer-events:none;}',
    '@keyframes slpulse{0%{transform:scale(.8);opacity:1;}100%{transform:scale(1.7);opacity:0;}}'
  ].join('');
  document.head.appendChild(style);
  var ov = document.createElement('div');
  ov.id = 'sl-overlay';
  ov.innerHTML = '<div id="sl-cutout"></div><div id="sl-pulse"></div><div id="sl-tooltip"></div>';
  document.body.appendChild(ov);
}

function _slPosition(step){
  var cutout = document.getElementById('sl-cutout');
  var tip = document.getElementById('sl-tooltip');
  var pulse = document.getElementById('sl-pulse');
  if(!cutout||!tip) return;

  var PAD = 10;
  var EDGE = 12; // margen mínimo respecto a los bordes de la pantalla
  var targetEl = step.target ? document.querySelector(step.target) : null;
  // window.innerHeight no siempre refleja el alto realmente visible en
  // celular (la barra de direcciones del navegador aparece/desaparece y lo
  // desincroniza) — visualViewport es más confiable cuando está disponible.
  var vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);

  // Medir el tooltip YA renderizado con su contenido real, en vez de asumir
  // una altura fija — el texto de cada paso varía, y en pantallas chicas o
  // con letra más grande (accesibilidad) puede ocupar bastante más de lo
  // esperado. getBoundingClientRect() da el tamaño real sin importar dónde
  // esté posicionado ahora mismo (max-width/max-height ya lo acotan).
  var tipRect = tip.getBoundingClientRect();
  var tipW = tipRect.width || 260;
  var tipH = tipRect.height || 200;

  if(targetEl){
    var r = targetEl.getBoundingClientRect();
    cutout.style.left = (r.left - PAD)+'px';
    cutout.style.top  = (r.top  - PAD)+'px';
    cutout.style.width  = (r.width  + PAD*2)+'px';
    cutout.style.height = (r.height + PAD*2)+'px';
    // Pulso en el centro del elemento
    pulse.style.display = 'block';
    pulse.style.left = (r.left + r.width/2 - 18)+'px';
    pulse.style.top  = (r.top + r.height/2 - 18)+'px';
    // Tooltip debajo o arriba, según cuál lado tiene espacio real suficiente
    // para la altura YA medida (no una estimación).
    var spaceBelow = vh - r.bottom - EDGE;
    var spaceAbove = r.top - EDGE;
    var top;
    if(spaceBelow >= tipH + 14){
      top = r.bottom + 14;
    } else if(spaceAbove >= tipH + 14){
      top = r.top - tipH - 14;
    } else {
      // No cabe cómodo ni arriba ni abajo (pantalla chica o texto largo):
      // se ubica del lado con más espacio disponible; si aún así no entra
      // completo, el propio tooltip scrollea internamente (ver overflow-y
      // en el CSS) en vez de quedar cortado sin forma de verlo.
      top = spaceBelow >= spaceAbove ? (r.bottom + 14) : Math.max(EDGE, r.top - tipH - 14);
    }
    // Clamp final: nunca permitir que el tooltip quede arriba/abajo del viewport
    top = Math.max(EDGE, Math.min(top, vh - tipH - EDGE));
    tip.style.top = top+'px';
    var tipX = Math.max(EDGE, Math.min(r.left, vw - tipW - EDGE));
    tip.style.left = tipX+'px';
  } else {
    // Sin elemento objetivo: centrado en pantalla, también acotado a lo que
    // realmente cabe.
    cutout.style.left='50%'; cutout.style.top='40%'; cutout.style.width='0'; cutout.style.height='0';
    pulse.style.display='none';
    tip.style.left = Math.max(EDGE, (vw-tipW)/2)+'px';
    tip.style.top  = Math.max(EDGE, Math.min((vh-tipH)/2, vh - tipH - EDGE))+'px';
  }
}

function _slRender(){
  _ensureSpotlightDOM();
  var ov = document.getElementById('sl-overlay');
  var tip = document.getElementById('sl-tooltip');
  if(!ov||!tip) return;
  ov.style.display = 'block';
  ov.style.pointerEvents = 'all'; // bloquea clics fuera del cutout

  var step = _tourSteps[_tourIdx];
  var total = _tourSteps.length;
  var dotsHTML = _tourSteps.map(function(_,i){
    return '<div style="width:'+(i===_tourIdx?18:5)+'px;height:5px;border-radius:3px;background:'+(i===_tourIdx?'var(--accent)':'var(--line)')+';transition:all .25s;display:inline-block;"></div>';
  }).join('');

  var actionHtml = step.action
    ? '<div class="sl-action"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'+step.action+'</div>'
    : '';
  var isLast = _tourIdx === total-1;

  tip.innerHTML =
    '<div style="display:flex;gap:4px;margin-bottom:12px;">'+dotsHTML+'</div>'+
    '<div class="sl-title">'+step.title+'</div>'+
    '<div class="sl-body">'+step.body+'</div>'+
    actionHtml+
    '<div class="sl-nav">'+
      '<button class="sl-skip" onclick="tourSkip()">Saltar tour</button>'+
      (!isLast
        ? '<button class="sl-next" onclick="tourNext()">Siguiente →</button>'
        : '<button class="sl-next" onclick="tourDone()">✓ Listo</button>'
      )+
    '</div>';

  // Posicionar después de que el DOM esté pintado con el contenido real (doble
  // rAF: dos frames de margen para que fuentes/layout ya estén asentados
  // antes de medir la altura real del tooltip).
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ _slPosition(step); });
  });

  // Hacer que el cutout sí deje pasar los clics al elemento objetivo
  var cutout = document.getElementById('sl-cutout');
  if(cutout){
    cutout.style.pointerEvents = 'none';
    // El overlay general bloquea todo — excepto los clics dentro del bbox del
    // elemento objetivo, que los dejamos pasar usando el truco de pointer-events
    // solo en la capa del tooltip y de la "máscara fuera".
  }
  // Si el paso tiene onEnter (navegar a la pestaña correcta), ejecutarlo
  if(step.onEnter) step.onEnter();
}

function tourNext(){
  if(_tourIdx < _tourSteps.length-1){ _tourIdx++; _slRender(); }
  else { tourDone(); }
}
function tourSkip(){ tourDone(); }
function tourDone(){
  var ov = document.getElementById('sl-overlay');
  if(ov){ ov.style.display='none'; ov.style.pointerEvents='none'; }
  _tourActive = false;
  if(_tourOnDone) _tourOnDone();
  _tourOnDone = null;
}
// Si el celular rota o cambia el alto disponible (p.ej. se abre el teclado,
// o el navegador muestra/oculta la barra de direcciones), recalculamos la
// posición del tooltip activo para que no quede mal ubicado.
window.addEventListener('resize', function(){
  if(_tourActive && _tourSteps[_tourIdx]) _slPosition(_tourSteps[_tourIdx]);
});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){
    if(_tourActive && _tourSteps[_tourIdx]) _slPosition(_tourSteps[_tourIdx]);
  });
}

function maybeAskNotifPermission(){
  // Solo preguntar si: la API existe, no se preguntó nunca o pasaron 30+ días, no rechazó
  if(typeof Notification === 'undefined')return;
  if(S.notifPermission === 'granted' || S.notifPermission === 'denied')return;
  // Si nunca se preguntó, esperar a que el usuario tenga al menos 3 días de uso
  var hist = S.dailyHistory || {};
  var daysActive = Object.keys(hist).length;
  if(daysActive < 3)return;
  // Si ya se preguntó, esperar 30 días para volver a preguntar
  if(S.notifAskedDate){
    var lastAsk = new Date(S.notifAskedDate);
    var diffDays = (new Date() - lastAsk) / 86400000;
    if(diffDays < 30)return;
  }
  // Mostrar pregunta gentil
  S.notifAskedDate = new Date().toISOString();
  saveState();
  setTimeout(showNotifAsk, 3000);
}

function showNotifAsk(){
  var ICON_BELL='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15.5V11a6 6 0 0 0-12 0v4.5L4 18h16l-2-2.5z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>';
  var box=document.createElement('div');box.className='conf-box';box.id='notif-ask';
  box.innerHTML='<div class="conf-inner" style="max-width:320px;">'+
    iconBadgeHTML(ICON_BELL, 64)+
    '<div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);text-align:center;">¿Quieres recordatorios?</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;text-align:center;">Te aviso solo de las tareas que tú elijas, cuando se acerque su hora. Sin spam: nada de notificaciones para todas tus tareas.</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<button class="sbtn" style="font-size:13px;" onclick="grantNotif();this.closest(\'.conf-box\').remove();">Sí, activar</button>'+
      '<button class="tbtn" style="text-align:center;text-decoration:none;" onclick="this.closest(\'.conf-box\').remove();">Ahora no</button>'+
      '<button class="tbtn" style="text-align:center;font-size:11px;opacity:.7;" onclick="denyNotif();this.closest(\'.conf-box\').remove();">No, gracias</button>'+
    '</div></div>';
  document.body.appendChild(box);
}

function grantNotif(){
  if(typeof Notification === 'undefined'){toast('Tu navegador no soporta notificaciones');return;}
  Notification.requestPermission().then(function(perm){
    S.notifPermission = perm;
    saveState();
    if(perm === 'granted'){
      toast('✓ Notificaciones activadas');
      scheduleNotifications();
    } else {
      toast('Permiso denegado en el sistema');
    }
    render();
  });
}
function revokeNotif(){
  S.notifPermission = 'revoked';
  saveState();
  render();

  if(!S.dailyReviewReminder || !S.dailyReviewReminder.on) return;

    new Notification('Gramifica', {body:'Es hora de revisar tus tareas de hoy y marcar las que ya tengas listas ✓', icon:'/icon-192.png'});

// ── Programador de notificaciones locales ──────────────────────────────────
// Usa la Web Notifications API para agendar un aviso por cada tarea del día
// que el usuario haya marcado explícitamente con "🔔 Recordatorio para esta
// tarea" (opt-in por tarea, no automático). Los timers se recrean cada vez
// que cambia la configuración o al abrir la app (los timers no persisten
// entre sesiones — cuando se integre FCM, esto pasa a ser serverless y
// persistente).
var _notifTimers = [];
function scheduleNotifications(){
  // Limpiar timers anteriores
  _notifTimers.forEach(function(t){clearTimeout(t);});
  _notifTimers = [];
  if(S.notifPermission !== 'granted') return;
  if(typeof Notification === 'undefined') return;
  var today = todayIdx();
  var now = new Date();
  // Solo tareas que el usuario activó explícitamente con "🔔 Recordatorio
  // para esta tarea" — ya no se avisa automáticamente para toda tarea con
  // hora definida, cada una se elige a propósito.
  var todayTasks = (S.tasks||[]).filter(function(t){
    return isTaskToday(t) && t.hora && t.notif && t.notif.on && !isDone(t);
  });
  todayTasks.forEach(function(t){
    var nt = t.notif || {hh:0, mm:15};
    var parts = t.hora.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
    var taskTime = new Date();
    taskTime.setHours(h, m, 0, 0);
    // Restar el aviso anticipado según configuración de ESTA tarea (hh horas + mm minutos)
    var alertTime = new Date(taskTime.getTime() - ((nt.hh||0)*60 + (nt.mm||0))*60000);
    var msUntil = alertTime - now;
    if(msUntil < 0) return; // ya pasó hoy
    var taskName = t.text;
    var isExact = !nt.hh && !nt.mm;
    var pre = isExact ? '' : (nt.hh?nt.hh+'h ':'') + (nt.mm?nt.mm+'min ':'');
    // Sin esc() aquí: la Notification API del sistema muestra texto plano,
    // no HTML, así que escapar (& → &amp;, etc.) mostraría entidades literales.
    var body = isExact
      ? 'Es la hora: '+taskName
      : 'En '+pre.trim()+': '+taskName;
    var timer = setTimeout(function(){
      new Notification('Gramifica', {body: body, icon: '/icon-192.png'});
    }, msUntil);
    _notifTimers.push(timer);
  });
  // Recordatorios independientes puestos desde el menú ⋯ (t.reminder.time),
  // no requieren que la tarea tenga "horario específico" activado.
  var reminderTasks = (S.tasks||[]).filter(function(t){
    return isTaskToday(t) && t.reminder && t.reminder.time && !isDone(t);
  });
  reminderTasks.forEach(function(t){
    var parts = t.reminder.time.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
    var alertTime = new Date();
    alertTime.setHours(h, m, 0, 0);
    var msUntil = alertTime - now;
    if(msUntil < 0) return; // ya pasó hoy
    var taskName = t.text;
    var timer = setTimeout(function(){
      new Notification('Gramifica', {body: 'Recordatorio: '+taskName, icon: '/icon-192.png'});
    }, msUntil);
    _notifTimers.push(timer);
  });
  // Recordatorio diario de revisión (Yo → Notificaciones) — independiente
  // de las tareas del día, se reprograma solo día a día (ver su función).
  scheduleDailyReviewReminder();
  if(_notifTimers.length) console.log('[Notif] '+_notifTimers.length+' recordatorio(s) programado(s) para hoy');
}

// ── Init ───────────────────────────────────────────────────────────────────
// ════════════════════════════════════════════════════════════════════════════
// 🐛 REPORTE AUTOMÁTICO DE ERRORES (Opción A — Crashlytics web)
// Captura errores JS no controlados y los guarda en Firestore → colección
// 'crash_reports'. Cuando la app esté empaquetada en Android, el SDK nativo
// de Firebase Crashlytics reemplaza esto con reportes mucho más detallados.
// ════════════════════════════════════════════════════════════════════════════
window.onerror = function(msg, src, line, col, err){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   String(msg).slice(0,300),
      src:   String(src).slice(0,200),
      line:  line, col: col,
      stack: err && err.stack ? err.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ua:    navigator.userAgent.slice(0,120),
      ver:   '3.0'
    });
  } catch(e){ /* no propagar errores del propio reporter */ }
  return false; // no suprimir el error en consola
};
window.addEventListener('unhandledrejection', function(ev){
  if(!firebaseAvailable || !db) return;
  try {
    db.collection('crash_reports').add({
      msg:   'UnhandledPromise: '+(ev.reason ? String(ev.reason).slice(0,300) : 'unknown'),
      stack: ev.reason && ev.reason.stack ? ev.reason.stack.slice(0,600) : '',
      uid:   (typeof currentUser !== 'undefined' && currentUser) ? currentUser.uid : 'anon',
      ts:    new Date().toISOString(),
      ver:   '3.0'
    });
  } catch(e){}
});

// ── Swipe horizontal en #content — animación suave + circular ──────────────
(function(){
  var c = document.getElementById('content');
  if(!c) return;

  var sx=0, sy=0, startTime=0;
  var dragging=false, axis=null; // null | 'x' | 'y'
  var swipeMode=null; // null | 'hoy' | 'plan' | 'energia' — se fija en touchstart

  // Overlay de feedback visual durante el drag
  var ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;font-size:40px;';
  document.body.appendChild(ghost);

  function isDefaultLayout(){ return (S.interfaceLayout||'default')==='default'; }
  function isHoy(){ return (S.tab==='hoy'||S.tab==='dia') && isDefaultLayout(); }
  // Energía (Modos / Plantillas) se puede recorrer deslizando, igual que
  // los días en Hoy. Pedido: Plan (Objetivos/Progreso) ya NO cambia de
  // subpestaña al deslizar — dentro de Calendarios, en cambio, deslizar
  // mueve entre meses o semanas (ver mode 'calendarios' más abajo).
  function energiaSubtabs(){ return ['modos','plantillas']; }
  function currentSwipeMode(){
    if(!isDefaultLayout()) return null;
    if(S.tab==='hoy'||S.tab==='dia') return 'hoy';
    if(S.tab==='horario') return 'calendarios';
    if(S.tab==='energia'||S.tab==='modos'||S.tab==='plantillas') return 'energia';
    return null;
  }
  function currentSubtab(mode){
    if(mode==='energia') return (S.tab==='plantillas')?'plantillas':'modos';
    return null;
  }
  // Dentro de Calendarios → Semanal hay una grilla que se desplaza
  // horizontalmente por sí misma (ver id="horario-scroll-wrap") cuando no
  // entran todas las columnas; si el gesto empieza ahí Y hace falta ese
  // scroll, dejamos que sea un scroll normal en vez de cambiar de semana.
  function startedOnHorarioScroll(target){
    var wrap = document.getElementById('horario-scroll-wrap');
    return !!(wrap && wrap.contains(target) && wrap.scrollWidth > wrap.clientWidth + 4);
  }
  // BUGFIX: la barra de categorías ("Todas / Estudio / Trabajo / ...") en
  // Hoy también se desplaza horizontalmente cuando hay muchas categorías —
  // sin este chequeo, arrastrar el dedo ahí para ver las categorías de más
  // a la derecha se interpretaba a la vez como "cambiar de día", y los dos
  // gestos se pisaban entre sí.
  function startedOnCatTabsScroll(target){
    var wrap = document.getElementById('cat-tabs-bar');
    return !!(wrap && wrap.contains(target) && wrap.scrollWidth > wrap.clientWidth + 4);
  }

  c.addEventListener('touchstart', function(e){
    swipeMode = currentSwipeMode();
    if(!swipeMode) return;
    if(swipeMode==='calendarios' && (S.calendariosSubTab||'semanal')==='semanal' && startedOnHorarioScroll(e.target)){
      swipeMode = null; // dejar que la grilla scrollee normalmente
      return;
    }
    if(swipeMode==='hoy' && startedOnCatTabsScroll(e.target)){
      swipeMode = null; // dejar que la barra de categorías scrollee normalmente
      return;
    }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    startTime = Date.now();
    dragging = true;
    axis = null;
    c.style.transition = 'none';
  }, {passive:true});

  c.addEventListener('touchmove', function(e){
    if(!dragging||!swipeMode) return;
    var dx = e.touches[0].clientX - sx;
    var dy = e.touches[0].clientY - sy;

    // Determinar eje al inicio del gesto
    if(!axis){
      if(Math.abs(dx)>8||Math.abs(dy)>8){
        axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      }
      return;
    }
    if(axis !== 'x') return;

    // Seguir el dedo con traslación suave
    c.style.transform = 'translateX('+dx*0.35+'px)';

    // Sin overlay — la animación de salida ya da el feedback
  }, {passive:true});

  c.addEventListener('touchend', function(e){
    if(!dragging) return;
    dragging = false;
    ghost.style.opacity = '0';

    if(!swipeMode || axis !== 'x'){
      c.style.transition = 'transform .2s ease';
      c.style.transform = '';
      axis = null;
      swipeMode = null;
      return;
    }

    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    var elapsed = Date.now() - startTime;
    var threshold = elapsed < 250 ? 30 : 60; // swipe rápido = menos recorrido requerido

    if(Math.abs(dx) < threshold || Math.abs(dy) > Math.abs(dx)*0.9){
      // Cancelar — volver al lugar con rebote
      c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
      c.style.transform = '';
      axis = null;
      swipeMode = null;
      return;
    }

    // Si es Energía pero solo tiene 1-2 sub-pestañas, calculamos a cuál
    // saltar; si el modo es 'hoy' seguimos con la lógica original de día.
    var mode = swipeMode;
    var goRight = dx > 0; // dedo hacia la derecha = ítem anterior (día/pestaña/mes/semana previo)
    var nextSubtab = null;
    if(mode==='energia'){
      var subtabs = energiaSubtabs();
      var cur = currentSubtab(mode);
      var idx = subtabs.indexOf(cur);
      if(idx<0) idx=0;
      if(subtabs.length<2){ // nada a donde ir — cancelar con rebote
        c.style.transition = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
        c.style.transform = '';
        axis = null; swipeMode = null;
        return;
      }
      var nextIdx = goRight ? (idx===0?subtabs.length-1:idx-1) : (idx===subtabs.length-1?0:idx+1);
      nextSubtab = subtabs[nextIdx];
    }

    // Pedido: dentro de Calendarios, deslizar mueve entre meses/semanas —
    // pero sin re-animar la pestaña Plan entera (subpestañas, toggle
    // Semanal/Mensual, cabecera del mes, agenda de abajo...), que se sentía
    // como un refresh de golpe. En Mensual, además, ahora es un deslizamiento
    // de verdad (no un fundido): el mes se va entero hacia un lado mientras
    // el que entra se ve "acercarse" desde el borde opuesto — para eso usa
    // su propio recorte (#cal-days-viewport, con overflow:hidden). En
    // Semanal se mantiene el fundido suave de siempre, acotado a la grilla.
    if(mode==='calendarios'){
      c.style.transition = 'transform .12s ease-out';
      c.style.transform = '';
      var calSub = S.calendariosSubTab||'semanal';
      var isMonthSlide = calSub==='mensual';
      var targetId = isMonthSlide ? 'cal-days-viewport' : 'horario-scroll-wrap';
      var calAreaBefore = document.getElementById(targetId);
      if(calAreaBefore){
        if(isMonthSlide){
          calAreaBefore.style.transition = 'transform .16s ease-out';
          calAreaBefore.style.transform = 'translateX('+(goRight?'100%':'-100%')+')';
        } else {
          calAreaBefore.style.transition = 'transform .14s ease-out, opacity .14s';
          calAreaBefore.style.transform = 'translateX('+(goRight?'-8%':'8%')+')';
          calAreaBefore.style.opacity = '0';
        }
      }
      setTimeout(function(){
        var sub = S.calendariosSubTab||'semanal';
        if(sub==='mensual'){
          if(S.calGridExpanded!==false) calNav(goRight?-1:1);
          else calNavWeek(goRight?-1:1);
        } else {
          weekNav(goRight?-1:1);
        }
        var calAreaAfter = document.getElementById(targetId);
        if(calAreaAfter){
          if(isMonthSlide){
            calAreaAfter.style.transition = 'none';
            calAreaAfter.style.transform = 'translateX('+(goRight?'-100%':'100%')+')';
            requestAnimationFrame(function(){
              requestAnimationFrame(function(){
                calAreaAfter.style.transition = 'transform .22s cubic-bezier(.25,.46,.45,.94)';
                calAreaAfter.style.transform = '';
              });
            });
          } else {
            calAreaAfter.style.transition = 'none';
            calAreaAfter.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
            calAreaAfter.style.opacity = '0';
            requestAnimationFrame(function(){
              requestAnimationFrame(function(){
                calAreaAfter.style.transition = 'transform .18s ease-out, opacity .16s';
                calAreaAfter.style.transform = '';
                calAreaAfter.style.opacity = '1';
              });
            });
          }
        }
      }, 160);
      axis = null;
      swipeMode = null;
      return;
    }

    // Transición suave: fade + pequeño desplazamiento (misma animación para
    // día y sub-pestañas de Energía)
    c.style.transition = 'transform .14s ease-out, opacity .14s';
    c.style.transform = 'translateX('+(goRight?'-8%':'8%')+')';
    c.style.opacity = '0';

    setTimeout(function(){
      if(mode==='hoy'){
        if(goRight){
          S.day = S.day === 0 ? 6 : S.day - 1;
        } else {
          S.day = S.day === 6 ? 0 : S.day + 1;
        }
        c.style.transition = 'none';
        c.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
        c.style.opacity = '0';
        c.scrollTop = 0;
        render();
      } else {
        c.style.transition = 'none';
        c.style.transform = 'translateX('+(goRight?'6%':'-6%')+')';
        c.style.opacity = '0';
        c.scrollTop = 0;
        setTab(nextSubtab); // ya hace render() y toca el sonido de cambio de pestaña
      }
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          c.style.transition = 'transform .18s ease-out, opacity .16s';
          c.style.transform = '';
          c.style.opacity = '1';
        });
      });
    }, 130);

    axis = null;
    swipeMode = null;
  }, {passive:true});

  // Limpiar si se cancela el touch
  c.addEventListener('touchcancel', function(){
    dragging = false;
    axis = null;
    swipeMode = null;
    ghost.style.opacity = '0';
    c.style.transition = 'transform .2s ease';
    c.style.transform = '';
    c.style.opacity = '1';
  }, {passive:true});
})();

// ── Botón "atrás" del sistema (o gesto de volver) ───────────────────────────
// Por defecto, en una SPA como esta, el botón físico/gesto de "atrás" del
// celular sale directamente de la app: el navegador nunca se enteró de que
// "cambiaste de pestaña" o "abriste un modal", porque todo eso pasa
// reemplazando el HTML de la página en vez de navegar de verdad. Esto lo
// arregla apoyándose en la History API:
//   1) Cada modal/overlay que se agrega a <body> (editar tarea, confirmar
//      eliminar, menús ⋯, etc.) empuja una entrada al historial. Si se cierra
//      "a mano" (Guardar/Cancelar/click afuera), sincronizamos retrocediendo
//      nosotros mismos para no dejar una entrada fantasma.
//   2) Cada cambio de pestaña real (setTab) también empuja una entrada — ver
//      más arriba.
// Al presionar "atrás", primero se cierra el modal más reciente si hay uno
// abierto; si no hay ninguno, se vuelve a la pestaña anterior. Solo cuando ya
// no queda nada de esto en el historial de la app, "atrás" vuelve a hacer lo
// de siempre (salir / volver a la página anterior fuera de la app).
(function(){
  var trackedModals = []; // pila de nodos <div> de modales/overlays abiertos
  var handlingPop = false;   // true mientras cerramos algo en respuesta a "atrás"
  var syntheticBack = false; // true cuando somos NOSOTROS quienes llamamos history.back()

  function isTrackable(node){
    // Cualquier elemento agregado directamente a <body> de aquí en adelante
    // cuenta como "modal": overlays de tareas, confirmaciones, menús ⋯, hojas
    // de opciones, animaciones de logro, etc. Los elementos permanentes
    // (contenido, nav inferior, toast, splash, el "ghost" del swipe...) ya
    // existían antes de empezar a observar, así que nunca disparan esto.
    return node.nodeType === 1 && node.parentNode === document.body;
  }

  var mo = new MutationObserver(function(mutations){
    mutations.forEach(function(m){
      if(m.addedNodes) m.addedNodes.forEach(function(node){
        if(!isTrackable(node) || handlingPop) return;
        try{ history.pushState({navModal:true}, ''); }catch(e){}
        trackedModals.push(node);
      });
      if(m.removedNodes) m.removedNodes.forEach(function(node){
        var idx = trackedModals.indexOf(node);
        if(idx === -1) return;
        var wasTop = idx === trackedModals.length - 1;
        trackedModals.splice(idx, 1);
        // Se cerró "a mano" (botón Guardar/Cancelar/tocar afuera). Si era el
        // que estaba arriba de la pila, sincronizamos el historial
        // retrocediendo nosotros para no dejar una entrada fantasma. Si no
        // era el de arriba (p.ej. una animación que se autodestruye mientras
        // hay otro modal abierto encima), no tocamos el historial para no
        // cerrar el modal equivocado.
        if(!handlingPop && wasTop){
          syntheticBack = true;
          try{ history.back(); }catch(e){ syntheticBack = false; }
        }
      });
    });
  });
  mo.observe(document.body, {childList:true});

  function closeTopModal(){
    var node = trackedModals[trackedModals.length-1];
    if(!node) return;
    handlingPop = true;
    if(node.id){
      // Reutiliza el mismo fade-out que ya usa el resto de la app para cerrar
      try{ removeOverlay(node.id); }catch(e){ if(node.parentNode) node.remove(); }
    } else if(node.parentNode){
      node.remove();
    }
    trackedModals.pop();
    setTimeout(function(){ handlingPop = false; }, 220);
  }

  window.addEventListener('popstate', function(e){
    if(syntheticBack){ syntheticBack = false; return; }
    if(trackedModals.length){
      closeTopModal();
      return;
    }
    // Pedido: Yo ahora navega entre una lista de categorías y pantallas
    // dedicadas (ver openYoScreen/closeYoScreen) — el botón atrás del
    // celular debe volver de a un paso ahí también, igual que con los
    // modales. navYoScreen puede ser null (volver a la lista principal).
    if(e.state && 'navYoScreen' in e.state){
      S.yoScreen = e.state.navYoScreen;
      var cYo = document.getElementById('content'); if(cYo) cYo.scrollTop = 0;
      render();
      return;
    }
    var targetTab = (e.state && e.state.navTab) ? e.state.navTab : 'hoy';
    if(targetTab !== S.tab){
      _tabHistorySuspended = true;
      setTab(targetTab);
      _tabHistorySuspended = false;
    }
  });
})();
loadState();           // Cargar datos guardados en localStorage (¡debe ir primero!)
// BUGFIX: trackVisit() existía pero nunca se invocaba desde ningún lado, así
// que S.visitHistory quedaba vacío para siempre y las medallas "Presente"
// (7 días seguidos) y "Habitual" (30 días) eran imposibles de conseguir.
trackVisit();          // Registrar la visita de hoy
checkMedals();         // Revisar medallas al iniciar
checkStreakOnLoad();
checkAutoReset();      // Auto reset on Monday 4 AM
render();
setTimeout(function(){
  var sp=document.getElementById('splash');
  if(sp){sp.classList.add('hide');setTimeout(function(){sp.remove();},600);}
  // Tutorial inicial (si no se ha visto)
  setTimeout(maybeShowTutorial, 600);
  // Show reset notification on weekend (after splash)
  setTimeout(checkResetNotification, 400);
  // Preguntar permiso de notificaciones (de forma muy poco insistente)
  setTimeout(maybeAskNotifPermission, 5000);
},1600);
</script>
