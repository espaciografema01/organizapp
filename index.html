    }
  }

  html += '</div>';
  return html;
}

// ── Detalle de un día del calendario de racha (clickeable) ──────────────
// Las tareas diarias pueden ser recurrentes (t.day = día de la semana, se
// repiten cada semana) o puntuales (t.date = fecha exacta ISO, existen una
// sola vez). El detalle de cada día combina ambos tipos: si el día cae en la
// semana actual se ven también las recurrentes (con su estado real); para
// cualquier otro día — pasado o futuro — se ven las tareas puntuales de esa
// fecha exacta, y ahora sí se pueden agregar tareas a cualquier día futuro.
function dayIdxFromDate(d){ var g=d.getDay(); return g===0?6:g-1; }
function isSameWeekAsToday(d){
  var today=new Date(); today.setHours(0,0,0,0);
  var monday=new Date(today); monday.setDate(today.getDate()-todayIdx());
  var sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  return d>=monday && d<=sunday;
}
// ¿Es esta tarea diaria "de hoy"? (recurrente de hoy, o puntual con fecha de hoy)
function isTaskToday(t){
  if(t.period!=='dia') return false;
  if(t.date) return t.date===todayStr();
  return !t.date && t.day===todayIdx();
}
// Día de semana (0-6) que ocupa esta tarea DENTRO DE LA SEMANA ACTUAL —
// para tareas recurrentes es simplemente t.day; para puntuales, solo aplica
// si su fecha cae en la semana en curso (si no, devuelve null).
function taskWeekdayThisWeek(t){
  if(t.period!=='dia') return null;
  if(t.date){
    var dc = new Date(t.date+'T00:00:00');
    if(!isSameWeekAsToday(dc)) return null;
    return dayIdxFromDate(dc);
  }
  return t.day;
}
// ¿Cuántos días atrás quedó esta fecha respecto a hoy? Negativo = futuro.
function daysAgoFromDateKey(dateKey){
  var d = new Date(dateKey+'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}
function toastTicketBlocked(){
  playSound('warn');
  toast('Solo se puede marcar/desmarcar hasta 7 días atrás');
}
function openDayDetail(dateKey){
  var d = new Date(dateKey+'T00:00:00');
  var isToday = dateKey === todayStr();
  var inCurrentWeek = isSameWeekAsToday(d);
  var dLabel = new Date(dateKey+'T12:00:00');
  var dayName = DAYS[dayIdxFromDate(d)];
  var dateLabel = dLabel.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});

  var daysAgo = daysAgoFromDateKey(dateKey);
  var isPastDay = daysAgo > 0;           // día ya pasado → no se pueden agregar tareas nuevas
  var canTicket = daysAgo <= 7;          // hasta 7 días atrás se puede marcar/desmarcar

  var wIdx = dayIdxFromDate(d);
  var recurring = inCurrentWeek ? S.tasks.filter(function(t){return t.period==='dia'&&!t.date&&t.day===wIdx;}) : [];
  var dated = S.tasks.filter(function(t){return t.period==='dia'&&t.date===dateKey;});
  var combined = recurring.concat(dated);

  var body='';
  var hist = (S.dailyHistory||{})[dateKey];
  if(!inCurrentWeek && hist){
    // Pedido: este % ahora coincide con el que decide el umbral — incluye
    // avance parcial de tareas con cantidad/checklist, no solo binario.
    var pct = Math.round((hist.ratio||0)*100);
    body += '<div style="text-align:center;padding:6px 0 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;">'+
      '<div style="font-size:26px;font-weight:800;color:'+(hist.streakReached?'var(--accent)':'var(--muted)')+';">'+hist.completed+'/'+hist.total+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:2px;">tareas recurrentes completadas ese día ('+pct+'%)</div>'+
    '</div>';
  }

  if(combined.length){
    body += combined.map(function(t){
      var dn=isDone(t);
      var checkOnclick = canTicket
        ? "tapTask('"+t.id+"');reopenDayDetail('"+dateKey+"')"
        : "toastTicketBlocked()";
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);">'+
        '<div onclick="'+checkOnclick+'" style="width:19px;height:19px;border-radius:5px;border:1.5px solid '+(dn?'var(--accent)':'var(--muted)')+';background:'+(dn?'var(--accent)':'transparent')+';flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;'+(canTicket?'':'opacity:.5;')+'">'+
          (dn?'<svg width="10" height="8" viewBox="0 0 8 6"><polyline points="1,3 3,5 7,1" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+
        '</div>'+
        '<span onclick="closeDayDetail();openEdit(\''+t.id+'\')" style="flex:1;font-size:13px;color:'+(dn?'var(--muted)':'var(--ink)')+';text-decoration:'+(dn?'line-through':'none')+';cursor:pointer;">'+esc(t.text)+(t.date?'':' <span style="font-size:9px;color:var(--muted-soft);">· recurrente</span>')+'</span>'+
      '</div>';
    }).join('');
  } else if(!hist || inCurrentWeek){
    body += '<div style="font-size:12px;color:var(--muted-soft);text-align:center;padding:18px 0;">Sin tareas para este día.</div>';
  }
  // No se pueden agregar tareas nuevas a días que ya pasaron — solo se puede
  // revisar lo archivado. Para días de hoy en adelante, el botón sigue igual.
  if(isPastDay){
    body += '<div style="text-align:center;padding:12px 0 2px;font-size:11px;color:var(--muted-soft);">Este día ya pasó — solo puedes revisar lo archivado'+(canTicket?', y marcar/desmarcar tareas.':'.')+'</div>';
    // Pedido: aviso de período de gracia — el día de ayer todavía puede
    // completarse hasta el final de HOY sin perder la racha.
    var hEntry = (S.dailyHistory||{})[dateKey];
    var stillGrace = streakActive() && daysAgo===1 && !(hEntry && hEntry.streakReached);
    if(stillGrace){
      body += '<div style="text-align:center;padding:8px 10px;margin-top:8px;background:var(--accent-bg);border-radius:9px;font-size:11px;color:var(--accent);font-weight:600;line-height:1.5;">⏳ Todavía puedes completar las tareas de este día antes de que termine hoy y mantener tu racha.</div>';
    }
  } else {
    body += '<button onclick="closeDayDetail();openNewDatedTask(\''+dateKey+'\')" style="width:100%;margin-top:12px;padding:10px;border:1.5px dashed var(--line);border-radius:9px;background:transparent;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;">+ Agregar tarea a este día</button>';
  }

  var box=document.createElement('div');box.className='conf-box';box.id='day-detail-box';
  box.innerHTML = '<div class="conf-inner" style="max-height:78vh;overflow-y:auto;">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'+
      '<div class="serif" style="font-weight:700;font-size:17px;color:var(--ink);">'+dayName+(isToday?' · <span style="color:var(--accent)">Hoy</span>':'')+'</div>'+
      '<button onclick="closeDayDetail()" style="background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;">×</button>'+
    '</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:16px;text-transform:capitalize;">'+dateLabel+'</div>'+
    body+
  '</div>';
  document.body.appendChild(box);
}
function closeDayDetail(){ var b=document.getElementById('day-detail-box'); if(b) b.remove(); }
function reopenDayDetail(dateKey){ render(); var old=document.getElementById('day-detail-box'); if(old) old.remove(); openDayDetail(dateKey); }

function calNav(delta){
  var current = S.calendarOffset || 0;
  var next = current + delta;
  // Permite navegar hacia el futuro (para revisar/preparar semanas próximas),
  // con un tope razonable de 6 meses para no perderse en el calendario.
  if(next > 6) next = 6;
  if(next < -24) next = -24;
  S.calendarOffset = next;
  render();
}

// ── Estadísticas ───────────────────────────────────────────────────────────
function renderStats(){
  var hist = S.dailyHistory || {};
  var keys = Object.keys(hist);
  var thisWeek = 0, thisMonth = 0, totalDone = 0, daysLogged = 0;
  var today = new Date();
  var weekStart = addDaysLocal(today, -7);
  var monthStart = addDaysLocal(today, -30);
  
  keys.forEach(function(k){
    var d = parseLocalDate(k);
    var data = hist[k];
    if(!data)return;
    daysLogged++;
    totalDone += data.completed || 0;
    if(d >= weekStart) thisWeek += data.completed || 0;
    if(d >= monthStart) thisMonth += data.completed || 0;
  });
  
  // Mini gráfico XP histórico (últimos 14 días)
  var xpHist = S.xpHistory || {};
  var xpDays = [];
  var lastXp = 0;
  for(var i=13;i>=0;i--){
    var d = addDaysLocal(today, -i);
    var key = localDateStr(d);
    if(xpHist[key]!==undefined){
      lastXp = xpHist[key];
    }
    xpDays.push(lastXp);
  }
  var maxXp = Math.max.apply(null, xpDays.concat([1]));
  var minXp = Math.min.apply(null, xpDays);
  var range = Math.max(maxXp - minXp, 1);
  
  var chart = '<svg width="100%" height="60" viewBox="0 0 280 60" preserveAspectRatio="none" style="display:block;margin-top:8px;">';
  // Línea
  var pts = xpDays.map(function(xp,i){
    var x = (i/(xpDays.length-1))*280;
    var y = 50 - ((xp-minXp)/range)*40;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  chart += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts+'"/>';
  // Puntos
  xpDays.forEach(function(xp,i){
    var x = (i/(xpDays.length-1))*280;
    var y = 50 - ((xp-minXp)/range)*40;
    chart += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2" fill="var(--accent)"/>';
  });
  chart += '</svg>';
  
  return '<div class="card">'+
    '<div style="font-weight:700;font-size:15px;color:var(--ink);margin-bottom:14px;">📊 Estadísticas</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+thisMonth+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Este mes</div>'+
      '</div>'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px;text-align:center;">'+
        '<div style="font-size:20px;font-weight:800;color:var(--accent);">'+daysLogged+'</div>'+
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Días con actividad</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function getAchievementName(days){
  if(days===30)return{emoji:'🌱',title:'Mes constante'};
  if(days===120)return{emoji:'🌳',title:'4 meses de tenacidad'};
  if(days===365)return{emoji:'☀️',title:'¡Un año entero!'};
  if(days>365 && days%365===0)return{emoji:'⭐',title:(days/365)+' años seguidos'};
  return{emoji:'🔥',title:days+' días'};
}
function openStreakCfg(){

  box.innerHTML =
    '<div class="conf-inner">'+

function isVacacionesActive(){

function vacacionesCanActivate(){
  // Donante: sin cooldown
  if(isPremium())return{ok:true};
  var vc=S.vacaciones;

  var since=new Date(vc.activeSince);

}

function toggleCustomMode(id){
  if(S.activeMode&&S.activeMode.type==='custom'&&S.activeMode.id===id){
    // Desactivar: restaurar backup si hay
    if(S.modeTaskBackup){
      S.tasks = S.modeTaskBackup;
      S.modeTaskBackup = null;
    }
    S.activeMode=null;S.showHidden=false;
    saveState();render();
    toast('Modo desactivado');
  } else {
    var mode = S.modes.find(function(m){return m.id===id;});
    if(!mode) return;
    S.activeMode={type:'custom',id:id};
    // Si tiene plantilla asociada, aplicarla
    if(mode.templateId){
      var tpl = (S.templates||[]).find(function(t){return t.id===mode.templateId;});
      if(tpl){
        // Backup tareas actuales
        S.modeTaskBackup = JSON.parse(JSON.stringify(S.tasks));
        // Reemplazar tareas recurrentes del día con las de la plantilla —
        // conservamos las tareas puntuales (con fecha específica) tal cual.
        var nonDay = S.tasks.filter(function(t){return t.period!=='dia' || t.date;});
        var newDayTasks = (tpl.tasks||[]).map(function(t){
          return Object.assign({},t,{
            id:uid(),done:false,prog:0,date:null,
            day: t.day===undefined?0:t.day,
            checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
          });
        });
        S.tasks = nonDay.concat(newDayTasks);
        toast('✓ Modo activado con plantilla "'+tpl.name+'"');
      } else {
        toast('Modo activado');
      }
    } else {
      toast('Modo activado');
    }
    saveState();render();
  }
}

// ── Sistema de Plantillas (entidades propias) ─────────────────────────────
var TPL = {templateId:null, name:'', tasks:[], currentDay:0};

function newTemplate(){
  // Verificar límite de plantillas (free)
  if(!isPremium() && (S.templates||[]).length >= FREE_LIMITS.templates){
    showInfoModal('Límite alcanzado','En el plan gratuito puedes crear hasta '+FREE_LIMITS.templates+' plantillas.','Entendido');
    return;
  }
  TPL = {
    templateId: 'tpl-'+uid(),
    name: 'Plantilla '+((S.templates||[]).length + 1),
    tasks: [],
    currentDay: todayIdx(),
    isNew: true
  };
  showTemplateModal();
}

function editTemplate(id){
  var tpl = (S.templates||[]).find(function(t){return t.id===id;});
  if(!tpl) return;
  TPL = {
    templateId: tpl.id,
    name: tpl.name,
    tasks: JSON.parse(JSON.stringify(tpl.tasks||[])),
    currentDay: todayIdx(),
    isNew: false
  };
  showTemplateModal();
}

function deleteTemplate(id){
  // Confirmación sin confirm() nativo
  var tplId = id;
  var box = document.createElement('div'); box.className='conf-box';
  box.innerHTML='<div class="conf-inner"><div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">Eliminar plantilla</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">¿Eliminar esta plantilla? No se puede deshacer.</div>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="sbtn" style="background:var(--bad);" onclick="_deleteTemplateConfirmed(\''+tplId+'\');this.closest(\'.conf-box\').remove();">Eliminar</button>'+
      '<button class="cbtn" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
}
// Separado de deleteTemplate() para que la limpieza de referencias (antes
// código muerto tras un "return" temprano) sí se ejecute: sin esto, una
// plantilla eliminada podía quedar "fantasma" asignada en la programación
// de semanas futuras o como plantilla activa de la semana en curso.
function _deleteTemplateConfirmed(id){
  S.templates = (S.templates||[]).filter(function(t){return t.id!==id;});
  // Limpiar de la programación de semanas futuras
  if(S.weekSchedule){
    Object.keys(S.weekSchedule).forEach(function(k){
      if(S.weekSchedule[k]===id) delete S.weekSchedule[k];
    });
  }
  if(S.activeTemplate===id) S.activeTemplate=null;
  saveState();render();
}

function showTemplateModal(){
  removeOverlay('tpl-modal');
  var overlay=document.createElement('div');overlay.className='overlay';overlay.id='tpl-modal';
  overlay.addEventListener('click',function(e){if(e.target===overlay)removeOverlay('tpl-modal');});
  
  var dayTabs = DAYS.map(function(name,i){
    var count = TPL.tasks.filter(function(t){return t.day===i;}).length;
    var active = i===TPL.currentDay;
    return '<button id="tpl-day-btn-'+i+'" onclick="tplSetDay('+i+')" style="flex:1;padding:8px 4px;border:none;border-radius:8px;background:'+(active?'var(--accent)':'transparent')+';color:'+(active?'white':'var(--muted)')+';font-size:11px;font-weight:600;font-family:Inter,sans-serif;cursor:pointer;">'+name.slice(0,3)+(count?'<span style="display:block;font-size:9px;opacity:.8;">'+count+'</span>':'')+'</button>';
  }).join('');
  
  overlay.innerHTML='<div class="sheet">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'+
      '<span class="serif" style="font-weight:700;font-size:20px;">'+(TPL.isNew?'Nueva plantilla':'Editar plantilla')+'</span>'+
      '<button onclick="removeOverlay(\'tpl-modal\')" style="background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;">×</button>'+
    '</div>'+
    '<label class="flbl">Nombre</label>'+
    '<input id="tpl-name" class="finp" value="'+esc(TPL.name)+'" placeholder="Ej: Semana de trabajo, Modo intenso, etc."/>'+
    '<div style="font-size:12px;color:var(--muted);margin:8px 0 14px;line-height:1.5;">Configura tareas para cada día. Después puedes aplicarla desde Plantillas.</div>'+
    '<div style="display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:14px;">'+dayTabs+'</div>'+
    '<div id="tpl-list">'+tplItemsHTML()+'</div>'+
    '<button id="tpl-add-btn" onclick="tplAddTask()" style="background:none;border:1.5px dashed var(--line);border-radius:8px;width:100%;padding:9px;color:var(--muted);font-size:13px;margin:10px 0 8px;">+ Agregar tarea para '+DAYS[TPL.currentDay]+'</button>'+
    '<button id="tpl-copy-btn" onclick="tplCopyToAllDays()" style="background:none;border:none;width:100%;padding:6px;color:var(--accent);font-size:11px;margin-bottom:16px;cursor:pointer;font-family:Inter,sans-serif;">Copiar tareas de '+DAYS[TPL.currentDay]+' a todos los días</button>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="sbtn" onclick="tplSave()">Guardar plantilla</button>'+
      '<button class="cbtn" onclick="removeOverlay(\'tpl-modal\')">Cancelar</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
}

function tplSetDay(d){
  TPL.currentDay = d;
  // Actualizar solo las partes que cambian sin re-crear el modal entero (evita scroll reset)
  var overlay = document.getElementById('tpl-modal');
  if(!overlay){ showTemplateModal(); return; }
  
  // Actualizar tabs
  DAYS.forEach(function(name,i){
    var count = TPL.tasks.filter(function(t){return t.day===i;}).length;
    var btn = document.getElementById('tpl-day-btn-'+i);
    if(btn){
      btn.style.background = i===d ? 'var(--accent)' : 'transparent';
      btn.style.color = i===d ? 'white' : 'var(--muted)';
      btn.innerHTML = name.slice(0,3)+(count?'<span style="display:block;font-size:9px;opacity:.8;">'+count+'</span>':'');
    }
  });
  
  // Actualizar lista de tareas y botón de agregar
  var area = document.getElementById('tpl-list');
  if(area) area.innerHTML = tplItemsHTML();
  var addBtn = document.getElementById('tpl-add-btn');
  if(addBtn) addBtn.textContent = '+ Agregar tarea para '+DAYS[d];
  var copyBtn = document.getElementById('tpl-copy-btn');
  if(copyBtn) copyBtn.textContent = 'Copiar tareas de '+DAYS[d]+' a todos los días';
}
function tplItemsHTML(){
  var dayTasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  if(!dayTasks.length)return '<div class="empty" style="padding:14px 0;font-size:13px;">Sin tareas para '+DAYS[TPL.currentDay]+'.</div>';
  return dayTasks.map(function(t){
    var i = TPL.tasks.indexOf(t);
    var hasQty = (t.qty||1)>1;
    return '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;">'+
      '<div style="display:flex;gap:6px;align-items:center;">'+
        (t.crucial?'<span style="color:var(--accent);font-size:13px;flex-shrink:0;">★</span>':'')+
        '<input value="'+esc(t.text)+'" oninput="tplUpdateText('+i+',this.value)" placeholder="Nombre de la tarea" style="flex:1;border:none;border-bottom:1px solid var(--line);outline:none;font-size:14px;background:transparent;padding:4px 0;font-family:Inter,sans-serif;color:var(--ink);"/>'+
        '<button onclick="tplToggleCrucial('+i+')" title="Crucial" style="background:none;border:none;color:'+(t.crucial?'var(--accent)':'var(--muted-soft)')+';font-size:14px;cursor:pointer;padding:0 4px;">★</button>'+
        '<button onclick="tplRemoveTask('+i+')" style="background:none;border:none;color:var(--muted-soft);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;">×</button>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;color:var(--muted);">'+
        '<span style="cursor:pointer;" onclick="tplToggleQty('+i+')">'+(hasQty?'✓ Cantidad: '+t.qty:'+ Cantidad')+'</span>'+
        (hasQty?'<button class="qb" style="width:24px;height:24px;font-size:14px;" onclick="tplQty('+i+',-1)">−</button><button class="qb" style="width:24px;height:24px;font-size:14px;" onclick="tplQty('+i+',1)">+</button>':'')+
      '</div>'+
    '</div>';
  }).join('');
}
function tplUpdateText(i,v){TPL.tasks[i].text=v;}
function tplToggleCrucial(i){TPL.tasks[i].crucial=!TPL.tasks[i].crucial;tplRerender();}
function tplAddTask(){TPL.tasks.push({text:'',qty:1,prog:0,crucial:false,checklist:[],links:{},day:TPL.currentDay});tplRerender();}
function tplRemoveTask(i){TPL.tasks.splice(i,1);tplRerender();}
function tplToggleQty(i){if((TPL.tasks[i].qty||1)>1){TPL.tasks[i].qty=1;}else{TPL.tasks[i].qty=3;}tplRerender();}
function tplQty(i,d){TPL.tasks[i].qty=Math.max(2,(TPL.tasks[i].qty||2)+d);tplRerender();}
function tplCopyToAllDays(){
  var dayTasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  if(!dayTasks.length){toast('No hay tareas para copiar');return;}
  TPL.tasks = TPL.tasks.filter(function(t){return t.day===TPL.currentDay;});
  for(var d=0;d<7;d++){
    if(d===TPL.currentDay)continue;
    dayTasks.forEach(function(t){TPL.tasks.push(Object.assign({},t,{day:d}));});
  }
  showTemplateModal();
  toast('✓ Copiado a todos los días');
}
function tplRerender(){
  var area=document.getElementById('tpl-list');if(!area)return;
  area.innerHTML=tplItemsHTML();
}
function tplSave(){
  var nameInp = document.getElementById('tpl-name');
  var name = nameInp ? nameInp.value.trim() : TPL.name;
  if(!name){toast('Ponele un nombre a la plantilla');return;}
  var clean = TPL.tasks.filter(function(t){return t.text&&t.text.trim();}).map(function(t){
    return {
      text:t.text.trim(),
      qty:t.qty||1,
      prog:0,
      crucial:!!t.crucial,
      checklist:t.checklist||[],
      links:t.links||{},
      done:false,
      period:'dia',
      day:t.day===undefined?0:t.day
    };
  });
  
  if(!S.templates) S.templates = [];
  var existing = S.templates.find(function(t){return t.id===TPL.templateId;});
  if(existing){
    existing.name = name;
    existing.tasks = clean;
  } else {
    S.templates.push({
      id: TPL.templateId,
      name: name,
      tasks: clean,
      created: new Date().toISOString()
    });
  }
  removeOverlay('tpl-modal');
  saveState();
  checkMedals();
  render();
  toast('✓ Plantilla guardada');
}

// ── Pestaña Plantillas ─────────────────────────────────────────────────────
function renderTemplates(){
  var html='<div style="margin-bottom:16px;">'+
    '<div style="font-size:12px;color:var(--muted);line-height:1.5;">Guarda una semana tipo y aplícala cuando quieras.</div>'+

  html+='<div class="card" style="border-color:'+(activeTpl?'var(--accent)':'var(--line)')+';background:'+(activeTpl?'var(--accent-bg)':'var(--paper)')+';">'+

      ? '<div style="font-weight:700;font-size:16px;color:var(--ink);">'+esc(activeTpl.name)+'</div><div style="font-size:11px;color:var(--muted);margin-top:2px;">Aplicada a la semana en curso</div>'+
        '<button onclick="clearActiveTemplate()" style="margin-top:10px;width:100%;background:var(--line);border:none;border-radius:8px;padding:8px;font-size:12px;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;">Quitar plantilla</button>'
      : '<div style="font-size:13px;color:var(--ink-soft);">Sin plantilla aplicada esta semana.</div>'
    )+
  '</div>';
  
  // Lista de plantillas
  var list = S.templates || [];
  if(list.length){
    html+='<div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;">Tus plantillas ('+list.length+(isPremium()?'':'/'+FREE_LIMITS.templates)+')</div>';
    list.forEach(function(t){

            '<button onclick="deleteTemplate(\''+t.id+'\')" style="background:none;border:1.5px solid var(--line);border-radius:7px;padding:4px 10px;font-size:11px;color:var(--bad);">×</button>'+

      '</div>';
    });
  } else {
    html+='<div style="text-align:center;padding:32px 16px;">'+
      '<div style="font-size:36px;margin-bottom:10px;opacity:.5;">📋</div>'+

  if(!isPremium() && list.length >= FREE_LIMITS.templates){

function renderWeekSchedule(){
  if(!(S.templates||[]).length) return '';
  var html='<div class="card" style="margin-top:18px;">'+
    '<div style="font-weight:700;font-size:15px;color:var(--ink);margin-bottom:6px;">📅 Programar semanas</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-bottom:14px;">Asigna una plantilla a las próximas semanas. Se aplicará automáticamente.</div>';
  
  for(var i=1;i<=4;i++){
    var weekKey = nextWeekKey(i);
    var assignedId = S.weekSchedule[weekKey];
    var assigned = assignedId ? S.templates.find(function(t){return t.id===assignedId;}) : null;
    var weekDate = new Date();
    weekDate.setDate(weekDate.getDate() + i*7);
    var dow = weekDate.getDay(); if(dow===0) dow=7;
    var monday = new Date(weekDate.getTime() - (dow-1)*86400000);
    var label = i===1 ? 'Próxima semana' : i===2 ? 'En 2 semanas' : i===3 ? 'En 3 semanas' : 'En 4 semanas';
    var dateLabel = monday.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;background:var(--bg);border-radius:10px;">'+
      '<div style="flex:1;">'+
        '<div style="font-size:13px;font-weight:600;color:var(--ink);">'+label+'</div>'+
        '<div style="font-size:10px;color:var(--muted);">desde '+dateLabel+'</div>'+
      '</div>'+
      '<select onchange="setWeekTemplate(\''+weekKey+'\',this.value)" style="background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;font-family:Inter,sans-serif;color:var(--ink);">'+
        '<option value="">Sin plantilla</option>'+
        S.templates.map(function(t){return '<option value="'+t.id+'"'+(assignedId===t.id?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+
      '</select>'+
    '</div>';
  }
  
  html+='</div>';
  return html;
}

function setWeekTemplate(weekKey, tplId){
  if(!S.weekSchedule) S.weekSchedule = {};
  if(tplId) S.weekSchedule[weekKey] = tplId;
  else delete S.weekSchedule[weekKey];
  saveState();
  toast(tplId?'✓ Plantilla programada':'Programación quitada');
}

function applyTemplateNow(tplId){
  var tpl = (S.templates||[]).find(function(t){return t.id===tplId;});
  if(!tpl) return;
  var box=document.createElement('div');box.className='conf-box';
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">Aplicar "'+esc(tpl.name)+'"</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;">Tus tareas diarias actuales se reemplazarán con las de la plantilla. Las tareas semanales/mensuales/etc. se mantienen.</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<button class="sbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove();_applyTemplate(\''+tplId+'\');">Aplicar</button>'+
      '<button class="cbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove();">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
}

function _applyTemplate(tplId){
  var tpl = (S.templates||[]).find(function(t){return t.id===tplId;});
  if(!tpl) return;
  // Backup tareas actuales
  S.taskBackup = {timestamp:new Date().toISOString(), tasks:JSON.parse(JSON.stringify(S.tasks))};
  // Reemplazar tareas recurrentes del día — las tareas puntuales (con fecha
  // específica) no forman parte de ninguna plantilla y se conservan.
  var nonDay = S.tasks.filter(function(t){return t.period!=='dia' || t.date;});
  var newDayTasks = (tpl.tasks||[]).map(function(t){
    return Object.assign({},t,{
      id:uid(),
      done:false,prog:0,date:null,
      day: t.day===undefined?0:t.day,
      checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
    });
  });
  S.tasks = nonDay.concat(newDayTasks);
  S.activeTemplate = tplId;
  S.weekSchedule[getWeekKey()] = tplId;
  saveState();render();
  toast('✓ Plantilla aplicada');
}

function clearActiveTemplate(){
  if(S.taskBackup){
    var box2 = document.createElement('div'); box2.className='conf-box';
    box2.innerHTML='<div class="conf-inner"><div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">Restaurar tareas</div>'+
      '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">¿Restaurar las tareas guardadas antes de activar el modo?</div>'+
      '<div style="display:flex;gap:8px;">'+
        '<button class="sbtn" onclick="(function(){if(S.taskBackup&&S.taskBackup.tasks)S.tasks=S.taskBackup.tasks;S.taskBackup=null;S.activeTemplate=null;saveState();render();document.querySelector(\'.conf-box\').remove();})()">Restaurar</button>'+
        '<button class="cbtn" onclick="(function(){S.taskBackup=null;S.activeTemplate=null;delete S.weekSchedule[getWeekKey()];saveState();render();document.querySelector(\'.conf-box\').remove();})()">No restaurar</button>'+
      '</div></div>';
    document.body.appendChild(box2);
    return;
  }

function tapTask(id){
  var t=S.tasks.find(function(t){return t.id===id;});if(!t)return;
  if(t.checklist&&t.checklist.length){expCL(id);return;}
  var wasDone=isDone(t),updated;
  var oldProg = t.prog||0;
  if((t.qty||1)>1){
    var next=(t.prog||0)>=t.qty?0:(t.prog||0)+1;
    updated=Object.assign({},t,{prog:next,done:next>=t.qty});
  }else{
    // BUGFIX: antes esta rama no guardaba "prog" (quedaba en lo que tuviera
    // antes, normalmente 0), así que al DESMARCAR una tarea simple, oldProg
    // y newProg terminaban valiendo lo mismo (0) y el delta salía 0 en vez
    // de -1 — el vínculo hacia una tarea/ítem superior nunca se retractaba
    // al desmarcar. Ahora "prog" queda sincronizado con "done" (0 o 1)
    // también en tareas simples, para que el delta sea siempre correcto.
    var newDone = !t.done;
    updated=Object.assign({},t,{done:newDone, prog:newDone?1:0});
  }
  // Calcular cuánto avanzó (delta)
  var newProg = updated.prog || (updated.done?1:0);
  var delta = newProg - oldProg;
  var justCompleted = !wasDone && isDone(updated);
  var justUncompleted = wasDone && !isDone(updated);
  // Pedido: una tarea SIN checklist propio también puede ser el "hijo" de un
  // vínculo (t.clLinkUp) — se marca/avanza como cualquier tarea normal, y
  // ese avance empuja hacia el ítem de checklist al que está vinculada.
  // Se le pasa a propagateCLLink() como si fuera un "ítem" con .linkUp
  // porque es justo el único campo que esa función necesita leer. Se pasan
  // los dos deltas (1 a 1 y "al completar") — cada vínculo usa el que
  // corresponda según su propio modo elegido al vincular.
  if(hasLinks(t.clLinkUp)) propagateCLLink({linkUp:t.clLinkUp}, delta, justCompleted?1:(justUncompleted?-1:0));
  finishUpdate(updated, justCompleted, delta);
}
// Pedido: poder escribir el avance de una tarea con cantidad directo, en
// vez de tener que tocar el círculo repetidas veces hasta llegar a la meta.
function setTaskProg(id, val){
  var t=S.tasks.find(function(t){return t.id===id;});if(!t)return;
  if((t.qty||1)<=1) return; // esto solo aplica a tareas con "Cantidad"
  var wasDone=isDone(t);
  var oldProg = t.prog||0;
  var newProg = Math.max(0, Math.min(parseInt(val,10)||0, t.qty));
  if(newProg===oldProg) return;
  var updated=Object.assign({},t,{prog:newProg,done:newProg>=t.qty});
  var delta = newProg - oldProg;
  var justCompletedQ = !wasDone && isDone(updated);
  var justUncompletedQ = wasDone && !isDone(updated);
  if(hasLinks(t.clLinkUp)) propagateCLLink({linkUp:t.clLinkUp}, delta, justCompletedQ?1:(justUncompletedQ?-1:0));
  finishUpdate(updated, justCompletedQ, delta);
}
function tapCL(taskId,itemId){
  var t=S.tasks.find(function(t){return t.id===taskId;});if(!t)return;
  var wasDone=isDone(t);
  var oldDone = t.checklist.filter(function(i){return i.done;}).length;
  var toggledItem=null;
  var newCL=t.checklist.map(function(i){
    if(i.id!==itemId) return i;
    toggledItem=Object.assign({},i,{done:!i.done});
    return toggledItem;
  });
  var newDone = newCL.filter(function(i){return i.done;}).length;
  var updated=Object.assign({},t,{checklist:newCL,done:newCL.every(function(i){return i.done;})});
  var delta = newDone - oldDone;
  var justCompleted = !wasDone && isDone(updated);
  var justUncompleted = wasDone && !isDone(updated);
  if(!justCompleted) playSound('tick'); // ítem suelto: sonido discreto (el 'complete' llega solo si cierra toda la tarea)
  // Si este ítem está vinculado a un ítem de una tarea de período más
  // amplio, empujar el cambio hacia arriba (un check simple es atómico:
  // el delta "1 a 1" y el de "al completar" coinciden siempre) antes de
  // guardar/renderizar, para que quede todo en un solo paso.
  if(toggledItem) propagateCLLink(toggledItem, toggledItem.done?1:-1, toggledItem.done?1:-1);
  // Pedido: aunque esta tarea tenga checklist propio, TAMBIÉN puede estar
  // vinculada como tarea completa (t.clLinkUp) — cada ítem que se completa
  // acá cuenta como 1 unidad hacia ese destino (o 1 al llegar al 100%, si
  // el vínculo usa el modo "completar").
  if(hasLinks(t.clLinkUp)) propagateCLLink({linkUp:t.clLinkUp}, delta, justCompleted?1:(justUncompleted?-1:0));
  finishUpdate(updated, justCompleted, delta);
}
// Sumar/restar de a 1 unidad en un ítem de checklist con cantidad, desde la
// vista rápida del día a día (sin tener que abrir el editor de la tarea).
function stepCL(taskId,itemId,stepDelta){
  var t=S.tasks.find(function(t){return t.id===taskId;});if(!t)return;
  var wasDone=isDone(t);
  var oldDoneCount=t.checklist.filter(function(i){return i.done;}).length;
  var oldItem=t.checklist.find(function(i){return i.id===itemId;});
  var targetItem=null;
  var newCL=t.checklist.map(function(i){
    if(i.id!==itemId) return i;
    var q=clItemQty(i);
    var newProg=Math.max(0, Math.min((i.prog||0)+stepDelta, q));
    targetItem=Object.assign({},i,{prog:newProg,done:newProg>=q});
    return targetItem;
  });
  if(!targetItem) return;
  var newDoneCount=newCL.filter(function(i){return i.done;}).length;
  var updated=Object.assign({},t,{checklist:newCL,done:newCL.every(function(i){return i.done;})});
  var taskLevelDelta = newDoneCount - oldDoneCount;
  var justCompleted = !wasDone && isDone(updated);
  var justUncompleted = wasDone && !isDone(updated);
  if(!justCompleted) playSound('tick');
  var itemJustCompleted = oldItem && !oldItem.done && targetItem.done;
  var itemJustUncompleted = oldItem && oldItem.done && !targetItem.done;
  propagateCLLink(targetItem, stepDelta, itemJustCompleted?1:(itemJustUncompleted?-1:0));
  // Vínculo de tarea completa (clLinkUp), aunque esta tarea tenga checklist.
  if(hasLinks(t.clLinkUp)) propagateCLLink({linkUp:t.clLinkUp}, taskLevelDelta, justCompleted?1:(justUncompleted?-1:0));
  finishUpdate(updated, justCompleted, taskLevelDelta);
}
// Pedido: poder escribir el número de avance directo en la lista del día a
// día (no solo con −/+) — útil cuando la meta es un número grande.
function setCLProg(taskId,itemId,val){
  var t=S.tasks.find(function(t){return t.id===taskId;});if(!t)return;
  var wasDone=isDone(t);
  var oldDoneCount=t.checklist.filter(function(i){return i.done;}).length;
  var oldItem=t.checklist.find(function(i){return i.id===itemId;});
  var targetItem=null, delta=0;
  var newCL=t.checklist.map(function(i){
    if(i.id!==itemId) return i;
    var q=clItemQty(i);
    var newProg=Math.max(0, Math.min(parseInt(val,10)||0, q));
    delta = newProg - (i.prog||0);
    targetItem=Object.assign({},i,{prog:newProg,done:newProg>=q});
    return targetItem;
  });
  if(!targetItem || !delta) return;
  var newDoneCount=newCL.filter(function(i){return i.done;}).length;
  var updated=Object.assign({},t,{checklist:newCL,done:newCL.every(function(i){return i.done;})});
  var taskLevelDelta = newDoneCount - oldDoneCount;
  var justCompleted = !wasDone && isDone(updated);
  var justUncompleted = wasDone && !isDone(updated);
  if(!justCompleted) playSound('tick');
  var itemJustCompleted = oldItem && !oldItem.done && targetItem.done;
  var itemJustUncompleted = oldItem && oldItem.done && !targetItem.done;
  propagateCLLink(targetItem, delta, itemJustCompleted?1:(itemJustUncompleted?-1:0));
  if(hasLinks(t.clLinkUp)) propagateCLLink({linkUp:t.clLinkUp}, taskLevelDelta, justCompleted?1:(justUncompleted?-1:0));
  finishUpdate(updated, justCompleted, taskLevelDelta);
}
function expCL(id){
  var cl=document.getElementById('cl-'+id),exp=document.getElementById('exp-'+id);if(!cl)return;
  var open=cl.style.display==='none'||cl.style.display==='';
  cl.style.display=open?'block':'none';
  if(exp)exp.style.transform=open?'rotate(180deg)':'none';
  // BUGFIX: antes este estado solo vivía en el DOM — como cada tilde de un
  // ítem dispara un render() completo (reconstruye todo el HTML de la
  // pestaña), el checklist recién abierto se volvía a colapsar solo en
  // cada toque, sintiéndose como un "refresh" no pedido. Ahora queda
  // guardado acá y taskHTML() lo respeta al reconstruir.
  if(!S._clOpen) S._clOpen={};
  S._clOpen[id]=open;
}
function finishUpdate(updated, justCompleted, delta){
  S.tasks=S.tasks.map(function(t){return t.id===updated.id?updated:t;});
  S._justCompletedId = justCompleted ? updated.id : null;
  saveState();
  render();
  S._justCompletedId = null; // limpiar para que el pop no se repita en próximos renders
  if(justCompleted){
    playSound('complete');
    vibrate(30);
    if(!S.rewardedTaskIds[updated.id]){
      S.rewardedTaskIds[updated.id]=true;
      addXP(PT[updated.period]||1);
      saveState();
    }
  }
  // Propagar según el modo de vinculación
  propagate(updated, justCompleted, delta||0);
  if(justCompleted) checkStreakNow();
}
// Propaga a las tareas vinculadas según el linkMode:
//   'unit' (default): cada unidad de la hija suma 1 unidad al padre
//   'completion': solo al completar 100% la hija suma 1 unidad al padre
function propagate(t, justCompleted, delta){
  var links=t.links||{};
  var linkMode = t.linkMode || 'unit';
  Object.keys(links).forEach(function(period){
    var tid=links[period];if(!tid||tid===true)return;
    var parent=S.tasks.find(function(p){return p.id===tid;});if(!parent)return;
    var wasDone=isDone(parent);
    var addAmount = 0;
    if(linkMode === 'unit'){
      // Cada unidad de la hija = 1 al padre. Usar delta.
      addAmount = delta || 0;
    } else if(linkMode === 'completion'){
      // Solo al completar la hija al 100% suma 1
      if(justCompleted) addAmount = 1;
    }
    if(addAmount === 0) return;
    var newProg = Math.max(0, Math.min((parent.prog||0)+addAmount, parent.qty||1));
    var nowDone = newProg >= (parent.qty||1);
    var updParent = Object.assign({},parent,{prog:newProg, done:nowDone});
    S.tasks = S.tasks.map(function(tt){return tt.id===tid?updParent:tt;});
    var parentJustCompleted = !wasDone && nowDone;
    if(parentJustCompleted){
      if(!S.rewardedTaskIds[tid]){
        S.rewardedTaskIds[tid]=true;
        addXP(PT[parent.period]||1);
        saveState();
      }
    }
    // Propagar recursivamente (con su delta también)
    propagate(updParent, parentJustCompleted, addAmount);
  });
}
function delTask(id){S.tasks=S.tasks.filter(function(t){return t.id!==id;});saveState();render();playSound('delete');vibrate(20);}
// ¿Esta tarea recibe avance de otras vía el sistema de "vincular tarea"

  });

// ── Reset logic: only allowed Sat/Sun, once per weekend ────────────────────
function isWeekend(){
  // Ilimitado: cualquier día es válido para reiniciar
  if(isIlimitado()) return true;
  var d=new Date().getDay();
  return d===0||d===6;
}

// Tracks if reset has been used this weekend (key = fecha local del sábado)
function getCurrentWeekendKey(){
  var d=new Date();
  var dow=d.getDay();
  if(dow===6)return localDateStr(d);
  if(dow===0){
    var sat=addDaysLocal(d,-1);
    return localDateStr(sat);
  }
  return null;
}

function resetUsedThisWeekend(){
  // Ilimitado: no hay restricción de "una vez por fin de semana"
  if(isIlimitado()) return false;
  var key=getCurrentWeekendKey();
  if(!key)return false;
  return localStorage.getItem('og6-reset-used')===key;
}
function markResetUsed(){
  var key=getCurrentWeekendKey();
  if(key)localStorage.setItem('og6-reset-used',key);
}

function confirmReset(){
  // Disabled if not weekend or already used
  if(!isWeekend()||resetUsedThisWeekend()){
    showInfoModal(TEXTS.resetDisabledTitle,TEXTS.resetDisabledBody,TEXTS.resetButton.split(' ')[0]);
    return;
  }
  var box=document.createElement('div');box.className='conf-box';
  box.innerHTML='<div class="conf-inner">'+
    '<div class="serif" style="font-weight:700;font-size:18px;margin-bottom:8px;color:var(--ink);">'+TEXTS.resetConfirmTitle+'</div>'+
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5;">'+TEXTS.resetConfirmBody+'</div>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="sbtn" style="font-size:13px;background:var(--bad);" onclick="doReset();this.closest(\'.conf-box\').remove()">Reiniciar</button>'+
      '<button class="cbtn" style="font-size:13px;" onclick="this.closest(\'.conf-box\').remove()">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(box);
}
function doReset(){
  // Reinicio de semana: solo tareas de tipo 'dia' y 'semana'
  S.tasks = S.tasks.map(function(t){
    if(t.period === 'dia' || t.period === 'semana'){
      return Object.assign({},t,{done:false,prog:0,checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false});})});
    }
    return t;
  });
  // Limpiar anti-farming para tareas reseteadas
  S.tasks.filter(function(t){return t.period==='dia'||t.period==='semana';}).forEach(function(t){
    if(S.rewardedTaskIds) delete S.rewardedTaskIds[t.id];
  });
  S.taskBlocks = {};
  S.resetUsedCount = (S.resetUsedCount||0) + 1;
  markResetUsed();
  saveState();
  checkMedals();
  render();
  toast('✓ Tareas de la semana reiniciadas');
}

// ── Auto reset on Monday 4 AM ──────────────────────────────────────────────
function checkAutoReset(){
  var now=new Date();
  var dow=now.getDay(); // Mon=1
  var hour=now.getHours();
  // BUGFIX: antes esta clave salía de now.toISOString() (UTC), mientras que
  // dow/hour de arriba son locales. En Chile eso hacía que, de noche, esta
  // función pensara que ya era "otro día" (uno que no coincidía con
  // S.lastAutoReset) y disparara el reinicio semanal completo fuera de
  // hora — desmarcando tareas que el usuario ya había completado ese
  // mismo día. Ahora todoKey usa la misma fecha LOCAL que dow y hour.
  var todayKey=localDateStr(now);
  if(dow===1&&hour>=4&&S.lastAutoReset!==todayKey){
    // Auto reset — solo tareas recurrentes (sin fecha específica). Las tareas
    // puntuales (t.date) son de un solo día y no se desmarcan ni se tocan
    // en el reinicio semanal.
    S.tasks=S.tasks.map(function(t){
      if(t.period==='dia' && t.date) return t;
      return Object.assign({},t,{done:false,prog:0,checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false});})});
    });
    S.rewardedTaskIds={};
    S.taskBlocks={};
    S.lastAutoReset=todayKey;
    
    // Aplicar plantilla programada para esta semana, si hay
    var thisWeek = getWeekKey();
    var scheduledTplId = S.weekSchedule ? S.weekSchedule[thisWeek] : null;
    if(scheduledTplId){
      var tpl = (S.templates||[]).find(function(t){return t.id===scheduledTplId;});
      if(tpl){
        // Reemplazar tareas recurrentes del día con las de la plantilla —
        // las tareas puntuales (con fecha) se conservan intactas.
        var nonDay = S.tasks.filter(function(t){return t.period!=='dia' || t.date;});
        var newDayTasks = (tpl.tasks||[]).map(function(t){
          return Object.assign({},t,{
            id:uid(),done:false,prog:0,date:null,
            day: t.day===undefined?0:t.day,
            checklist:(t.checklist||[]).map(function(i){return Object.assign({},i,{done:false,id:uid()});})
          });
        });
        S.tasks = nonDay.concat(newDayTasks);
        S.activeTemplate = scheduledTplId;
      }
    }
    saveState();
  }
}

function checkResetNotification(){
  if(!isWeekend()||resetUsedThisWeekend())return;
  var todayKey=todayStr();
  if(S.resetNotifShown===todayKey)return;
  S.resetNotifShown=todayKey;
  saveState();
  setTimeout(function(){
    showInfoModal(TEXTS.resetAvailableTitle,TEXTS.resetAvailableBody,'Entendido');
  },600);
}

// ── Time picker helpers (desde / hasta) ──────────────────────────────────────────────────────────────
function mHoraTo12(hora24){
  if(!hora24) return '';
  var parts = hora24.split(':');
  var h = parseInt(parts[0],10), m = parseInt(parts[1]||'0',10);
  var ampm = h < 12 ? 'AM' : 'PM';
  var h12 = h % 12 || 12;
  return h12 + ':' + (m<10?'0':'')+m + ' ' + ampm;
}
function mHoraToMins(hora24){
  if(!hora24) return 0;
  var p = hora24.split(':');
  return parseInt(p[0],10)*60 + parseInt(p[1]||'0',10);
}
function mMinsToHora(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  var h = Math.floor(mins/60), m = mins%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function mAddMins(hora24, mins){
  return mMinsToHora(mHoraToMins(hora24) + mins);
}
function mDurLabel(mins){
  if(!mins) return '';
  var h = Math.floor(mins/60), m = mins%60;
  if(h && m) return h+'h '+m+' min';
  if(h) return h === 1 ? '1 hora' : h+' horas';
  return m+' min';
}
function mBuildPickerOptions(selected, anchor, which){
  var html = '';
  for(var h=0;h<24;h++){
    for(var m=0;m<60;m+=15){
      var val = (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
      if(which === 'hasta' && anchor && mHoraToMins(val) <= mHoraToMins(anchor)) continue;
      var label = mHoraTo12(val);
      var durLabel = '';
      if(anchor){
        var diff = mHoraToMins(val) - mHoraToMins(anchor);
        if(diff > 0) durLabel = mDurLabel(diff);
      }
      var isActive = val === selected;
      html += '<button type="button" onclick="mPickTime(\''+which+'\',\''+val+'\')" style="'+
        'display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;'+
        'padding:11px 16px;border:none;background:'+(isActive?'var(--accent-bg)':'transparent')+';'+
        'font-family:Inter,sans-serif;font-size:14px;font-weight:'+(isActive?'700':'500')+';'+
        'color:'+(isActive?'var(--accent)':'var(--ink)')+';cursor:pointer;'+
        'border-radius:0;border-bottom:1px solid var(--line-soft);">'+
        '<span>'+label+'</span>'+
        (durLabel?'<span style="font-size:12px;color:var(--muted);font-weight:400;">'+durLabel+'</span>':'')+
      '</button>';
    }
  }
  return html;
}
function mPickTime(which, val){
  if(which === 'desde'){
    M.hora = val;
    var hastaVal = mAddMins(val, M.duracion||60);
    var lbl = document.getElementById('m-desde-label');
    if(lbl) lbl.textContent = mHoraTo12(val);
    var hastaLbl = document.getElementById('m-hasta-label');
    if(hastaLbl) hastaLbl.textContent = mHoraTo12(hastaVal);
    var hastaDD = document.getElementById('m-hasta-dropdown');
    if(hastaDD) hastaDD.innerHTML = mBuildPickerOptions(hastaVal, val, 'hasta');
    var desdeDD = document.getElementById('m-desde-dropdown');
    if(desdeDD) desdeDD.innerHTML = mBuildPickerOptions(val, null, 'desde');
  } else {
    var durMins = mHoraToMins(val) - mHoraToMins(M.hora||'09:00');
    if(durMins <= 0) return;
    M.duracion = durMins;
    var lbl = document.getElementById('m-hasta-label');
    if(lbl) lbl.textContent = mHoraTo12(val);
    var hastaDD = document.getElementById('m-hasta-dropdown');
    if(hastaDD) hastaDD.innerHTML = mBuildPickerOptions(val, M.hora||'09:00', 'hasta');
  }
  var badge = document.getElementById('m-dur-badge');
  if(badge) badge.textContent = mDurLabel(M.duracion||60);
  var dd = document.getElementById('m-'+which+'-dropdown');
  if(dd) dd.style.display = 'none';
  _pickerOpen = null;
  document.removeEventListener('click', mPickerOutsideClose);
}
var _pickerOpen = null;
function mTogglePicker(which){
  var dd = document.getElementById('m-'+which+'-dropdown');
  if(!dd) return;
  var other = which === 'desde' ? 'hasta' : 'desde';
  var otherDD = document.getElementById('m-'+other+'-dropdown');
  if(otherDD) otherDD.style.display = 'none';
  if(_pickerOpen === which){
    dd.style.display = 'none';
    _pickerOpen = null;
    document.removeEventListener('click', mPickerOutsideClose);
    return;
  }
  _pickerOpen = which;
  dd.style.display = 'block';
  setTimeout(function(){
    var active = dd.querySelector('[style*="var(--accent-bg)"]');
    if(active) active.scrollIntoView({block:'center'});
    else {
      var btns = dd.querySelectorAll('button');
      if(btns.length) btns[Math.min(4,btns.length-1)].scrollIntoView({block:'start'});
    }
    document.addEventListener('click', mPickerOutsideClose);
  }, 30);
}
function mPickerOutsideClose(e){
  if(!_pickerOpen) return;
  var wrap = document.getElementById('m-picker-'+_pickerOpen+'-wrap');
  if(wrap && !wrap.contains(e.target)){
    var dd = document.getElementById('m-'+_pickerOpen+'-dropdown');
    if(dd) dd.style.display = 'none';
    _pickerOpen = null;
    document.removeEventListener('click', mPickerOutsideClose);
  }
}

function clItemQty(i){ return (i&&i.qty)||1; }
function clItemIsQty(i){ return clItemQty(i)>1; }
function clItemsHTML(){

        '<button class="cl-step-btn" onclick="mStepCLItem(\''+item.id+'\',-1)">−</button>'+

        '<span style="font-size:13px;font-weight:700;color:var(--muted);">/'+q+'</span>'+
        '<button class="cl-step-btn" onclick="mStepCLItem(\''+item.id+'\',1)">+</button>'+
      '</div>') :
      ('<div style="width:26px;height:26px;border-radius:7px;border:'+(item.done?'2px solid var(--accent)':'2px solid var(--muted-soft)')+';background:'+(item.done?'var(--accent)':'var(--paper)')+';flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;" onclick="mToggleCLItem(\''+item.id+'\')">'+( item.done?miniChkSVG():'')+'</div>');
    // "Meta" — antes era el emoji "🔢" (poco serio); ahora es una etiqueta
    // de texto, más acorde al resto de la app.
    var qtyBtn = '<button onclick="mToggleCLQtyEditor(\''+item.id+'\')" title="Cantidad / meta" style="background:'+(isQtyItem?'var(--accent-bg)':'var(--paper)')+';border:1.5px solid '+(isQtyItem?'var(--accent)':'var(--line)')+';color:'+(isQtyItem?'var(--accent)':'var(--muted-soft)')+';border-radius:7px;height:22px;padding:0 6px;font-size:10px;font-weight:800;letter-spacing:.03em;cursor:pointer;flex-shrink:0;font-family:Inter,sans-serif;">META</button>';
    // Pedido: se sacaron del editor todos los botones de vincular — ahora
    // eso se maneja desde un solo lugar, el botón 🔗 de la fila de la
    // tarea en la lista principal (ver openTaskLinkMenu). Acá solo queda,
    // a modo informativo, la meta automática cuando corresponde (si este
    // ítem ya recibe avance de algo vinculado desde afuera, no tiene
    // sentido dejar editarla a mano).
    var children = findCLChildren(M.task.id, item.id);

    var qtyEditorHTML = qtyEditorOpen ?
      (children.length ?
        ('<div style="margin:2px 0 8px 38px;font-size:11px;color:var(--muted);line-height:1.5;">Meta automática: <b style="color:var(--ink);">'+q+'</b> (según lo vinculado — para cambiarla, gestiona el vínculo con el botón 🔗 de la lista principal)</div>')
      :

          (isQtyItem?'<span onclick="mSetCLQty(\''+item.id+'\',1)" style="font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;">quitar cantidad</span>':'')+

    // Barrita de progreso — "de forma más amigable y diferenciada" para

    var barHTML = isQtyItem ? '<div style="margin:2px 0 6px 38px;">'+mpHTML(q?( (item.prog||0)/q ):0, 4)+'</div>' : '';
    return '<div style="margin-bottom:'+(isQtyItem||qtyEditorOpen?4:14)+'px;">'+
      '<div style="display:flex;align-items:center;gap:8px;">'+
        controlHTML+
        // BUGFIX: le faltaba min-width:0 — sin eso, un input con flex:1
        // igual se resiste a achicarse más allá de cierto ancho mínimo del

        '<input value="'+esc(item.text)+'" placeholder="Ítem..." oninput="mUpdateCL(\''+item.id+'\',this.value)" style="flex:1;min-width:0;border:none;border-bottom:1px solid var(--line);outline:none;font-size:16px;background:transparent;padding:5px 0;font-family:Inter,sans-serif;color:'+(item.done&&!isQtyItem?'var(--muted-soft)':'var(--ink)')+';text-decoration:'+(item.done&&!isQtyItem?'line-through':'none')+';"/>'+

function mUpdateCL(id,val){for(var i=0;i<M.checklist.length;i++){if(M.checklist[i].id===id){M.checklist[i].text=val;break;}}}
function mToggleCLItem(id){for(var i=0;i<M.checklist.length;i++){if(M.checklist[i].id===id){M.checklist[i].done=!M.checklist[i].done;playSound('tick');break;}}mRerenderCL();}
// Sumar/restar de a 1 unidad en un ítem con cantidad, dentro del editor.
function mStepCLItem(id, delta){
  for(var i=0;i<M.checklist.length;i++){
    if(M.checklist[i].id===id){
      var q=clItemQty(M.checklist[i]);
      var newProg=Math.max(0, Math.min((M.checklist[i].prog||0)+delta, q));
      M.checklist[i]=Object.assign({}, M.checklist[i], {prog:newProg, done:newProg>=q});
      playSound('tick');
      break;
    }
  }
  mRerenderCL();
}
// Pedido: poder escribir el número de avance directo (en vez de solo
// sumar de a uno con −/+) — útil cuando la meta es un número grande.
function mSetCLProg(id, val){

    if(M.checklist[i].id===id){
      var q=clItemQty(M.checklist[i]);
      var newProg=Math.max(0, Math.min(parseInt(val,10)||0, q));
      M.checklist[i]=Object.assign({}, M.checklist[i], {prog:newProg, done:newProg>=q});
      break;

// Muestra/oculta el pequeño editor de "Meta" para este ítem.

}
// Cambia la meta (cantidad objetivo) de un ítem a mano. Si se baja a 1,
// vuelve a ser un check simple (se resetea el avance para que no quede un
// progreso fantasma tipo "1/1" a medio marcar). No hace nada si el ítem ya
// tiene vínculos entrantes (su meta es automática — ver
// recalcParentItemQtyFromLinks); en la práctica el input ni se muestra en
// ese caso, esto es solo un resguardo extra.
function mSetCLQty(id, val){
  if(!M.isNew && findCLChildren(M.task.id, id).length) return;
  var q = Math.max(1, Math.min(999, parseInt(val,10)||1));
  for(var i=0;i<M.checklist.length;i++){
    if(M.checklist[i].id===id){
      if(q<=1){
        M.checklist[i]=Object.assign({}, M.checklist[i], {qty:1, prog:0, done:false});
      } else {
        var prog=Math.min(M.checklist[i].prog||0, q);
        M.checklist[i]=Object.assign({}, M.checklist[i], {qty:q, prog:prog, done:prog>=q});
      }
      break;
    }
  }
  mRerenderCL();
}
// ── Vínculo entre ítems de checklist de distinto período (multi-vínculo) ──
// Un ítem (o una tarea completa) puede vincularse hacia VARIOS objetivos a
// la vez — por ej. "leer 5 páginas" puede sumar simultáneamente a "leer 20
// páginas/semana", "leer 150/mes", "leer 600/semestre" y "leer 1200/año".
// Por eso item.linkUp / t.clLinkUp ahora puede guardar un ARRAY de
// {taskId,itemId} en vez de un solo objeto. normalizeLinks() acepta los
// tres formatos posibles (null, objeto único de datos viejos, o array) y
// siempre devuelve un array, para poder iterar parejo sin importar cómo
// haya quedado guardado.
function normalizeLinks(linkUp){
  if(!linkUp) return [];
  return Array.isArray(linkUp) ? linkUp : [linkUp];
}
function hasLinks(linkUp){ return normalizeLinks(linkUp).length>0; }
// Un ítem de una tarea con período MÁS ESPECÍFICO (ej. mensual) puede
// sumar su avance hacia un ítem de una tarea con período MÁS AMPLIO (ej.
// anual) — o incluso de su mismo período, para combinar varias metas en
// paralelo. Se guarda como item.linkUp=[{taskId,itemId},...] en el ítem
// que genera el avance (el "hijo"), y se puede consultar quién apunta a un
// ítem dado calculándolo al vuelo (findCLChildren), sin duplicar el dato
// en los dos lados y arriesgar que se desincronicen.
// Encuentra el "objetivo" de un vínculo: un ítem de checklist puntual, o
// (si itemId es null/vacío) la tarea completa — su check simple o su
// cantidad propia, para tareas sin checklist.
function findCLItem(taskId, itemId){
  var t=S.tasks.find(function(tt){return tt.id===taskId;});
  if(!t) return null;
  if(!itemId) return {task:t, item:null};
  if(!t.checklist) return null;
  var it=t.checklist.find(function(i){return i.id===itemId;});
  return it?{task:t,item:it}:null;
}
// Pedido: además de ítems de checklist, una tarea que NO tiene checklist
// propio también puede ser "hijo" de un vínculo (usando su check simple o
// su cantidad propia como fuente). Estas tareas guardan el vínculo en
// t.clLinkUp en vez de en un item.linkUp — item queda en null para
// representar "toda la tarea" en vez de un ítem puntual. itemId también
// puede ser null del lado del OBJETIVO (buscar quién vincula hacia "toda
// la tarea X", no hacia un ítem puntual de X).
function findCLChildren(taskId, itemId){
  var norm = itemId||null;
  var out=[];
  S.tasks.forEach(function(t){
    (t.checklist||[]).forEach(function(i){
      var m = normalizeLinks(i.linkUp).filter(function(l){return l.taskId===taskId && (l.itemId||null)===norm;});
      if(m.length) out.push({task:t,item:i,link:m[0]});
    });
    // Pedido: la tarea COMPLETA puede vincularse hacia un objetivo aunque
    // ella misma tenga checklist propio (antes clLinkUp solo existía en
    // tareas sin checklist) — por eso ya no se excluye aquí según si tiene
    // checklist o no.
    var mt = normalizeLinks(t.clLinkUp).filter(function(l){return l.taskId===taskId && (l.itemId||null)===norm;});
    if(mt.length) out.push({task:t,item:null,link:mt[0]});
  });
  return out;
}
// Cuánto "vale" un hijo para efectos de sumar la meta automática del padre
// (ver recalcParentItemQtyFromLinks): su propia meta si es un ítem de
// checklist, o su propia cantidad (o 1, si es un check simple) si es toda
// una tarea — o su cantidad de ítems de checklist, si es una tarea completa
// con checklist propio (cada ítem completado = 1 unidad). Pedido: si el
// vínculo específico usa el modo "completar" (mode:'completion'), el hijo
// solo vale 1 en total (recién se cuenta al completarse del todo), sin
// importar su propia meta interna.
function clChildContribution(child){
  var mode = (child.link && child.link.mode) || 'unit';
  if(mode === 'completion') return 1;
  if(child.item) return clItemQty(child.item);
  if(child.task.checklist && child.task.checklist.length) return child.task.checklist.length;
  return Math.max(1, child.task.qty||1);
}
// Recalcula la meta del objetivo (ítem de checklist, o tarea completa si
// itemId es null) como la suma de lo que aportan todos sus hijos
// vinculados. Si no tiene hijos, no toca nada (se deja la meta manual tal
// como esté).
function recalcParentItemQtyFromLinks(taskId, itemId){
  var children = findCLChildren(taskId, itemId);
  var found = findCLItem(taskId, itemId);
  if(!found || !children.length) return;
  var sum = children.reduce(function(s,c){return s+clChildContribution(c);},0);
  var newQty = Math.max(1, sum);
  if(found.item){
    var newProg = Math.min(found.item.prog||0, newQty);
    var newChecklist = found.task.checklist.map(function(i){return i.id===itemId?Object.assign({},i,{qty:newQty,prog:newProg,done:newProg>=newQty}):i;});
    var updated = Object.assign({}, found.task, {checklist:newChecklist});
    S.tasks = S.tasks.map(function(t){return t.id===taskId?updated:t;});
    // Si el editor de esta tarea está abierto, reflejarlo también en el
    // buffer local para que se vea sin tener que reabrirlo.
    if(typeof M!=='undefined' && M && M.task && !M.isNew && M.task.id===taskId && M.checklist){
      var mi=M.checklist.findIndex(function(i){return i.id===itemId;});
      if(mi>=0) M.checklist[mi]=Object.assign({}, M.checklist[mi], {qty:newQty, prog:newProg, done:newProg>=newQty});
    }
  } else {
    var newProg2 = Math.min(found.task.prog||0, newQty);
    var updated2 = Object.assign({}, found.task, {qty:newQty, prog:newProg2, done:newProg2>=newQty});
    S.tasks = S.tasks.map(function(t){return t.id===taskId?updated2:t;});
  }
}
// Empuja avance desde un ítem (o tarea) hijo hacia CADA uno de sus
// objetivos vinculados (uno o varios ítems de checklist, o tareas
// completas si itemId es null), y sigue subiendo recursivamente por cada
// rama si ese objetivo a su vez está vinculado más arriba todavía (ej.
// semana → mes → año, o hacia varios en simultáneo). `visited` evita
// bucles infinitos si el usuario llegara a crear un vínculo circular
// (ej. A vinculada a B y B vinculada de vuelta a A).
//
// Pedido: en TODA vinculación se puede elegir el modo de suma (por eso cada
// entrada de link ahora guarda .mode) — por eso acá se manejan DOS deltas:
//   `delta`     — avance "1 a 1": cada unidad del hijo suma 1 unidad allá.
//   `complDelta`— avance "solo al completar": +1 cuando el hijo pasa de no
//                 completo a completo, -1 al revés, 0 mientras tanto — así
//                 el destino recién recibe 1 unidad cuando el hijo llega al
//                 100%, sin importar cuántas unidades tenga por dentro.
// Cada vínculo usa el delta que corresponda según su propio .mode. Si se
// omite complDelta (llamadas antiguas), se asume igual a delta — correcto
// para los toggles atómicos (0↔1) donde ambos valores siempre coinciden.
function propagateCLLink(childItem, delta, complDelta, visited){
  if(!childItem) return;
  if(complDelta===undefined || complDelta===null) complDelta = delta;
  delta = delta||0; complDelta = complDelta||0;
  if(!delta && !complDelta) return;
  var links = normalizeLinks(childItem.linkUp);
  if(!links.length) return;
  visited = visited || [];
  links.forEach(function(link){
    var key = link.taskId+':'+(link.itemId||'');
    if(visited.indexOf(key)!==-1) return; // vínculo circular — cortar acá
    var nextVisited = visited.concat([key]);
    var mode = link.mode || 'unit';
    var addAmount = mode==='completion' ? complDelta : delta;
    if(!addAmount) return;
    var found = findCLItem(link.taskId, link.itemId);
    if(!found) return;
    var parentTask=found.task, parentItem=found.item;
    if(!parentItem){
      // Objetivo = la tarea completa — mismo cálculo que usa tapTask() para
      // tareas con cantidad. (Puede tener checklist propio igual: si lo
      // tiene, isDone()/tRatio() ya priorizan el checklist sobre prog/qty,
      // así que este prog acumulado queda como dato informativo nada más.)
      var wasDone=isDone(parentTask);
      var oldProg = parentTask.prog||0;
      var newProg=Math.max(0, Math.min(oldProg+addAmount, parentTask.qty||1));
      var appliedDelta = newProg-oldProg;
      var nowDone = newProg>=(parentTask.qty||1);
      var updatedTask=Object.assign({},parentTask,{prog:newProg,done:nowDone});
      S.tasks=S.tasks.map(function(t){return t.id===parentTask.id?updatedTask:t;});
      var justCompletedTask = !wasDone && nowDone;
      var justUncompletedTask = wasDone && !nowDone;
      if(justCompletedTask && !S.rewardedTaskIds[parentTask.id]){S.rewardedTaskIds[parentTask.id]=true;addXP(PT[parentTask.period]||1);}
      // seguir subiendo si esta tarea a su vez está vinculada más arriba
      propagateCLLink({linkUp:updatedTask.clLinkUp}, appliedDelta, justCompletedTask?1:(justUncompletedTask?-1:0), nextVisited);
      return;
    }
    var wasTaskDone=isDone(parentTask);
    var oldDoneCount=parentTask.checklist.filter(function(i){return i.done;}).length;
    var q=clItemQty(parentItem);
    var oldItemProg = parentItem.prog||0;
    var newProg=Math.max(0, Math.min(oldItemProg+addAmount, q));
    var appliedItemDelta = newProg-oldItemProg;
    var newDone = q>1 ? newProg>=q : newProg>0;
    var newChecklist=parentTask.checklist.map(function(i){return i.id===parentItem.id?Object.assign({},i,{prog:newProg,done:newDone}):i;});
    var newDoneCount=newChecklist.filter(function(i){return i.done;}).length;
    var taskDelta=newDoneCount-oldDoneCount;
    var updatedParentTask=Object.assign({},parentTask,{checklist:newChecklist, done: newChecklist.length? newChecklist.every(function(i){return i.done;}) : parentTask.done});
    S.tasks=S.tasks.map(function(t){return t.id===parentTask.id?updatedParentTask:t;});
    var justCompletedParent = !wasTaskDone && isDone(updatedParentTask);
    var justUncompletedParent = wasTaskDone && !isDone(updatedParentTask);
    if(justCompletedParent && !S.rewardedTaskIds[parentTask.id]){S.rewardedTaskIds[parentTask.id]=true;addXP(PT[parentTask.period]||1);}
    var updatedParentItem=newChecklist.find(function(i){return i.id===parentItem.id;});
    var itemJustCompleted = !parentItem.done && updatedParentItem.done;
    var itemJustUncompleted = parentItem.done && !updatedParentItem.done;
    propagateCLLink(updatedParentItem, appliedItemDelta, itemJustCompleted?1:(itemJustUncompleted?-1:0), nextVisited);
    propagate(updatedParentTask, justCompletedParent, taskDelta);
  });
}
function mRerenderCL(){
  var area=document.getElementById('m-cl-items');if(!area)return;
  area.innerHTML=clItemsHTML();
  var addrow=document.getElementById('m-cl-addrow');
  if(addrow)addrow.innerHTML=clAddButtonHTML();
}
// ── Vincular la tarea COMPLETA (sin checklist propio) a un ítem de una
// tarea de período más amplio. Disponible para cualquier período salvo
// "año" (no hay nada más amplio arriba), y solo si la tarea no tiene su
// propio checklist (si lo tiene, se vincula ítem por ítem más arriba).
function mSave(){
  var nameEl=document.getElementById('m-name');if(!nameEl)return;
  var name=nameEl.value.trim();
  if(!name){nameEl.style.borderBottomColor='var(--bad)';nameEl.focus();return;}
  // Pedido: el checklist ahora está disponible para tareas de cualquier
  // período (antes solo para "día"). Además, en plan gratuito se recorta a
  // MAX_CHECKLIST_ITEMS_FREE ítems por las dudas (mAddCL ya lo bloquea al
  // agregar, esto es solo un resguardo extra al guardar).
  var isDay=M.task.period==='dia';
  // BUGFIX / pedido: "Cantidad" y "Checklist interno" no pueden estar
  // activos los dos a la vez (si no, no queda claro cuál decide si la
  // tarea está completa). mToggleQty()/mToggleCLSection() ya lo evitan al
  // tocar los interruptores; esto es un resguardo extra al guardar — si
  // por lo que sea llegan los dos en true, gana el checklist por ser más
  // específico.
  if(M.hasQty && M.hasCL) M.hasQty=false;
  var cl=M.hasCL?M.checklist.filter(function(i){return i.text.trim();}):[];
  if(!isPremium() && cl.length>MAX_CHECKLIST_ITEMS_FREE) cl=cl.slice(0,MAX_CHECKLIST_ITEMS_FREE);
  var qty=M.hasQty?Math.max(2,M.qty):1;
  var done_=cl.length?cl.every(function(i){return i.done;}):(qty>1?(M.task.prog||0)>=qty:!!M.task.done);
  // BUGFIX: si es una tarea simple (sin "Cantidad"), "prog" debe quedar en
  // sincronía con "done" (0 o 1) — igual que ya se corrigió en tapTask() —
  // para que un vínculo hacia otra tarea (t.clLinkUp) calcule bien el
  // delta la próxima vez que se marque/desmarque. Antes quedaba siempre en
  // 0 acá, pisando lo que tapTask() hubiera dejado.
  var prog=M.hasQty?Math.min(M.task.prog||0,qty):(done_?1:0);
  // Fecha específica (tarea puntual, no recurrente) — si está activa, además
  // recalculamos el día de semana correspondiente por si se desactiva luego.
  var dateInp = isDay ? document.getElementById('m-date-input') : null;
  var specificDate = (isDay && M.hasDate && dateInp && dateInp.value) ? dateInp.value : null;
  var effectiveDay = specificDate ? dayIdxFromDate(new Date(specificDate+'T00:00:00')) : M.task.day;
  // El recordatorio solo tiene sentido si la tarea es diaria y tiene hora
  // definida; si se desactivó la hora, el recordatorio no se guarda activo.
  var notifSaved = (isDay && M.hora && M.notif && M.notif.on) ? {on:true, hh:M.notif.hh||0, mm:M.notif.mm!=null?M.notif.mm:15} : null;
  // Pedido: la tarea COMPLETA puede estar vinculada (clLinkUp) aunque tenga
  // checklist propio — antes se borraba el vínculo acá apenas el checklist
  // tenía algún ítem; ahora se conserva siempre tal cual estaba.
  var saved=Object.assign({},M.task,{text:name,checklist:cl,qty:qty,prog:prog,done:done_,crucial:isDay?!!M.crucial:false,categoryId:isDay?(M.categoryId||null):null,hora:isDay?(M.hora||null):null,duracion:isDay?(M.duracion||60):60,date:isDay?specificDate:null,day:isDay?effectiveDay:M.task.day,notif:notifSaved,clLinkUp:(M.task.clLinkUp||null)});
  // Si algún ítem vinculado cambió su avance mientras se editaba en este
  // modal (se le sumó/restó cantidad, o se marcó/desmarcó un ítem simple),
  // empujar ese cambio hacia el ítem vinculado — comparando contra el
  // checklist tal como estaba cuando se abrió el editor. Se calculan los
  // dos deltas (1 a 1 y "al completar") para que cada vínculo use el que
  // corresponda según su propio modo.
  var oldCL = M.task.checklist || [];
  function _clEffProg(i){ return clItemQty(i)>1 ? (i.prog||0) : (i.done?1:0); }
  function _clEffDone(i){ return clItemQty(i)>1 ? (i.prog||0)>=clItemQty(i) : !!i.done; }
  var clDeltas = [];
  oldCL.forEach(function(oi){
    if(!hasLinks(oi.linkUp)) return;
    var ni = cl.find(function(i){return i.id===oi.id;});
    var newP = ni ? _clEffProg(ni) : 0; // el ítem se borró: se retracta su aporte
    var d = newP - _clEffProg(oi);
    var wasD = _clEffDone(oi), nowD = ni ? _clEffDone(ni) : false;
    var cd = (!wasD && nowD) ? 1 : (wasD && !nowD ? -1 : 0);
    if(d || cd) clDeltas.push({item: ni||oi, delta: d, compl: cd});
  });
  // Igual, pero para el vínculo de la tarea COMPLETA (clLinkUp) — el avance
  // que aporta es la cantidad de ítems completados (antes/después).
  var wholeDelta=0, wholeCompl=0;
  if(hasLinks(saved.clLinkUp)){
    var oldDoneCountW = oldCL.filter(function(i){return i.done;}).length;
    var newDoneCountW = cl.filter(function(i){return i.done;}).length;
    wholeDelta = newDoneCountW - oldDoneCountW;
    var wasDoneW = oldCL.length ? oldCL.every(function(i){return i.done;}) : !!M.task.done;
    var nowDoneW = done_;
    wholeCompl = (!wasDoneW && nowDoneW) ? 1 : (wasDoneW && !nowDoneW ? -1 : 0);
  }
  if(M.isNew){S.tasks.push(saved);}else{S.tasks=S.tasks.map(function(t){return t.id===saved.id?saved:t;});}
  clDeltas.forEach(function(d){ propagateCLLink(d.item, d.delta, d.compl); });
  if(wholeDelta || wholeCompl) propagateCLLink({linkUp:saved.clLinkUp}, wholeDelta, wholeCompl);
  removeOverlay('task-modal');saveState();checkMedals();render();
  playSound(M.isNew?'add':'toggle');
}
function removeOverlay(id){
  var el=document.getElementById(id);
  if(!el) return;
  el.classList.add('closing');
  setTimeout(function(){ if(el && el.parentNode) el.remove(); }, 180);
}

// ── Racha con período de gracia de 1 día ────────────────────────────────────
// ¿Está la racha "en vivo" (contando días, mostrando el contador, logros,
// etc.)? Distinto de S.simpleMode: acá los niveles/XP siguen activos, solo
// se apaga el sistema de racha en sí (pedido: opción independiente).
function streakActive(){ return !S.simpleMode && !S.streakDisabled; }
// Pedido: si un día no alcanza el umbral, el usuario tiene hasta el FINAL
// DEL DÍA SIGUIENTE para tickear esas tareas y que ese día igual cuente
// para la racha. Pasado ese plazo, las tareas se pueden seguir marcando
// (hasta 7 días atrás, ver canTicket en openDayDetail) pero ya no revive
// la racha de ese día — queda "cerrado" (finalized).
//
// Tareas "de un día concreto" dateKey: las puntuales con esa fecha, más las
// recurrentes de ese día de semana, siempre que dateKey siga dentro de la
// semana en curso (el reset semanal de los lunes reutiliza el mismo objeto
// de tarea para la semana nueva, así que una vez cruzada esa frontera ya no
// se puede reconstruir el detalle de la semana anterior — la misma
// limitación que ya tenía openDayDetail para tickear tareas pasadas).
function tasksForDateKey(dateKey){
  var d = parseLocalDate(dateKey);
  var wIdx = dayIdxFromDate(d);
  var recurring = isSameWeekAsToday(d) ? S.tasks.filter(function(t){return t.period==='dia'&&!t.date&&t.day===wIdx;}) : [];
  var dated = S.tasks.filter(function(t){return t.period==='dia'&&t.date===dateKey;});
  return recurring.concat(dated);
}
// ¿Sigue "dentro de gracia" el día dateKey? (hoy mismo, o el día
// inmediatamente anterior — que se puede completar hasta el final de hoy).
function isWithinGracePeriod(dateKey){
  var diff = Math.round((parseLocalDate(todayStr()) - parseLocalDate(dateKey))/86400000);
  return diff>=0 && diff<=1;
}
// Evalúa (o re-evalúa) el cumplimiento de un día concreto y guarda/actualiza
// su historial — salvo que ya esté "finalized" (fuera de gracia y ya
// resuelto para siempre), en cuyo caso no se vuelve a tocar. Días sin
// ninguna tarea asignada (dayTasks vacío) no generan entrada — no hay nada
// que evaluar — y se dejan tal cual estaban (relevante para el borde
// semana-anterior/semana-actual del último día de la semana).
function evaluateDayHistory(dateKey, weekendSkipAllowed){
  var prev = (S.dailyHistory||{})[dateKey];
  if(prev && prev.finalized) return prev;
  var dow = parseLocalDate(dateKey).getDay(); // 0=domingo,6=sábado
  var isWknd = (dow===0||dow===6);
  if(!S.dailyHistory) S.dailyHistory={};
  // BUGFIX: el fin de semana libre solo puede EXTENDER una racha que ya
  // viene viva (weekendSkipAllowed — reconcileStreak lo calcula mirando si
  // S.streak.days>0 justo antes de este día) — nunca puede generar una
  // racha nueva de la nada. Antes, cualquier sábado/domingo se daba por
  // cumplido sin condición, así que una racha ya rota "revivía" sola en el
  // fin de semana siguiente aunque no se hubiera hecho nada esos días.
  if(S.streakCfg && S.streakCfg.skipWeekends && isWknd && weekendSkipAllowed){
    var wkEntry = {ratio:1, completed:prev?prev.completed:0, total:prev?prev.total:0, streakReached:true, threshold:S.streakCfg.threshold, weekendSkipped:true, finalized:false};
    S.dailyHistory[dateKey]=wkEntry;
    return wkEntry;
  }
  var dayTasks = tasksForDateKey(dateKey);
  if(!dayTasks.length) return prev||null;
  var am=getActiveMode();
  var thr=am&&am.lowThresh?am.lowThresh:S.streakCfg.threshold;
  var completed = dayTasks.filter(isDone).length; // cuántas quedaron 100% completas — para mostrar "3/5"
  // Pedido: el avance PARCIAL de una tarea con cantidad específica o con
  // checklist también debe contar como porcentaje parcial hacia el umbral
  // del día — antes una tarea a medias (ej. 7/10) sumaba 0 hasta llegar al
  // 100%. tRatio() ya calcula justo esa fracción (checklist: ítems
  // hechos/total; cantidad: prog/meta; check simple: 0 o 1).
  var partialSum = dayTasks.reduce(function(s,tk){return s+tRatio(tk);},0);
  var r = partialSum/dayTasks.length;
  var entry = {ratio:r, completed:completed, total:dayTasks.length, streakReached:r>=thr, threshold:thr, finalized:false};
  S.dailyHistory[dateKey]=entry;
  return entry;
}
// Recorre día a día desde el último día confirmado de racha hasta hoy,
// extendiendo la racha mientras cada día cumpla el umbral. El primer día
// que YA salió del período de gracia sin cumplir corta la racha ahí (pero
// se sigue avanzando por si algún día posterior ya está al día). Un día
// todavía en gracia (hoy, o ayer que aún puede completarse hasta el final
// de hoy) detiene el recorrido: ni suma ni corta la racha todavía.
function reconcileStreak(){
  if(S.simpleMode) return;
  if(!S.streak) S.streak={days:0,lastDate:null,total:0};
  var today = todayStr();
  var todayDate = parseLocalDate(today);
  var yesterdayKey = localDateStr(addDaysLocal(new Date(),-1));
  var cursor = S.streak.lastDate ? addDaysLocal(parseLocalDate(S.streak.lastDate),1) : todayDate;
  var guard=0;
  while(cursor <= todayDate && guard<3660){
    guard++;
    var cKey = localDateStr(cursor);
    var weekendSkipAllowed = S.streak.days>0; // ver BUGFIX en evaluateDayHistory
    var h = evaluateDayHistory(cKey, weekendSkipAllowed);
    if(h && h.streakReached){
      h.finalized = true;
      if(!streakActive()){
        // Racha desactivada (pero niveles activos, o modo simplificado ya
        // filtrado arriba): igual guardamos el historial del día — lo usa
        // el calendario y medallas por cumplimiento diario — pero no
        // tocamos el contador ni mostramos nada. lastDate avanza para no
        // tener que reprocesar estos días si se reactiva más adelante.
        S.streak.lastDate = cKey;
        cursor = addDaysLocal(cursor,1);
        continue;
      }
      var nd=S.streak.days+1, nt=(S.streak.total||0)+1;
      S.streak={days:nd,lastDate:cKey,total:nt};
      var bonus=0;
      if(nd%7===0)bonus+=5;
      if(nt%30===0)bonus+=7;
      if(nt%180===0)bonus+=30;
      checkAndUnlockAchievement(nd);
      if(bonus>0)addXP(bonus);
      if(cKey===today){
        setTimeout(function(){showStreakAchieved(nd,bonus);},900);
      } else if(cKey===yesterdayKey && !h.weekendSkipped){
        // Confirmado dentro del período de gracia — aviso breve, sin el
        // modal grande de racha (ese queda reservado para el día de "hoy").
        setTimeout(function(){toast('✅ Alcanzaste a completar ayer a tiempo — racha en '+nd+' 🔥');},400);
      }
      cursor = addDaysLocal(cursor,1);
      continue;
    }
    if(!h){ cursor = addDaysLocal(cursor,1); continue; } // día sin tareas: no altera la racha
    if(isWithinGracePeriod(cKey)) break; // todavía se puede completar — esperar
    // Gracia vencida sin alcanzar el umbral: la racha se corta en este día
    // (si está activa — si no, solo avanzamos el puntero sin tocar days/total).
    h.finalized = true;
    S.streak = streakActive() ? {days:0, lastDate:cKey, total:S.streak.total||0} : Object.assign({},S.streak,{lastDate:cKey});
    cursor = addDaysLocal(cursor,1);
  }
  saveState();
}
// Se llama tras cada tarea completada (hoy o, dentro del editor de un día
// pasado, ayer) para recalcular el historial y la racha al vuelo.
function checkStreakNow(){
  if(S.simpleMode)return; // Modo simplificado: sin racha
  reconcileStreak();
  render();
}

// MEDALLAS (medals): acciones específicas. También en silencio.

var ACHIEVEMENT_DAYS = [30, 120, 365];
function checkAndUnlockAchievement(days){
  var unlocked = false;
  if(ACHIEVEMENT_DAYS.indexOf(days) !== -1) unlocked = true;
  if(days > 365 && days % 365 === 0) unlocked = true;
  if(unlocked){
    var ach = {id:'streak-'+days, days:days, dateUnlocked:new Date().toISOString()};
    if(!S.achievements)S.achievements=[];
    var exists = S.achievements.some(function(a){return a.id===ach.id;});
    if(!exists){
      S.achievements.push(ach);
      // Recompensa: XP según días de racha
      var xpBonus = days >= 365 ? 50 : days >= 120 ? 30 : 20;
      addXP(xpBonus);
      saveState();
      setTimeout(function(){
        playSound('achievement');
        showRewardToast('🏆 '+getAchievementName(days).title, '+'+xpBonus+' XP');
      }, 500);
    }
  }
}
