function miniChkSVG(){return '<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function mpHTML(r,h){h=h||4;r=isFinite(r)?r:0;return '<div class="mpbar" style="height:'+h+'px"><div class="mpbar-fill" style="width:'+Math.min(100,Math.round(r*100))+'%;height:100%;"></div></div>';}

function taskHTML(t,showPeriod){
  if(SEL.active && SEL.type==='tasks') return taskHTMLSelectable(t,showPeriod);
  var done=isDone(t),r=tRatio(t);
  var hasQty=(t.qty||1)>1,hasCL=t.checklist&&t.checklist.length>0;
  var hasTimer = !!(t.hasTimer && t.timer && t.timer.sets && t.timer.sets.length);
  var clDone=hasCL?t.checklist.filter(function(i){return i.done;}).length:0;
  // Pedido: si el checklist usa la regla "con algunos alcanza" (K de N), el
  // contador de la fila muestra "hechos/K" en vez de "hechos/N total" —
  // así se ve de un vistazo cuánto falta para la meta real, no cuánto falta
  // para marcar TODO.
  var clKofN = hasCL && t.clRule && t.clRule.mode==='kofn';
  // Pedido: si el checklist tiene ítems con cantidad (ej. Kindle 2/4), el
  // contador "0/3" (ítems completos) engañaba — la barra avanzaba pero el
  // número seguía en 0. En ese caso se muestra el porcentaje real.
    var clGoal = clKofN ? Math.max(1,Math.min(t.clRule.k||1,t.checklist.length)) : (hasCL?t.checklist.length:0);
  var clHasQtyItems = hasCL && !clKofN && t.checklist.some(function(i){return clItemQty(i)>1;});
var innerChk=done?chkSVG():(r>0&&!hasCL?'<span style="font-size:8px;font-weight:700;color:var(--accent);">'+(t.prog||0)+'</span>':(r>0&&hasCL&&!clHasQtyItems?'<span style="font-size:7px;font-weight:700;color:var(--accent);">'+clDone+'</span>':''));
  // Pedido: las tareas con cantidad usan la misma casilla cuadrada
  // redondeada que el resto (antes eran un círculo aparte, sin motivo para
  // diferenciarse visualmente del resto de las tareas).
  var chkCls='chk'+(done?' done':r>0?' partial':'');
  var justPopped = (S._justCompletedId === t.id);
  if(justPopped) chkCls += ' chk-pop';
  var clHTML='';
  var clIsOpen = !!(S._clOpen && S._clOpen[t.id]);
  if(hasCL){
    clHTML='<div id="cl-'+t.id+'" style="display:'+(clIsOpen?'block':'none')+';padding-left:33px;padding-bottom:10px;">';
    t.checklist.forEach(function(item){
      // Pedido: los ítems con cantidad muestran un stepper −/+ en vez de un
      // check simple, para diferenciarlos de un vistazo. El 🔗 es solo un
      // indicador (no clickeable acá) de que el ítem está vinculado — la
      // gestión del vínculo vive en el editor de la tarea, para no ensuciar
      // esta vista rápida del día a día.
      var q = clItemQty(item);
      var isQtyItem = q>1;
      var linkedMark = hasLinks(item.linkUp) ? '<span title="Vinculado" style="font-size:10px;margin-right:3px;color:var(--accent);">🔗</span>' : '';
      if(isQtyItem){
        clHTML+='<div class="cl-row" style="cursor:default;">'+
          '<button class="cl-step-btn" onclick="event.stopPropagation();stepCL(\''+t.id+'\',\''+item.id+'\',-1)" style="width:20px;height:20px;font-size:13px;">−</button>'+
          '<input type="number" inputmode="numeric" min="0" max="'+q+'" value="'+(item.prog||0)+'" onclick="event.stopPropagation()" onchange="event.stopPropagation();setCLProg(\''+t.id+'\',\''+item.id+'\',this.value)" style="width:30px;text-align:center;border:none;border-bottom:1.5px solid var(--line);background:transparent;font-size:12px;font-weight:700;color:'+(item.done?'var(--accent)':'var(--ink-soft)')+';font-family:Inter,sans-serif;padding:1px 0;"/>'+
          '<span style="font-size:12px;font-weight:700;color:var(--muted);margin:0 2px;">/'+q+'</span>'+
          '<button class="cl-step-btn" onclick="event.stopPropagation();stepCL(\''+t.id+'\',\''+item.id+'\',1)" style="width:20px;height:20px;font-size:13px;">+</button>'+
          '<span style="font-size:13px;color:'+(item.done?'var(--muted-soft)':'var(--ink-soft)')+';text-decoration:'+(item.done?'line-through':'none')+';margin-left:2px;">'+linkedMark+esc(item.text)+'</span>'+
          '</div>';
      } else {
        clHTML+='<div class="cl-row" onclick="tapCL(\''+t.id+'\',\''+item.id+'\')">'+
          '<div class="cl-box'+(item.done?' done':'')+'">'+(item.done?miniChkSVG():'')+'</div>'+
          '<span style="font-size:13px;color:'+(item.done?'var(--muted-soft)':'var(--ink-soft)')+';text-decoration:'+(item.done?'line-through':'none')+';">'+linkedMark+esc(item.text)+'</span>'+
          '</div>';
      }
    });
    clHTML+='</div>';
  }
  var tagHTML=showPeriod?'<div style="margin-top:4px;"><span style="font-size:10px;padding:2px 7px;border-radius:20px;background:'+(PC[t.period]||'var(--line)')+';color:var(--ink-soft);font-weight:600;">'+PL[t.period]+'</span></div>':'';
  var crucialMark=t.crucial?'<span class="crucial-star" title="Tarea crucial">★</span>':'';
  // Etiqueta de categoría (solo para tareas diarias)
  var category = (t.period==='dia' && t.categoryId) ? (S.categories||[]).find(function(c){return c.id===t.categoryId;}) : null;
  var categoryTag = category ? '<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:'+category.color+';color:white;font-weight:600;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;" title="Categoría">'+esc(category.name)+'</span>' : '';
  var horaTag = (t.period==='dia' && t.hora) ? '<span style="font-size:10px;padding:2px 6px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-weight:700;flex-shrink:0;" title="Hora">'+esc(t.hora)+'</span>' : '';
  // Mantener presionado sobre la fila entra en modo de selección múltiple
  // (ver SEL / selLpStart) — no interfiere con los toques normales, ya que
  // solo dispara tras ~480ms sin moverse.
  var lpAttrs = 'ontouchstart="selLpStart(\'tasks\',\''+t.id+'\',event)" ontouchmove="selLpMove(event)" ontouchend="selLpEnd()" ontouchcancel="selLpEnd()" onmousedown="selLpStart(\'tasks\',\''+t.id+'\',event)" onmouseup="selLpEnd()" onmouseleave="selLpEnd()"';
  var skipped = isSkipped(t);
  var skipTag = skipped ? '<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:var(--line);color:var(--muted);font-weight:700;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;" title="Ignorada esta semana"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:3px;"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>Ignorada</span>' : '';
  return '<div class="task-item'+(justPopped?' row-glow':'')+'" id="ti-'+t.id+'" '+lpAttrs+(skipped?' style="opacity:.5;"':'')+'>'+
    '<div class="task-row">'+
      '<div class="'+chkCls+'" onclick="tapTask(\''+t.id+'\')">'+innerChk+'</div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="display:flex;align-items:center;gap:6px;">'+
          crucialMark+
          '<span ondblclick="startInlineEdit(\''+t.id+'\')" id="tt-'+t.id+'" style="font-size:14px;color:'+(done?'var(--muted-soft)':'var(--ink)')+';text-decoration:'+(done?'line-through':'none')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;flex:1;min-width:0;" title="Doble click para editar">'+esc(t.text)+'</span>'+
          skipTag+categoryTag+
          horaTag+
          // Pedido: poder escribir el avance directo (no solo tocando el
          // círculo repetidas veces) — útil cuando la meta es un número
          // grande, ej. una meta de 100.
          (hasQty?'<input type="number" inputmode="numeric" min="0" max="'+t.qty+'" value="'+(t.prog||0)+'" onclick="event.stopPropagation()" onchange="event.stopPropagation();setTaskProg(\''+t.id+'\',this.value)" style="width:22px;text-align:center;border:none;border-bottom:1.5px solid var(--line);background:transparent;font-size:11px;font-weight:700;color:var(--muted);font-family:Inter,sans-serif;padding:0;flex-shrink:0;"/><span style="font-size:11px;color:var(--muted);flex-shrink:0;">/'+t.qty+'</span>':'')+
          (hasCL?'<span onclick="event.stopPropagation();openCLSheet(\''+t.id+'\')" title="'+(clKofN?('Con '+clGoal+' de '+t.checklist.length+' alcanza — abrir checklist'):'Abrir checklist')+'" style="font-size:11px;color:var(--muted);flex-shrink:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;">'+(clHasQtyItems?(Math.round(r*100)+'%'):(clDone+'/'+clGoal+(clKofN?' ✦':'')))+'</span>':'')+
        '</div>'+
        ((hasQty||hasCL)?mpHTML(r):'')+tagHTML+
      '</div>'+
      (hasCL?'<button onclick="expCL(\''+t.id+'\')" id="exp-'+t.id+'" style="background:none;border:none;color:var(--muted);font-size:14px;padding:0 3px;flex-shrink:0;transition:transform .2s;transform:'+(clIsOpen?'rotate(180deg)':'none')+';">▾</button>':'')+
      // Botón de temporizador (pedido): abre la pantalla de ejecución con
      // sets/descansos. La casilla de la izquierda sigue funcionando normal
      // para marcarla a mano, sin usar el temporizador — no son excluyentes.
      (hasTimer?'<button onclick="event.stopPropagation();openTimerRun(\''+t.id+'\')" title="Iniciar temporizador" style="background:var(--accent);border:none;color:#fff;font-size:12px;padding:0;width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;">▶</button>':'')+
      // Botón editar — visible directo
      '<button onclick="openEdit(\''+t.id+'\')" title="Editar" style="background:none;border:none;color:var(--muted);font-size:15px;padding:0 4px;flex-shrink:0;line-height:1;">✎</button>'+
      // Botón vincular — pedido: ahora se puede vincular con tareas del
      // mismo período (no solo "superior"), incluidas las anuales entre sí,
      // así que el botón ya se muestra siempre, sin excluir "año". "Activo"
      // refleja el sistema nuevo, multi-vínculo (clLinkUp/linkUp pueden
      // guardar varios a la vez — ver normalizeLinks/hasLinks) — el campo
      // viejo t.links ya no se usa para crear vínculos nuevos.
      '<button onclick="openLinkModal(\''+t.id+'\')" title="Vincular con otra(s) tarea(s)" style="background:none;border:none;color:'+((hasLinks(t.clLinkUp)||(t.checklist&&t.checklist.some(function(i){return hasLinks(i.linkUp);})))?'var(--accent)':'var(--muted)')+';font-size:13px;padding:0 4px;flex-shrink:0;line-height:1;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 9L9 5"/><path d="M8 3h3v3"/><path d="M6 11H3V8"/></svg></button>'+
      // Botón ⋯ menú
      '<button onclick="openTaskMenu(\''+t.id+'\',event)" style="background:none;border:none;color:var(--muted);font-size:18px;padding:0 4px;flex-shrink:0;line-height:1;letter-spacing:1px;">⋯</button>'+
    '</div>'+clHTML+
  '</div>';
}
// Fila simplificada mostrada mientras hay una selección múltiple de tareas en
// curso: una sola casilla que alterna la selección, sin los botones normales
// (editar, vincular, ⋯) para evitar acciones a medio camino de una selección.
function taskHTMLSelectable(t,showPeriod){

  var categoryTag = category ? '<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:'+category.color+';color:white;font-weight:600;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;">'+esc(category.name)+'</span>' : '';
  var tagHTML=showPeriod?'<span style="font-size:10px;padding:2px 7px;border-radius:20px;background:'+(PC[t.period]||'var(--line)')+';color:var(--ink-soft);font-weight:600;flex-shrink:0;">'+PL[t.period]+'</span>':'';
  return '<div class="task-item" id="ti-'+t.id+'" onclick="toggleSelect(\'tasks\',\''+t.id+'\')" style="cursor:pointer;background:'+(checked?'var(--accent-bg)':'transparent')+';border-radius:10px;">'+
    '<div class="task-row">'+
      '<div style="width:20px;height:20px;border-radius:6px;border:2px solid '+(checked?'var(--accent)':'var(--muted-soft)')+';background:'+(checked?'var(--accent)':'transparent')+';flex-shrink:0;display:flex;align-items:center;justify-content:center;">'+(checked?chkSVG():'')+'</div>'+
      '<div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;">'+
        (t.crucial?'<span class="crucial-star">★</span>':'')+
        '<span style="font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">'+esc(t.text)+'</span>'+
        categoryTag+tagHTML+

    '</div>'+
  '</div>';
}

  if(prev){prev.remove();}

  if(!t) return;
  var isDay = t.period==='dia';
  
  var menu = document.createElement('div');
  menu.id = 'task-menu-popup';
  menu.style.cssText = 'position:fixed;right:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:800;min-width:220px;overflow:hidden;';

      label:'Llevar al día siguiente', action:'moveTaskToNextDay(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.5" width="11" height="9.5" rx="1.5"/><path d="M1.5 5.7h11M4.5 1v2.3M9.5 1v2.3"/></svg>',

      items.push({icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 12V5M7 12V2M12 12V8"/></svg>', label:'Registrar ahora', action:'openRegEntryForTask(\''+id+'\')'});
    }
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
      label: isSkipped(t) ? 'Reactivar esta semana' : 'Ignorar esta semana', action:'toggleSkipTaskWeek(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 4 7M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg>',
      label:'Reordenar', action:'startReorder()'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
      label:'Seleccionar varias', action:'enterSelectMode(\'tasks\',\''+id+'\')'
    });
    items.push({divider:true});
    // Duplicar — ícono de dos hojas superpuestas
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/></svg>',
      label:'Duplicar', action:'duplicateTaskSameDay(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/></svg>',
      label:'Duplicar al día siguiente', action:'duplicateTaskToNextDay(\''+id+'\')'
    });
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="9" height="10" rx="1.5"/><path d="M4 3V2a1 1 0 011-1h6a1 1 0 011 1v8a1 1 0 01-1 1h-1"/><line x1="5" y1="8" x2="9" y2="8" stroke-width="1.3"/><line x1="7" y1="6" x2="7" y2="10" stroke-width="1.3"/></svg>',
      label:'Duplicar a varios días...', action:'duplicateTaskToDays(\''+id+'\')'
    });
    items.push({divider:true});
    // Recordatorio a horario específico — independiente de si la tarea tiene
    // "Definir horario específico" activado; el recordatorio es un aviso a
    // una hora fija que uno elige aquí mismo.
    items.push({
      icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-4-5.66V4a2 2 0 1 0-4 0v1.34A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>',
      label: t.reminder && t.reminder.time ? 'Editar recordatorio' : 'Añadir recordatorio',
      action: 'openReminderPopup(\''+id+'\')'
    });
    items.push({divider:true});
  }
  
  // Eliminar
  items.push({icon:'<svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="1 3 12 3"/><path d="M4 3V2h5v1"/><rect x="2" y="3" width="9" height="10" rx="1"/><line x1="5" y1="6" x2="5" y2="10"/><line x1="8" y1="6" x2="8" y2="10"/></svg>', label:'Eliminar tarea', action:'delTask(\''+id+'\')', danger:true});
  
  var html = items.map(function(item){
    if(item.divider) return '<div style="height:1px;background:var(--line);margin:3px 0;"></div>';
    return '<button onclick="closeTaskMenu();'+item.action+'" style="display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;background:none;border:none;font-size:13px;color:'+(item.danger?'var(--bad)':'var(--ink)')+';font-family:Inter,sans-serif;cursor:pointer;text-align:left;">'+
      '<span style="width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:'+(item.danger?'var(--bad)':'var(--muted)')+';">'+item.icon+'</span>'+
      '<span>'+item.label+'</span>'+
    '</button>';
  }).join('');
  
  menu.innerHTML = html;
  document.body.appendChild(menu);
  
  // Cerrar al tocar fuera
  setTimeout(function(){
    document.addEventListener('click', function handler(e){
      if(Date.now()-menu._t<450) return; // ignora el click que sigue al soltar tras mantener presionado
      if(!menu.contains(e.target)){
        menu.remove();
        document.removeEventListener('click', handler);
      }
    });
  }, 50);
}

// ── Modal de vincular tarea ────────────────────────────────────────────────
// ── Vincular una tarea — punto de entrada único ─────────────────────────
// Pedido: antes esto vivía repartido en varios lugares — un modal acá
// afuera para "vincular tarea completa" (con elegir período + modo
// unidad/completar), y por separado, botones sueltos por cada ítem del
// checklist dentro del editor de la tarea. Ahora todo pasa por un solo
// botón (el de al lado del lápiz ✎, sin abrir el editor), sea que se
// quiera vincular la tarea completa o uno de sus propios ítems de
// checklist con una tarea superior (tenga o no checklist ella misma).
//
// Pedido: se ve como "ventanillas distintas" al vincular — antes este picker
// usaba un popup chico centrado (.conf-box) que se destruía y se volvía a
// crear desde cero cada vez que cambiabas de paso o de tarea destino, sin
// animación al cerrar (desaparecía de golpe). Ahora usa el MISMO tipo de
// hoja deslizante (.overlay/.sheet) que el resto de los modales de la app:
// un solo overlay que se abre una vez por sesión, y navegar entre "elegir
// qué vincular" y "elegir con qué" solo reemplaza el contenido de esa misma
// hoja (sin abrir/cerrar nada), con un botón "‹" para volver. Recién al
// tocar "Listo" se cierra con su animación y ahí se sincroniza la página de
// fondo si hubo cambios.
//
// Estado del "picker" de vínculos — vive acá afuera (no en S) porque es
// pura UI de un modal flotante, no datos a guardar:
//   LINK_PICK_MODE       — modo elegido para el PRÓXIMO vínculo nuevo que
//                           se cree ('unit' = 1 a 1, 'completion' = todo el
//                           origen equivale a 1 recién al completarse).
//   LINK_PICK_TASK_ID / LINK_PICK_SOURCE_ITEM — a qué tarea/ítem origen
//                           corresponde el picker abierto, para poder
//                           refrescarlo tras cambiar el modo.
//   LINK_PICK_DIRTY       — pedido: al plegar/desplegar un período o
//                           marcar/quitar un vínculo NO se refresca la
//                           página de fondo en cada click (nada de
//                           render() ahí) — solo se actualiza el propio
//                           modal. Esta bandera queda pendiente y recién
//                           se aplica un solo render() de fondo al cerrar
//                           el modal (botón "Listo"), ya con todo resuelto.
var LINK_PICK_MODE = 'unit';
var LINK_PICK_TASK_ID = null;
var LINK_PICK_SOURCE_ITEM = null;
var LINK_PICK_DIRTY = false;
function openLinkModal(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  LINK_PICK_MODE = 'unit'; // nueva sesión de vinculación — arranca en modo por defecto
  LINK_PICK_DIRTY = false;
  linkPickerSheet(); // crea (o reutiliza) la hoja una sola vez por sesión
  if(t.checklist && t.checklist.length){
    openCLSourcePicker(id); // elegir cuál de sus ítems vincular (o la tarea completa)
  } else {
    openLinkTargetPicker(id, null); // vincular la tarea completa
  }
}
// Crea el overlay/hoja una sola vez (si ya existe, lo reutiliza) — evita el
// parpadeo de abrir/cerrar un modal nuevo cada vez que se navega de paso.
function linkPickerSheet(){
  var existing = document.getElementById('link-picker-overlay');
  if(existing) return document.getElementById('link-picker-sheet');
  var overlay=document.createElement('div');overlay.className='overlay';overlay.id='link-picker-overlay';
  overlay.addEventListener('click',function(e){if(e.target===overlay) closeLinkPicker();});
  overlay.innerHTML = '<div class="sheet" id="link-picker-sheet" style="max-height:85vh;overflow-y:auto;"></div>';
  document.body.appendChild(overlay);
  return document.getElementById('link-picker-sheet');
}
// Cierra el picker (con su animación) y recién ahí aplica, en un solo paso,
// el render() de fondo si algo cambió mientras estuvo abierto (ver
// LINK_PICK_DIRTY) — así cada click de plegar/marcar/cambiar-modo/navegar
// entre pasos dentro del modal no refresca la página de fondo; se
// sincroniza una sola vez al terminar.
function closeLinkPicker(){
  removeOverlay('link-picker-overlay');
  if(LINK_PICK_DIRTY){ LINK_PICK_DIRTY=false; render(); }
}
// Paso 1 (solo si la tarea tiene checklist propio): elegir qué ítem
// vincular — o, pedido, vincular la TAREA COMPLETA igual, aunque tenga
// checklist propio (cada ítem que se complete cuenta como 1 unidad hacia
// el destino elegido, o como 1 recién al completarse todo, según el modo).
function openCLSourcePicker(taskId){
  var t = S.tasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  var sheet = linkPickerSheet();
  var wholeLinks = normalizeLinks(t.clLinkUp).map(function(l){return findCLItem(l.taskId,l.itemId);}).filter(Boolean);
  var wholeLabel = wholeLinks.length ? wholeLinks.map(function(linked){return esc(linked.task.text)+(linked.item?(' · '+esc(linked.item.text||'ítem')):' (tarea completa)');}).join(', ') : null;
  var wholeRow = '<button onclick="openLinkTargetPicker(\''+taskId+'\',null)" style="width:100%;text-align:left;padding:10px 12px;border:1.5px solid '+(wholeLinks.length?'var(--accent)':'var(--line)')+';background:'+(wholeLinks.length?'var(--accent-bg)':'var(--paper)')+';border-radius:10px;margin-bottom:10px;cursor:pointer;font-family:Inter,sans-serif;">'+
    '<div style="font-size:13px;font-weight:700;color:var(--ink);">📦 Vincular la tarea COMPLETA</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;">Cada ítem que completes acá suma hacia el destino que elijas.</div>'+
    (wholeLabel?'<div style="font-size:11px;color:var(--accent);margin-top:4px;">⬆ '+wholeLabel+'</div>':'')+
  '</button>'+
  '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 8px;">O vincula un ítem puntual</div>';
  var rows = t.checklist.map(function(it){
    var links = normalizeLinks(it.linkUp).map(function(l){return findCLItem(l.taskId,l.itemId);}).filter(Boolean);
    var label = links.length ? links.map(function(linked){return esc(linked.task.text)+(linked.item?(' · '+esc(linked.item.text||'ítem')):' (tarea completa)');}).join(', ') : null;
    return '<button onclick="openLinkTargetPicker(\''+taskId+'\',\''+it.id+'\')" style="width:100%;text-align:left;padding:10px 12px;border:1.5px solid '+(links.length?'var(--accent)':'var(--line)')+';background:'+(links.length?'var(--accent-bg)':'var(--paper)')+';border-radius:10px;margin-bottom:8px;cursor:pointer;font-family:Inter,sans-serif;">'+
      '<div style="font-size:13px;color:var(--ink);">'+esc(it.text||'(sin nombre)')+'</div>'+
      (label?'<div style="font-size:11px;color:var(--accent);margin-top:2px;">⬆ '+label+'</div>':'<div style="font-size:11px;color:var(--muted);margin-top:2px;">sin vincular</div>')+
    '</button>';
  }).join('');
  sheet.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'+
      '<span class="serif" style="font-weight:700;font-size:19px;">Vincular</span>'+
      '<button onclick="closeLinkPicker()" style="background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;">×</button>'+
    ''+infoBtn('linkcl')+'</div>'+
    
    wholeRow+
    rows+
    '<button class="cbtn" style="width:100%;margin-top:6px;" onclick="closeLinkPicker()">Cerrar</button>';
}
// Paso 2: elegir el/los destino(s). sourceItemId es null/'' si se vincula
// la tarea completa, o el id de uno de sus propios ítems de checklist.
// Pedido: SOLO se puede vincular hacia una tarea de período SUPERIOR — nunca
// del mismo rango (una diaria jamás puede vincularse a otra diaria, etc.) —
// por eso candidatePeriods arranca en idx+1, sin incluir el propio período.
// Se puede elegir VARIAS tareas destino a la vez (todas las superiores que
// quieras, en simultáneo) — cada fila alterna (agrega/quita), y desde acá
// se puede volver ("‹") a elegir OTRO ítem propio para vincular también,
// sin cerrar esta hoja — pedido: vincular varias cosas de un tirón.
// Pedido: la lista de destinos arranca toda PLEGADA por período — semana,
// mes, semestre, año — y se despliega la que quieras tocándola, sin volver
// a dibujar la página de fondo (ver toggleLinkGroup). Pedido también: en
// cada vínculo se puede elegir si suma 1 a 1 o si el origen completo
// equivale recién a 1 al terminarlo (ver el selector de modo más abajo).
function openLinkTargetPicker(taskId, sourceItemId){
  var t = S.tasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  LINK_PICK_TASK_ID = taskId;
  LINK_PICK_SOURCE_ITEM = sourceItemId || null;
  var idx = PERIODS.indexOf(t.period);
  var candidatePeriods = PERIODS.slice(idx+1).filter(isPeriodEnabled); // SOLO períodos estrictamente superiores y activos
  var groups = candidatePeriods.map(function(p){
    return {period:p, tasks:S.tasks.filter(function(h){return h.period===p && h.id!==taskId;})};
  }).filter(function(g){return g.tasks.length;});
  var sheet = linkPickerSheet();
  var currentLinkVal = sourceItemId ? ((t.checklist||[]).find(function(i){return i.id===sourceItemId;})||{}).linkUp : t.clLinkUp;
  var currentLinks = normalizeLinks(currentLinkVal);
  var body;
  if(!candidatePeriods.length){
    body = '<div style="font-size:13px;color:var(--muted);line-height:1.6;text-align:center;padding:10px 0;">"'+PL[t.period]+'" ya es el período más amplio — no hay nada superior para vincular.</div>';
  } else if(!groups.length){
    body = '<div style="font-size:13px;color:var(--muted);line-height:1.6;text-align:center;padding:10px 0;">Todavía no tienes tareas de '+candidatePeriods.map(function(p){return PL[p];}).join(', ')+' para vincular.</div>';
  } else {
    body = groups.map(function(g){

// Pliega/despliega un grupo de período dentro del picker — pedido: sin

function toggleLinkGroup(period){

  if(!bodyEl) return;

}

function linkRowButton(taskId, sourceItemId, targetTaskId, targetItemId, labelHtml, linkObj){
  var already = !!linkObj;

    ? '<span onclick="event.stopPropagation();cycleLinkMode(\''+taskId+'\',\''+(sourceItemId||'')+'\',\''+targetTaskId+'\',\''+targetItemId+'\')" title="Tocar para cambiar el modo de suma" style="font-size:9px;font-weight:800;letter-spacing:.02em;padding:3px 7px;border-radius:6px;background:var(--accent);color:white;flex-shrink:0;cursor:pointer;white-space:nowrap;">'+((linkObj.mode||'unit')==='completion'?'=1 AL COMPLETAR':'1 A 1')+'</span>'
    : '';

// Agrega o quita (alterna) un vínculo hacia targetTaskId/targetItemId,
// dentro del array de vínculos de la tarea/ítem origen — a diferencia del
// viejo setTaskLink() (que reemplazaba el único vínculo posible), esto
// permite mantener varios vínculos activos a la vez. targetItemId vacío
// (con targetTaskId con valor) = vincular con la tarea destino completa.
// Un vínculo NUEVO se crea con el modo elegido en LINK_PICK_MODE. Si el
// vínculo YA existía, este mismo botón lo QUITA (desvincula).
// Pedido: no se refresca la página de fondo en cada click acá — solo se
// guarda el dato y se redibuja la hoja; el render() de fondo queda
// pendiente hasta cerrar el picker (ver closeLinkPicker/LINK_PICK_DIRTY).
function toggleTaskLink(taskId, sourceItemId, targetTaskId, targetItemId){
  if(!targetTaskId || targetTaskId===taskId) return; // no auto-vínculo
  var t = S.tasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  var normItem = targetItemId||null;
  function isSame(l){ return l.taskId===targetTaskId && (l.itemId||null)===normItem; }
  var arr, removed;
  if(sourceItemId){
    var it = (t.checklist||[]).find(function(i){return i.id===sourceItemId;});
    if(!it) return;
    arr = normalizeLinks(it.linkUp);
    removed = arr.some(isSame);
    arr = removed ? arr.filter(function(l){return !isSame(l);}) : arr.concat([{taskId:targetTaskId, itemId:normItem, mode:LINK_PICK_MODE}]);
    var nc = t.checklist.map(function(i){return i.id===sourceItemId?Object.assign({},i,{linkUp:arr}):i;});
    S.tasks = S.tasks.map(function(x){return x.id===taskId?Object.assign({},t,{checklist:nc}):x;});
  } else {
    arr = normalizeLinks(t.clLinkUp);
    removed = arr.some(isSame);
    arr = removed ? arr.filter(function(l){return !isSame(l);}) : arr.concat([{taskId:targetTaskId, itemId:normItem, mode:LINK_PICK_MODE}]);
    S.tasks = S.tasks.map(function(x){return x.id===taskId?Object.assign({},t,{clLinkUp:arr}):x;});
  }
  recalcParentItemQtyFromLinks(targetTaskId, normItem);
  saveState();
  LINK_PICK_DIRTY = true;
  toast(removed?'Vínculo eliminado':'Vinculado ✓ ('+(LINK_PICK_MODE==='completion'?'solo al completar':'1 a 1')+' — la meta se recalculó sola)');
  openLinkTargetPicker(taskId, sourceItemId); // refresca el mismo modal, sigue abierto — sin tocar la página de fondo
}
// Cambia el modo de un vínculo YA existente (unit ↔ completion) sin
// quitarlo, y recalcula la meta automática del destino porque el "peso"
// del hijo puede cambiar según el modo (ver clChildContribution).
function cycleLinkMode(taskId, sourceItemId, targetTaskId, targetItemId){
  var t = S.tasks.find(function(x){return x.id===taskId;});
  if(!t) return;
  var normItem = targetItemId||null;
  function isSame(l){ return l.taskId===targetTaskId && (l.itemId||null)===normItem; }
  var list = sourceItemId ? normalizeLinks(((t.checklist||[]).find(function(i){return i.id===sourceItemId;})||{}).linkUp) : normalizeLinks(t.clLinkUp);
  var link = list.find(isSame);
  if(!link) return;
  link.mode = (link.mode||'unit')==='unit' ? 'completion' : 'unit';
  if(sourceItemId){
    var nc = t.checklist.map(function(i){return i.id===sourceItemId?Object.assign({},i,{linkUp:list}):i;});
    S.tasks = S.tasks.map(function(x){return x.id===taskId?Object.assign({},t,{checklist:nc}):x;});
  } else {
    S.tasks = S.tasks.map(function(x){return x.id===taskId?Object.assign({},t,{clLinkUp:list}):x;});
  }
  recalcParentItemQtyFromLinks(targetTaskId, normItem);
  saveState();
  LINK_PICK_DIRTY = true;
  toast('Modo cambiado a "'+(link.mode==='completion'?'todo = 1 al completar':'1 a 1')+'"');
  openLinkTargetPicker(taskId, sourceItemId);
}

// Pedido: el plegado de categorías se puede personalizar desde Yo →
// Personalización → Categorías, con 4 estrategias posibles:
//  - 'always-collapsed'  : siempre todas plegadas.
//  - 'smart'             : plegadas las que ya están 100% completas,
//                          desplegadas las que tienen algo pendiente.
//  - 'remember' (default): respeta lo último que el usuario dejó a mano
//                          para cada categoría (comportamiento de siempre).
//  - 'always-expanded'   : siempre todas desplegadas.
// El toggle manual (toggleCatSection) sigue funcionando igual en cualquier
// modo — sirve para "espiar" una categoría un momento; en el próximo
// render completo vuelve a acomodarse según la estrategia elegida (salvo
// en modo 'remember', donde ese toque manual s í queda guardado).
function isCatCollapsed(catId, doneInCat, total){
  var mode = S.catCollapseMode || 'remember';
  if(mode==='always-collapsed') return true;
  if(mode==='always-expanded') return false;
  if(mode==='smart'){
    // Pedido: si esta categoría se acaba de completar recién ahora, no la
    // pliegues en este mismo render — dale un respiro (ver finishUpdate) para
    // que se alcance a ver el ✓ antes de que la sección desaparezca de golpe.
    if(catId===S._delayedCollapseCatId) return false;
    return total>0 && doneInCat===total;
  }
  return !!(S.collapsedCats && S.collapsedCats[catId]);
}
function toggleCatSection(catId){
  if(!S.collapsedCats) S.collapsedCats = {};
  var body = document.getElementById('cat-body-'+catId);
  var sec = document.getElementById('cat-sec-'+catId);
  // BUGFIX: antes esto alternaba S.collapsedCats[catId] a ciegas, sin mirar
  // cómo se veía la categoría en pantalla. En los modos "siempre
  // plegadas/desplegadas" o "plegar las completas" (ver isCatCollapsed), lo
  // que se ve en pantalla no tiene por qué coincidir con lo último guardado
  // acá — así que a veces el primer click solo "confirmaba" un estado que
  // ya estaba aplicado y no cambiaba nada visualmente, obligando a tocar
  // dos veces para que recién el segundo click sí se notara. Ahora se mira
  // el DOM real para decidir qué hay que invertir.
  var currentlyCollapsed = body ? (body.style.display === 'none') : !!S.collapsedCats[catId];
  var nowCollapsed = !currentlyCollapsed;
  S.collapsedCats[catId] = nowCollapsed;
  // BUGFIX: esto nunca llamaba a saveState(), así que el plegado/desplegado
  // de categorías vivía solo en memoria — al cerrar y volver a abrir la app,
  // S.collapsedCats no se cargaba de ningún lado y todo volvía a mostrarse
  // desplegado, aunque el usuario lo hubiera dejado plegado.
  saveState();
  // Toggle rápido sin re-render completo
  if(body) body.style.display = nowCollapsed ? 'none' : 'block';
  // Rotar flecha
  if(sec){
    var arrow = sec.querySelector('.cat-sec-chevron');
    if(arrow) arrow.style.transform = nowCollapsed ? 'rotate(-90deg)' : 'rotate(0)';
  }
}

// ── Mover / Duplicar entre días ───────────────────────────────────────────
function moveTaskToNextDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  if(t.date){
    var nd=new Date(t.date+'T12:00:00'); nd.setDate(nd.getDate()+1);
    t.date=localDateStr(nd); t.day=dayIdxFromDate(nd);
    t.done=false; t.prog=0;
    saveState();render();
    toast('→ Tarea movida a '+formatDateShort(t.date));
    return;
  }
  var nextDay = (t.day + 1) % 7;
  t.day = nextDay;
  t.done = false; t.prog = 0;
  saveState();render();
  toast('→ Tarea movida a '+DAYS[nextDay]);
}

function moveTaskToDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  showDayPickerModal('¿A qué día quieres mover esta tarea?', false, function(days){
    if(days.length){
      t.day = days[0];
      t.date = null; // pasa a ser recurrente en ese día de la semana
      t.done = false; t.prog = 0;
      saveState();render();
      toast('→ Tarea movida a '+DAYS[days[0]]);
    }
  });
}

// Copia justo debajo de la original, en el mismo día (y misma categoría), sin
// marcar y con el checklist limpio; se puede editar/renombrar después.
function duplicateTaskSameDay(id){
  var t = S.tasks.find(function(x){return x.id===id;}); if(!t) return;
  var copy = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), done:false, prog:0, text:t.text+' (copia)'});
  copy.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false,prog:0});});
  var idx = S.tasks.findIndex(function(x){return x.id===id;});
  S.tasks.splice(idx+1, 0, copy);
  saveState(); render();
  toast('⊕ Tarea duplicada');
}
function duplicateTaskToNextDay(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  if(t.date){
    var nd=new Date(t.date+'T12:00:00'); nd.setDate(nd.getDate()+1);
    var copy1 = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), date:localDateStr(nd), day:dayIdxFromDate(nd), done:false, prog:0});
    copy1.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false});});
    S.tasks.push(copy1);
    saveState();render();
    toast('⊕ Duplicada para '+formatDateShort(copy1.date));
    return;
  }
  var nextDay = (t.day + 1) % 7;
  var copy = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), day:nextDay, done:false, prog:0});
  copy.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false});});
  S.tasks.push(copy);
  saveState();render();
  toast('⊕ Duplicada para '+DAYS[nextDay]);
}

function duplicateTaskToDays(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  showDayPickerModal('¿En qué días quieres duplicar la tarea?', true, function(days){
    days.forEach(function(d){
      if(d === t.day && !t.date) return; // no duplicar en el mismo día
      var copy = Object.assign({}, JSON.parse(JSON.stringify(t)), {id:uid(), day:d, date:null, done:false, prog:0});
      copy.checklist = (t.checklist||[]).map(function(i){return Object.assign({},i,{id:uid(),done:false});});
      S.tasks.push(copy);
    });
    saveState();render();
    toast('⊕ Duplicada en '+days.length+' día(s)');
  });
}

function showDayPickerModal(title, multi, callback){

  }).join('');

  document.body.appendChild(box);

function dpToggle(i){
  var sel = window._dpSelected;
  var btn = document.getElementById('dpb-'+i);
  if(!btn) return;
  var idx = sel.indexOf(i);
  if(idx === -1){
    if(!window._dpMulti){
      // Si es single select, deseleccionar los demás
      sel.forEach(function(d){
        var b = document.getElementById('dpb-'+d);
        if(b){b.style.background='var(--paper)';b.style.color='var(--ink-soft)';b.style.borderColor='var(--line)';}
      });
      window._dpSelected = [i];
    } else {
      window._dpSelected.push(i);
    }
    btn.style.background = 'var(--accent)';
    btn.style.color = 'white';
    btn.style.borderColor = 'var(--accent)';
  } else {
    window._dpSelected.splice(idx, 1);
    btn.style.background = 'var(--paper)';
    btn.style.color = 'var(--ink-soft)';
    btn.style.borderColor = 'var(--line)';
  }
}

function dpConfirm(){
  var sel = window._dpSelected || [];
  var cb = window._dpCallback;
  var modal = document.getElementById('day-picker-modal');
  if(modal) modal.remove();
  if(cb && sel.length > 0) cb(sel);
  else toast('Selecciona al menos un día');
}
function startInlineEdit(id){
  var t = S.tasks.find(function(x){return x.id===id;});
  if(!t) return;
  var span = document.getElementById('tt-'+id);
  if(!span) return;
  // Reemplazar span con input
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.value = t.text;
  inp.style.cssText = 'flex:1;min-width:0;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:6px;padding:3px 6px;font-family:Inter,sans-serif;outline:none;';
  inp.id = 'inline-edit-'+id;
  span.replaceWith(inp);
  inp.focus();
  inp.select();
  var save = function(){
    var v = inp.value.trim();
    if(v && v !== t.text){
      t.text = v;
      saveState();
    }
    render();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){e.preventDefault(); inp.blur();}
    if(e.key === 'Escape'){inp.value = t.text; inp.blur();}
  });
}

// ── Botón de reinicio unificado ───────────────────────────────────────────
// type: 'semana' | 'mes' | 'semestre' | 'año'
// size: 'lg' (52px, para Hoy) | 'sm' (40px, para Plan)
// Calcula disponibilidad y texto explicativo para un tipo de reinicio de
// período — separado del HTML para poder reutilizarlo tanto en
// resetButtonHTML() como en el selector flotante (openPeriodResetPicker).
function periodResetUsedThisCycle(period){
  // Verifica si ya se usó el reinicio de este ciclo — comparando IDs de
  // ciclo (no fechas), para que siga contando como "usado" en toda la
  // ventana (ej. usado el día 29 del mes, sigue "usado" el día 1 siguiente).
  if(!S.periodResetUsed || !S.periodResetUsed[period]) return false;
  var stored = S.periodResetUsed[period];
  if(period==='mes') return stored === monthResetCycleId();
  if(period==='semestre') return stored === semesterResetCycleId();
  if(period==='año') return stored === String(yearResetCycleId());
  return false;
}
function computeResetAvailability(type){
  var ilim = isIlimitado();
  var available = false, whenText = '';
  switch(type){
    case 'semana':
      available = isWeekend() && !resetUsedThisWeekend();
      if(!available){
        if(resetUsedThisWeekend()) whenText = 'Ya reiniciaste esta semana';
        else{
          var today = new Date().getDay(); // 0=dom,1=lun...6=sab
          var daysToSat = today===0?6:6-today;
          whenText = 'Disponible en '+(daysToSat===0?'hoy (sábado)':daysToSat===1?'mañana':daysToSat+' días');
        }
      }
      break;
    case 'mes':
      available = (isMonthResetWindow() && !periodResetUsedThisCycle('mes')) || ilim;
      if(!available) whenText = ilim?'Disponible siempre (plan Donante)':(periodResetUsedThisCycle('mes')?'Ya reiniciaste este mes':daysUntilMonthWindowText());
      break;
    case 'semestre':
      available = (isSemesterResetWindow() && !periodResetUsedThisCycle('semestre')) || ilim;
      if(!available) whenText = ilim?'Disponible siempre':(periodResetUsedThisCycle('semestre')?'Ya reiniciaste este semestre':daysUntilSemesterWindowText());
      break;
    case 'año':
      available = (isYearResetWindow() && !periodResetUsedThisCycle('año')) || ilim;
      if(!available) whenText = ilim?'Disponible siempre':(periodResetUsedThisCycle('año')?'Ya reiniciaste este año':daysUntilYearWindowText());
      break;
  }
  return {available:available, whenText:whenText};
}

  var sz = size==='hdr' ? 32 : size==='sm' ? 40 : 52;

// ── Seguimientos de nivel personalizados: UI ────────────────────────────────
// Pedido: en vez de reusar el color de nivel general, el color de cada
// seguimiento sale del color de SU categoría (si sigue una), o de la misma
// paleta que usan las categorías (para que "combine" visualmente aunque el
// seguimiento no siga ninguna categoría en particular) — el usuario también
// puede elegir uno explícito desde el editor (track.color).
function levelTrackColor(track, idx){
  if(track.color) return track.color;
  if(track.source && track.source.type==='category'){
    var cat = (S.categories||[]).find(function(c){return c.id===track.source.categoryId;});
    if(cat) return cat.color;
  }
  return CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
}
function levelTrackSourceLabel(track){
  if(!track.source) return '';
  if(track.source.type==='category'){
    var cat=(S.categories||[]).find(function(c){return c.id===track.source.categoryId;});
    return cat?('Categoría: '+cat.name):'Categoría eliminada';
  }
  var n=(track.source.taskIds||[]).length;
  return n+' tarea'+(n===1?'':'s')+' elegida'+(n===1?'':'s');
}
// ── Nombres de nivel "prototípicos" para seguimientos personalizados ────────
// A diferencia del nivel general (con nombres fijos y temáticos), acá se usa
// una escala genérica de maestría que sirve para cualquier cosa que el
// usuario decida seguir (Deporte, Estudio, lo que sea) — y es 100%
// personalizable por seguimiento (track.levelNames), así que estos son solo
// el punto de partida por defecto.
var TRACK_LEVEL_NAMES_DEFAULT = ['Iniciado','Aprendiz','Practicante','Competente','Adepto','Experto','Maestro','Gran Maestro','Leyenda','Mítico'];
function _toRoman(n){
  var map=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']], res='';
  map.forEach(function(m){ while(n>=m[0]){res+=m[1]; n-=m[0];} });
  return res;
}
function trackLevelName(track, lvl){
  if(track && track.levelNames && track.levelNames[lvl]) return track.levelNames[lvl];
  var base = TRACK_LEVEL_NAMES_DEFAULT[(lvl-1)%TRACK_LEVEL_NAMES_DEFAULT.length];
  var cycle = Math.floor((lvl-1)/TRACK_LEVEL_NAMES_DEFAULT.length);
  return cycle>0 ? base+' '+_toRoman(cycle+1) : base;
}
// ── La "gema" de cada seguimiento: una figura geométrica que se vuelve más
// compleja e intrincada a cada nivel (más lados + facetas internas + una
// estrella interior desde nivel 6), y que se va RELLENANDO de su color desde
// abajo a medida que sube el XP dentro del nivel — como un líquido que sube
// hasta completar la figura de un color radiante; al subir de nivel, pasa a
// una figura nueva, más compleja, y empieza a llenarse de nuevo.
function trackGemPath(level){
  var sides = Math.max(3, Math.min(3+Math.floor((level-1)*0.9), 12));
  var cx=50, cy=50, R=40;
  var pts=[];
  for(var i=0;i<sides;i++){
    var a=-Math.PI/2 + i*2*Math.PI/sides;
    pts.push([+(cx+R*Math.cos(a)).toFixed(2), +(cy+R*Math.sin(a)).toFixed(2)]);
  }
  var outer='M'+pts.map(function(p){return p[0]+','+p[1];}).join('L')+'Z';
  var facets='';
  if(level>=2){
    pts.forEach(function(p){ facets+='M'+cx+','+cy+'L'+p[0]+','+p[1]+' '; });
  }
  var innerStar='';
  if(level>=6){
    var innerR=R*0.48, ip=[];
    for(var j=0;j<sides;j++){
      var ia=-Math.PI/2+Math.PI/sides+j*2*Math.PI/sides;

      '<rect x="0" y="'+fillY.toFixed(2)+'" width="100" height="'+(100-fillY).toFixed(2)+'" fill="'+col+'" style="transition:y .6s ease-out,height .6s ease-out;"/>'+

  var groups = [];

    var list = tasks.filter(function(t){return t.period===pp[0];});
    if(!list.length) return;
    if(pp[0]==='dia'){
      for(var d=0; d<7; d++){
        var dl = list.filter(function(t){return !t.date && t.day===d;});
        if(dl.length) groups.push({key:'dia-'+d, head:'Día', sub:DAYS[d], tasks:dl});
      }
      var dated = list.filter(function(t){return !!t.date;}).sort(function(a,b){return a.date.localeCompare(b.date);});
      if(dated.length) groups.push({key:'dia-f', head:'Día', sub:'Fecha(s) puntual(es)', tasks:dated});
    } else groups.push({key:pp[0], head:pp[1], sub:null, tasks:list.sort(function(a,b){return (a.text||'').localeCompare(b.text||'');})});
  });
  return groups;

// ── Motor del temporizador de sets/repeticiones/descansos (pedido) ─────────
// Notas de diseño, para quien retome esto:
// - Usa su PROPIO AudioContext (_timerGetCtx), separado del _sndCtx general
//   de la app — así pausar el temporizador (ctx.suspend()) no silencia ni
//   traba el resto de los sonidos de la app mientras tanto.
// - Los sonidos se PROGRAMAN de antemano contra el reloj del AudioContext
//   (osc.start(tiempoFuturo)), no con setTimeout/setInterval — esa es la
//   diferencia real para que sigan sonando si el usuario cambia de pestaña
//   o app (ej. para poner música): el hardware de audio programado no se ve
//   afectado por el throttling que los navegadores aplican a los timers de
//   JS en segundo plano. Eso sí, esto depende de que el navegador no
//   descargue/congele la pestaña por completo (fuera de nuestro control,
//   pero instalarla como app / PWA ayuda bastante).
// - Pausar = ctx.suspend() (congela TODO el audio programado sin perder los
//   tiempos relativos); reanudar = ctx.resume(). Saltar de tramo cancela lo
//   pendiente y reprograma desde un nuevo "origen" virtual.
// - La cuenta regresiva visual se calcula siempre desde ctx.currentTime -
//   TR.audioStartCtxTime (nunca contando "ticks"), así que es inmune a que
//   el setInterval de refresco se atrase.
var TR = null; // estado de la sesión de temporizador en curso (null = ninguna)
var _timerCtx = null;
function _timerGetCtx(){
  if(_timerCtx) return _timerCtx;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    _timerCtx = new AC();
  }catch(e){ return null; }
  return _timerCtx;
}
// Config por ejercicio (todo opcional; sin nada, se comporta como antes):
//  · set.reps      → cuántas veces seguidas se repite ESE ejercicio cada vez que le toca
//  · set.restReps  → descanso entre esas repeticiones (null = el descanso general entre ejercicios)
//  · set.restAfter → descanso al terminar el ejercicio, antes del siguiente ejercicio — o, si es el
//                    último de la vuelta, antes de la vuelta siguiente (null = el general que corresponda)
function buildTimerSteps(timer){
  var steps = [];
  var sets = timer.sets;
  for(var r=0; r<timer.rounds; r++){
    sets.forEach(function(set, i){
      var reps = Math.max(1, set.reps||1);
      var restReps = (set.restReps==null) ? (timer.restBetween||0) : set.restReps;
      var isLastSet = i===sets.length-1, isLastRound = r===timer.rounds-1;
      var name = set.name||('Ejercicio '+(i+1));
      var color = set.color||CATEGORY_COLORS[i%CATEGORY_COLORS.length];
      for(var k=1; k<=reps; k++){
        steps.push({type:'work', name:name, sec:Math.max(1,set.sec||30), color:color, round:r+1, totalRounds:timer.rounds, rep:k, reps:reps});
        if(k<reps){
          if(restReps>0) steps.push({type:'rest', name:'Descanso', sec:restReps, round:r+1, totalRounds:timer.rounds});
        } else if(!isLastSet){
          var ra = (set.restAfter==null) ? (timer.restBetween||0) : set.restAfter;
          if(ra>0) steps.push({type:'rest', name:'Descanso', sec:ra, round:r+1, totalRounds:timer.rounds});
        } else if(!isLastRound){
          var rr = (set.restAfter==null) ? (timer.restBetweenRounds||0) : set.restAfter;
          if(rr>0) steps.push({type:'restRound', name:'Descanso entre vueltas', sec:rr, round:r+1, totalRounds:timer.rounds});
        }
      }
    });
  }
  var t=0;
  steps.forEach(function(s){ s.startAt=t; t+=s.sec; });
  return {steps:steps, totalSec:t};
}
function timerStepIndexAt(elapsed){
  var steps = TR.steps;
  for(var i=0;i<steps.length;i++){
    if(elapsed < steps[i].startAt+steps[i].sec) return i;
  }
  return steps.length-1;
}
function cancelScheduledTimerAudio(){
  if(!TR) return;
  (TR.scheduledOscillators||[]).forEach(function(osc){ try{osc.stop(0);}catch(e){} });
  TR.scheduledOscillators = [];
}
// Programa el audio desde el paso fromIdx en adelante (usado al iniciar, y al
// saltar de tramo). Nunca programa algo con tiempo ya pasado.
function scheduleTimerAudioFrom(fromIdx){
  var ctx = _timerGetCtx();
  if(!ctx || !TR) return;
  var cfg = S.timerCfg || {countdownBeepSec:3,volume:1,sounds:{}};
  var vol = (cfg.volume==null?1:cfg.volume);
  var sounds = cfg.sounds||{};
  var steps = TR.steps;
  var base = TR.audioStartCtxTime;
  var now = ctx.currentTime;
  if(fromIdx===0 && sounds.start!==false){
    TR.scheduledOscillators.push(_sndTone(ctx, Math.max(base-0.05,now+0.01), 659.25, 0.14, 'sine', 0.16*vol));
    TR.scheduledOscillators.push(_sndTone(ctx, Math.max(base+0.05,now+0.05), 987.77, 0.2, 'sine', 0.18*vol));
  }
  for(var idx=fromIdx; idx<steps.length; idx++){
    var step = steps[idx];
    var stepAt = base + step.startAt;
    if(idx>fromIdx || fromIdx>0){
      if(stepAt>=now-0.05){
        if(step.type==='work' && sounds.work!==false){
          TR.scheduledOscillators.push(_sndTone(ctx, Math.max(stepAt,now+0.02), 880, 0.16, 'triangle', 0.18*vol));
        } else if((step.type==='rest'||step.type==='restRound') && sounds.rest!==false){
          TR.scheduledOscillators.push(_sndTone(ctx, Math.max(stepAt,now+0.02), 392, 0.22, 'sine', 0.14*vol));
        }
      }
    }
    if(sounds.countdown!==false && cfg.countdownBeepSec>0){
      var n = Math.min(cfg.countdownBeepSec, step.sec-1);
      for(var s=n; s>=1; s--){
        var beepAt = stepAt + (step.sec-s);
        if(beepAt < now-0.05) continue;
        var isLast = s===1;
        TR.scheduledOscillators.push(_sndTone(ctx, Math.max(beepAt,now+0.01), isLast?987.77:698.46, 0.09, 'square', (isLast?0.16:0.11)*vol));
      }
    }
  }
  var endAt = base + TR.totalSec;
  if(sounds.finish!==false && endAt>=now-0.05){
    [[523.25,0,0.16],[659.25,0.13,0.16],[784.0,0.26,0.16],[1046.5,0.4,0.32]].forEach(function(p){
      TR.scheduledOscillators.push(_sndTone(ctx, Math.max(endAt+p[1],now+0.01), p[0], p[2], 'triangle', 0.18*vol));
    });
  }
}
function timerRequestWakeLock(){
  if(!S.timerCfg || S.timerCfg.keepScreenOn===false) return;
  if(!('wakeLock' in navigator)) return;
  try{
    navigator.wakeLock.request('screen').then(function(lock){
      if(TR) TR.wakeLock = lock; else { try{lock.release();}catch(e){} }
    }).catch(function(){ /* algunos navegadores lo niegan sin gesto reciente; no es crítico */ });
  }catch(e){}
}
function timerReleaseWakeLock(){
  if(TR && TR.wakeLock){ try{TR.wakeLock.release();}catch(e){} TR.wakeLock=null; }
}
function buildTimerAndStart(taskId, timer, taskName, isPreview){
  var built = buildTimerSteps(timer);
  if(!built.steps.length){ toast('Agrega al menos un ejercicio'); return; }
  TR = {
    taskId: isPreview?null:taskId, preview: !!isPreview, taskName: taskName,
    steps: built.steps, totalSec: built.totalSec,
    scheduledOscillators: [], wakeLock:null, paused:false, finished:false, tickHandle:null
  };
  var ctx = _timerGetCtx();
  if(ctx){
    if(ctx.state==='suspended') ctx.resume();
    TR.audioStartCtxTime = ctx.currentTime + 0.15;
    scheduleTimerAudioFrom(0);
  } else {
    TR.audioStartCtxTime = 0;
    toast('Tu navegador no soporta sonido para el temporizador — igual funciona la cuenta visual');
  }
  timerRequestWakeLock();
  showTimerRunOverlay();
  TR.tickHandle = setInterval(timerTick, 200);
}
function openTimerRun(taskId, previewConfig, previewName, isPreview){
  if(isPreview){
    buildTimerAndStart(null, previewConfig, previewName||'Vista previa', true);
    return;
  }
  var t = S.tasks.find(function(x){return x.id===taskId;});
  if(!t || !t.timer){ return; }
  buildTimerAndStart(taskId, t.timer, t.text, false);
}
function timerTick(){
  if(!TR || TR.finished) return;
  var ctx = _timerGetCtx();
  var elapsed = ctx ? Math.max(0, ctx.currentTime - TR.audioStartCtxTime) : 0;
  if(elapsed >= TR.totalSec){
    timerFinish();
    return;
  }
  timerRenderFrame();
}
function timerFinish(){
  if(!TR) return;
  TR.finished = true;
  if(TR.tickHandle){ clearInterval(TR.tickHandle); TR.tickHandle=null; }
  timerReleaseWakeLock();
  vibrate(50);
  if(!TR.preview && TR.taskId){
    var t = S.tasks.find(function(x){return x.id===TR.taskId;});
    if(t && !isDone(t)) tapTask(TR.taskId);
  }
  timerRenderFrame();
}
function timerTogglePause(){
  if(!TR || TR.finished) return;
  var ctx = _timerGetCtx();
  if(TR.paused){
    if(ctx) ctx.resume();
    TR.paused = false;
    timerRequestWakeLock();
    if(!TR.tickHandle) TR.tickHandle = setInterval(timerTick, 200);
  } else {
    if(ctx) ctx.suspend();
    TR.paused = true;
    if(TR.tickHandle){ clearInterval(TR.tickHandle); TR.tickHandle=null; }
    timerReleaseWakeLock();
  }
  timerRenderFrame();
}
function timerSkip(delta){
  if(!TR || TR.finished) return;
  var ctx = _timerGetCtx();
  if(!ctx) return;
  cancelScheduledTimerAudio();
  var elapsed = Math.max(0, ctx.currentTime - TR.audioStartCtxTime);
  var curIdx = timerStepIndexAt(elapsed);
  var newIdx = Math.max(0, Math.min(TR.steps.length-1, curIdx+delta));
  TR.audioStartCtxTime = ctx.currentTime - TR.steps[newIdx].startAt;
  scheduleTimerAudioFrom(newIdx);
  timerRenderFrame();
}
function closeTimerRun(){
  if(TR){
    cancelScheduledTimerAudio();
    if(TR.tickHandle){ clearInterval(TR.tickHandle); TR.tickHandle=null; }
    timerReleaseWakeLock();

  TR = null;
  removeOverlay('timer-run');
}

function timerRenderFrame(){
  var body = document.getElementById('timer-run-body');

      '<div class="serif" style="font-size:22px;font-weight:700;margin-bottom:6px;">¡Listo!</div>'+
      '<div style="font-size:14px;color:rgba(255,255,255,.7);margin-bottom:28px;">'+esc(TR.taskName)+'</div>'+

  }
  var ctx = _timerGetCtx();
  var elapsed = ctx ? Math.max(0, ctx.currentTime - TR.audioStartCtxTime) : 0;

  var remaining = Math.max(0, Math.ceil(step.startAt+step.sec-elapsed));

  var isRest = step.type!=='work';

  body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top,0px));">'+
      '<button onclick="confirmExitTimerRun()" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;">×</button>'+
      '<div style="color:rgba(255,255,255,.85);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;">Vuelta '+step.round+'/'+step.totalRounds+'</div>'+
      '<div style="width:36px;"></div>'+
    '</div>'+
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:0 24px;text-align:center;">'+

// Celdas cuadradas con fondo propio, "hoy" marcado en el número, puntitos de

function calCatColor(t){

// Tareas de un día: interactivas (se pueden marcar) y "fantasma" (recurrentes
// de semanas futuras, solo informativas).
function calAgendaData(dateKey){
  var d = parseLocalDate(dateKey), wIdx = dayIdxFromDate(d), inCur = isSameWeekAsToday(d);
  var t0 = new Date(); t0.setHours(0,0,0,0);
  var isFuture = d > t0;
  var dated = S.tasks.filter(function(t){return t.period==='dia' && t.date===dateKey;});
  var rec = S.tasks.filter(function(t){return t.period==='dia' && !t.date && t.day===wIdx;});
  var hideRec = !!S.calAgendaHideRecurring;
  var interactive = dated.concat(inCur && !hideRec ? rec : []);
  var ghost = (!inCur && isFuture && !hideRec) ? rec.filter(function(t){return !t.oneShotWeek;}) : [];
  return {date:d, isFuture:isFuture, inCur:inCur, interactive:interactive, ghost:ghost, hasRecurring:rec.length>0};
}

    '<button onclick="openDayDetail(\''+dateKey+'\')" style="background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;padding:0;">Detalle ⤢</button>'+
  '</div>';
  if(!list.length && !A.ghost.length){
    html += '<div style="text-align:center;padding:22px 0 8px;"><div style="font-size:26px;opacity:.5;margin-bottom:6px;">'+(isPastDay?'🗓️':'🌤️')+'</div><div style="font-size:13px;color:var(--muted);">'+(S.calAgendaHideRecurring&&A.hasRecurring?'Sin tareas puntuales este día.':(isPastDay?'No hubo tareas este día.':'Día libre.'))+'</div></div>';
  }
  if(timed.length){
    html += calSectionLabel('Con horario', timed.length)+timed.map(function(t){return calTaskRowHTML(t, canTicket, {time:t.hora, showCat:true});}).join('');
  }
  var catSections = cats.filter(function(c){return byCat[c.id] && byCat[c.id].length;});
  catSections.forEach(function(c){
    html += '<div style="display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:'+c.color+';"><span style="width:8px;height:8px;border-radius:50%;background:'+c.color+';"></span>'+esc(c.name)+'<span style="background:'+c.color+'1f;border-radius:8px;padding:1px 7px;font-size:10px;letter-spacing:0;">'+byCat[c.id].length+'</span><span style="flex:1;height:1px;background:'+c.color+'33;"></span></div>'+
      calGroupSort(byCat[c.id]).map(function(t){return calTaskRowHTML(t, canTicket, {});}).join('');
  });
  if(noCat.length){
    html += (catSections.length||timed.length ? calSectionLabel(timed.length||catSections.length?'Durante el día':'', noCat.length) : '')+
      calGroupSort(noCat).map(function(t){return calTaskRowHTML(t, canTicket, {});}).join('');

          (t.hora?'<span style="font-size:11px;font-weight:700;color:var(--muted);width:40px;">'+esc(t.hora)+'</span>':'')+
          '<span style="flex:1;font-size:13.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.text)+'</span></div>';
      }).join('');
  }
  if(!isPastDay){
    html += '<button onclick="openNewDatedTask(\''+dateKey+'\')" style="width:100%;margin-top:14px;padding:11px;border:1.5px dashed var(--line);border-radius:11px;background:transparent;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:Inter,sans-serif;">+ Agregar tarea a este día</button>';
  } else {

    if(stillGrace) html += '<div style="text-align:center;padding:8px 10px;margin-top:12px;background:var(--accent-bg);border-radius:9px;font-size:11px;color:var(--accent);font-weight:600;line-height:1.5;">⏳ Todavía puedes completarlo hoy y mantener tu racha.</div>';

function selectCalendarDay(key){
  S.calendarSelectedDay = key;

}
// Toggle "desplegar/plegar" el calendario — inspirado en calendarios de
// celular típicos (Google Calendar, calendario nativo): plegado, solo se ve
// la semana del día seleccionado y se libera espacio para la agenda de
// abajo; desplegado, se ve el mes completo. Simplificado a un toque en vez
// de arrastre para mayor solidez (el arrastre real de un panel es mucho
// más frágil de implementar bien).
function toggleCalGridExpanded(){
  S.calGridExpanded = !(S.calGridExpanded!==false);
  render();
}
// Con el calendario plegado, las flechas navegan semana a semana (en vez de
// mes a mes) — mueven el día seleccionado ±7 días y ajustan el mes
// mostrado para que quede consistente si se vuelve a desplegar.
function calNavWeek(delta){
  var d = parseLocalDate(S.calendarSelectedDay || todayStr());
  d = addDaysLocal(d, delta*7);
  S.calendarSelectedDay = localDateStr(d);
  var today = new Date();
  var monthDiff = (d.getFullYear()-today.getFullYear())*12 + (d.getMonth()-today.getMonth());
  S.calendarOffset = Math.max(-24, Math.min(6, monthDiff));
  render();
}
// Mostrar/ocultar del todo las tareas recurrentes (sin hora específica) en
// la agenda del día — pedido explícito, para poder ver solo lo puntual/con
// hora cuando se quiere.
function toggleCalHideRecurring(){
  S.calAgendaHideRecurring = !S.calAgendaHideRecurring;
  render();
}
// Celda simple de un día (sin el ícono de bono de racha, que depende del
// conteo secuencial del mes completo) — se usa en la tira semanal plegada.
function renderCalendarioMensual(){
  var hist = S.dailyHistory || {};
  var today = new Date();
  var todayKey = todayStr();
  S.calendarSelectedDay = S.calendarSelectedDay || todayKey;
  // Por defecto desplegado (mes completo) — como pediste, "semidesplegado"
  // por defecto, con la opción de plegar a la semana para ganar espacio.
  var expanded = S.calGridExpanded!==false;

  // Mes mostrado (puede ser distinto al actual via S.calendarOffset)
  var offset = S.calendarOffset || 0;
  var displayDate = new Date(today.getFullYear(), today.getMonth()+offset, 1);
  var year = displayDate.getFullYear();
  var month = displayDate.getMonth();
  var monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var monthName = monthNames[month] + ' ' + year;

  // Color dorado fijo
  var GOLD = '#f5a524';
  var GOLD_LIGHT = '#fbc04a';

  // Primer día del mes y día de la semana — semana empieza LUNES, como el
  // resto de la app.
  var firstDay = new Date(year, month, 1);
  var startDow = (firstDay.getDay()+6)%7; // 0=lunes ... 6=domingo
  var lastDay = new Date(year, month+1, 0).getDate();

  var dayLabels = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

  // Pedido: ahora vive en su propia subpestaña (Plan → Calendarios →
  // Mensual), con toda la pantalla para él — celdas más grandes, y una
  // agenda del día seleccionado debajo, en vez de tener que abrir un
  // modal para cada día (aunque el modal completo sigue disponible con
  // "Detalle ⤢", útil para semanas archivadas con estadísticas).
  var canGoForward = offset < 6;
  var navPrev = expanded ? 'calNav(-1)' : 'calNavWeek(-1)';
  var navNext = expanded ? 'calNav(1)' : 'calNavWeek(1)';
  var navBtnStyle = function(dis){ return 'width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:'+(dis?'var(--muted-soft)':'var(--ink-soft)')+';font-size:19px;line-height:1;cursor:'+(dis?'default':'pointer')+';padding:0;opacity:'+(dis?.4:1)+';'; };
  var notToday = offset!==0 || S.calendarSelectedDay!==todayKey;
  var html = '<div style="padding:0 16px;" id="streak-calendar-card">'+
    '<div style="background:var(--bg);border-radius:20px;padding:14px 10px 4px;">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px;">'+
        '<button onclick="'+navPrev+'" style="'+navBtnStyle(false)+'">‹</button>'+
        '<div style="text-align:center;">'+
          '<div class="serif" style="font-weight:800;font-size:19px;color:var(--ink);text-transform:capitalize;">'+monthNames[month]+'</div>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:1px;">'+year+(notToday?' · <span onclick="calGoToday()" style="color:var(--accent);font-weight:700;cursor:pointer;">ir a hoy</span>':'')+'</div>'+
        '</div>'+
        '<button onclick="'+navNext+'" '+(expanded&&!canGoForward?'disabled':'')+' style="'+navBtnStyle(expanded&&!canGoForward)+'">›</button>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">'+
        dayLabels.map(function(l){return '<div style="text-align:center;font-size:11px;color:var(--muted-soft);font-weight:700;padding:4px 0;">'+l+'</div>';}).join('')+
      '</div>';

  // Pedido: al deslizar, que se mueva SOLO la grilla de días (no el header
  // con el nombre del mes, ni la agenda de abajo) — se envuelve acá en su
  // propio contenedor recortado (overflow:hidden), así el mes que entra se
  // ve "acercarse" desde el borde en vez de aparecer de golpe.
  html += '<div id="cal-days-viewport" style="overflow:hidden;position:relative;">';

  if(!expanded){
    // ── Plegado: solo la semana del día seleccionado ──────────────────────
    var selD = parseLocalDate(S.calendarSelectedDay);
    var selDow = (selD.getDay()+6)%7;
    var monday = addDaysLocal(selD, -selDow);
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">';
    for(var wi=0; wi<7; wi++){
      html += renderCalDayCellSimple(localDateStr(addDaysLocal(monday, wi)));
    }
    html += '</div>';
  } else {
    // ── Desplegado: mes completo ───────────────────────────────────────────
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">';

    // Espacios vacíos antes del primer día
    for(var i=0;i<startDow;i++){
      html += '<div></div>';
    }

    // Días del mes
    // Calcular cuántos días de racha había al inicio del mes para saber los bonos
    var streakAtStart = 0;
    Object.keys(hist).sort().forEach(function(k){
      var d2 = parseLocalDate(k);
      if(d2 < new Date(year,month,1) && hist[k].streakReached) streakAtStart++;
    });

    var runningStreak = streakAtStart;

    for(var day=1; day<=lastDay; day++){
      var d = new Date(year, month, day);
      var key = localDateStr(d);
      var data = hist[key];
      var isFuture = d > today;
      var isToday = key === todayKey;
      var isSelected = key === S.calendarSelectedDay;
      var streakReached = data && data.streakReached;
      var hasDated = calHasDatedTask(key); // "evento" del día — típico de un calendario

      if(streakReached) runningStreak++;
      else if(!isFuture && data) runningStreak = 0; // racha rota

      // Determinar si este día tiene bono
      var bonusIcon = '';
      if(streakReached){
        if(runningStreak % 180 === 0) bonusIcon = '⭐';       // cada 180 días +30 XP
        else if(runningStreak % 30 === 0) bonusIcon = '🔥';   // cada 30 días +7 XP
        else if(runningStreak % 7 === 0) bonusIcon = '✨';    // cada 7 días +5 XP
      }

      html += calCellHTML(key, {bonus:bonusIcon});
    }

    html += '</div>';
  }
  html += '</div>'; // cierre cal-days-viewport

  // Manija para plegar/desplegar — toque en vez de arrastre real (más
  // sólido), inspirada en el tirador de los calendarios de celular.
  html += '<div onclick="toggleCalGridExpanded()" title="'+(expanded?'Plegar a la semana':'Ver el mes completo')+'" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;cursor:pointer;">'+
    '<div style="width:36px;height:4px;border-radius:2px;background:var(--line);"></div>'+
    '<div style="font-size:9px;color:var(--muted-soft);margin-top:2px;">'+(expanded?'▲ plegar':'▼ ver mes')+'</div>'+
  '</div>';

  html += '</div>'; // cierre bg card

  if(expanded){
    html += '<div style="display:flex;align-items:center;gap:14px;justify-content:center;margin-top:10px;font-size:10px;color:var(--muted);">'+
      '<span><span style="display:inline-block;width:11px;height:11px;border-radius:4px;background:linear-gradient(160deg,#fff3d1,#fbd989);border:1px solid #f5c25a;margin-right:4px;vertical-align:middle;"></span>objetivo cumplido</span>'+
      '<span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:middle;"></span>hecha</span>'+
      '<span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;border:1.3px solid var(--accent);box-sizing:border-box;margin-right:4px;vertical-align:middle;"></span>pendiente</span>'+
    '</div>';
  }

  html += '</div>'; // cierre wrapper padding

  // Agenda del día seleccionado — se actualiza al tocar cualquier día de
  // arriba, sin abrir modal (el modal completo sigue disponible con
  // "Detalle ⤢" para revisar semanas archivadas con sus estadísticas).
  html += renderCalMonthAgenda(S.calendarSelectedDay);

  return html;
}
// Agenda inline del día seleccionado en el calendario mensual — mismo dato
// que openDayDetail (recurrentes de la semana en curso + puntuales de esa
// fecha exacta), pero incrustada bajo la grilla en vez de en un modal.
function dayIdxFromDate(d){ var g=d.getDay(); return g===0?6:g-1; }
function isSameWeekAsToday(d){
  var today=new Date(); today.setHours(0,0,0,0);
  var monday=new Date(today); monday.setDate(today.getDate()-todayIdx());
  var sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  return d>=monday && d<=sunday;
}
// ¿Es esta tarea diaria "de hoy"? (recurrente de hoy, o puntual con fecha de hoy)
function isTaskToday(t){
  if(t.period!=='dia') return false;
  if(isSkipped(t)) return false; // ignorada esta semana: no cuenta para el %, el umbral ni los avisos
  if(t.date) return t.date===todayStr();
  return !t.date && t.day===todayIdx();
}
// Día de semana (0-6) que ocupa esta tarea DENTRO DE LA SEMANA ACTUAL —
// para tareas recurrentes es simplemente t.day; para puntuales, solo aplica
// si su fecha cae en la semana en curso (si no, devuelve null).
function taskWeekdayThisWeek(t){
  if(t.period!=='dia') return null;
  if(t.date){
    var dc = new Date(t.date+'T00:00:00');
    if(!isSameWeekAsToday(dc)) return null;
    return dayIdxFromDate(dc);
  }
  return t.day;
}
// ¿Cuántos días atrás quedó esta fecha respecto a hoy? Negativo = futuro.
function daysAgoFromDateKey(dateKey){
  var d = new Date(dateKey+'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}
function toastTicketBlocked(){
  playSound('warn');
  toast('Solo se puede marcar/desmarcar hasta 7 días atrás');
}
function openDayDetail(dateKey){
  var d = new Date(dateKey+'T00:00:00');
  var isToday = dateKey === todayStr();
  var inCurrentWeek = isSameWeekAsToday(d);
  var dLabel = new Date(dateKey+'T12:00:00');
  var dayName = DAYS[dayIdxFromDate(d)];
  var dateLabel = dLabel.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});

  var daysAgo = daysAgoFromDateKey(dateKey);
  var isPastDay = daysAgo > 0;           // día ya pasado → no se pueden agregar tareas nuevas
  var canTicket = daysAgo <= 7;          // hasta 7 días atrás se puede marcar/desmarcar

  var wIdx = dayIdxFromDate(d);
  var recurring = inCurrentWeek ? S.tasks.filter(function(t){return t.period==='dia'&&!t.date&&t.day===wIdx;}) : [];
  var dated = S.tasks.filter(function(t){return t.period==='dia'&&t.date===dateKey;});
  var combined = recurring.concat(dated);

  var body='';
  var hist = (S.dailyHistory||{})[dateKey];
  if(!inCurrentWeek && hist){
    // Pedido: este % ahora coincide con el que decide el umbral — incluye
    // avance parcial de tareas con cantidad/checklist, no solo binario.
    var pct = Math.round((hist.ratio||0)*100);
    body += '<div style="text-align:center;padding:6px 0 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;">'+
      '<div style="font-size:26px;font-weight:800;color:'+(hist.streakReached?'var(--accent)':'var(--muted)')+';">'+hist.completed+'/'+hist.total+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:2px;">tareas recurrentes completadas ese día ('+pct+'%)</div>'+
    '</div>';
  }

  if(combined.length){
    body += combined.map(function(t){
      var dn=isDone(t);
      var checkOnclick = canTicket
        ? "tapTask('"+t.id+"');reopenDayDetail('"+dateKey+"')"
        : "toastTicketBlocked()";
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);">'+
        '<div onclick="'+checkOnclick+'" style="width:19px;height:19px;border-radius:5px;border:1.5px solid '+(dn?'var(--accent)':'var(--muted)')+';background:'+(dn?'var(--accent)':'transparent')+';flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;'+(canTicket?'':'opacity:.5;')+'">'+
          (dn?'<svg width="10" height="8" viewBox="0 0 8 6"><polyline points="1,3 3,5 7,1" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+
        '</div>'+
        '<span onclick="closeDayDetail();openEdit(\''+t.id+'\')" style="flex:1;font-size:13px;color:'+(dn?'var(--muted)':'var(--ink)')+';text-decoration:'+(dn?'line-through':'none')+';cursor:pointer;">'+esc(t.text)+(t.date?'':' <span style="font-size:9px;color:var(--muted-soft);">· recurrente</span>')+'</span>'+
      '</div>';
    }).join('');
  } else if(!hist || inCurrentWeek){
    body += '<div style="font-size:12px;color:var(--muted-soft);text-align:center;padding:18px 0;">Sin tareas para este día.</div>';
  }
  // No se pueden agregar tareas nuevas a días que ya pasaron — solo se puede
  // revisar lo archivado. Para días de hoy en adelante, el botón sigue igual.
